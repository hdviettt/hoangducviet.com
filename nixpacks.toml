# Configure Nixpacks to use Bun
[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "cp -rn public/uploads/* /data/uploads/ 2>/dev/null; ln -sf /data/uploads public/uploads && bun run start"
