00;animation-delay:0.66s"/><path class="draw" d="M312.6 485.5 C485.2 485.5 547.5 397.2 723.6 397.2" fill="none" stroke="#004aef" stroke-width="1.3" opacity="0.3" style="--len:700;animation-delay:0.72s"/><path class="pop" d="M741.5 159.6 Q741.9 151.6 749.9 151.6 L827.0 151.6 Q835.0 151.6 834.4 159.5 L834.4 159.6 Q833.9 167.6 825.9 167.6 L749.2 167.6 Q741.2 167.6 741.5 159.6 Z" fill="url(#ggreen)" style="--o:0.75;animation-delay:0.70s"/><path class="pop" d="M739.1 209.1 Q739.5 201.3 747.4 201.3 L823.7 201.3 Q831.5 201.3 831.0 209.1 L831.0 209.1 Q830.5 217.0 822.6 217.0 L746.6 217.0 Q738.7 217.0 739.1 209.1 Z" fill="url(#gchip)" style="--o:0.75;animation-delay:0.73s"/><path class="pop" d="M736.7 257.6 Q737.1 250.0 744.8 250.0 L820.5 250.0 Q828.2 250.0 827.6 257.6 L827.6 257.6 Q827.1 265.3 819.4 265.3 L744.1 265.3 Q736.4 265.3 736.7 257.6 Z" fill="url(#gchip)" style="--o:0.75;animation-delay:0.76s"/><path class="pop" d="M734.4 305.1 Q734.8 297.6 742.3 297.6 L817.3 297.6 Q824.9 297.6 824.4 305.1 L824.4 305.1 Q823.8 312.7 816.3 312.7 L741.6 312.7 Q734.1 312.7 734.4 305.1 Z" fill="url(#gchip)" style="--o:0.75;animation-delay:0.79s"/><path class="pop" d="M732.2 351.6 Q732.5 344.3 739.9 344.3 L814.3 344.3 Q821.7 344.3 821.2 351.6 L821.2 351.6 Q820.6 359.0 813.3 359.0 L739.2 359.0 Q731.8 359.0 732.2 351.6 Z" fill="url(#gchip)" style="--o:0.75;animation-delay:0.82s"/><path class="pop" d="M729.9 397.2 Q730.3 390.0 737.5 390.0 L811.3 390.0 Q818.5 390.0 818.0 397.2 L818.0 397.2 Q817.5 404.4 810.3 404.4 L736.8 404.4 Q729.6 404.4 729.9 397.2 Z" fill="url(#gchip)" style="--o:0.75;animation-delay:0.85s"/><path class="pop" d="M727.7 441.8 Q728.1 434.7 735.2 434.7 L808.3 434.7 Q815.4 434.7 814.9 441.8 L814.9 441.8 Q814.4 448.8 807.4 448.8 L734.5 448.8 Q727.4 448.8 727.7 441.8 Z" fill="url(#gchip)" style="--o:0.75;animation-delay:0.88s"/><path class="pop" d="M725.6 485.5 Q725.9 478.6 732.9 478.6 L805.4 478.6 Q812.4 478.6 811.9 485.5 L811.9 485.5 Q811.4 492.4 804.5 492.4 L732.2 492.4 Q72