<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop: the figure resolves on a sweep, the one annotation arrives,
       then it rests. Reduced motion paints the finished frame, which is also
       what the og:image renderer captures. */
    .c { opacity: 0; animation: fill 14s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0 } 22%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }
    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }
    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 34% { opacity: 0 } 46%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .c { opacity: var(--o, 1); animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><polygon class="c" points="188.3,134.3 270.8,134.3 289.7,491.4 213.5,491.4" fill="#004aef" style="--o:0.30;animation-delay:0.00s"/><text x="251.6" y="521.4" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">crawl</text><polygon class="c" points="304.1,161.2 386.1,161.2 394.8,468.2 318.2,468.2" fill="#004aef" style="--o:0.41;animation-delay:0.11s"/><text x="357.4" y="521.4" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">index</text><polygon class="c" points="419.3,219.8 500.3,219.8 500.9,415.9 423.4,415.9" fill="#004aef" style="--o:0.52;animation-delay:0.22s"/><text x="463.1" y="521.4" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">BM25</text><polygon class="c" points="531.6,251.2 612.1,251.2 609.2,386.7 531.2,386.7" fill="#004aef" style="--o:0.63;animation-delay:0.33s"/><text x="568.9" y="521.4" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">PageRank</text><polygon class="c" points="642.2,291.3 721.9,291.3 719.3,348.3 640.6,348.3" fill="#004aef" style="--o:0.74;animation-delay:0.44s"/><text x="674.6" y="521.4" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">rerank</text><polygon class="c" points="751.9,311.1 831.2,311.1 830.0,328.9 750.9,328.9" fill="#c2410c" style="--o:1.00;animation-delay:0.55s"/><text x="780.4" y="521.4" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">answer</text></g><g class="mark"><line x1="830.0" y1="320.0" x2="872.0" y2="320.0" stroke="#c2410c" stroke-width="1.2"/><text x="882.0" y="314.0" font-size="17" fill="#c2410c">each stage is slower</text><text x="882.0" y="336.0" font-size="17" fill="#c2410c">and sees fewer</text></g><text x="190.0" y="96.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">documents reaching each stage</text>
</svg>
