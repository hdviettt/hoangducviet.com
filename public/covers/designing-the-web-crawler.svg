<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#86F7CC"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="170" r="210" fill="#9FEFFC" fill-opacity="0.55" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="490" r="220" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>
  <rect x="405" y="175" width="150" height="90" rx="24" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="435" y="208" width="90" height="24" rx="12" fill="url(#brandSoft)" fill-opacity="0.8"/>
  <rect x="589" y="200.92" width="150" height="90" rx="24" fill="none" stroke="url(#brand)" stroke-opacity="0.29" stroke-width="2.5"/>
  <rect x="607" y="187.96" width="150" height="90" rx="24" fill="none" stroke="url(#brand)" stroke-opacity="0.42" stroke-width="2.5"/>
  <rect x="625" y="175" width="150" height="90" rx="24" fill="url(#brand)"/>
  <rect x="845" y="175" width="150" height="90" rx="24" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="875" y="208" width="90" height="24" rx="12" fill="url(#brandSoft)" fill-opacity="0.8"/>
  <line x1="555" y1="220" x2="625" y2="220" stroke="url(#brand)" stroke-opacity="0.7" stroke-width="3"/>
  <line x1="775" y1="220" x2="845" y2="220" stroke="url(#brand)" stroke-opacity="0.7" stroke-width="3"/>
  <path d="M 920 265 C 920 400, 480 400, 480 265" fill="none" stroke="url(#brand)" stroke-opacity="0.65" stroke-width="3" stroke-dasharray="10 8"/>
  <g class="sparkle" style="transform-origin:1010px 130px"><path d="M 1010 88 Q 1019.24 120.76 1052 130 Q 1019.24 139.24 1010 172 Q 1000.76 139.24 968 130 Q 1000.76 120.76 1010 88 Z" fill="#0fd6f7"/></g>
  <text x="60" y="580" font-size="360" font-weight="700" fill="#0fd6f7" fill-opacity="0.13" letter-spacing="-12">02</text>
</svg>
