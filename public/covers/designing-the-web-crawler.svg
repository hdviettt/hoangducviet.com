<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* 12s loop: a page rides the pipeline — queue, fetch, parse — and the
         links it yields cycle back to the queue. */
      .doc {
        offset-path: path('M 480 250 L 700 250 L 920 250 C 920 430, 480 430, 480 250');
        offset-rotate: 0deg;
        animation: ride 12s ease-in-out infinite;
      }
      @keyframes ride {
        0%, 8% { offset-distance: 0%; }
        24% { offset-distance: 18%; }
        34% { offset-distance: 18%; }
        50% { offset-distance: 36%; }
        60% { offset-distance: 36%; }
        96%, 100% { offset-distance: 100%; }
      }
      .s1 { animation: st1 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .s2 { animation: st2 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .s3 { animation: st3 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes st1 { 0%, 4% { transform: scale(1); } 8% { transform: scale(1.06); } 14%, 100% { transform: scale(1); } }
      @keyframes st2 { 0%, 26% { transform: scale(1); } 30% { transform: scale(1.06); } 36%, 100% { transform: scale(1); } }
      @keyframes st3 { 0%, 52% { transform: scale(1); } 56% { transform: scale(1.06); } 62%, 100% { transform: scale(1); } }
      .ret { stroke-dasharray: 10 8; animation: retmarch 4s linear infinite; }
      @keyframes retmarch { to { stroke-dashoffset: -72; } }
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="170" r="210" fill="#9FEFFC" fill-opacity="0.55" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="490" r="220" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>

  <!-- pipeline stages -->
  <line x1="555" y1="250" x2="625" y2="250" stroke="url(#brand)" stroke-opacity="0.6" stroke-width="3"/>
  <line x1="775" y1="250" x2="845" y2="250" stroke="url(#brand)" stroke-opacity="0.6" stroke-width="3"/>
  <path class="ret" d="M 920 295 C 920 430, 480 430, 480 295" fill="none" stroke="url(#brand)" stroke-opacity="0.55" stroke-width="2.5"/>

  <g class="s1">
    <rect x="405" y="205" width="150" height="90" rx="24" fill="#FFFFFF" fill-opacity="0.94" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="433" y="233" width="94" height="10" rx="5" fill="#7E9BF7" fill-opacity="0.85"/>
    <rect x="433" y="253" width="70" height="10" rx="5" fill="#7E9BF7" fill-opacity="0.55"/>
  </g>
  <g class="s2">
    <rect x="625" y="205" width="150" height="90" rx="24" fill="none" stroke="url(#brand)" stroke-width="3"/>
    <rect x="653" y="233" width="94" height="24" rx="12" fill="url(#brand)" fill-opacity="0.85"/>
  </g>
  <g class="s3">
    <rect x="845" y="205" width="150" height="90" rx="24" fill="#FFFFFF" fill-opacity="0.94" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="873" y="228" width="94" height="9" rx="4.5" fill="#04B876" fill-opacity="0.8"/>
    <rect x="873" y="245" width="76" height="9" rx="4.5" fill="#04B876" fill-opacity="0.6"/>
    <rect x="873" y="262" width="60" height="9" rx="4.5" fill="#04B876" fill-opacity="0.45"/>
  </g>

  <!-- the page riding through -->
  <g class="doc">
    <rect x="-22" y="-28" width="44" height="56" rx="10" fill="url(#brand)"/>
    <rect x="-12" y="-16" width="24" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="-12" y="-5" width="18" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.7"/>
    <rect x="-12" y="6" width="21" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>

  <g class="sparkle">
    <path d="M 1030 130 Q 1038.8 157.6 1066 166 Q 1038.8 174.4 1030 202 Q 1021.2 174.4 994 166 Q 1021.2 157.6 1030 130 Z" fill="#ffce00"/>
  </g>
  <text x="60" y="580" font-size="360" font-weight="700" fill="#0fd6f7" fill-opacity="0.13" letter-spacing="-12">02</text>
</svg>
