<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* 11s loop: model pieces are picked up, carried into the flow, and
         absorbed — integration as a moving current. */
      .p1, .p2, .p3, .p4, .p5 { opacity: 0; }
      .p1 { animation: absorb1 11s ease-in infinite; }
      .p2 { animation: absorb2 11s ease-in infinite; animation-delay: 1s; }
      .p3 { animation: absorb3 11s ease-in infinite; animation-delay: 2s; }
      .p4 { animation: absorb4 11s ease-in infinite; animation-delay: 3s; }
      .p5 { animation: absorb5 11s ease-in infinite; animation-delay: 4s; }
      @keyframes absorb1 {
        0%, 6% { opacity: 0; transform: translate(0, 0); }
        10% { opacity: 1; }
        40% { opacity: 1; transform: translate(300px, 250px) rotate(24deg); }
        47%, 100% { opacity: 0; transform: translate(330px, 280px) rotate(32deg); }
      }
      @keyframes absorb2 {
        0%, 6% { opacity: 0; transform: translate(0, 0); }
        10% { opacity: 1; }
        40% { opacity: 1; transform: translate(220px, 300px) rotate(-18deg); }
        47%, 100% { opacity: 0; transform: translate(250px, 330px) rotate(-26deg); }
      }
      @keyframes absorb3 {
        0%, 6% { opacity: 0; transform: translate(0, 0); }
        10% { opacity: 1; }
        40% { opacity: 1; transform: translate(180px, 210px) rotate(14deg); }
        47%, 100% { opacity: 0; transform: translate(210px, 240px) rotate(22deg); }
      }
      @keyframes absorb4 {
        0%, 6% { opacity: 0; transform: translate(0, 0); }
        10% { opacity: 1; }
        40% { opacity: 1; transform: translate(260px, 160px) rotate(-12deg); }
        47%, 100% { opacity: 0; transform: translate(290px, 190px) rotate(-20deg); }
      }
      @keyframes absorb5 {
        0%, 6% { opacity: 0; transform: translate(0, 0); }
        10% { opacity: 1; }
        40% { opacity: 1; transform: translate(150px, 120px) rotate(10deg); }
        47%, 100% { opacity: 0; transform: translate(180px, 150px) rotate(18deg); }
      }
      .glintband {
        stroke-dasharray: 90 1400;
        animation: sweep 5.5s linear infinite;
      }
      @keyframes sweep { to { stroke-dashoffset: -1490; } }
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .p1, .p2, .p3 { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="300" cy="440" r="240" fill="#9FEFFC" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="920" cy="170" r="240" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>

  <!-- the current: one strong flow through the frame -->
  <path d="M -80 470 C 420 540, 700 110, 1290 220" fill="none" stroke="#9FEFFC" stroke-opacity="0.5" stroke-width="110" stroke-linecap="round"/>
  <path d="M -80 470 C 420 540, 700 110, 1290 220" fill="none" stroke="url(#brand)" stroke-opacity="0.85" stroke-width="64" stroke-linecap="round"/>
  <path class="glintband" d="M -80 470 C 420 540, 700 110, 1290 220" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="20" stroke-linecap="round"/>

  <!-- pieces of the frontier being carried in -->
  <g class="p1"><rect x="150" y="110" width="40" height="40" rx="10" fill="#ffce00"/></g>
  <g class="p2"><rect x="300" y="90" width="32" height="32" rx="9" fill="#ffce00" fill-opacity="0.9"/></g>
  <g class="p3"><rect x="440" y="150" width="36" height="36" rx="10" fill="#ffce00" fill-opacity="0.85"/></g>
  <g class="p4"><rect x="250" y="220" width="28" height="28" rx="8" fill="#ffce00" fill-opacity="0.9"/></g>
  <g class="p5"><rect x="420" y="270" width="30" height="30" rx="8" fill="#ffce00" fill-opacity="0.85"/></g>

  <g class="sparkle">
    <path d="M 1040 130 Q 1048.8 157.6 1076 166 Q 1048.8 174.4 1040 202 Q 1031.2 174.4 1004 166 Q 1031.2 157.6 1040 130 Z" fill="#07ef9c"/>
  </g>
</svg>
