<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop: the figure resolves on a sweep, the one annotation arrives,
       then it rests. Reduced motion paints the finished frame, which is also
       what the og:image renderer captures. */
    .c { opacity: 0; animation: fill 14s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0 } 22%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }
    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }
    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 34% { opacity: 0 } 46%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .c { opacity: var(--o, 1); animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><polygon class="c" points="223.1,238.1 376.9,238.1 381.5,387.4 232.8,387.4" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.10s"/><polygon class="c" points="276.4,276.4 327.2,276.4 329.3,325.2 279.0,325.2" fill="#004aef" style="--o:0.85;animation-delay:0.20s"/><polygon class="c" points="258.6,344.6 351.5,344.6 352.0,357.4 259.3,357.4" fill="#5f656d" style="--o:0.28;animation-delay:0.25s"/><polygon class="c" points="553.4,143.6 859.9,143.6 835.4,472.3 550.7,472.3" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.45s"/><polygon class="c" points="582.9,166.6 746.6,166.6 745.7,184.4 582.7,184.4" fill="#5f656d" style="--o:0.3;animation-delay:0.50s"/><polygon class="c" points="582.1,222.6 629.9,222.6 628.6,272.6 581.4,272.6" fill="#004aef" style="--o:0.2;animation-delay:0.55s"/><polygon class="c" points="648.3,222.6 696.0,222.6 694.0,272.6 646.8,272.6" fill="#004aef" style="--o:0.2;animation-delay:0.59s"/><polygon class="c" points="714.4,222.6 762.2,222.6 759.4,272.6 712.2,272.6" fill="#004aef" style="--o:0.2;animation-delay:0.63s"/><polygon class="c" points="780.5,222.6 828.3,222.6 824.8,272.6 777.6,272.6" fill="#004aef" style="--o:0.2;animation-delay:0.67s"/><polygon class="c" points="581.1,295.3 628.1,295.3 626.9,343.6 580.4,343.6" fill="#004aef" style="--o:0.2;animation-delay:0.71s"/><polygon class="c" points="646.1,295.3 693.1,295.3 691.2,343.6 644.7,343.6" fill="#004aef" style="--o:0.2;animation-delay:0.75s"/><polygon class="c" points="711.2,295.3 758.2,295.3 755.6,343.6 709.1,343.6" fill="#07ef9c" style="--o:0.9;animation-delay:0.79s"/><polygon class="c" points="776.3,295.3 823.3,295.3 820.0,343.6 773.5,343.6" fill="#004aef" style="--o:0.2;animation-delay:0.83s"/><polygon class="c" points="580.0,365.6 626.3,365.6 625.1,412.5 579.4,412.5" fill="#004aef" style="--o:0.2;animation-delay:0.87s"/><polygon class="c" points="644.1,365.6 690.4,365.6 688.5,412.5 642.7,412.5" fill="#004aef" style="--o:0.2;animation-delay:0.91s"/><polygon class="c" points="708.1,365.6 754.4,365.6 751.9,412.5 706.1,412.5" fill="#004aef" style="--o:0.2;animation-delay:0.95s"/><polygon class="c" points="772.2,365.6 818.4,365.6 815.2,412.5 769.5,412.5" fill="#004aef" style="--o:0.2;animation-delay:0.99s"/><polygon class="c" points="579.0,437.3 810.0,437.3 808.6,458.4 578.7,458.4" fill="#004aef" style="--o:0.14;animation-delay:0.95s"/></g><g class="mark"><line x1="738.1" y1="295.3" x2="780.1" y2="295.3" stroke="#04815a" stroke-width="1.4"/><text x="790.1" y="289.3" font-size="17" fill="#04815a">the same feature, where</text><text x="790.1" y="311.3" font-size="17" fill="#04815a">they already spend the day</text></g><text x="210.0" y="96.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">an app to open</text><text x="620.0" y="96.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">an app they never close</text>
</svg>
