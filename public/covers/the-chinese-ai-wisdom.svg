<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="gblue" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#3d76ff"/><stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="ggreen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#6df7cd"/><stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="gcard" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="gchip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#e6ecfa"/>
    </linearGradient>
  </defs>
  <g filter="url(#lift)"><path class="rise" d="M335.6 157.0 Q334.7 139.0 352.7 139.0 L917.5 139.0 Q935.5 139.0 934.0 156.9 L907.2 488.0 Q905.8 505.9 887.8 505.9 L370.5 505.9 Q352.5 505.9 351.7 487.9 Z" fill="url(#gcard)" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.06s"/><path class="pop" d="M378.4 199.1 Q377.9 185.2 391.9 185.2 L471.7 185.2 Q485.7 185.2 485.9 199.2 L486.8 258.8 Q487.1 272.8 473.1 272.8 L395.3 272.8 Q381.3 272.8 380.8 258.8 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.20s"/><path class="pop" d="M515.5 199.2 Q515.4 185.2 529.4 185.2 L609.2 185.2 Q623.2 185.2 623.0 199.2 L622.2 258.8 Q622.0 272.8 608.0 272.8 L530.2 272.8 Q516.2 272.8 516.1 258.8 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.24s"/><path class="pop" d="M652.6 199.2 Q652.9 185.2 666.9 185.2 L746.7 185.2 Q760.7 185.2 760.1 199.1 L757.5 258.8 Q756.9 272.8 742.9 272.8 L665.2 272.8 Q651.2 272.8 651.4 258.8 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.27s"/><path class="pop" d="M789.8 199.1 Q790.5 185.2 804.5 185.2 L884.3 185.2 Q898.3 185.2 897.2 199.1 L892.8 258.8 Q891.8 272.8 877.8 272.8 L800.1 272.8 Q786.1 272.8 786.8 258.8 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.31s"/><path class="pop" d="M382.9 312.6 Q382.4 298.6 396.4 298.6 L473.5 298.6 Q487.5 298.6 487.7 312.6 L488.6 368.0 Q488.8 382.0 474.8 382.0 L399.7 382.0 Q385.7 382.0 385.1 368.0 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.34s"/><path class="pop" d="M516.6 312.6 Q516.5 298.6 530.5 298.6 L607.6 298.6 Q621.6 298.6 621.4 312.6 L620.7 368.0 Q620.5 382.0 606.5 382.0 L531.3 382.0 Q517.3 382.0 517.2 368.0 Z" fill="url(#ggreen)" style="--o:0.9;animation-delay:0.38s"/><path class="pop" d="M650.4 312.6 Q650.6 298.6 664.6 298.6 L741.8 298.6 Q755.8 298.6 755.2 312.6 L752.7 368.0 Q752.1 382.0 738.1 382.0 L662.9 382.0 Q648.9 382.0 649.2 368.0 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.41s"/><path class="pop" d="M784.1 312.6 Q784.8 298.6 798.8 298.6 L875.9 298.6 Q889.9 298.6 888.9 312.6 L884.8 368.0 Q883.8 382.0 869.8 382.0 L794.6 382.0 Q780.6 382.0 781.3 368.0 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.45s"/><path class="pop" d="M387.2 420.6 Q386.6 406.6 400.6 406.6 L475.2 406.6 Q489.2 406.6 489.5 420.6 L490.3 472.0 Q490.5 486.0 476.5 486.0 L403.8 486.0 Q389.8 486.0 389.2 472.0 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.48s"/><path class="pop" d="M517.7 420.6 Q517.5 406.6 531.5 406.6 L606.1 406.6 Q620.1 406.6 620.0 420.6 L619.2 472.0 Q619.1 486.0 605.1 486.0 L532.3 486.0 Q518.3 486.0 518.2 472.0 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.52s"/><path class="pop" d="M648.2 420.6 Q648.5 406.6 662.5 406.6 L737.1 406.6 Q751.1 406.6 750.4 420.6 L748.2 472.0 Q747.6 486.0 733.6 486.0 L660.8 486.0 Q646.8 486.0 647.1 472.0 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.55s"/><path class="pop" d="M778.7 420.6 Q779.4 406.6 793.4 406.6 L868.0 406.6 Q882.0 406.6 880.9 420.5 L877.1 472.1 Q876.1 486.0 862.1 486.0 L789.4 486.0 Q775.4 486.0 776.1 472.0 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.58s"/><text x="628.7" y="534.5" text-anchor="middle" font-size="13" fill="#5f656d" font-weight="400">the app they already live in</text><path class="rise" d="M168.5 298.7 Q167.8 290.7 175.8 290.7 L254.2 290.7 Q262.2 290.7 262.7 298.7 L266.8 360.6 Q267.4 368.6 259.4 368.6 L182.6 368.6 Q174.6 368.6 173.9 360.7 Z" fill="url(#gcard)" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.62s"/><text x="223.3" y="399.0" text-anchor="middle" font-size="11" fill="#5f656d" font-weight="400">0 opens</text></g><g class="mark"><line x1="474.3" y1="274.8" x2="516.3" y2="274.8" stroke="#04815a" stroke-width="1.4"/><text x="526.3" y="268.8" font-size="17" fill="#04815a">they never had to</text><text x="526.3" y="290.8" font-size="17" fill="#04815a">go anywhere</text></g><text x="190.0" y="100.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">a destination, against a function</text>
</svg>
