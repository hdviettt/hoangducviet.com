<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#86F7CC"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="300" cy="440" r="240" fill="#57E2FA" fill-opacity="0.4" filter="url(#soft)"/>
  <circle class="drift2" cx="920" cy="170" r="240" fill="#3DF3B1" fill-opacity="0.4" filter="url(#soft)"/>
  <path class="drift1" d="M -80 470 C 420 540, 700 110, 1290 220" fill="none" stroke="#9FEFFC" stroke-opacity="0.5" stroke-width="110" stroke-linecap="round"/>
  <path class="drift1" d="M -80 470 C 420 540, 700 110, 1290 220" fill="none" stroke="url(#brand)" stroke-opacity="0.85" stroke-width="64" stroke-linecap="round"/>
  <path class="drift1" d="M -80 470 C 420 540, 700 110, 1290 220" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="22" stroke-linecap="round"/>
  <rect x="140" y="54" width="34" height="34" rx="7" fill="#ffce00" fill-opacity="0.40" transform="rotate(-17 140 54)"/>
  <rect x="192" y="94" width="21" height="21" rx="7" fill="#ffce00" fill-opacity="0.44" transform="rotate(0 192 94)"/>
  <rect x="204" y="119" width="22" height="22" rx="7" fill="#ffce00" fill-opacity="0.48" transform="rotate(-16 204 119)"/>
  <rect x="266" y="178" width="23" height="23" rx="7" fill="#ffce00" fill-opacity="0.53" transform="rotate(-11 266 178)"/>
  <rect x="317" y="209" width="33" height="33" rx="7" fill="#ffce00" fill-opacity="0.57" transform="rotate(-4 317 209)"/>
  <rect x="377" y="133" width="39" height="39" rx="7" fill="#ffce00" fill-opacity="0.61" transform="rotate(-8 377 133)"/>
  <rect x="370" y="159" width="27" height="27" rx="7" fill="#ffce00" fill-opacity="0.65" transform="rotate(13 370 159)"/>
  <rect x="412" y="225" width="34" height="34" rx="7" fill="#ffce00" fill-opacity="0.70" transform="rotate(-5 412 225)"/>
  <rect x="473" y="189" width="21" height="21" rx="7" fill="#ffce00" fill-opacity="0.74" transform="rotate(-12 473 189)"/>
  <rect x="520" y="245" width="27" height="27" rx="7" fill="#ffce00" fill-opacity="0.78" transform="rotate(3 520 245)"/>
  <rect x="547" y="250" width="37" height="37" rx="7" fill="#ffce00" fill-opacity="0.82" transform="rotate(8 547 250)"/>
  <rect x="576" y="297" width="32" height="32" rx="7" fill="#ffce00" fill-opacity="0.87" transform="rotate(15 576 297)"/>
  <rect x="643" y="285" width="42" height="42" rx="7" fill="#ffce00" fill-opacity="0.91" transform="rotate(-15 643 285)"/>
  <g class="sparkle" style="transform-origin:1030px 150px"><path d="M 1030 102 Q 1040.56 139.44 1078 150 Q 1040.56 160.56 1030 198 Q 1019.44 160.56 982 150 Q 1019.44 139.44 1030 102 Z" fill="#07ef9c"/></g>
</svg>
