<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#EBFDF4"/>
      <stop offset="1" stop-color="#F9FFFC"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* 12s loop: 融 — "to blend in". AI chips fly into the character and
         vanish; with each one absorbed, the glyph fills a step further with
         the brand gradient. China's wisdom: AI you stop noticing.
         Green-led palette, type-as-illustration. */
      .glyph { animation: fillup 12s ease-in-out infinite; }
      @keyframes fillup {
        0%, 14% { fill-opacity: 0.06; }
        26% { fill-opacity: 0.06; } 30% { fill-opacity: 0.34; }
        42% { fill-opacity: 0.34; } 46% { fill-opacity: 0.62; }
        58% { fill-opacity: 0.62; } 62% { fill-opacity: 0.9; }
        94% { fill-opacity: 0.9; }
        99%, 100% { fill-opacity: 0.06; }
      }
      .k1, .k2, .k3 { opacity: 0; transform-box: fill-box; transform-origin: center; }
      .k1 { animation: fly1 12s ease-in-out infinite; }
      .k2 { animation: fly2 12s ease-in-out infinite; }
      .k3 { animation: fly3 12s ease-in-out infinite; }
      @keyframes fly1 { 0%, 12% { opacity: 0; transform: translate(0, 0) scale(1); } 16% { opacity: 1; } 26% { opacity: 1; transform: translate(250px, 180px) scale(0.85); } 30% { opacity: 0; transform: translate(260px, 190px) scale(0.5); } 100% { opacity: 0; transform: translate(0, 0); } }
      @keyframes fly2 { 0%, 28% { opacity: 0; transform: translate(0, 0) scale(1); } 32% { opacity: 1; } 42% { opacity: 1; transform: translate(-220px, 160px) scale(0.85); } 46% { opacity: 0; transform: translate(-230px, 170px) scale(0.5); } 100% { opacity: 0; transform: translate(0, 0); } }
      @keyframes fly3 { 0%, 44% { opacity: 0; transform: translate(0, 0) scale(1); } 48% { opacity: 1; } 58% { opacity: 1; transform: translate(230px, -80px) scale(0.85); } 62% { opacity: 0; transform: translate(240px, -90px) scale(0.5); } 100% { opacity: 0; transform: translate(0, 0); } }
      .star { opacity: 0; transform-box: fill-box; transform-origin: center; animation: st 12s ease-out infinite; }
      @keyframes st { 0%, 62% { opacity: 0; transform: scale(0.4); } 67% { opacity: 1; transform: scale(1.12); } 72% { transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      .tiles { animation: br 12s ease-in-out infinite; }
      @keyframes br { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.75; } }
      .drift1 { animation: d1 20s ease-in-out infinite alternate; }
      .drift2 { animation: d2 26s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(18px, -12px); } }
      @keyframes d2 { to { transform: translate(-14px, 12px); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .glyph { fill-opacity: 0.9; }
        .star { opacity: 1; }
        .k1, .k2, .k3 { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="250" cy="160" r="200" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="990" cy="480" r="200" fill="#9FEFFC" fill-opacity="0.45" filter="url(#soft)"/>

  <!-- the existing patterns AI melts into: a quiet app grid -->
  <g class="tiles">
    <rect x="736" y="120" width="64" height="64" rx="16" fill="#FFFFFF" stroke="#CBEFDC" stroke-width="2"/>
    <rect x="816" y="120" width="64" height="64" rx="16" fill="#FFFFFF" stroke="#CBEFDC" stroke-width="2"/>
    <rect x="736" y="200" width="64" height="64" rx="16" fill="#FFFFFF" stroke="#CBEFDC" stroke-width="2"/>
    <rect x="816" y="200" width="64" height="64" rx="16" fill="#FFFFFF" stroke="#CBEFDC" stroke-width="2"/>
    <circle cx="768" cy="152" r="9" fill="#07ef9c" fill-opacity="0.5"/>
    <rect x="836" y="144" width="24" height="7" rx="3.5" fill="#0fd6f7" fill-opacity="0.5"/>
    <rect x="836" y="157" width="17" height="7" rx="3.5" fill="#0fd6f7" fill-opacity="0.35"/>
    <circle cx="768" cy="232" r="9" fill="#7E9BF7" fill-opacity="0.5"/>
    <rect x="836" y="224" width="24" height="7" rx="3.5" fill="#07ef9c" fill-opacity="0.5"/>
    <rect x="836" y="237" width="17" height="7" rx="3.5" fill="#07ef9c" fill-opacity="0.35"/>
  </g>

  <!-- 融 — fills in as AI is absorbed; echo outlines carry the signature -->
  <text x="545" y="472" font-size="400" font-weight="700" text-anchor="middle" fill="none" stroke="url(#brand)" stroke-opacity="0.14" stroke-width="3" transform="translate(26, 26)">融</text>
  <text class="glyph" x="545" y="472" font-size="400" font-weight="700" text-anchor="middle" fill="url(#brand)" fill-opacity="0.06" stroke="url(#brand)" stroke-width="3.5" stroke-opacity="0.85">融</text>

  <!-- AI chips flying in, absorbed one by one -->
  <g class="k1">
    <rect x="300" y="168" width="38" height="38" rx="11" fill="url(#brand)"/>
    <path d="M 319 176 Q 321.4 183.4 328 185.5 Q 321.4 187.6 319 195 Q 316.6 187.6 310 185.5 Q 316.6 183.4 319 176 Z" fill="#FFFFFF"/>
  </g>
  <g class="k2">
    <rect x="856" y="330" width="38" height="38" rx="11" fill="url(#brand)"/>
    <path d="M 875 338 Q 877.4 345.4 884 347.5 Q 877.4 349.6 875 357 Q 872.6 349.6 866 347.5 Q 872.6 345.4 875 338 Z" fill="#FFFFFF"/>
  </g>
  <g class="k3">
    <rect x="316" y="486" width="38" height="38" rx="11" fill="url(#brand)"/>
    <path d="M 335 494 Q 337.4 501.4 344 503.5 Q 337.4 505.6 335 513 Q 332.6 505.6 326 503.5 Q 332.6 501.4 335 494 Z" fill="#FFFFFF"/>
  </g>

  <g class="star">
    <path d="M 762 356 Q 768.4 376.4 788 382 Q 768.4 387.6 762 408 Q 755.6 387.6 736 382 Q 755.6 376.4 762 356 Z" fill="#ffce00"/>
  </g>
</svg>
