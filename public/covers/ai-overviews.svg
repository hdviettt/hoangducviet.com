<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="gblue" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#3d76ff"/><stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="ggreen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#6df7cd"/><stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="gcard" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="gchip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#e6ecfa"/>
    </linearGradient>
  </defs>
  <g filter="url(#lift)"><path class="rise" d="M149.7 123.1 Q148.0 101.4 169.7 101.4 L574.3 101.4 Q596.0 101.4 595.6 123.1 L595.6 123.1 Q595.3 144.7 573.6 144.7 L173.1 144.7 Q151.4 144.7 149.7 123.1 Z" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.06s"/><polygon class="type" points="177.0,115.3 436.2,115.3 436.5,130.5 178.1,130.5" fill="#004aef" style="--o:0.9;animation-delay:0.20s"/><path class="pop" d="M611.6 121.4 Q612.0 101.4 632.0 101.4 L672.0 101.4 Q692.0 101.4 691.3 121.4 L691.1 124.7 Q690.4 144.7 670.4 144.7 L631.1 144.7 Q611.1 144.7 611.5 124.7 Z" fill="url(#gblue)" style="--o:0.9;animation-delay:0.30s"/><path class="expandy" d="M154.8 187.8 Q153.3 169.8 171.3 169.8 L860.7 169.8 Q878.7 169.8 877.2 187.8 L863.4 364.0 Q862.0 381.9 844.0 381.9 L188.0 381.9 Q170.0 381.9 168.6 364.0 Z" fill="url(#ggreen)" style="--o:0.17;animation-delay:0.40s"/><polygon class="c" points="182.6,193.2 857.2,193.2 856.3,206.0 183.6,206.0" fill="#5f656d" style="--o:0.34;animation-delay:0.50s"/><polygon class="c" points="185.3,230.0 800.0,230.0 799.2,242.6 186.2,242.6" fill="#5f656d" style="--o:0.34;animation-delay:0.55s"/><polygon class="c" points="187.9,266.2 867.2,266.2 866.3,278.6 188.8,278.6" fill="#5f656d" style="--o:0.34;animation-delay:0.60s"/><polygon class="c" points="190.5,301.8 588.8,301.8 588.6,314.1 191.4,314.1" fill="#5f656d" style="--o:0.34;animation-delay:0.65s"/><path class="pop" d="M194.5 356.8 Q193.8 347.6 203.1 347.6 L305.9 347.6 Q315.1 347.6 315.5 356.8 L315.5 356.8 Q316.0 366.0 306.7 366.0 L204.4 366.0 Q195.2 366.0 194.5 356.8 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.74s"/><path class="pop" d="M330.7 356.8 Q330.3 347.6 339.5 347.6 L442.4 347.6 Q451.6 347.6 451.7 356.8 L451.7 356.8 Q451.8 366.0 442.6 366.0 L340.3 366.0 Q331.1 366.0 330.7 356.8 Z" fill="url(#ggreen)" style="--o:0.9;animation-delay:0.79s"/><path class="pop" d="M466.8 356.8 Q466.7 347.6 475.9 347.6 L578.8 347.6 Q588.0 347.6 587.9 356.8 L587.9 356.8 Q587.7 366.0 578.5 366.0 L476.1 366.0 Q466.9 366.0 466.8 356.8 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.84s"/><polygon class="c" points="173.2,422.0 285.0,422.0 285.5,431.8 173.9,431.8" fill="#5f656d" style="--o:0.28;animation-delay:0.92s"/><polygon class="rise" points="174.5,438.5 560.5,438.5 560.4,452.6 175.6,452.6" fill="#004aef" style="--o:0.8;animation-delay:0.96s"/><polygon class="c" points="176.3,462.3 693.2,462.3 692.9,471.0 177.0,471.0" fill="#5f656d" style="--o:0.24;animation-delay:1.00s"/><polygon class="c" points="179.7,505.3 289.4,505.3 289.9,514.7 180.4,514.7" fill="#5f656d" style="--o:0.28;animation-delay:0.98s"/><polygon class="rise" points="180.9,521.1 559.7,521.1 559.6,534.7 182.0,534.7" fill="#004aef" style="--o:0.8;animation-delay:1.02s"/><polygon class="c" points="182.7,544.0 689.9,544.0 689.5,552.4 183.4,552.4" fill="#5f656d" style="--o:0.24;animation-delay:1.06s"/><polygon class="c" points="186.0,585.4 293.6,585.4 294.1,594.4 186.7,594.4" fill="#5f656d" style="--o:0.28;animation-delay:1.04s"/><polygon class="rise" points="187.2,600.6 558.9,600.6 558.8,613.7 188.2,613.7" fill="#004aef" style="--o:0.8;animation-delay:1.08s"/><polygon class="c" points="188.9,622.7 686.6,622.7 686.3,630.8 189.6,630.8" fill="#5f656d" style="--o:0.24;animation-delay:1.12s"/></g><g class="mark"><line x1="642.2" y1="289.1" x2="684.2" y2="289.1" stroke="#04815a" stroke-width="1.4"/><text x="694.2" y="283.1" font-size="17" fill="#04815a">the answer, with a</text><text x="694.2" y="305.1" font-size="17" fill="#04815a">source under each claim</text></g><text x="190.0" y="100.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">the links, now below the fold</text>
</svg>
