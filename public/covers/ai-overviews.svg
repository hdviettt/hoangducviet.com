<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* 10s loop: the spark thinks, the answer writes itself line by line,
         then the citations that earned their place pop in. */
      .think { animation: think 10s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes think {
        0% { transform: rotate(0deg) scale(1); }
        18% { transform: rotate(180deg) scale(1.15); }
        30%, 100% { transform: rotate(360deg) scale(1); }
      }
      .a1 { animation: writea 10s ease-out infinite; }
      .a2 { animation: writeb 10s ease-out infinite; }
      .a3 { animation: writec 10s ease-out infinite; }
      @keyframes writea {
        0%, 20% { width: 0px; } 32% { width: 384px; }
        90% { width: 384px; } 96%, 100% { width: 0px; }
      }
      @keyframes writeb {
        0%, 30% { width: 0px; } 42% { width: 328px; }
        90% { width: 328px; } 96%, 100% { width: 0px; }
      }
      @keyframes writec {
        0%, 40% { width: 0px; } 52% { width: 256px; }
        90% { width: 256px; } 96%, 100% { width: 0px; }
      }
      .c1, .c2, .c3 { opacity: 0; }
      .c1 { animation: pop 10s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .c2 { animation: pop 10s ease-out infinite; animation-delay: 0.35s; transform-box: fill-box; transform-origin: center; }
      .c3 { animation: pop 10s ease-out infinite; animation-delay: 0.7s; transform-box: fill-box; transform-origin: center; }
      @keyframes pop {
        0%, 54% { opacity: 0; transform: scale(0.6); }
        60% { opacity: 1; transform: scale(1.06); }
        63% { transform: scale(1); }
        90% { opacity: 1; transform: scale(1); }
        96%, 100% { opacity: 0; transform: scale(0.6); }
      }
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .a1 { width: 384px; } .a2 { width: 328px; } .a3 { width: 256px; }
        .c1, .c2, .c3 { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="230" cy="480" r="210" fill="#7E9BF7" fill-opacity="0.4" filter="url(#soft)"/>
  <circle class="drift2" cx="1010" cy="160" r="220" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>

  <!-- query bar (already asked) -->
  <rect x="300" y="96" width="600" height="72" rx="36" fill="#FFFFFF" fill-opacity="0.96" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="348" cy="132" r="12" fill="none" stroke="#004aef" stroke-width="3"/>
  <line x1="357" y1="141" x2="366" y2="150" stroke="#004aef" stroke-width="3" stroke-linecap="round"/>
  <rect x="392" y="121" width="228" height="14" rx="7" fill="#2E62F1" fill-opacity="0.8"/>

  <!-- the AI Overview card -->
  <rect x="300" y="200" width="600" height="256" rx="28" fill="#FFFFFF" fill-opacity="0.96" stroke="url(#brand)" stroke-opacity="0.7" stroke-width="2.5"/>
  <!-- gemini-style spark thinking, then the answer writes itself -->
  <g class="think">
    <path d="M 352 226 Q 358.6 246.4 379 253 Q 358.6 259.6 352 280 Q 345.4 259.6 325 253 Q 345.4 246.4 352 226 Z" fill="url(#brand)"/>
  </g>
  <rect class="a1" x="408" y="245" height="14" rx="7" fill="url(#brand)" fill-opacity="0.9"/>
  <rect class="a2" x="408" y="277" height="12" rx="6" fill="#2E62F1" fill-opacity="0.55"/>
  <rect class="a3" x="408" y="306" height="12" rx="6" fill="#2E62F1" fill-opacity="0.4"/>

  <!-- citations pop in: the sources that earned their place -->
  <g class="c1">
    <rect x="332" y="376" width="160" height="44" rx="22" fill="#FFFFFF" stroke="#004aef" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="358" cy="398" r="8" fill="#004aef"/>
    <rect x="378" y="393" width="92" height="10" rx="5" fill="#7E9BF7" fill-opacity="0.8"/>
  </g>
  <g class="c2">
    <rect x="512" y="376" width="160" height="44" rx="22" fill="#FFFFFF" stroke="#0fd6f7" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="538" cy="398" r="8" fill="#0fd6f7"/>
    <rect x="558" y="393" width="92" height="10" rx="5" fill="#7E9BF7" fill-opacity="0.8"/>
  </g>
  <g class="c3">
    <rect x="692" y="376" width="160" height="44" rx="22" fill="#FFFFFF" stroke="#07ef9c" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="718" cy="398" r="8" fill="#07ef9c"/>
    <rect x="738" y="393" width="92" height="10" rx="5" fill="#7E9BF7" fill-opacity="0.8"/>
  </g>

  <!-- classic results, pushed below the fold by the AI card -->
  <rect x="300" y="492" width="600" height="14" rx="7" fill="#7E9BF7" fill-opacity="0.35"/>
  <rect x="300" y="522" width="520" height="14" rx="7" fill="#7E9BF7" fill-opacity="0.25"/>
  <rect x="300" y="552" width="560" height="14" rx="7" fill="#7E9BF7" fill-opacity="0.18"/>

  <text x="1020" y="580" font-size="360" font-weight="700" fill="#0AA6C4" fill-opacity="0.12" letter-spacing="-12" text-anchor="end">06</text>
</svg>
