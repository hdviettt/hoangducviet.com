<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#86F7CC"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <radialGradient id="liuOrb" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#004aef"/>
    </radialGradient>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="160" r="200" fill="#7E9BF7" fill-opacity="0.4" filter="url(#soft)"/>
  <circle class="drift2" cx="950" cy="470" r="250" fill="#9FEFFC" fill-opacity="0.5" filter="url(#soft)"/>
  <circle cx="352" cy="366.15999999999997" r="150" fill="none" stroke="url(#brand)" stroke-opacity="0.14" stroke-width="2.5"/>
  <circle cx="378" cy="347.44" r="150" fill="none" stroke="url(#brand)" stroke-opacity="0.26" stroke-width="2.5"/>
  <circle cx="404" cy="328.72" r="150" fill="none" stroke="url(#brand)" stroke-opacity="0.38" stroke-width="2.5"/>
  <circle cx="430" cy="310" r="150" fill="url(#liuOrb)"/>
  <g class="float" style="transform-origin:760px 300px">
  <rect x="660" y="160" width="60" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
  <rect x="760" y="300" width="48" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
  <rect x="700" y="440" width="54" height="54" rx="14" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
  <rect x="850" y="200" width="42" height="42" rx="14" fill="#ffce00" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
  <rect x="880" y="400" width="46" height="46" rx="14" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
  </g>
</svg>
