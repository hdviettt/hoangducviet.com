<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#F3E8FD"/>
      <stop offset="1" stop-color="#FDFBFF"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <radialGradient id="liuOrb" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#D7AEFB"/>
      <stop offset="1" stop-color="#8430CE"/>
    </radialGradient>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="160" r="200" fill="#A142F4" fill-opacity="0.45" filter="url(#soft)"/>
  <circle class="drift2" cx="950" cy="470" r="260" fill="#D7AEFB" fill-opacity="0.6" filter="url(#soft)"/>
  <circle cx="430" cy="320" r="150" fill="url(#liuOrb)"/>
  <g class="float" style="transform-origin:760px 300px">
  <rect x="660" y="160" width="64" height="64" rx="16" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="760" y="300" width="52" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="700" y="440" width="58" height="58" rx="16" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="850" y="200" width="44" height="44" rx="16" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="880" y="400" width="48" height="48" rx="16" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  </g>
</svg>
