<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#E9FBFE"/>
      <stop offset="1" stop-color="#F8FEFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* 11s loop: a one-line vibe ("make me an app") goes into the dark
         editor, the AI types the actual code line by line, and shipped apps
         pop out the other side earning their $ badges. Cyan-led palette,
         and the set's one dark focal surface. */
      .l1 { animation: t1 11s ease-out infinite; }
      .l2 { animation: t2 11s ease-out infinite; }
      .l3 { animation: t3 11s ease-out infinite; }
      .l4 { animation: t4 11s ease-out infinite; }
      .l5 { animation: t5 11s ease-out infinite; }
      .l6 { animation: t6 11s ease-out infinite; }
      .l7 { animation: t7 11s ease-out infinite; }
      @keyframes t1 { 0%, 10% { width: 0; } 14% { width: 150px; } 96% { width: 150px; } 100% { width: 0; } }
      @keyframes t2 { 0%, 15% { width: 0; } 19% { width: 240px; } 96% { width: 240px; } 100% { width: 0; } }
      @keyframes t3 { 0%, 20% { width: 0; } 24% { width: 200px; } 96% { width: 200px; } 100% { width: 0; } }
      @keyframes t4 { 0%, 25% { width: 0; } 29% { width: 264px; } 96% { width: 264px; } 100% { width: 0; } }
      @keyframes t5 { 0%, 30% { width: 0; } 34% { width: 180px; } 96% { width: 180px; } 100% { width: 0; } }
      @keyframes t6 { 0%, 35% { width: 0; } 39% { width: 250px; } 96% { width: 250px; } 100% { width: 0; } }
      @keyframes t7 { 0%, 40% { width: 0; } 44% { width: 130px; } 96% { width: 130px; } 100% { width: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .prompt { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pr 11s ease-out infinite; }
      @keyframes pr { 0%, 2% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: translateY(0); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      .app1, .app2, .d1, .d2 { opacity: 0; transform-box: fill-box; transform-origin: center; }
      .app1 { animation: a1 11s ease-out infinite; }
      .app2 { animation: a2 11s ease-out infinite; }
      @keyframes a1 { 0%, 48% { opacity: 0; transform: scale(0.85); } 53% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 58% { opacity: 0; transform: scale(0.85); } 63% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      .d1 { animation: dd1 11s ease-out infinite; }
      .d2 { animation: dd2 11s ease-out infinite; }
      @keyframes dd1 { 0%, 53% { opacity: 0; transform: scale(0.5); } 57% { opacity: 1; transform: scale(1.1); } 61% { transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes dd2 { 0%, 63% { opacity: 0; transform: scale(0.5); } 67% { opacity: 1; transform: scale(1.1); } 71% { transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      .drift1 { animation: dr1 20s ease-in-out infinite alternate; }
      .drift2 { animation: dr2 26s ease-in-out infinite alternate; }
      @keyframes dr1 { to { transform: translate(18px, -12px); } }
      @keyframes dr2 { to { transform: translate(-14px, 12px); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .l1 { width: 150px; } .l2 { width: 240px; } .l3 { width: 200px; }
        .l4 { width: 264px; } .l5 { width: 180px; } .l6 { width: 250px; } .l7 { width: 130px; }
        .prompt, .app1, .app2, .d1, .d2 { opacity: 1; }
        .cursor { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="250" cy="470" r="200" fill="#9FEFFC" fill-opacity="0.55" filter="url(#soft)"/>
  <circle class="drift2" cx="990" cy="150" r="190" fill="#86F7CC" fill-opacity="0.45" filter="url(#soft)"/>

  <!-- the vibe: one casual line in, no spec, no ticket -->
  <g class="prompt">
    <rect x="300" y="96" width="252" height="52" rx="26" fill="#FFFFFF" stroke="#D7E6EB" stroke-width="1.5"/>
    <circle cx="332" cy="122" r="10" fill="url(#brand)"/>
    <text x="354" y="131" font-size="26" font-weight="500" fill="#3A3F4B">帮我做个 App</text>
    <path d="M 566 122 L 592 122 M 583 113 L 593 122 L 583 131" fill="none" stroke="#0fd6f7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- dark editor, echoed -->
  <rect x="322" y="216" width="400" height="300" rx="20" fill="none" stroke="url(#brand)" stroke-opacity="0.16" stroke-width="2.5"/>
  <rect x="306" y="200" width="400" height="300" rx="20" fill="none" stroke="url(#brand)" stroke-opacity="0.32" stroke-width="2.5"/>
  <rect x="290" y="184" width="400" height="300" rx="20" fill="#12161F"/>
  <circle cx="318" cy="208" r="5" fill="#0fd6f7"/>
  <circle cx="336" cy="208" r="5" fill="#07ef9c"/>
  <circle cx="354" cy="208" r="5" fill="#ffce00"/>

  <!-- the AI typing the actual code -->
  <rect class="l1" x="322" y="240" height="12" rx="6" fill="#0fd6f7" fill-opacity="0.9"/>
  <rect class="l2" x="346" y="266" height="12" rx="6" fill="#7E9BF7" fill-opacity="0.85"/>
  <rect class="l3" x="346" y="292" height="12" rx="6" fill="#3f4a5c"/>
  <rect class="l4" x="370" y="318" height="12" rx="6" fill="#2fe9a5" fill-opacity="0.85"/>
  <rect class="l5" x="370" y="344" height="12" rx="6" fill="#ffce00" fill-opacity="0.8"/>
  <rect class="l6" x="346" y="370" height="12" rx="6" fill="#7E9BF7" fill-opacity="0.7"/>
  <rect class="l7" x="322" y="396" height="12" rx="6" fill="#0fd6f7" fill-opacity="0.7"/>
  <rect class="cursor" x="322" y="424" width="14" height="18" rx="3" fill="#EAF6FF"/>

  <!-- shipped apps, earning -->
  <g class="app1">
    <rect x="710" y="210" width="168" height="118" rx="16" fill="#FFFFFF" fill-opacity="0.96" stroke="#D7E6EB" stroke-width="1.5"/>
    <circle cx="730" cy="230" r="5" fill="#0fd6f7" fill-opacity="0.8"/>
    <rect x="724" y="248" width="140" height="10" rx="5" fill="#7E9BF7" fill-opacity="0.7"/>
    <rect x="724" y="268" width="108" height="10" rx="5" fill="#7E9BF7" fill-opacity="0.45"/>
    <rect x="724" y="292" width="76" height="20" rx="10" fill="url(#brand)" fill-opacity="0.85"/>
  </g>
  <g class="d1">
    <circle cx="878" cy="216" r="17" fill="#07ef9c"/>
    <text x="878" y="225" font-size="24" font-weight="700" fill="#063" text-anchor="middle">$</text>
  </g>
  <g class="app2">
    <rect x="710" y="368" width="168" height="118" rx="16" fill="#FFFFFF" fill-opacity="0.96" stroke="#D7E6EB" stroke-width="1.5"/>
    <circle cx="730" cy="388" r="5" fill="#07ef9c" fill-opacity="0.8"/>
    <rect x="724" y="406" width="140" height="10" rx="5" fill="#7E9BF7" fill-opacity="0.7"/>
    <rect x="724" y="426" width="96" height="10" rx="5" fill="#7E9BF7" fill-opacity="0.45"/>
    <rect x="724" y="450" width="76" height="20" rx="10" fill="url(#brand)" fill-opacity="0.85"/>
  </g>
  <g class="d2">
    <circle cx="878" cy="374" r="17" fill="#07ef9c"/>
    <text x="878" y="383" font-size="24" font-weight="700" fill="#063" text-anchor="middle">$</text>
  </g>

  <g class="sparkle">
    <path d="M 268 220 Q 274.4 240.4 294 246 Q 274.4 251.6 268 272 Q 261.6 251.6 242 246 Q 261.6 240.4 268 220 Z" fill="#ffce00"/>
  </g>
</svg>
