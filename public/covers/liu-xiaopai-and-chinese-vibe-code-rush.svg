<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop: the figure resolves on a sweep, the one annotation arrives,
       then it rests. Reduced motion paints the finished frame, which is also
       what the og:image renderer captures. */
    .c { opacity: 0; animation: fill 14s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0 } 22%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }
    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }
    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 34% { opacity: 0 } 46%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .c { opacity: var(--o, 1); animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><polygon class="c" points="194.8,161.5 837.2,161.5 833.6,213.2 198.4,213.2" fill="#004aef" style="--o:0.85;animation-delay:0.00s"/><text x="182.6" y="192.5" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">first product</text><text x="847.4" y="192.5" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">30 days</text><polygon class="c" points="201.2,253.0 516.0,253.0 516.0,302.8 204.7,302.8" fill="#004aef" style="--o:0.85;animation-delay:0.12s"/><text x="188.9" y="283.0" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">second</text><text x="528.0" y="283.0" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">15 days</text><polygon class="c" points="207.3,341.1 214.7,341.1 218.0,388.9 210.7,388.9" fill="#004aef" style="--o:0.85;animation-delay:0.24s"/><text x="195.0" y="370.1" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">later ones</text><text x="228.4" y="370.1" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">4 hours</text><polygon class="c" points="213.2,425.7 220.5,425.7 223.6,471.7 216.4,471.7" fill="#c2410c" style="--o:1;animation-delay:0.36s"/><text x="200.8" y="453.8" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">now</text><text x="234.1" y="453.8" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">1 hour</text></g><g class="mark"><line x1="334.9" y1="448.8" x2="376.9" y2="448.8" stroke="#c2410c" stroke-width="1.2"/><text x="386.9" y="442.8" font-size="17" fill="#c2410c">from a month</text><text x="386.9" y="464.8" font-size="17" fill="#c2410c">to an hour</text></g><text x="300.0" y="566.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">time to ship one product, same builder</text>
</svg>
