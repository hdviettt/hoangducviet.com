<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* 12s loop: scattered keywords fly into their clusters; the hulls
         close around them; the outliers stay behind — that's HDBSCAN. */
      .cg1 { animation: gather1 12s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
      .cg2 { animation: gather2 12s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
      .cg3 { animation: gather3 12s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
      @keyframes gather1 {
        0%, 10% { transform: translate(-390px, -30px); }
        30% { transform: translate(0, 0); }
        90% { transform: translate(0, 0); }
        97%, 100% { transform: translate(-390px, -30px); }
      }
      @keyframes gather2 {
        0%, 16% { transform: translate(-600px, -240px); }
        38% { transform: translate(0, 0); }
        90% { transform: translate(0, 0); }
        97%, 100% { transform: translate(-600px, -240px); }
      }
      @keyframes gather3 {
        0%, 22% { transform: translate(-90px, -270px); }
        46% { transform: translate(0, 0); }
        90% { transform: translate(0, 0); }
        97%, 100% { transform: translate(-90px, -270px); }
      }
      .h1, .h2, .h3 { opacity: 0; }
      .h1 { animation: hull 12s ease-out infinite; }
      .h2 { animation: hull 12s ease-out infinite; animation-delay: 0.96s; }
      .h3 { animation: hull 12s ease-out infinite; animation-delay: 1.92s; }
      @keyframes hull {
        0%, 32% { opacity: 0; }
        40% { opacity: 1; }
        88% { opacity: 1; }
        95%, 100% { opacity: 0; }
      }
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .h1, .h2, .h3 { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="660" cy="210" r="190" fill="#9FEFFC" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="880" cy="440" r="180" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>

  <!-- outliers: the noise that never joins a cluster -->
  <g fill="#7E9BF7" fill-opacity="0.45">
    <circle cx="150" cy="120" r="5"/><circle cx="230" cy="90" r="5"/><circle cx="320" cy="140" r="5"/>
    <circle cx="180" cy="210" r="5"/><circle cx="285" cy="250" r="5"/><circle cx="140" cy="300" r="5"/>
    <circle cx="360" cy="80" r="5"/><circle cx="410" cy="180" r="5"/>
  </g>

  <!-- cluster 1: gathers mid-right -->
  <g class="cg1">
    <g fill="#004aef">
      <circle cx="630" cy="180" r="6"/><circle cx="668" cy="164" r="6"/><circle cx="700" cy="196" r="6"/>
      <circle cx="648" cy="222" r="6"/><circle cx="690" cy="238" r="6"/><circle cx="616" cy="252" r="6"/>
      <circle cx="662" cy="200" r="6"/><circle cx="636" cy="212" r="6"/>
    </g>
  </g>
  <circle class="h1" cx="658" cy="208" r="92" fill="none" stroke="url(#brand)" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- cluster 2: gathers lower-right -->
  <g class="cg2">
    <g fill="#04B876">
      <circle cx="860" cy="400" r="6"/><circle cx="896" cy="386" r="6"/><circle cx="922" cy="418" r="6"/>
      <circle cx="874" cy="440" r="6"/><circle cx="908" cy="452" r="6"/><circle cx="846" cy="428" r="6"/>
    </g>
  </g>
  <circle class="h2" cx="885" cy="420" r="72" fill="none" stroke="url(#brand)" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- cluster 3: gathers lower-left-center -->
  <g class="cg3">
    <g fill="#0AA6C4">
      <circle cx="330" cy="420" r="6"/><circle cx="362" cy="406" r="6"/><circle cx="384" cy="436" r="6"/>
      <circle cx="342" cy="456" r="6"/><circle cx="372" cy="466" r="6"/>
    </g>
  </g>
  <circle class="h3" cx="358" cy="438" r="62" fill="none" stroke="url(#brand)" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>

  <g class="sparkle">
    <path d="M 1030 130 Q 1038.8 157.6 1066 166 Q 1038.8 174.4 1030 202 Q 1021.2 174.4 994 166 Q 1021.2 157.6 1030 130 Z" fill="#ffce00"/>
  </g>
</svg>
