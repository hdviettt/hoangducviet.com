<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#EDF3FF"/>
      <stop offset="1" stop-color="#FBFDFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* 12s loop: real search keywords fly out of the scatter into three
         NAMED intent clusters (Learn / Compare / Buy). One keyword is a
         different product entirely — it stays behind and dims: that's the
         noise cluster. Blue-led palette. */
      .c1 { animation: m1 12s ease-in-out infinite; }
      .c2 { animation: m2 12s ease-in-out infinite; }
      .c3 { animation: m3 12s ease-in-out infinite; }
      .c4 { animation: m4 12s ease-in-out infinite; }
      .c5 { animation: m5 12s ease-in-out infinite; }
      .c6 { animation: m6 12s ease-in-out infinite; }
      @keyframes m1 { 0%, 16% { transform: rotate(-4deg); } 24% { transform: translate(120px, 215px) rotate(0deg); } 94% { transform: translate(120px, 215px) rotate(0deg); } 100% { transform: rotate(-4deg); } }
      @keyframes m2 { 0%, 22% { transform: rotate(3deg); } 30% { transform: translate(59px, 165px) rotate(0deg); } 94% { transform: translate(59px, 165px) rotate(0deg); } 100% { transform: rotate(3deg); } }
      @keyframes m3 { 0%, 28% { transform: rotate(-3deg); } 36% { transform: translate(0px, 201px) rotate(0deg); } 94% { transform: translate(0px, 201px) rotate(0deg); } 100% { transform: rotate(-3deg); } }
      @keyframes m4 { 0%, 34% { transform: rotate(5deg); } 42% { transform: translate(-31px, 321px) rotate(0deg); } 94% { transform: translate(-31px, 321px) rotate(0deg); } 100% { transform: rotate(5deg); } }
      @keyframes m5 { 0%, 40% { transform: rotate(-5deg); } 48% { transform: translate(100px, 332px) rotate(0deg); } 94% { transform: translate(100px, 332px) rotate(0deg); } 100% { transform: rotate(-5deg); } }
      @keyframes m6 { 0%, 46% { transform: rotate(4deg); } 54% { transform: translate(39px, 287px) rotate(0deg); } 94% { transform: translate(39px, 287px) rotate(0deg); } 100% { transform: rotate(4deg); } }
      .c1, .c2, .c3, .c4, .c5, .c6, .noise { transform-box: fill-box; transform-origin: center; }
      .noise { animation: nz 12s ease-in-out infinite; }
      @keyframes nz { 0%, 55% { transform: rotate(6deg); opacity: 1; } 60% { transform: rotate(2deg) translate(6px, 0); } 65% { transform: rotate(8deg) translate(-4px, 0); } 72% { transform: rotate(6deg); opacity: 0.45; } 94% { opacity: 0.45; } 100% { transform: rotate(6deg); opacity: 1; } }
      .row1 { animation: r1 12s ease-out infinite; }
      .row2 { animation: r2 12s ease-out infinite; }
      .row3 { animation: r3 12s ease-out infinite; }
      @keyframes r1 { 0%, 22% { stroke-opacity: 0; } 26% { stroke-opacity: 0.9; } 34%, 100% { stroke-opacity: 0; } }
      @keyframes r2 { 0%, 40% { stroke-opacity: 0; } 44% { stroke-opacity: 0.9; } 52%, 100% { stroke-opacity: 0; } }
      @keyframes r3 { 0%, 52% { stroke-opacity: 0; } 56% { stroke-opacity: 0.9; } 64%, 100% { stroke-opacity: 0; } }
      .drift1 { animation: d1 20s ease-in-out infinite alternate; }
      .drift2 { animation: d2 26s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(18px, -12px); } }
      @keyframes d2 { to { transform: translate(-14px, 12px); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .c1 { transform: translate(120px, 215px); }
        .c2 { transform: translate(59px, 165px); }
        .c3 { transform: translate(0px, 201px); }
        .c4 { transform: translate(-31px, 321px); }
        .c5 { transform: translate(100px, 332px); }
        .c6 { transform: translate(39px, 287px); }
        .noise { opacity: 0.45; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="180" r="200" fill="#B8C9FF" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="480" r="200" fill="#9FEFFC" fill-opacity="0.45" filter="url(#soft)"/>

  <!-- named intent clusters, echoed on the last one -->
  <rect class="row1" x="300" y="296" width="600" height="84" rx="20" fill="#E7EEFF" stroke="#004aef" stroke-opacity="0" stroke-width="2.5"/>
  <rect class="row2" x="300" y="392" width="600" height="84" rx="20" fill="#E0F9FE" stroke="#0fd6f7" stroke-opacity="0" stroke-width="2.5"/>
  <rect x="332" y="520" width="600" height="84" rx="20" fill="none" stroke="url(#brand)" stroke-opacity="0.28" stroke-width="2.5"/>
  <rect class="row3" x="300" y="488" width="600" height="84" rx="20" fill="#E2FCF1" stroke="#07ef9c" stroke-opacity="0" stroke-width="2.5"/>

  <!-- cluster names -->
  <circle cx="332" cy="338" r="7" fill="#004aef"/>
  <text x="350" y="346" font-size="23" font-weight="700" fill="#0038B8">Learn</text>
  <circle cx="332" cy="434" r="7" fill="#0fd6f7"/>
  <text x="350" y="442" font-size="23" font-weight="700" fill="#0783A8">Compare</text>
  <circle cx="332" cy="530" r="7" fill="#07ef9c"/>
  <text x="350" y="538" font-size="23" font-weight="700" fill="#04915D">Buy</text>

  <!-- keywords: scattered, then clustered -->
  <g class="c1">
    <rect x="330" y="100" width="195" height="46" rx="23" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
    <text x="427" y="129" font-size="22" font-weight="500" fill="#3A3F4B" text-anchor="middle">what is ro water</text>
  </g>
  <g class="c2">
    <rect x="600" y="150" width="215" height="46" rx="23" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
    <text x="707" y="179" font-size="22" font-weight="500" fill="#3A3F4B" text-anchor="middle">ro filter benefits</text>
  </g>
  <g class="c3">
    <rect x="450" y="210" width="205" height="46" rx="23" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
    <text x="552" y="239" font-size="22" font-weight="500" fill="#3A3F4B" text-anchor="middle">best water filter</text>
  </g>
  <g class="c4">
    <rect x="700" y="90" width="185" height="46" rx="23" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
    <text x="792" y="119" font-size="22" font-weight="500" fill="#3A3F4B" text-anchor="middle">ro vs uv filter</text>
  </g>
  <g class="c5">
    <rect x="350" y="175" width="215" height="46" rx="23" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
    <text x="457" y="204" font-size="22" font-weight="500" fill="#3A3F4B" text-anchor="middle">water filter price</text>
  </g>
  <g class="c6">
    <rect x="640" y="220" width="195" height="46" rx="23" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
    <text x="737" y="249" font-size="22" font-weight="500" fill="#3A3F4B" text-anchor="middle">buy water filter</text>
  </g>

  <!-- the noise point: a different product, never joins a cluster -->
  <g class="noise">
    <rect x="590" y="34" width="215" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.8" stroke="#C4CAD6" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="697" y="63" font-size="22" font-weight="500" fill="#8A90A0" text-anchor="middle">air purifier price</text>
  </g>
</svg>
