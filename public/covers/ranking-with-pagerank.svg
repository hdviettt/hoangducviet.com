<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* Votes flow along every edge, endlessly; the page they pool at
         breathes bigger. That's PageRank. */
      .v1 { offset-path: path('M 520 210 L 700 150'); animation: flow 3s linear infinite; }
      .v2 { offset-path: path('M 700 150 L 820 330'); animation: flow 3s linear infinite; animation-delay: 0.7s; }
      .v3 { offset-path: path('M 580 390 L 820 330'); animation: flow 3s linear infinite; animation-delay: 1.2s; }
      .v4 { offset-path: path('M 520 210 L 580 390'); animation: flow 3s linear infinite; animation-delay: 1.8s; }
      .v5 { offset-path: path('M 960 190 L 820 330'); animation: flow 3s linear infinite; animation-delay: 0.3s; }
      .v6 { offset-path: path('M 700 150 L 960 190'); animation: flow 3s linear infinite; animation-delay: 2.2s; }
      @keyframes flow {
        0% { offset-distance: 0%; opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .winner { animation: breathe 8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.12); } }
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .v1, .v2, .v3, .v4, .v5, .v6 { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="250" cy="170" r="210" fill="#FFEB99" fill-opacity="0.6" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="490" r="220" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>

  <!-- the web of pages voting for each other -->
  <line x1="520" y1="210" x2="700" y2="150" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="700" y1="150" x2="820" y2="330" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="580" y1="390" x2="820" y2="330" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="520" y1="210" x2="580" y2="390" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="960" y1="190" x2="820" y2="330" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="700" y1="150" x2="960" y2="190" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>

  <circle cx="520" cy="210" r="26" fill="#FFFFFF" fill-opacity="0.92" stroke="url(#brand)" stroke-opacity="0.8" stroke-width="2.5"/>
  <circle cx="700" cy="150" r="34" fill="#FFFFFF" fill-opacity="0.92" stroke="url(#brand)" stroke-opacity="0.8" stroke-width="2.5"/>
  <circle cx="580" cy="390" r="30" fill="#FFFFFF" fill-opacity="0.92" stroke="url(#brand)" stroke-opacity="0.8" stroke-width="2.5"/>
  <circle cx="960" cy="190" r="30" fill="#FFFFFF" fill-opacity="0.92" stroke="url(#brand)" stroke-opacity="0.8" stroke-width="2.5"/>

  <!-- the winner: echoes behind, breathing bigger as votes pool -->
  <circle cx="766" cy="368" r="56" fill="none" stroke="url(#brand)" stroke-opacity="0.18" stroke-width="2.5"/>
  <circle cx="793" cy="349" r="56" fill="none" stroke="url(#brand)" stroke-opacity="0.34" stroke-width="2.5"/>
  <circle class="winner" cx="820" cy="330" r="56" fill="url(#brand)"/>
  <circle cx="804" cy="314" r="12" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- votes in transit -->
  <circle class="v1" r="7" fill="#004aef"/>
  <circle class="v2" r="7" fill="#0fd6f7"/>
  <circle class="v3" r="7" fill="#04B876"/>
  <circle class="v4" r="7" fill="#7E9BF7"/>
  <circle class="v5" r="7" fill="#07ef9c"/>
  <circle class="v6" r="7" fill="#0AA6C4"/>

  <g class="sparkle">
    <path d="M 1040 420 Q 1048.8 447.6 1076 456 Q 1048.8 464.4 1040 492 Q 1031.2 464.4 1004 456 Q 1031.2 447.6 1040 420 Z" fill="#ffce00"/>
  </g>
  <text x="60" y="580" font-size="360" font-weight="700" fill="#B06000" fill-opacity="0.12" letter-spacing="-12">05</text>
</svg>
