<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#86F7CC"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="170" r="210" fill="#FFEB99" fill-opacity="0.55" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="490" r="220" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>
  <line x1="520" y1="210" x2="700" y2="150" stroke="url(#brand)" stroke-opacity="0.45" stroke-width="2.5"/>
  <line x1="700" y1="150" x2="820" y2="330" stroke="url(#brand)" stroke-opacity="0.45" stroke-width="2.5"/>
  <line x1="580" y1="390" x2="820" y2="330" stroke="url(#brand)" stroke-opacity="0.45" stroke-width="2.5"/>
  <line x1="520" y1="210" x2="580" y2="390" stroke="url(#brand)" stroke-opacity="0.45" stroke-width="2.5"/>
  <line x1="960" y1="190" x2="820" y2="330" stroke="url(#brand)" stroke-opacity="0.45" stroke-width="2.5"/>
  <line x1="700" y1="150" x2="960" y2="190" stroke="url(#brand)" stroke-opacity="0.45" stroke-width="2.5"/>
  <circle cx="520" cy="210" r="26" fill="#FFFFFF" fill-opacity="0.9" stroke="url(#brand)" stroke-opacity="0.8" stroke-width="2.5"/>
  <circle cx="700" cy="150" r="34" fill="#FFFFFF" fill-opacity="0.9" stroke="url(#brand)" stroke-opacity="0.8" stroke-width="2.5"/>
  <circle cx="760" cy="373.2" r="58" fill="none" stroke="url(#brand)" stroke-opacity="0.14" stroke-width="2.5"/>
  <circle cx="780" cy="358.8" r="58" fill="none" stroke="url(#brand)" stroke-opacity="0.26" stroke-width="2.5"/>
  <circle cx="800" cy="344.4" r="58" fill="none" stroke="url(#brand)" stroke-opacity="0.38" stroke-width="2.5"/>
  <circle cx="820" cy="330" r="58" fill="url(#brand)"/>
  <circle cx="580" cy="390" r="30" fill="#FFFFFF" fill-opacity="0.9" stroke="url(#brand)" stroke-opacity="0.8" stroke-width="2.5"/>
  <circle cx="960" cy="190" r="30" fill="#FFFFFF" fill-opacity="0.9" stroke="url(#brand)" stroke-opacity="0.8" stroke-width="2.5"/>
  <g class="sparkle" style="transform-origin:1010px 430px"><path d="M 1010 390 Q 1018.8 421.2 1050 430 Q 1018.8 438.8 1010 470 Q 1001.2 438.8 970 430 Q 1001.2 421.2 1010 390 Z" fill="#ffce00"/></g>
  <text x="60" y="580" font-size="360" font-weight="700" fill="#ffce00" fill-opacity="0.13" letter-spacing="-12">05</text>
</svg>
