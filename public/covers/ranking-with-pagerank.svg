<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop: the figure resolves on a sweep, the one annotation arrives,
       then it rests. Reduced motion paints the finished frame, which is also
       what the og:image renderer captures. */
    .c { opacity: 0; animation: fill 14s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0 } 22%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }
    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }
    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 34% { opacity: 0 } 46%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .c { opacity: var(--o, 1); animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><line class="c" x1="346.4" y1="232.5" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.00s"/><line class="c" x1="673.4" y1="208.6" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.05s"/><line class="c" x1="314.3" y1="385.6" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.10s"/><line class="c" x1="705.4" y1="378.2" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.15s"/><line class="c" x1="463.2" y1="176.3" x2="346.4" y2="232.5" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.20s"/><line class="c" x1="463.2" y1="176.3" x2="673.4" y2="208.6" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.25s"/><line class="c" x1="590.7" y1="436.8" x2="705.4" y2="378.2" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.30s"/><line class="c" x1="259.1" y1="302.7" x2="314.3" y2="385.6" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.35s"/><line class="c" x1="773.3" y1="295.0" x2="705.4" y2="378.2" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.40s"/><line class="c" x1="416.2" y1="429.5" x2="314.3" y2="385.6" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.45s"/><line class="c" x1="631.2" y1="318.0" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.50s"/><line class="c" x1="478.0" y1="363.3" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.55s"/><line class="c" x1="673.4" y1="208.6" x2="631.2" y2="318.0" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.60s"/><line class="c" x1="705.4" y1="378.2" x2="631.2" y2="318.0" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.65s"/><line class="c" x1="346.4" y1="232.5" x2="259.1" y2="302.7" stroke="#00