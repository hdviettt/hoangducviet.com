<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn.
       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas.

       Every animation rests on the finished figure, and reduced motion paints
       that frame directly. The og:image renderer runs with reduced motion
       forced, so the still it captures is always the completed drawing. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    /* a caret running left to right */
    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    /* lands with a little overshoot, the way a result appears */
    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    /* a panel opening downward, which is what pushes the links off the frame */
    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><line class="c" x1="346.4" y1="232.5" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.00s"/><line class="c" x1="673.4" y1="208.6" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.05s"/><line class="c" x1="314.3" y1="385.6" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.10s"/><line class="c" x1="705.4" y1="378.2" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.15s"/><line class="c" x1="463.2" y1="176.3" x2="346.4" y2="232.5" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.20s"/><line class="c" x1="463.2" y1="176.3" x2="673.4" y2="208.6" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.25s"/><line class="c" x1="590.7" y1="436.8" x2="705.4" y2="378.2" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.30s"/><line class="c" x1="259.1" y1="302.7" x2="314.3" y2="385.6" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.35s"/><line class="c" x1="773.3" y1="295.0" x2="705.4" y2="378.2" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.40s"/><line class="c" x1="416.2" y1="429.5" x2="314.3" y2="385.6" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.45s"/><line class="c" x1="631.2" y1="318.0" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.50s"/><line class="c" x1="478.0" y1="363.3" x2="516.0" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.55s"/><line class="c" x1="673.4" y1="208.6" x2="631.2" y2="318.0" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.60s"/><line class="c" x1="705.4" y1="378.2" x2="631.2" y2="318.0" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.65s"/><line class="c" x1="346.4" y1="232.5" x2="259.1" y2="302.7" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.70s"/><line class="c" x1="590.7" y1="436.8" x2="416.2" y2="429.5" stroke="#004aef" stroke-width="1.1" style="--o:0.26;animation-delay:0.75s"/><circle class="pop" cx="516.0" cy="302.7" r="29.0" fill="#004aef" style="--o:0.87;animation-delay:0.30s"/><circle class="pop" cx="346.4" cy="232.5" r="16.2" fill="#004aef" style="--o:0.55;animation-delay:0.36s"/><circle class="pop" cx="673.4" cy="208.6" r="18.0" fill="#004aef" style="--o:0.59;animation-delay:0.42s"/><circle class="pop" cx="314.3" cy="385.6" r="14.5" fill="#004aef" style="--o:0.51;animation-delay:0.48s"/><circle class="pop" cx="705.4" cy="378.2" r="17.1" fill="#004aef" style="--o:0.57;animation-delay:0.54s"/><circle class="pop" cx="463.2" cy="176.3" r="12.7" fill="#004aef" style="--o:0.46;animation-delay:0.60s"/><circle class="pop" cx="590.7" cy="436.8" r="13.6" fill="#004aef" style="--o:0.48;animation-delay:0.66s"/><circle class="pop" cx="259.1" cy="302.7" r="11.8" fill="#004aef" style="--o:0.44;animation-delay:0.72s"/><circle class="pop" cx="773.3" cy="295.0" r="12.3" fill="#004aef" style="--o:0.45;animation-delay:0.78s"/><circle class="pop" cx="416.2" cy="429.5" r="11.8" fill="#004aef" style="--o:0.44;animation-delay:0.84s"/><circle class="pop" cx="631.2" cy="318.0" r="13.6" fill="#004aef" style="--o:0.48;animation-delay:0.90s"/><circle class="pop" cx="478.0" cy="363.3" r="12.7" fill="#004aef" style="--o:0.46;animation-delay:0.96s"/></g><g class="mark"><line x1="532.0" y1="302.7" x2="574.0" y2="302.7" stroke="#04815a" stroke-width="1.4"/><text x="584.0" y="296.7" font-size="17" fill="#04815a">rank is what other</text><text x="584.0" y="318.7" font-size="17" fill="#04815a">pages give you</text></g><text x="190.0" y="100.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">pages, sized by the authority they collect</text>
</svg>
