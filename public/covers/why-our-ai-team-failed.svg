<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FCE8E6"/>
      <stop offset="1" stop-color="#FFF9F8"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="180" r="220" fill="#F28B82" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="960" cy="460" r="260" fill="#EA4335" fill-opacity="0.35" filter="url(#soft)"/>
  <rect x="198" y="226" width="104" height="234" rx="52" fill="#F28B82" fill-opacity="0.38"/>
  <rect x="198" y="226" width="104" height="234" rx="52" fill="none" stroke="#EA4335" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="358" y="196" width="104" height="264" rx="52" fill="#F28B82" fill-opacity="0.38"/>
  <rect x="358" y="196" width="104" height="264" rx="52" fill="none" stroke="#EA4335" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="518" y="166" width="104" height="294" rx="52" fill="#F28B82" fill-opacity="0.38"/>
  <rect x="518" y="166" width="104" height="294" rx="52" fill="none" stroke="#EA4335" stroke-opacity="0.3" stroke-width="2"/>
  <rect class="float" style="transform-origin:730px 330px" x="678" y="200" width="104" height="260" rx="52" fill="#D93025" fill-opacity="0.92"/>
  <rect x="838" y="196" width="104" height="264" rx="52" fill="#F28B82" fill-opacity="0.38"/>
  <rect x="838" y="196" width="104" height="264" rx="52" fill="none" stroke="#EA4335" stroke-opacity="0.3" stroke-width="2"/>
</svg>
