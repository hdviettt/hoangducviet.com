<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#86F7CC"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="180" r="220" fill="#7E9BF7" fill-opacity="0.45" filter="url(#soft)"/>
  <circle class="drift2" cx="960" cy="460" r="250" fill="#86F7CC" fill-opacity="0.4" filter="url(#soft)"/>
  <rect x="200" y="229" width="100" height="226" rx="50" fill="none" stroke="url(#brandSoft)" stroke-opacity="0.75" stroke-width="2.5"/>
  <rect x="355" y="199" width="100" height="256" rx="50" fill="none" stroke="url(#brandSoft)" stroke-opacity="0.75" stroke-width="2.5"/>
  <rect x="510" y="169" width="100" height="286" rx="50" fill="none" stroke="url(#brandSoft)" stroke-opacity="0.75" stroke-width="2.5"/>
  <rect class="float" style="transform-origin:715px 330px" x="665" y="205" width="100" height="250" rx="50" fill="url(#brand)"/>
  <rect x="820" y="199" width="100" height="256" rx="50" fill="none" stroke="url(#brandSoft)" stroke-opacity="0.75" stroke-width="2.5"/>
  <g class="sparkle" style="transform-origin:1010px 160px"><path d="M 1010 116 Q 1019.68 150.32 1054 160 Q 1019.68 169.68 1010 204 Q 1000.32 169.68 966 160 Q 1000.32 150.32 1010 116 Z" fill="#0fd6f7"/></g>
</svg>
