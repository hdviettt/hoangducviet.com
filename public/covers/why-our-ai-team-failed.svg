<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop: the figure resolves on a sweep, the one annotation arrives,
       then it rests. Reduced motion paints the finished frame, which is also
       what the og:image renderer captures. */
    .c { opacity: 0; animation: fill 14s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0 } 22%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }
    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }
    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 34% { opacity: 0 } 46%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .c { opacity: var(--o, 1); animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><polygon class="c" points="205.0,158.8 466.2,158.8 466.7,197.4 207.6,197.4" fill="#004aef" style="--o:0.7;animation-delay:0.00s"/><polygon class="c" points="466.2,158.8 827.0,158.8 824.4,197.4 466.7,197.4" fill="#004aef" style="--o:0.08;animation-delay:0.00s"/><text x="192.3" y="183.2" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">a blueprint for the org</text><polygon class="c" points="210.0,232.5 393.6,232.5 394.6,269.9 212.5,269.9" fill="#004aef" style="--o:0.7;animation-delay:0.10s"/><polygon class="c" points="393.6,232.5 822.0,232.5 819.5,269.9 394.6,269.9" fill="#004aef" style="--o:0.08;animation-delay:0.10s"/><text x="197.2" y="256.3" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">infrastructure that fits</text><polygon class="c" points="214.8,303.8 359.4,303.8 360.6,340.0 217.2,340.0" fill="#004aef" style="--o:0.7;animation-delay:0.20s"/><polygon class="c" points="359.4,303.8 817.2,303.8 814.8,340.0 360.6,340.0" fill="#004aef" style="--o:0.08;animation-delay:0.20s"/><text x="202.0" y="327.0" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">documented competencies</text><polygon class="c" points="219.4,372.9 545.7,372.9 545.4,408.0 221.8,408.0" fill="#004aef" style="--o:0.7;animation-delay:0.30s"/><polygon class="c" points="545.7,372.9 812.6,372.9 810.2,408.0 545.4,408.0" fill="#004aef" style="--o:0.08;animation-delay:0.30s"/><text x="206.6" y="395.6" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">individual capability</text><polygon class="c" points="224.0,440.0 329.1,440.0 330.6,474.0 226.3,474.0" fill="#004aef" style="--o:0.7;animation-delay:0.40s"/><polygon class="c" points="329.1,440.0 808.0,440.0 805.7,474.0 330.6,474.0" fill="#004aef" style="--o:0.08;animation-delay:0.40s"/><text x="211.1" y="462.0" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">middle management</text><line x1="828.2" y1="140.8" x2="804.7" y2="489.5" stroke="#04815a" stroke-width="1.6"/></g><g class="mark"><line x1="808.7" y1="315.2" x2="850.7" y2="315.2" stroke="#04815a" stroke-width="1.4"/><text x="860.7" y="309.2" font-size="17" fill="#04815a">where each of them</text><text x="860.7" y="331.2" font-size="17" fill="#04815a">needed to be</text></g><text x="330.0" y="566.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">five things I owned</text>
</svg>
