xml:space="preserve">Roughly a year.</text><text x="104.0" y="250.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="currentColor" fill-opacity="0.70" text-anchor="start" xml:space="preserve">Did our costs go down?</text><text x="704.0" y="250.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="currentColor" fill-opacity="0.90" text-anchor="start" xml:space="preserve">No. They went up.</text><text x="104.0" y="368.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="currentColor" fill-opacity="0.70" text-anchor="start" xml:space="preserve">How many people have we replaced?</text><text x="704.0" y="368.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="currentColor" fill-opacity="0.90" text-anchor="start" xml:space="preserve">None. We hired more.</text><text x="104.0" y="486.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="currentColor" fill-opacity="0.70" text-anchor="start" xml:space="preserve">So what have you been doing?</text></svg>