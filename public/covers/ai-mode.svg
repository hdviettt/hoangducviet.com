<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="gblue" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#3d76ff"/><stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="ggreen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#6df7cd"/><stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="gcard" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="gchip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#e6ecfa"/>
    </linearGradient>
  </defs>
  <g filter="url(#lift)"><path class="rise" d="M273.4 166.0 Q272.6 152.0 286.6 152.0 L745.4 152.0 Q759.4 152.0 758.6 166.0 L757.9 180.1 Q757.2 194.1 743.2 194.1 L288.8 194.1 Q274.8 194.1 274.1 180.1 Z" fill="url(#gcard)" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.00s"/><text x="302.3" y="180.0" text-anchor="start" font-size="12" fill="#5f656d" font-weight="500">which crm should a 20-person team buy?</text><path class="draw" d="M516.0 194.1 L516.0 257.5 L247.8 279.5 L249.9 315.7" fill="none" stroke="#004aef" stroke-width="1.8" opacity="0.42" style="--len:600;animation-delay:0.16s"/><path class="pop" d="M129.9 329.6 Q128.7 315.7 142.7 315.7 L357.2 315.7 Q371.2 315.7 371.7 329.7 L372.0 339.1 Q372.4 353.1 358.4 353.1 L145.9 353.1 Q131.9 353.1 130.7 339.1 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.36s"/><text x="251.4" y="340.7" text-anchor="middle" font-size="12" fill="#5f656d" font-weight="400">best crm for smes</text><path class="draw" d="M252.2 353.1 L254.6 393.3 L516.0 413.9 L516.0 448.0" fill="none" stroke="#004aef" stroke-width="1.8" opacity="0.42" style="--len:600;animation-delay:0.56s"/><path class="draw" d="M516.0 194.1 L516.0 257.5 L516.0 279.5 L516.0 315.7" fill="none" stroke="#004aef" stroke-width="1.8" opacity="0.42" style="--len:600;animation-delay:0.22s"/><path class="pop" d="M395.1 329.7 Q394.7 315.7 408.7 315.7 L623.3 315.7 Q637.3 315.7 636.9 329.7 L636.7 339.1 Q636.3 353.1 622.3 353.1 L409.7 353.1 Q395.7 353.1 395.3 339.1 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.43s"/><text x="516.0" y="340.7" text-anchor="middle" font-size="12" fill="#5f656d" font-weight="400">crm pricing 2026</text><path class="draw" d="M516.0 353.1 L516.0 393.3 L516.0 413.9 L516.0 448.0" fill="none" stroke="#004aef" stroke-width="1.8" opacity="0.42" style="--len:600;animation-delay:0.62s"/><path class="draw" d="M516.0 194.1 L516.0 257.5 L784.2 279.5 L782.1 315.7" fill="none" stroke="#004aef" stroke-width="1.8" opacity="0.42" style="--len:600;animation-delay:0.28s"/><path class="pop" d="M660.3 329.7 Q660.8 315.7 674.8 315.7 L889.3 315.7 Q903.3 315.7 902.1 329.6 L901.3 339.1 Q900.1 353.1 886.1 353.1 L673.6 353.1 Q659.6 353.1 660.0 339.1 Z" fill="url(#gchip)" style="--o:0.85;animation-delay:0.50s"/><text x="780.6" y="340.7" text-anchor="middle" font-size="12" fill="#5f656d" font-weight="400">crm vs spreadsheet</text><path class="draw" d="M779.8 353.1 L777.4 393.3 L516.0 413.9 L516.0 448.0" fill="none" stroke="#004aef" stroke-width="1.8" opacity="0.42" style="--len:600;animation-delay:0.68s"/><path class="expandy" d="M288.9 462.0 Q288.2 448.0 302.2 448.0 L729.8 448.0 Q743.8 448.0 743.1 462.0 L742.1 480.8 Q741.3 494.8 727.3 494.8 L304.7 494.8 Q290.7 494.8 289.9 480.8 Z" fill="url(#ggreen)" style="--o:0.22;animation-delay:0.78s"/><text x="516.0" y="476.5" text-anchor="middle" font-size="13" fill="#04815a" font-weight="500">one answer</text></g><g class="mark"><line x1="765.7" y1="253.9" x2="807.7" y2="253.9" stroke="#04815a" stroke-width="1.4"/><text x="817.7" y="247.9" font-size="17" fill="#04815a">one question becomes</text><text x="817.7" y="269.9" font-size="17" fill="#04815a">three searches</text></g><text x="190.0" y="100.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">the fan-out, and what comes back</text>
</svg>
