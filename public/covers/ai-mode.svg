<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FDE7F3"/>
      <stop offset="1" stop-color="#FFF9FC"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <radialGradient id="mse8" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FF8BCB"/>
      <stop offset="1" stop-color="#C2185B"/>
    </radialGradient>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="260" cy="170" r="230" fill="#E52592" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="500" r="240" fill="#FF8BCB" fill-opacity="0.65" filter="url(#soft)"/>
  <circle cx="760" cy="280" r="165" fill="url(#mse8)"/>
  <g class="spin" style="transform-origin:760px 280px">
    <ellipse cx="760" cy="280" rx="255" ry="92" fill="none" stroke="#9C166B" stroke-opacity="0.35" stroke-width="2" transform="rotate(-18 760 280)"/>
    <circle cx="1005" cy="215" r="13" fill="#C2185B"/>
  </g>
  <g class="sparkle" style="transform-origin:600px 120px"><path d="M 600 74 Q 610.12 109.88 646 120 Q 610.12 130.12 600 166 Q 589.88 130.12 554 120 Q 589.88 109.88 600 74 Z" fill="#C2185B"/></g>
  <text x="60" y="580" font-size="360" font-weight="700" fill="#9C166B" fill-opacity="0.16" letter-spacing="-12">08</text>
</svg>
