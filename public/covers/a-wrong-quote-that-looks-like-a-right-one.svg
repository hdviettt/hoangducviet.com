<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#2f6bf6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a72f4"/>
      <stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b1a3a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g filter="url(#lift)"><polygon class="rise" points="-18.3,95.1 1218.3,95.1 1157.9,553.3 42.1,553.3" fill="url(#plate)" filter="url(#soft)" style="--o:1;animation-delay:0s"/><polygon class="rise" points="32.7,123.7 860.0,123.7 858.6,148.2 35.7,148.2" fill="url(#head)" style="--o:1;animation-delay:0.04s"/><text x="51.3" y="140.7" text-anchor="start" font-size="12" fill="#ffffff" font-weight="600">SEO Production Quote</text><polygon class="rise" points="676.7,128.9 755.8,128.9 755.3,143.5 676.5,143.5" fill="#ffffff" style="--o:0.18;animation-delay:0.06s"/><text x="716.0" y="139.3" text-anchor="middle" font-size="8.5" fill="#ffffff" font-weight="400">Run</text><polygon class="rise" points="762.9,128.9 843.2,128.9 842.4,143.5 762.4,143.5" fill="#ffffff" style="--o:0.28;animation-delay:0.06s"/><text x="802.6" y="139.3" text-anchor="middle" font-size="8.5" fill="#ffffff" font-weight="400">Agent</text><polygon class="rise" points="43.1,151.0 146.5,151.0 148.2,168.7 45.2,168.7" fill="#004aef" style="--o:0.1;animation-delay:0.09s"/><text x="96.2" y="163.6" text-anchor="middle" font-size="10" fill="#1f2124" font-weight="600">Quote</text><text x="213.3" y="163.6" text-anchor="middle" font-size="9.5" fill="#5f656d" font-weight="400">Justify</text><text x="330.5" y="163.6" text-anchor="middle" font-size="9.5" fill="#5f656d" font-weight="400">Topics</text><text x="447.7" y="163.6" text-anchor="middle" font-size="9.5" fill="#5f656d" font-weight="400">Rivals</text><text x="564.8" y="163.6" text-anchor="middle" font-size="9.5" fill="#5f656d" font-weight="400">Commitment</text><text x="682.0" y="163.6" text-anchor="middle" font-size="9.5" fill="#5f656d" font-weight="400">Keywords</text><text x="799.2" y="163.6" text-anchor="middle" font-size="9.5" fill="#5f656d" font-weight="400">Assumptions</text><text x="69.4" y="185.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="600">Quote</text><text x="133.5" y="185.4" text-anchor="start" font-size="9" fill="#5f656d" font-weight="400">edit directly in the table</text><polygon class="rise" points="53.3,196.8 855.9,196.8 855.1,211.5 55.0,211.5" fill="#f0f4f9" style="--o:1;animation-delay:0.10s"/><text x="71.9" y="206.9" text-anchor="start" font-size="8.5" fill="#5f656d" font-weight="600">Item</text><text x="483.9" y="206.9" text-anchor="end" font-size="8.5" fill="#5f656d" font-weight="600">Qty</text><text x="623.2" y="206.9" text-anchor="end" font-size="8.5" fill="#5f656d" font-weight="600">Unit</text><text x="756.7" y="206.9" text-anchor="end" font-size="8.5" fill="#5f656d" font-weight="600">Min cost</text><text x="843.8" y="206.9" text-anchor="end" font-size="8.5" fill="#5f656d" font-weight="600">Max cost</text><polygon class="rise" points="437.1,196.8 675.6,196.8 675.4,211.5 437.7,211.5" fill="#004aef" style="--o:0.06;animation-delay:0.11s"/><polygon class="rise" points="55.0,211.5 855.1,211.5 853.8,235.0 57.8,235.0" fill="#f6f8fb" style="--o:1;animation-delay:0.16s"/><circle class="pop" cx="65.7" cy="223.3" r="3.4" fill="#07ef9c" style="--o:1;animation-delay:0.18s"/><text x="89.4" y="228.7" text-anchor="start" font-size="10" fill="#1f2124" font-weight="600">Content</text><polygon class="rise" points="57.7,234.1 853.8,234.1 853.8,235.0 57.8,235.0" fill="#dfe4ec" style="--o:0.7;animation-delay:0.16s"/><circle class="pop" cx="68.4" cy="246.7" r="3.4" fill="#07ef9c" style="--o:1;animation-delay:0.23s"/><text x="92.0" y="252.1" text-anchor="start" font-size="9.5" fill="#1f2124" font-weight="400">New blog posts</text><text x="485.1" y="252.1" text-anchor="end" font-size="9.5" fill="#1f2124" font-weight="400">62</text><polygon class="rise" points="565.4,241.3 674.9,241.3 674.7,252.1 565.5,252.1" fill="#004aef" style="--o:0.16;animation-delay:0.25s"/><polygon class="rise" points="715.2,242.2 847.6,242.2 847.1,251.2 715.0,251.2" fill="#5f656d" style="--o:0.14;animation-delay:0.26s"/><polygon class="rise" points="60.5,257.5 852.5,257.5 852.5,258.4 60.6,258.4" fill="#dfe4ec" style="--o:0.7;animation-delay:0.21s"/><circle class="pop" cx="71.1" cy="269.9" r="3.4" fill="#07ef9c" style="--o:1;animation-delay:0.28s"/><text x="94.6" y="275.3" text-anchor="start" font-size="9.5" fill="#1f2124" font-weight="400">Product posts</text><text x="485.7" y="275.3" text-anchor="end" font-size="9.5" fill="#1f2124" font-weight="400">28</text><polygon class="rise" points="565.6,264.6 674.5,264.6 674.3,275.3 565.7,275.3" fill="#004aef" style="--o:0.16;animation-delay:0.30s"/><polygon class="rise" points="714.6,265.5 846.4,265.5 845.9,274.4 714.4,274.4" fill="#5f656d" style="--o:0.14;animation-delay:0.31s"/><polygon class="rise" points="63.2,280.6 851.3,280.6 851.2,281.5 63.3,281.5" fill="#dfe4ec" style="--o:0.7;animation-delay:0.26s"/><polygon class="rise" points="63.3,281.5 851.2,281.5 849.9,304.3 66.1,304.3" fill="#f6f8fb" style="--o:1;animation-delay:0.31s"/><circle class="rise" cx="73.8" cy="292.9" r="3.4" fill="#004aef" style="--o:1;animation-delay:0.33s"/><text x="97.2" y="298.2" text-anchor="start" font-size="10" fill="#1f2124" font-weight="600">Off-page</text><polygon class="rise" points="66.0,303.4 850.0,303.4 849.9,304.3 66.1,304.3" fill="#dfe4ec" style="--o:0.7;animation-delay:0.31s"/><circle class="rise" cx="76.5" cy="315.6" r="3.4" fill="#004aef" style="--o:1;animation-delay:0.38s"/><text x="99.7" y="320.9" text-anchor="start" font-size="9.5" fill="#1f2124" font-weight="400">Guest-post links</text><polygon class="rise" points="68.7,326.1 848.7,326.1 848.7,326.9 68.8,326.9" fill="#dfe4ec" style="--o:0.7;animation-delay:0.36s"/><polygon class="rise" points="68.8,326.9 848.7,326.9 847.4,349.3 71.4,349.3" fill="#f6f8fb" style="--o:1;animation-delay:0.41s"/><circle class="pop" cx="79.1" cy="338.2" r="3.4" fill="#07ef9c" style="--o:1;animation-delay:0.43s"/><text x="102.2" y="343.3" text-anchor="start" font-size="10" fill="#1f2124" font-weight="600">Technical</text><polygon class="rise" points="71.3,348.5 847.5,348.5 847.4,349.3 71.4,349.3" fill="#dfe4ec" style="--o:0.7;animation-delay:0.41s"/><polygon class="rise" points="71.4,349.3 847.4,349.3 846.2,371.5 74.1,371.5" fill="#f6f8fb" style="--o:1;animation-delay:0.46s"/><circle class="rise" cx="81.7" cy="360.4" r="3.4" fill="#e0a000" style="--o:1;animation-delay:0.48s"/><text x="104.7" y="365.5" text-anchor="start" font-size="10" fill="#1f2124" font-weight="600">Personnel</text><polygon class="rise" points="74.0,370.6 846.2,370.6 846.2,371.5 74.1,371.5" fill="#dfe4ec" style="--o:0.7;animation-delay:0.46s"/><polygon class="type" points="100.9,311.3 441.2,311.3 441.5,320.0 101.9,320.0" fill="#004aef" style="--o:0.1;animation-delay:0.90s"/><polygon class="rise" points="74.4,374.0 846.0,374.0 844.9,395.1 76.9,395.1" fill="#004aef" style="--o:0.09;animation-delay:0.90s"/><text x="107.3" y="388.0" text-anchor="start" font-size="11" fill="#1f2124" font-weight="700">QUOTE TOTAL</text><polygon class="pop" points="667.0,380.0 840.1,380.0 839.6,390.1 666.9,390.1" fill="#004aef" style="--o:0.6;animation-delay:0.94s"/><polygon class="rise" points="877.7,123.7 1167.3,123.7 1118.1,527.8 853.6,527.8" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.10s"/><polygon class="rise" points="877.7,123.7 1167.3,123.7 1164.3,148.2 876.3,148.2" fill="#f6f8fb" style="--o:1;animation-delay:0.11s"/><text x="896.8" y="139.7" text-anchor="start" font-size="10.5" fill="#1f2124" font-weight="600">Quoting agent</text><polygon class="rise" points="922.4,161.3 1145.1,161.3 1140.2,202.8 919.5,202.8" fill="url(#chip)" style="--o:1;animation-delay:0.50s"/><text x="1131.2" y="180.7" text-anchor="end" font-size="8.5" fill="#ffffff" font-weight="400">rivals: dropped 4 sites</text><text x="1129.8" y="192.7" text-anchor="end" font-size="8.5" fill="#ffffff" font-weight="400">that only share a keyword</text><polygon class="rise" points="891.9,216.5 1098.1,216.5 1092.9,263.7 888.9,263.7" fill="#f2f4f9" style="--o:1;animation-delay:0.56s"/><text x="906.7" y="237.3" text-anchor="start" font-size="8.5" fill="#5f656d" font-weight="400">assembled the cost table,</text><text x="905.9" y="249.4" text-anchor="start" font-size="8.5" fill="#5f656d" font-weight="400">9 of 9 steps done.</text><polygon class="rise" points="914.5,274.8 1131.7,274.8 1127.1,314.3 911.7,314.3" fill="url(#chip)" style="--o:1;animation-delay:0.62s"/><text x="1118.2" y="293.3" text-anchor="end" font-size="8.5" fill="#ffffff" font-weight="400">invariant gate: every</text><text x="1116.8" y="304.7" text-anchor="end" font-size="8.5" fill="#ffffff" font-weight="400">number present before ship</text><polygon class="rise" points="874.2,494.0 1105.9,494.0 1102.8,519.9 872.5,519.9" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.70s"/><text x="888.4" y="509.2" text-anchor="start" font-size="8.5" fill="#5f656d" font-weight="400">message the agent…</text></g>
</svg>
