<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop: the figure resolves on a sweep, the one annotation arrives,
       then it rests. Reduced motion paints the finished frame, which is also
       what the og:image renderer captures. */
    .c { opacity: 0; animation: fill 14s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0 } 22%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }
    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }
    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 34% { opacity: 0 } 46%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .c { opacity: var(--o, 1); animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><line x1="217.7" y1="487.5" x2="814.3" y2="487.5" stroke="#dfe4ec"/><line x1="217.7" y1="487.5" x2="193.4" y2="138.8" stroke="#dfe4ec"/><path class="draw" d="M214.3 438.6 L228.6 426.6 L243.0 416.1 L257.6 406.8 L272.4 398.8 L287.3 391.9 L302.2 386.1 L317.3 381.1 L332.4 377.0 L347.6 373.6 L362.8 370.8 L378.0 368.7 L393.3 367.1 L408.6 366.0 L423.9 365.4 L439.3 365.1 L454.6 365.1 L470.0 365.4 L485.3 366.0 L500.7 366.8 L516.0 367.8 L531.3 369.0 L546.6 370.3 L562.0 371.7 L577.3 373.2 L592.5 374.8 L607.8 376.4 L623.1 378.1 L638.3 379.8 L653.6 381.6 L668.8 383.4 L684.0 385.1 L699.2 386.9 L714.4 388.7 L729.6 390.4 L744.7 392.1 L759.9 393.8 L775.0 395.5 L790.2 397.1 L805.3 398.7 L820.4 400.3" fill="none" stroke="#004aef" stroke-width="2.6" style="--len:900"/><circle class="c" cx="439.3" cy="365.1" r="7" fill="#07ef9c" style="--o:1"/></g><g class="mark"><line x1="449.3" y1="359.1" x2="491.3" y2="359.1" stroke="#04815a" stroke-width="1.4"/><text x="501.3" y="353.1" font-size="17" fill="#04815a">as much freedom as</text><text x="501.3" y="375.1" font-size="17" fill="#04815a">it can be trusted with</text></g><text x="190.0" y="100.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">how well it works in production</text><text x="790.0" y="566.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">how much the agent decides</text>
</svg>
