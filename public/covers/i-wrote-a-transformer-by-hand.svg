<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, Arial, sans-serif">
  <style>
    /* Drawn in the same language as the figures inside the post: flat bars, a
       hairline baseline, one warm accent, and nothing else. No gradient wash,
       no blurred circles, no brand sweep. The old cover had all three and read
       as though it had been imported from a different article.

       12s loop. The bars land in order, the keyword counter arrives third and
       almost catches the model, and the line under it holds. */

    .bar { transform-origin: 236px 0; transform: scaleX(0);
           animation: grow 12s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 16%, 86% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .b2 { animation-delay: .35s } .b3 { animation-delay: .7s }
    .b4 { animation-delay: 1.05s } .b5 { animation-delay: 1.4s }

    .val { opacity: 0; animation: show 12s ease infinite; }
    @keyframes show { 0%, 10% { opacity: 0 } 22%, 86% { opacity: 1 } 100% { opacity: 0 } }
    .v2 { animation-delay: .35s } .v3 { animation-delay: .7s }
    .v4 { animation-delay: 1.05s } .v5 { animation-delay: 1.4s }

    .note { opacity: 0; animation: note 12s ease infinite; }
    @keyframes note { 0%, 36% { opacity: 0 } 48%, 84% { opacity: 1 } 94%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .bar { transform: scaleX(1); animation: none }
      .val, .note { opacity: 1; animation: none }
    }
  </style>

  <rect width="1200" height="630" fill="#ffffff"/>

  <text x="96" y="128" font-size="20" font-weight="600" fill="#004aef" letter-spacing="2.4">MINI-RERANKER</text>
  <text x="96" y="196" font-size="46" font-weight="600" fill="#1f2124">I tried to train a cross-encoder</text>
  <text x="96" y="252" font-size="46" font-weight="600" fill="#1f2124">from scratch and it sucked</text>

  <line x1="96" y1="300" x2="1104" y2="300" stroke="#e1e6ec"/>

  <!-- the same ladder as the figure in section 5, same geometry, same palette -->
  <g font-size="19" fill="#5f656d">
    <text x="220" y="352" text-anchor="end">random shuffle</text>
    <text x="220" y="398" text-anchor="end">no reranking</text>
    <text x="220" y="444" text-anchor="end">count keywords</text>
    <text x="220" y="490" text-anchor="end">mine, by hand</text>
    <text x="220" y="536" text-anchor="end">ms-marco-MiniLM</text>
  </g>

  <g>
    <rect class="bar"    x="236" y="336" width="416" height="18" rx="3" fill="#004aef" opacity="0.28"/>
    <rect class="bar b2" x="236" y="382" width="425" height="18" rx="3" fill="#004aef" opacity="0.28"/>
    <rect class="bar b3" x="236" y="428" width="507" height="18" rx="3" fill="#c2410c"/>
    <rect class="bar b4" x="236" y="474" width="541" height="18" rx="3" fill="#004aef"/>
    <rect class="bar b5" x="236" y="520" width="718" height="18" rx="3" fill="#004aef"/>
  </g>

  <g font-size="19" font-weight="600" fill="#1f2124">
    <text class="val"    x="666" y="352">0.510</text>
    <text class="val v2" x="675" y="398">0.516</text>
    <text class="val v3" x="757" y="444" fill="#c2410c">0.573</text>
    <text class="val v4" x="791" y="490">0.596</text>
    <text class="val v5" x="968" y="536">0.720</text>
  </g>

  <g class="note">
    <line x1="757" y1="452" x2="791" y2="482" stroke="#c2410c" stroke-width="1.4"/>
    <text x="836" y="447" font-size="18" fill="#c2410c">five lines of keyword counting, no model</text>
  </g>

  <text x="96" y="588" font-size="18" fill="#5f656d">nDCG@10 on 800 held-out MS MARCO queries, labelled by Microsoft's annotators</text>
</svg>
