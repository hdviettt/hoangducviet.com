<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="frameclip">
      <rect x="650" y="165" width="240" height="300" rx="20"/>
    </clipPath>
    <style>
      /* 11s loop: a raw draft rides into the LLM gate; on the other side the
         article re-assembles inside a CMS frame block by block — H1, meta,
         body, image — and ends on a green "published" pulse. The echo
         outlines behind the frame are the CMS-adaptable part: same article,
         any CMS shape. */
      .draft { animation: travel 11s ease-in-out infinite; }
      @keyframes travel {
        0% { transform: translateX(0); opacity: 0; }
        4% { opacity: 1; }
        6% { transform: translateX(0); }
        16% { transform: translateX(230px); opacity: 1; }
        20% { transform: translateX(230px); opacity: 0; }
        96%, 100% { transform: translateX(0); opacity: 0; }
      }
      .gateband { animation: gate 11s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes gate {
        0%, 12% { transform: scaleY(0.25); opacity: 0.35; }
        17% { transform: scaleY(1); opacity: 0.95; }
        24%, 100% { transform: scaleY(0.25); opacity: 0.35; }
      }
      .b1, .b2, .b3, .b4, .b5, .b6 { opacity: 0; }
      .b1 { animation: pop1 11s ease-out infinite; }
      .b2 { animation: pop2 11s ease-out infinite; }
      .b3 { animation: pop3 11s ease-out infinite; }
      .b4 { animation: pop4 11s ease-out infinite; }
      .b5 { animation: pop5 11s ease-out infinite; }
      .b6 { animation: pop6 11s ease-out infinite; }
      @keyframes pop1 { 0%, 21% { opacity: 0; transform: translateY(8px); } 25% { opacity: 1; transform: translateY(0); } 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes pop2 { 0%, 27% { opacity: 0; transform: translateY(8px); } 31% { opacity: 1; transform: translateY(0); } 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes pop3 { 0%, 32% { opacity: 0; transform: translateY(8px); } 36% { opacity: 1; transform: translateY(0); } 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes pop4 { 0%, 36% { opacity: 0; transform: translateY(8px); } 40% { opacity: 1; transform: translateY(0); } 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes pop5 { 0%, 40% { opacity: 0; transform: translateY(8px); } 44% { opacity: 1; transform: translateY(0); } 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes pop6 { 0%, 45% { opacity: 0; transform: translateY(10px) scale(0.96); } 50% { opacity: 1; transform: translateY(0) scale(1); } 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .b6 { transform-box: fill-box; transform-origin: center; }
      .pubdot { opacity: 0; animation: pub 11s ease-out infinite; }
      @keyframes pub { 0%, 54% { opacity: 0; } 58% { opacity: 1; } 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .pubring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ring 11s ease-out infinite; }
      @keyframes ring { 0%, 54% { opacity: 0; transform: scale(0.4); } 58% { opacity: 0.7; transform: scale(1); } 68% { opacity: 0; transform: scale(2.1); } 100% { opacity: 0; } }
      .glint { opacity: 0; animation: sweep 11s ease-in-out infinite; }
      @keyframes sweep { 0%, 58% { opacity: 0; transform: translateX(-260px); } 61% { opacity: 0.55; } 68% { opacity: 0; transform: translateX(260px); } 100% { opacity: 0; transform: translateX(-260px); } }
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        /* completed frame: article assembled and published, draft consumed */
        .b1, .b2, .b3, .b4, .b5, .b6, .pubdot { opacity: 1; }
        .draft, .glint, .pubring { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="170" r="210" fill="#9FEFFC" fill-opacity="0.55" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="490" r="220" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>

  <!-- flow track: draft → gate → CMS -->
  <line x1="420" y1="315" x2="540" y2="315" stroke="url(#brand)" stroke-opacity="0.5" stroke-width="3"/>
  <line x1="620" y1="315" x2="645" y2="315" stroke="url(#brand)" stroke-opacity="0.5" stroke-width="3"/>

  <!-- the raw draft (rides into the gate) -->
  <g class="draft">
    <rect x="295" y="245" width="110" height="140" rx="16" fill="#FFFFFF" fill-opacity="0.94" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="315" y="270" width="70" height="9" rx="4.5" fill="#4e4f56" fill-opacity="0.5"/>
    <rect x="315" y="289" width="54" height="9" rx="4.5" fill="#4e4f56" fill-opacity="0.38"/>
    <rect x="315" y="308" width="62" height="9" rx="4.5" fill="#4e4f56" fill-opacity="0.3"/>
    <rect x="315" y="327" width="46" height="9" rx="4.5" fill="#4e4f56" fill-opacity="0.24"/>
    <rect x="315" y="346" width="58" height="9" rx="4.5" fill="#4e4f56" fill-opacity="0.18"/>
  </g>

  <!-- the LLM gate -->
  <rect x="548" y="215" width="72" height="200" rx="24" fill="none" stroke="url(#brand)" stroke-width="3"/>
  <rect class="gateband" x="566" y="233" width="36" height="164" rx="18" fill="url(#brand)"/>

  <!-- the CMS frame, echoed: same article, any CMS -->
  <rect x="682" y="197" width="240" height="300" rx="20" fill="none" stroke="url(#brand)" stroke-opacity="0.16" stroke-width="2.5"/>
  <rect x="666" y="181" width="240" height="300" rx="20" fill="none" stroke="url(#brand)" stroke-opacity="0.32" stroke-width="2.5"/>
  <rect x="650" y="165" width="240" height="300" rx="20" fill="#FFFFFF" fill-opacity="0.95" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="674" cy="187" r="5" fill="#0fd6f7" fill-opacity="0.8"/>
  <circle cx="691" cy="187" r="5" fill="#07ef9c" fill-opacity="0.8"/>
  <circle cx="708" cy="187" r="5" fill="#ffce00" fill-opacity="0.9"/>
  <line x1="650" y1="203" x2="890" y2="203" stroke="#E1E6EC" stroke-width="2"/>

  <!-- SEO-compliant blocks assembling inside the frame -->
  <rect class="b1" x="674" y="225" width="150" height="17" rx="8.5" fill="url(#brand)"/>
  <rect class="b2" x="674" y="254" width="104" height="12" rx="6" fill="#07ef9c" fill-opacity="0.75"/>
  <rect class="b3" x="674" y="282" width="192" height="9" rx="4.5" fill="#7E9BF7" fill-opacity="0.7"/>
  <rect class="b4" x="674" y="300" width="172" height="9" rx="4.5" fill="#7E9BF7" fill-opacity="0.55"/>
  <rect class="b5" x="674" y="318" width="182" height="9" rx="4.5" fill="#7E9BF7" fill-opacity="0.42"/>
  <g class="b6">
    <rect x="674" y="343" width="192" height="86" rx="12" fill="#9FEFFC" fill-opacity="0.55"/>
    <path d="M 706 412 L 736 380 L 758 400 L 782 372 L 812 412 Z" fill="#0fd6f7" fill-opacity="0.65"/>
    <circle cx="716" cy="368" r="9" fill="#ffce00" fill-opacity="0.9"/>
  </g>

  <!-- published -->
  <circle class="pubring" cx="866" cy="447" r="12" fill="none" stroke="#04B876" stroke-width="3"/>
  <g class="pubdot">
    <circle cx="866" cy="447" r="9" fill="#04B876"/>
    <path d="M 861.5 447 L 864.8 450.4 L 870.6 443.8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- glint sweep across the frame once it's live -->
  <g clip-path="url(#frameclip)">
    <rect class="glint" x="700" y="120" width="56" height="400" fill="#FFFFFF" transform="skewX(-18)"/>
  </g>

  <g class="sparkle">
    <path d="M 960 120 Q 968.8 147.6 996 156 Q 968.8 164.4 960 192 Q 951.2 164.4 924 156 Q 951.2 147.6 960 120 Z" fill="#ffce00"/>
  </g>
</svg>
