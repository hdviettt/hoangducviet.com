    </pattern>
    <filter id="haze" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter>
    <style>
      .nd0 { opacity: 0; animation: pop 6s ease-out infinite; animation-delay: 0.80s; }
      .nd1 { opacity: 0; animation: pop 6s ease-out infinite; animation-delay: 1.22s; }
      .nd2 { opacity: 0; animation: pop 6s ease-out infinite; animation-delay: 1.64s; }
      .nd3 { opacity: 0; animation: pop 6s ease-out infinite; animation-delay: 2.06s; }
      .nd4 { opacity: 0; animation: pop 6s ease-out infinite; animation-delay: 2.48s; }
      .nd5 { opacity: 0; animation: pop 6s ease-out infinite; animation-delay: 2.90s; }
      @keyframes pop { 0%{opacity:0;transform:translateY(-10px)} 4%{opacity:1;transform:translateY(0)} 90%{opacity:1} 96%,100%{opacity:0} }
      @media (prefers-reduced-motion: reduce){*{animation:none!important}[class^='nd']{opacity:1}}
      .doc { animation: enter 6s ease-in-out infinite; }
      @keyframes enter { 0%{opacity:0;transform:translate(563px,104px)} 8%{opacity:1} 20%{transform:translate(563px,122px)} 84%{opacity:1} 94%,100%{opacity:0;transform:translate(563px,122px)} }
      .draft { opacity: 0; animation: arrive 6s ease-out infinite; animation-delay: 3.6s; }
      @keyframes arrive { 0%{opacity:0} 6%{opacity:1} 60%{opacity:1} 70%,100%{opacity:0} }
      .orb { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @media (prefers-reduced-motion: reduce){.doc{opacity:1}.draft{opacity:1}.orb{animation:none}}
    </style>
