<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#0A56FF"/><stop offset="0.6" stop-color="#004AEF"/><stop offset="1" stop-color="#0038B8"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0FD6F7"/><stop offset="0.55" stop-color="#07EF9C"/><stop offset="1" stop-color="#04C97E"/>
    </linearGradient>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0FD6F7"/><stop offset="1" stop-color="#07EF9C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/></pattern>
    <filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#00205F" flood-opacity="0.35"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="17" flood-color="#07EF9C" flood-opacity="0.4"/></filter>
    <style>
      .flow { stroke-dasharray: 4 8; animation: dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -24 } }
      .pip { animation: pip 3s ease-in-out infinite; }
      @keyframes pip { 0%{opacity:0;transform:translateX(0)} 12%{opacity:1} 88%{opacity:1} 100%{opacity:0;transform:translateX(120px)} }
      .pip2 { animation-delay: 1.5s }
      @media (prefers-reduced-motion: reduce){ .flow{animation:none} .pip{opacity:1;animation:none} }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- ============ 1. CONTENT — a raw document ============ -->
  <g filter="url(#sh)">
    <rect x="150" y="205" width="228" height="220" rx="18" fill="#FFFFFF"/>
  </g>
  <g>
    <rect x="182" y="240" width="120" height="12" rx="6" fill="#9AA9C4"/>
    <rect x="182" y="266" width="164" height="8" rx="4" fill="#D6DEEC"/>
    <rect x="182" y="284" width="164" height="8" rx="4" fill="#D6DEEC"/>
    <rect x="182" y="302" width="120" height="8" rx="4" fill="#F0B4B4"/>
    <rect x="182" y="320" width="150" height="8" rx="4" fill="#D6DEEC"/>
    <rect x="182" y="338" width="164" height="8" rx="4" fill="#D6DEEC"/>
    <rect x="182" y="356" width="96"  height="8" rx="4" fill="#F0B4B4"/>
    <rect x="182" y="382" width="164" height="8" rx="4" fill="#EAEFF6"/>
  </g>

  <!-- flow content -> agent -->
  <line x1="384" y1="315" x2="470" y2="315" stroke="#BFE6FF" stroke-width="2" opacity="0.6"/>
  <line x1="384" y1="315" x2="470" y2="315" stroke="#FFFFFF" stroke-width="2" class="flow"/>
  <circle class="pip" cx="392" cy="315" r="4" fill="#FFFFFF"/>

  <!-- ============ 2. AGENT — the transform, brand gradient, elevated ============ -->
  <g filter="url(#glow)">
    <rect x="492" y="235" width="216" height="160" rx="22" fill="url(#node)"/>
  </g>
  <!-- a crisp white double-chevron: forward, transform -->
  <g stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M572 288 L602 315 L572 342"/>
    <path d="M614 288 L644 315 L614 342"/>
  </g>

  <!-- flow agent -> website -->
  <line x1="708" y1="315" x2="794" y2="315" stroke="#BFE6FF" stroke-width="2" opacity="0.6"/>
  <line x1="708" y1="315" x2="794" y2="315" stroke="#FFFFFF" stroke-width="2" class="flow"/>
  <circle class="pip pip2" cx="716" cy="315" r="4" fill="#FFFFFF"/>

  <!-- ============ 3. WEBSITE — the published page, ranking ============ -->
  <g filter="url(#sh)">
    <rect x="810" y="188" width="300" height="254" rx="18" fill="#FFFFFF"/>
  </g>
  <!-- browser chrome -->
  <path d="M810 206 a18 18 0 0 1 18 -18 h264 a18 18 0 0 1 18 18 v14 h-300 z" fill="#EEF3FB"/>
  <circle cx="832" cy="203" r="4" fill="#C4D0E4"/><circle cx="848" cy="203" r="4" fill="#C4D0E4"/><circle cx="864" cy="203" r="4" fill="#C4D0E4"/>
  <rect x="892" y="196" width="196" height="14" rx="7" fill="#FFFFFF"/>
  <!-- published article -->
  <rect x="838" y="244" width="180" height="14" rx="7" fill="#004AEF"/>
  <rect x="838" y="272" width="244" height="8" rx="4" fill="#D6DEEC"/>
  <rect x="838" y="290" width="220" height="8" rx="4" fill="#D6DEEC"/>
  <rect x="838" y="314" width="140" height="86" rx="10" fill="url(#img)"/>
  <rect x="998" y="322" width="84" height="8" rx="4" fill="#DEE6F1"/>
  <rect x="998" y="340" width="84" height="8" rx="4" fill="#DEE6F1"/>
  <rect x="998" y="358" width="64" height="8" rx="4" fill="#DEE6F1"/>
  <rect x="998" y="384" width="84" height="8" rx="4" fill="#EAEFF6"/>
  <rect x="838" y="416" width="244" height="8" rx="4" fill="#EAEFF6"/>
  <!-- rank-up badge, SEONGON green -->
  <g transform="translate(1054 168)">
    <circle cx="20" cy="20" r="24" fill="#07EF9C" filter="url(#glow)"/>
    <circle cx="20" cy="20" r="22" fill="#07EF9C"/>
    <path d="M10 26 L18 15 L24 21 L32 10" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 10 L32 10 L32 16" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
