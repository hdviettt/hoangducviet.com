;animation-delay:0.76s"/><polygon class="c" points="653.2,280.3 728.2,280.3 727.8,287.5 653.0,287.5" fill="#5f656d" style="--o:0.28;animation-delay:0.79s"/><polygon class="c" points="652.7,299.1 711.6,299.1 711.3,306.3 652.4,306.3" fill="#5f656d" style="--o:0.28;animation-delay:0.81s"/><polygon class="c" points="652.1,317.8 720.9,317.8 720.6,325.0 651.9,325.0" fill="#5f656d" style="--o:0.28;animation-delay:0.83s"/><path class="rise" d="M777.4 261.0 Q777.9 252.0 786.9 252.0 L868.1 252.0 Q877.1 252.0 876.4 261.0 L871.2 326.4 Q870.5 335.3 861.5 335.3 L782.1 335.3 Q773.1 335.3 773.6 326.4 Z" fill="url(#gcard)" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.80s"/><path class="type" d="M777.7 256.0 Q777.9 252.0 781.9 252.0 L873.1 252.0 Q877.1 252.0 876.8 256.0 L876.3 262.7 Q875.9 266.7 871.9 266.7 L781.1 266.7 Q777.1 266.7 777.3 262.7 Z" fill="url(#gblue)" style="--o:0.8;animation-delay:0.84s"/><polygon class="c" points="787.3,280.3 862.2,280.3 861.7,287.5 786.9,287.5" fill="#5f656d" style="--o:0.28;animation-delay:0.87s"/><polygon class="c" points="786.2,299.1 845.1,299.1 844.6,306.3 785.7,306.3" fill="#5f656d" style="--o:0.28;animation-delay:0.89s"/><polygon class="c" points="785.1,317.8 853.9,317.8 853.3,325.0 784.6,325.0" fill="#5f656d" style="--o:0.28;animation-delay:0.91s"/><g class="rise" style="--o:1;animation-delay:0.9s" transform="rotate(-7 516.0 494.8)"><path class="rise" d="M470.6 465.4 Q470.5 456.4 479.5 456.4 L556.3 456.4 Q565.3 456.4 565.2 465.4 L564.5 523.5 Q564.4 532.5 555.4 532.5 L480.3 532.5 Q471.3 532.5 471.2 523.5 Z" fill="url(#gcard)" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.00s"/><path class="type" d="M470.6 460.4 Q470.5 456.4 474.5 456.4 L561.3 456.4 Q565.3 456.4 565.2 460.4 L565.2 465.8 Q565.1 469.8 561.1 469.8 L474.7 469.8 Q470.7 469.8 470.6 465.8 Z" fill="url(#gchip)" style="--o:0.8;animation-delay:0.04s"/><polygon class="c" points="481.3,482.2 552.9,482.2 552.9,488.8 481.4,488.8" fill="#5f656d" style="--o:0.28;animation-delay:0.07s"/><polygon class="c" points="481.5,499.4 537.8,499.4 537.7,506.0 481.5,506.0" fill="#5f656d" style="--o:0.28;animation-delay:0.09s"/><polygon class="c" points="481.6,516.5 547.4,516.5 547.3,523.0 481.7,523.0" fill="#5f656d" style="--o:0.28;animation-delay:0.11s"/></g><path class="draw" d="M516.0 441.2 L516.0 456.4" fill="none" stroke="#04815a" stroke-width="1.8" style="--len:60;animation-delay:0.88s"/></g><g class="mark"><line x1="575.1" y1="494.8" x2="617.1" y2="494.8" stroke="#04815a" stroke-width="1.4"/><text x="627.1" y="488.8" font-size="17" fill="#04815a">one rule it did not</text><text x="627.1" y="510.8" font-size="17" fill="#04815a">pass, so it stops</text></g><text x="190.0" y="100.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">a draft, the rules, and the page that comes out</text>
</svg>
