<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop: the figure resolves on a sweep, the one annotation arrives,
       then it rests. Reduced motion paints the finished frame, which is also
       what the og:image renderer captures. */
    .c { opacity: 0; animation: fill 14s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0 } 22%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }
    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }
    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 34% { opacity: 0 } 46%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .c { opacity: var(--o, 1); animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><polygon class="c" points="195.3,166.3 836.7,166.3 831.9,234.8 200.1,234.8" fill="#004aef" style="--o:0.3;animation-delay:0.00s"/><text x="183.7" y="205.8" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">what the model wrote</text><polygon class="c" points="203.7,287.3 590.9,287.3 589.9,352.3 208.2,352.3" fill="#004aef" style="--o:0.62;animation-delay:0.14s"/><text x="192.0" y="325.0" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">what passed the rules</text><polygon class="c" points="211.7,402.0 503.8,402.0 504.0,463.8 216.0,463.8" fill="#07ef9c" style="--o:1.0;animation-delay:0.28s"/><text x="199.9" y="438.1" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">what got published</text></g><g class="mark"><line x1="501.9" y1="433.1" x2="543.9" y2="433.1" stroke="#04815a" stroke-width="1.4"/><text x="553.9" y="427.1" font-size="17" fill="#04815a">one call, and the half</text><text x="553.9" y="449.1" font-size="17" fill="#04815a">of it worth keeping</text></g><text x="330.0" y="566.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">a single generation, then the checks</text>
</svg>
