<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.44" r="0.95">
      <stop offset="0" stop-color="#0E1A31"/><stop offset="0.58" stop-color="#080D18"/><stop offset="1" stop-color="#04060B"/>
    </radialGradient>
    <linearGradient id="paneA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111F36" stop-opacity="0.85"/><stop offset="1" stop-color="#0B1730" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="paneR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2447"/><stop offset="1" stop-color="#081E3C"/>
    </linearGradient>
    <linearGradient id="amberEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFC400"/>
      <stop offset="1" stop-color="#FFD84D" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="380" ry="240" fill="#0B6BFF" fill-opacity="0.09" filter="url(#soft)"/>

  <g transform="translate(600 315) scale(1.02)">
    <!-- centre the stack around (0,0); skewY gives depth -->
    <g transform="translate(-300 -150) skewY(16)">
      <!-- back pane: target markup, faintest -->
      <g transform="translate(70 -34)">
        <rect x="0" y="0" width="286" height="250" rx="9" fill="url(#paneA)" stroke="#2B476E" stroke-width="0"/>
        <rect x="0" y="0" width="286" height="250" rx="9" fill="none" stroke="#2B476E" stroke-width="1.5"/>
        <g stroke="#2E5C9E" stroke-width="2" stroke-linecap="round" opacity="0.42">
          <line x1="30" y1="48" x2="196" y2="48"/><line x1="30" y1="74" x2="150" y2="74"/>
          <line x1="30" y1="100" x2="224" y2="100"/><line x1="30" y1="126" x2="140" y2="126"/>
          <line x1="30" y1="152" x2="200" y2="152"/><line x1="30" y1="178" x2="168" y2="178"/>
        </g>
      </g>
      <!-- front pane: source markup -->
      <g transform="translate(0 34)">
        <rect x="0" y="0" width="286" height="250" rx="9" fill="url(#paneA)" stroke="#375782" stroke-width="1.75"/>
        <g stroke="#3E6DA8" stroke-width="2" stroke-linecap="round" opacity="0.62">
          <line x1="30" y1="48" x2="176" y2="48"/><line x1="30" y1="74" x2="214" y2="74"/>
          <line x1="30" y1="100" x2="146" y2="100"/><line x1="30" y1="126" x2="196" y2="126"/>
          <line x1="30" y1="152" x2="172" y2="152"/><line x1="30" y1="178" x2="120" y2="178"/>
        </g>
      </g>
    </g>

    <!-- the single amber seam: one bright vertical edge where the two are reconciled -->
    <g transform="translate(0 0)">
      <rect x="-6" y="-150" width="12" height="300" fill="#FFC400" opacity="0.12" filter="url(#soft)"/>
      <rect x="-1.5" y="-140" width="3" height="280" fill="url(#amberEdge)"/>
    </g>

    <!-- the result pane: crisp blue, forward, emerging past the seam -->
    <g transform="translate(16 -120) skewY(16)">
      <rect x="0" y="0" width="286" height="250" rx="9" fill="#0A1F3D" stroke="#2E86FF" stroke-width="2"/>
      <g stroke-linecap="round">
        <line x1="30" y1="48" x2="196" y2="48" stroke="#2E86FF" stroke-width="7"/>
        <line x1="30" y1="76" x2="236" y2="76" stroke="#3E6DA8" stroke-width="3"/>
        <line x1="30" y1="96" x2="236" y2="96" stroke="#3E6DA8" stroke-width="3"/>
        <line x1="30" y1="116" x2="210" y2="116" stroke="#3E6DA8" stroke-width="3"/>
        <line x1="30" y1="150" x2="196" y2="150" stroke="#28405f" stroke-width="3"/>
        <line x1="30" y1="170" x2="236" y2="170" stroke="#28405f" stroke-width="3"/>
        <line x1="30" y1="190" x2="168" y2="190" stroke="#28405f" stroke-width="3"/>
      </g>
    </g>
  </g>

  <text x="150" y="486" font-size="14.5" fill="#5E7398">source and target markup, read once</text>
  <text x="1050" y="486" font-size="14.5" fill="#6E90C8" text-anchor="end">every article after, deterministic</text>
</svg>
