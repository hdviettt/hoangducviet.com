<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F3F8FF"/>
      <stop offset="1" stop-color="#EEFBF6"/>
    </linearGradient>
    <linearGradient id="seon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004AEF"/>
      <stop offset="0.52" stop-color="#0FD6F7"/>
      <stop offset="1" stop-color="#07EF9C"/>
    </linearGradient>
    <linearGradient id="seonV" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#004AEF"/><stop offset="1" stop-color="#07EF9C"/>
    </linearGradient>
    <linearGradient id="imgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#004AEF"/>
      <stop offset="0.55" stop-color="#0FD6F7"/>
      <stop offset="1" stop-color="#07EF9C"/>
    </linearGradient>
    <filter id="cardsh" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#0A4B9E" flood-opacity="0.15"/>
    </filter>
    <style>
      /* one article rises off the stack and climbs — continuous publishing */
      .rise { animation: rise 4.5s ease-out infinite; }
      .rise2 { animation-delay: 2.25s; }
      @keyframes rise {
        0%   { opacity: 0; transform: translate(0,0) }
        14%  { opacity: 0.55 }
        100% { opacity: 0; transform: translate(96px,-96px) }
      }
      @media (prefers-reduced-motion: reduce) { .rise { display: none } }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="120" r="220" fill="#004AEF" opacity="0.04"/>
  <circle cx="1050" cy="560" r="220" fill="#07EF9C" opacity="0.05"/>

  <!-- kicker, upper-left in the open space -->
  <text x="150" y="150" font-size="13" fill="#7C8CA6" letter-spacing="2">SEO CONTENT PUBLISHING</text>
  <text x="150" y="196" font-size="30" font-weight="700" fill="#0A1B33" letter-spacing="-0.5">One document in,</text>
  <text x="150" y="234" font-size="30" font-weight="700" fill="#0A1B33" letter-spacing="-0.5">a ranking article out.</text>
  <rect x="150" y="262" width="54" height="4" rx="2" fill="url(#seon)"/>

  <!-- ============ SEONGON echo trail — the rising stack of published articles ============ -->
  <g fill="none" stroke-width="2">
    <rect x="612" y="286" width="440" height="286" rx="20" stroke="url(#seon)" opacity="0.20"/>
    <rect x="632" y="266" width="440" height="286" rx="20" stroke="url(#seon)" opacity="0.32"/>
    <rect x="652" y="246" width="440" height="286" rx="20" stroke="url(#seon)" opacity="0.5"/>
    <rect x="672" y="226" width="440" height="286" rx="20" stroke="url(#seon)" opacity="0.72"/>
    <!-- the rising ones, animated -->
    <rect class="rise" x="692" y="206" width="440" height="286" rx="20" stroke="url(#seon)"/>
    <rect class="rise rise2" x="692" y="206" width="440" height="286" rx="20" stroke="url(#seon)"/>
  </g>

  <!-- ============ the published article, crisp and forward ============ -->
  <g filter="url(#cardsh)">
    <rect x="692" y="206" width="440" height="286" rx="20" fill="#FFFFFF" stroke="#E6ECF4" stroke-width="1"/>
  </g>
  <rect x="728" y="246" width="270" height="18" rx="6" fill="#004AEF"/>
  <rect x="728" y="278" width="330" height="10" rx="5" fill="#CBD8EA"/>
  <rect x="728" y="295" width="300" height="10" rx="5" fill="#CBD8EA"/>
  <rect x="728" y="324" width="180" height="108" rx="12" fill="url(#imgg)"/>
  <rect x="932" y="332" width="164" height="9" rx="4" fill="#D7E0EE"/>
  <rect x="932" y="350" width="164" height="9" rx="4" fill="#D7E0EE"/>
  <rect x="932" y="368" width="130" height="9" rx="4" fill="#D7E0EE"/>
  <rect x="932" y="392" width="164" height="9" rx="4" fill="#E4EBF4"/>
  <rect x="932" y="410" width="110" height="9" rx="4" fill="#E4EBF4"/>
  <rect x="728" y="452" width="368" height="8" rx="4" fill="#E4EBF4"/>
  <rect x="728" y="469" width="300" height="8" rx="4" fill="#E4EBF4"/>

  <!-- rank-up chip: the SEO payoff, SEONGON green -->
  <g transform="translate(1038 218)">
    <rect x="0" y="0" width="66" height="38" rx="11" fill="#EAFBF3" stroke="#07EF9C" stroke-width="1.25"/>
    <path d="M13 25 L23 14 L30 21 L44 8" fill="none" stroke="url(#seonV)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 8 L44 8 L44 14" fill="none" stroke="#07EF9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- caption, clear bottom-left -->
  <text x="150" y="470" font-size="16" fill="#46566E" width="380">A raw Google Doc becomes a formatted,</text>
  <text x="150" y="496" font-size="16" fill="#46566E">image-optimised WordPress draft — with</text>
  <text x="150" y="522" font-size="16" fill="#46566E">no model anywhere in the publishing path.</text>
</svg>
