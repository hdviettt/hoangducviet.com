<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.44" r="0.95">
      <stop offset="0" stop-color="#0E1A31"/><stop offset="0.6" stop-color="#080D18"/><stop offset="1" stop-color="#04060B"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFC400"/>
      <stop offset="1" stop-color="#FFD84D" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="15"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; }
      /* raw shows to the RIGHT of the pass; clean shows to the LEFT. Same boundary. */
      #raw   { animation: rawc  6s cubic-bezier(.5,0,.2,1) infinite; }
      #clean { animation: clnc  6s cubic-bezier(.5,0,.2,1) infinite; }
      #pass  { animation: sweep 6s cubic-bezier(.5,0,.2,1) infinite; }
      @keyframes rawc  { 0%,10%{clip-path: inset(0 0 0 0%)}   62%{clip-path: inset(0 0 0 100%)} 90%{clip-path: inset(0 0 0 100%)} 100%{clip-path: inset(0 0 0 0%)} }
      @keyframes clnc  { 0%,10%{clip-path: inset(0 100% 0 0)} 62%{clip-path: inset(0 0% 0 0)}    90%{clip-path: inset(0 0% 0 0)}   100%{clip-path: inset(0 100% 0 0)} }
      @keyframes sweep { 0%,10%{transform:translateX(0)}      62%{transform:translateX(878px)}   90%{transform:translateX(878px)}  100%{transform:translateX(0)} }
      @media (prefers-reduced-motion: reduce) {
        /* rest fully resolved: the clean house-style result, the pass finished
           at the right. A mid-sweep still collides two different texts on one
           line; the animation carries the transform, the still is the result. */
        #raw   { animation: none; clip-path: inset(0 0 0 100%); }
        #clean { animation: none; clip-path: inset(0 0 0 0); }
        #pass  { animation: none; transform: translateX(878px); opacity: 0.5; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="420" ry="250" fill="#0B6BFF" fill-opacity="0.08" filter="url(#soft)"/>

  <rect x="150" y="140" width="900" height="352" rx="16" fill="#0A1526" stroke="#1E3350" stroke-width="1.25"/>

  <text x="182" y="120" font-size="12" fill="#5E7398" letter-spacing="2">GOOGLE DOC MARKUP</text>
  <text x="1018" y="120" font-size="12" fill="#4E77B6" letter-spacing="2" text-anchor="end">THE SITE'S HOUSE STYLE</text>

  <!-- ============ RAW (Google Docs noise), red inline-style clutter ============ -->
  <g id="raw" class="mono">
    <text x="182" y="200" fill="#C07E7E">&lt;p style="margin:0;line-height:1.38"&gt;</text>
    <text x="182" y="242" fill="#C07E7E">  &lt;span style="fw:400"&gt;Benefits&lt;/span&gt;</text>
    <text x="182" y="284" fill="#C07E7E">&lt;/p&gt;&lt;br&gt;</text>
    <text x="182" y="326" fill="#C07E7E">&lt;p style="margin:0"&gt;Clean water&lt;/p&gt;</text>
    <text x="182" y="368" fill="#C07E7E">&lt;img src="blob:https://docs..."&gt;</text>
    <text x="182" y="410" fill="#C07E7E">&lt;table style="border:1px solid #000"&gt;</text>
    <text x="182" y="452" fill="#8A6F6F">  &lt;tr&gt;&lt;td&gt;…&lt;/td&gt;&lt;/tr&gt;</text>
  </g>

  <!-- ============ CLEAN (house style), blue ============ -->
  <g id="clean" class="mono">
    <text x="182" y="200"><tspan fill="#6E90C8">&lt;p style=</tspan><tspan fill="#5B9BFF">"text-align: justify;"</tspan><tspan fill="#6E90C8">&gt;</tspan></text>
    <text x="182" y="242"><tspan fill="#9FC0EA">  Benefits</tspan></text>
    <text x="182" y="284"><tspan fill="#6E90C8">&lt;/p&gt;</tspan></text>
    <text x="182" y="326"><tspan fill="#6E90C8">&lt;h2 class=</tspan><tspan fill="#5B9BFF">"titletab"</tspan><tspan fill="#6E90C8">&gt;Clean water&lt;/h2&gt;</tspan></text>
    <text x="182" y="368"><tspan fill="#6E90C8">&lt;img src=</tspan><tspan fill="#5B9BFF">"main-keyword-2-benefits.webp"</tspan><tspan fill="#6E90C8">&gt;</tspan></text>
    <text x="182" y="410"><tspan fill="#6E90C8">&lt;table class=</tspan><tspan fill="#5B9BFF">"has-fixed-layout"</tspan><tspan fill="#6E90C8">&gt;</tspan></text>
    <text x="182" y="452"><tspan fill="#6E90C8">  &lt;tr&gt;&lt;td&gt;…&lt;/td&gt;&lt;/tr&gt;</tspan></text>
  </g>

  <!-- ============ the agent's single pass ============ -->
  <g id="pass">
    <!-- a narrow mask riding just ahead of the line: clean code emerges from
         behind it, so the seam where two texts would collide is never seen -->
    <rect x="160" y="150" width="17" height="332" fill="#0A1526"/>
    <rect x="166" y="150" width="20" height="332" fill="#FFC400" opacity="0.14" filter="url(#soft)"/>
    <rect x="174.5" y="156" width="3" height="320" fill="url(#scan)"/>
    <circle cx="176" cy="150" r="6" fill="#FFC400"/>
    <circle cx="176" cy="150" r="6" fill="none" stroke="#FFE9A8" stroke-width="1" opacity="0.7"/>
  </g>

  <text x="600" y="546" font-size="15" fill="#C79A1E" text-anchor="middle">the agent works out the transform once — then code applies it to every article, with no model</text>
</svg>
