<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop: the figure resolves on a sweep, the one annotation arrives,
       then it rests. Reduced motion paints the finished frame, which is also
       what the og:image renderer captures. */
    .c { opacity: 0; animation: fill 14s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0 } 22%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }
    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }
    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 34% { opacity: 0 } 46%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .c { opacity: var(--o, 1); animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><line x1="207.5" y1="481.8" x2="824.5" y2="481.8" stroke="#dfe4ec"/><polygon class="c" points="232.8,444.5 332.4,444.5 334.0,481.8 235.3,481.8" fill="#004aef" style="--o:0.35;animation-delay:0.00s"/><text x="284.6" y="507.8" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">by hand</text><polygon class="c" points="386.7,387.3 487.6,387.3 488.2,481.8 389.5,481.8" fill="#004aef" style="--o:0.55;animation-delay:0.13s"/><text x="438.9" y="507.8" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">by template</text><polygon class="c" points="545.3,247.8 649.4,247.8 642.5,481.8 543.8,481.8" fill="#004aef" style="--o:0.75;animation-delay:0.26s"/><text x="593.1" y="507.8" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">by model</text><polygon class="c" points="711.4,167.6 817.3,167.6 796.7,481.8 698.0,481.8" fill="#07ef9c" style="--o:1.00;animation-delay:0.39s"/><text x="747.4" y="507.8" text-anchor="middle" font-size="14" fill="#5f656d" font-weight="400">by model, checked</text></g><g class="mark"><line x1="805.3" y1="167.6" x2="847.3" y2="167.6" stroke="#04815a" stroke-width="1.4"/><text x="857.3" y="161.6" font-size="17" fill="#04815a">volume was never</text><text x="857.3" y="183.6" font-size="17" fill="#04815a">the hard part</text></g><text x="190.0" y="100.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">words published per week</text>
</svg>
