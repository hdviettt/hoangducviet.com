<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#86F7CC"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="260" cy="180" r="230" fill="#2E62F1" fill-opacity="0.4" filter="url(#soft)"/>
  <circle class="drift2" cx="960" cy="470" r="260" fill="#3DF3B1" fill-opacity="0.45" filter="url(#soft)"/>
  <g class="float" style="transform-origin:620px 300px">
  <rect x="440" y="236.39999999999998" width="250" height="250" rx="52" fill="none" stroke="url(#brand)" stroke-opacity="0.03" stroke-width="2.5"/>
  <rect x="470" y="214.8" width="250" height="250" rx="52" fill="none" stroke="url(#brand)" stroke-opacity="0.16" stroke-width="2.5"/>
  <rect x="500" y="193.2" width="250" height="250" rx="52" fill="none" stroke="url(#brand)" stroke-opacity="0.29" stroke-width="2.5"/>
  <rect x="530" y="171.6" width="250" height="250" rx="52" fill="none" stroke="url(#brand)" stroke-opacity="0.42" stroke-width="2.5"/>
  <rect x="560" y="150" width="250" height="250" rx="52" fill="url(#brand)"/>
  </g>
  <rect x="256" y="361.68" width="150" height="150" rx="34" fill="none" stroke="url(#brand)" stroke-opacity="0.29" stroke-width="2.5"/>
  <rect x="278" y="345.84" width="150" height="150" rx="34" fill="none" stroke="url(#brand)" stroke-opacity="0.42" stroke-width="2.5"/>
  <rect x="300" y="330" width="150" height="150" rx="34" fill="url(#brandSoft)"/>
  <g class="sparkle" style="transform-origin:1000px 150px"><path d="M 1000 96 Q 1011.88 138.12 1054 150 Q 1011.88 161.88 1000 204 Q 988.12 161.88 946 150 Q 988.12 138.12 1000 96 Z" fill="#ffce00"/></g>
</svg>
