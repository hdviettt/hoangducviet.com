<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#EAF1FF"/>
      <stop offset="1" stop-color="#FAFCFF"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="280" cy="180" r="240" fill="#4285F4" fill-opacity="0.55" filter="url(#soft)"/>
  <circle class="drift2" cx="950" cy="480" r="280" fill="#8AB4F8" fill-opacity="0.7" filter="url(#soft)"/>
  <circle class="drift2" cx="700" cy="120" r="170" fill="#A8C7FA" fill-opacity="0.5" filter="url(#soft)"/>
  <g class="float" style="transform-origin:600px 340px">
  <rect x="330" y="330" width="190" height="190" rx="40" fill="#FFFFFF" fill-opacity="0.4" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="470" y="250" width="210" height="210" rx="44" fill="#FFFFFF" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="630" y="160" width="230" height="230" rx="48" fill="#FFFFFF" fill-opacity="0.7" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  </g>
  <g class="sparkle" style="transform-origin:920px 170px"><path d="M 920 106 Q 934.08 155.92 984 170 Q 934.08 184.08 920 234 Q 905.92 184.08 856 170 Q 905.92 155.92 920 106 Z" fill="#1A73E8"/></g>
</svg>
