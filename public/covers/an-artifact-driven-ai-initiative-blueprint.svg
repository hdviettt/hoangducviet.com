<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* 10s loop: the blueprint fills in — agents come online one by one. */
      .t1, .t2, .t3, .t4, .t5, .t6 { opacity: 0; }
      .t1 { animation: lit 10s ease-out infinite; }
      .t2 { animation: lit 10s ease-out infinite; animation-delay: 0.7s; }
      .t3 { animation: lit 10s ease-out infinite; animation-delay: 1.4s; }
      .t4 { animation: lit 10s ease-out infinite; animation-delay: 2.1s; }
      .t5 { animation: lit 10s ease-out infinite; animation-delay: 2.8s; }
      .t6 { animation: lit 10s ease-out infinite; animation-delay: 3.5s; }
      @keyframes lit {
        0%, 16% { opacity: 0; transform: scale(0.7); }
        22% { opacity: 1; transform: scale(1.08); }
        25% { transform: scale(1); }
        88% { opacity: 1; }
        94%, 100% { opacity: 0; }
      }
      .t1, .t2, .t3, .t4, .t5, .t6 { transform-box: fill-box; transform-origin: center; }
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .t1, .t2, .t3, .t4, .t5, .t6 { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="250" cy="170" r="220" fill="#7E9BF7" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="960" cy="480" r="250" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>

  <!-- the blueprint board, with the SEONGON echo trailing behind -->
  <rect x="322" y="186" width="460" height="340" rx="36" fill="none" stroke="url(#brand)" stroke-opacity="0.16" stroke-width="2.5"/>
  <rect x="348" y="167" width="460" height="340" rx="36" fill="none" stroke="url(#brand)" stroke-opacity="0.29" stroke-width="2.5"/>
  <rect x="374" y="148" width="460" height="340" rx="36" fill="none" stroke="url(#brand)" stroke-opacity="0.42" stroke-width="2.5"/>
  <rect x="400" y="130" width="460" height="340" rx="36" fill="#FFFFFF" fill-opacity="0.72"/>

  <!-- the roster grid: every cell planned, six coming online -->
  <g>
    <rect x="436" y="172" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="518" y="172" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="600" y="172" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="682" y="172" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="764" y="172" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="436" y="262" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="518" y="262" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="600" y="262" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="682" y="262" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="764" y="262" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="436" y="352" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="518" y="352" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="600" y="352" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="682" y="352" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="764" y="352" width="58" height="58" rx="14" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <rect class="t1" x="436" y="172" width="58" height="58" rx="14" fill="url(#brand)"/>
  <rect class="t2" x="682" y="262" width="58" height="58" rx="14" fill="url(#brand)"/>
  <rect class="t3" x="518" y="352" width="58" height="58" rx="14" fill="url(#brand)"/>
  <rect class="t4" x="682" y="172" width="58" height="58" rx="14" fill="url(#brand)"/>
  <rect class="t5" x="764" y="352" width="58" height="58" rx="14" fill="url(#brand)"/>
  <rect class="t6" x="436" y="262" width="58" height="58" rx="14" fill="url(#brand)"/>

  <g class="sparkle">
    <path d="M 950 118 Q 959.7 148.4 990 158 Q 959.7 167.6 950 198 Q 940.3 167.6 910 158 Q 940.3 148.4 950 118 Z" fill="#ffce00"/>
  </g>
</svg>
