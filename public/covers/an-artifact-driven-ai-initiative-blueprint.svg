l="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.39s"/><polygon class="pop" points="610.0,368.9 647.1,368.9 646.0,404.3 609.3,404.3" fill="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.41s"/><text x="152.8" y="454.7" text-anchor="end" font-size="12" fill="#5f656d" font-weight="400">data</text><polygon class="pop" points="179.2,435.7 215.7,435.7 218.1,470.1 181.9,470.1" fill="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.34s"/><polygon class="pop" points="226.9,435.7 263.4,435.7 265.4,470.1 229.2,470.1" fill="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.36s"/><polygon class="pop" points="274.7,435.7 311.1,435.7 312.8,470.1 276.6,470.1" fill="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.37s"/><polygon class="pop" points="322.4,435.7 358.8,435.7 360.1,470.1 323.9,470.1" fill="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.39s"/><polygon class="pop" points="370.1,435.7 406.6,435.7 407.4,470.1 371.2,470.1" fill="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.40s"/><polygon class="pop" points="417.8,435.7 454.3,435.7 454.7,470.1 418.6,470.1" fill="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.42s"/><polygon class="pop" points="465.5,435.7 502.0,435.7 502.1,470.1 465.9,470.1" fill="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.43s"/><polygon class="pop" points="513.2,435.7 549.7,435.7 549.4,470.1 513.2,470.1" fill="url(#gchip)" stroke="#dfe4ec" stroke-width="1.2" style="--o:0.95;animation-delay:0.45s"/></g><g class="mark"><line x1="335.5" y1="490.5" x2="377.5" y2="490.5" stroke="#04815a" stroke-width="1.4"/><text x="387.5" y="484.5" font-size="17" fill="#04815a">nine of them were</text><text x="387.5" y="506.5" font-size="17" fill="#04815a">runni