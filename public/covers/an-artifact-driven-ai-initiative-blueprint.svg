<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#EFF4FF"/>
      <stop offset="1" stop-color="#F9FBFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <pattern id="paper" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D9E4FB" stroke-width="1"/>
    </pattern>
    <style>
      /* 11s loop: the blueprint. Business artifacts (a table, a document,
         a report) each wire into the agent grid, and the agents they map to
         switch on — the rest of the roster stays dashed: designed, not
         built yet. Blueprint-paper treatment, blue-led. */
      .a1 { animation: art1 11s ease-in-out infinite; }
      .a2 { animation: art2 11s ease-in-out infinite; }
      .a3 { animation: art3 11s ease-in-out infinite; }
      .a1, .a2, .a3 { transform-box: fill-box; transform-origin: center; }
      @keyframes art1 { 0%, 4% { transform: scale(1); } 7% { transform: scale(1.05); } 11%, 100% { transform: scale(1); } }
      @keyframes art2 { 0%, 26% { transform: scale(1); } 29% { transform: scale(1.05); } 33%, 100% { transform: scale(1); } }
      @keyframes art3 { 0%, 46% { transform: scale(1); } 49% { transform: scale(1.05); } 53%, 100% { transform: scale(1); } }
      .w1, .w2, .w3 { stroke-dasharray: 260; stroke-dashoffset: 260; }
      .w1 { animation: wire1 11s ease-in-out infinite; }
      .w2 { animation: wire2 11s ease-in-out infinite; }
      .w3 { animation: wire3 11s ease-in-out infinite; }
      @keyframes wire1 { 0%, 7% { stroke-dashoffset: 260; } 16% { stroke-dashoffset: 0; } 95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 260; } }
      @keyframes wire2 { 0%, 29% { stroke-dashoffset: 260; } 38% { stroke-dashoffset: 0; } 95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 260; } }
      @keyframes wire3 { 0%, 49% { stroke-dashoffset: 260; } 58% { stroke-dashoffset: 0; } 95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 260; } }
      .t1a, .t1b, .t1c, .t2a, .t2b, .t2c, .t3a, .t3b, .spark { opacity: 0; transform-box: fill-box; transform-origin: center; }
      .t1a { animation: tp 11s ease-out infinite; animation-name: k1a; }
      .t1b { animation: k1b 11s ease-out infinite; }
      .t1c { animation: k1c 11s ease-out infinite; }
      .t2a { animation: k2a 11s ease-out infinite; }
      .t2b { animation: k2b 11s ease-out infinite; }
      .t2c { animation: k2c 11s ease-out infinite; }
      .t3a { animation: k3a 11s ease-out infinite; }
      .t3b { animation: k3b 11s ease-out infinite; }
      @keyframes k1a { 0%, 15% { opacity: 0; transform: scale(0.8); } 19% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes k1b { 0%, 18% { opacity: 0; transform: scale(0.8); } 22% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes k1c { 0%, 21% { opacity: 0; transform: scale(0.8); } 25% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes k2a { 0%, 37% { opacity: 0; transform: scale(0.8); } 41% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes k2b { 0%, 40% { opacity: 0; transform: scale(0.8); } 44% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes k2c { 0%, 43% { opacity: 0; transform: scale(0.8); } 47% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes k3a { 0%, 57% { opacity: 0; transform: scale(0.8); } 61% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes k3b { 0%, 60% { opacity: 0; transform: scale(0.8); } 64% { opacity: 1; transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      .spark { animation: sp 11s ease-out infinite; }
      @keyframes sp { 0%, 64% { opacity: 0; transform: scale(0.4); } 69% { opacity: 1; transform: scale(1.12); } 74% { transform: scale(1); } 94% { opacity: 1; } 99%, 100% { opacity: 0; } }
      .planned { animation: pl 11s ease-in-out infinite; }
      @keyframes pl { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 0.7; } }
      .drift1 { animation: d1 22s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(18px, -12px); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .w1, .w2, .w3 { stroke-dashoffset: 0; }
        .t1a, .t1b, .t1c, .t2a, .t2b, .t2c, .t3a, .t3b, .spark { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle class="drift1" cx="1000" cy="500" r="200" fill="#B8C9FF" fill-opacity="0.4" filter="url(#soft)"/>

  <!-- the agent roster: a blueprint grid, mostly still dashed -->
  <g class="planned" stroke="#7E9BF7" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <rect x="764" y="150" width="56" height="56" rx="14"/>
    <rect x="832" y="150" width="56" height="56" rx="14"/>
    <rect x="696" y="218" width="56" height="56" rx="14"/>
    <rect x="764" y="218" width="56" height="56" rx="14"/>
    <rect x="832" y="218" width="56" height="56" rx="14"/>
    <rect x="696" y="286" width="56" height="56" rx="14"/>
    <rect x="764" y="286" width="56" height="56" rx="14"/>
    <rect x="832" y="286" width="56" height="56" rx="14"/>
    <rect x="628" y="354" width="56" height="56" rx="14"/>
    <rect x="696" y="354" width="56" height="56" rx="14"/>
    <rect x="764" y="354" width="56" height="56" rx="14"/>
    <rect x="832" y="354" width="56" height="56" rx="14"/>
  </g>

  <!-- artifacts: the things the org already produces -->
  <g class="a1">
    <rect x="310" y="150" width="130" height="100" rx="14" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
    <rect x="326" y="166" width="98" height="14" rx="7" fill="url(#brand)" fill-opacity="0.85"/>
    <rect x="326" y="190" width="46" height="20" rx="6" fill="#E7EEFF"/>
    <rect x="378" y="190" width="46" height="20" rx="6" fill="#E7EEFF"/>
    <rect x="326" y="216" width="46" height="20" rx="6" fill="#E7EEFF"/>
    <rect x="378" y="216" width="46" height="20" rx="6" fill="#E7EEFF"/>
  </g>
  <g class="a2">
    <rect x="310" y="280" width="130" height="100" rx="14" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
    <rect x="326" y="298" width="76" height="11" rx="5.5" fill="#7E9BF7" fill-opacity="0.9"/>
    <rect x="326" y="318" width="98" height="9" rx="4.5" fill="#B9C5E8"/>
    <rect x="326" y="335" width="88" height="9" rx="4.5" fill="#B9C5E8"/>
    <rect x="326" y="352" width="94" height="9" rx="4.5" fill="#B9C5E8"/>
  </g>
  <g class="a3">
    <rect x="310" y="410" width="130" height="100" rx="14" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
    <rect x="330" y="458" width="18" height="36" rx="5" fill="#0fd6f7" fill-opacity="0.8"/>
    <rect x="356" y="440" width="18" height="54" rx="5" fill="url(#brand)" fill-opacity="0.9"/>
    <rect x="382" y="470" width="18" height="24" rx="5" fill="#07ef9c" fill-opacity="0.8"/>
    <rect x="408" y="450" width="18" height="44" rx="5" fill="#7E9BF7" fill-opacity="0.8"/>
  </g>

  <!-- wiring artifacts to the agents they define -->
  <path class="w1" d="M 440 200 C 500 200, 510 178, 560 178" fill="none" stroke="#004aef" stroke-width="3" stroke-linecap="round"/>
  <path class="w2" d="M 440 330 C 498 330, 508 246, 556 246" fill="none" stroke="#004aef" stroke-width="3" stroke-linecap="round"/>
  <path class="w3" d="M 440 460 C 498 460, 508 382, 556 382" fill="none" stroke="#004aef" stroke-width="3" stroke-linecap="round"/>

  <!-- the agents that switched on -->
  <g class="t1a"><rect x="560" y="150" width="56" height="56" rx="14" fill="url(#brand)"/><circle cx="588" cy="178" r="7" fill="#FFFFFF"/></g>
  <g class="t1b"><rect x="628" y="150" width="56" height="56" rx="14" fill="url(#brand)" fill-opacity="0.85"/><circle cx="656" cy="178" r="7" fill="#FFFFFF"/></g>
  <g class="t1c"><rect x="696" y="150" width="56" height="56" rx="14" fill="url(#brand)" fill-opacity="0.7"/><circle cx="724" cy="178" r="7" fill="#FFFFFF"/></g>
  <g class="t2a"><rect x="560" y="218" width="56" height="56" rx="14" fill="url(#brand)" fill-opacity="0.9"/><circle cx="588" cy="246" r="7" fill="#FFFFFF"/></g>
  <g class="t2b"><rect x="628" y="218" width="56" height="56" rx="14" fill="url(#brand)" fill-opacity="0.75"/><circle cx="656" cy="246" r="7" fill="#FFFFFF"/></g>
  <g class="t2c"><rect x="560" y="286" width="56" height="56" rx="14" fill="url(#brand)" fill-opacity="0.8"/><circle cx="588" cy="314" r="7" fill="#FFFFFF"/></g>
  <g class="t3a"><rect x="628" y="286" width="56" height="56" rx="14" fill="url(#brand)" fill-opacity="0.7"/><circle cx="656" cy="314" r="7" fill="#FFFFFF"/></g>
  <g class="t3b"><rect x="560" y="354" width="56" height="56" rx="14" fill="url(#brand)" fill-opacity="0.85"/><circle cx="588" cy="382" r="7" fill="#FFFFFF"/></g>

  <!-- echo signature behind the grid -->
  <rect x="576" y="166" width="328" height="260" rx="20" fill="none" stroke="url(#brand)" stroke-opacity="0.14" stroke-width="2.5" transform="translate(24, 24)"/>

  <g class="spark">
    <path d="M 872 96 Q 879 116.4 899 122 Q 879 127.6 872 148 Q 865 127.6 845 122 Q 865 116.4 872 96 Z" fill="#ffce00"/>
  </g>
</svg>
