<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#EAF1FF"/>
      <stop offset="1" stop-color="#FAFCFF"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <radialGradient id="mseAll" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#8AB4F8"/>
      <stop offset="1" stop-color="#1A73E8"/>
    </radialGradient>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="230" cy="160" r="220" fill="#4285F4" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="470" r="250" fill="#80DEEA" fill-opacity="0.6" filter="url(#soft)"/>
  <circle class="drift1" cx="600" cy="560" r="190" fill="#D7AEFB" fill-opacity="0.4" filter="url(#soft)"/>
  <circle cx="600" cy="300" r="180" fill="url(#mseAll)"/>
  <g class="spin" style="transform-origin:600px 300px">
    <ellipse cx="600" cy="300" rx="330" ry="120" fill="none" stroke="#174EA6" stroke-opacity="0.3" stroke-width="2" transform="rotate(-16 600 300)"/>
    <circle cx="917" cy="268" r="12" fill="#1A73E8"/>
    <circle cx="848" cy="359" r="12" fill="#3949AB"/>
    <circle cx="633" cy="415" r="12" fill="#0097A7"/>
    <circle cx="399" cy="404" r="12" fill="#188038"/>
    <circle cx="283" cy="332" r="12" fill="#EA8600"/>
    <circle cx="352" cy="241" r="12" fill="#D93025"/>
    <circle cx="567" cy="185" r="12" fill="#8430CE"/>
    <circle cx="801" cy="196" r="12" fill="#C2185B"/>
  </g>
  <g class="sparkle" style="transform-origin:920px 130px"><path d="M 920 74 Q 932.32 117.68 976 130 Q 932.32 142.32 920 186 Q 907.68 142.32 864 130 Q 907.68 117.68 920 74 Z" fill="#1A73E8"/></g>
</svg>
