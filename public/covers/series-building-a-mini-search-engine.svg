<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#86F7CC"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <radialGradient id="mseAll" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#004aef"/>
    </radialGradient>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="230" cy="160" r="210" fill="#7E9BF7" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="470" r="240" fill="#3DF3B1" fill-opacity="0.45" filter="url(#soft)"/>
  <circle cx="488" cy="380.64" r="180" fill="none" stroke="url(#brand)" stroke-opacity="0.02" stroke-width="2.5"/>
  <circle cx="516" cy="360.48" r="180" fill="none" stroke="url(#brand)" stroke-opacity="0.14" stroke-width="2.5"/>
  <circle cx="544" cy="340.32" r="180" fill="none" stroke="url(#brand)" stroke-opacity="0.26" stroke-width="2.5"/>
  <circle cx="572" cy="320.16" r="180" fill="none" stroke="url(#brand)" stroke-opacity="0.38" stroke-width="2.5"/>
  <circle cx="600" cy="300" r="180" fill="url(#mseAll)"/>
  <g class="spin" style="transform-origin:600px 300px">
    <ellipse cx="600" cy="300" rx="330" ry="118" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="2" transform="rotate(-16 600 300)"/>
    <circle cx="930" cy="300" r="11" fill="#004aef"/>
    <circle cx="833" cy="383" r="11" fill="#0fd6f7"/>
    <circle cx="600" cy="418" r="11" fill="#04B876"/>
    <circle cx="367" cy="383" r="11" fill="#07ef9c"/>
    <circle cx="270" cy="300" r="11" fill="#ffce00"/>
    <circle cx="367" cy="217" r="11" fill="#0AA6C4"/>
    <circle cx="600" cy="182" r="11" fill="#2E62F1"/>
    <circle cx="833" cy="217" r="11" fill="#03895A"/>
  </g>
  <g class="sparkle" style="transform-origin:930px 130px"><path d="M 930 78 Q 941.44 118.56 982 130 Q 941.44 141.44 930 182 Q 918.56 141.44 878 130 Q 918.56 118.56 930 78 Z" fill="#ffce00"/></g>
</svg>
