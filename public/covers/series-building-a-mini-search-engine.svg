="#5f656d" style="--o:0.2;animation-delay:0.81s"/><polygon class="c" points="232.3,469.1 553.3,469.1 553.2,480.8 233.0,480.8" fill="#5f656d" style="--o:0.2;animation-delay:0.83s"/></g><g class="mark"><line x1="683.6" y1="271.7" x2="725.6" y2="271.7" stroke="#04815a" stroke-width="1.4"/><text x="735.6" y="265.7" font-size="17" fill="#04815a">nine parts, from the</text><text x="735.6" y="287.7" font-size="17" fill="#04815a">crawler to this page</text></g>
