<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="gblue" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#3d76ff"/><stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="ggreen" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#6df7cd"/><stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="gcard" x1="0.1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="gchip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#e6ecfa"/>
    </linearGradient>
  </defs>
  <g filter="url(#lift)"><line x1="261.1" y1="489.8" x2="858.9" y2="489.8" stroke="#dfe4ec"/><line x1="261.1" y1="489.8" x2="238.0" y2="157.8" stroke="#dfe4ec"/><path class="draw" d="M259.5 466.0 L273.7 454.3 L288.1 443.2 L302.6 432.8 L317.2 422.8 L331.9 413.4 L346.6 404.4 L361.5 395.8 L376.4 387.7 L391.4 379.9 L406.5 372.4 L421.6 365.3 L436.8 358.5 L452.0 352.0 L467.3 345.7 L482.7 339.7 L498.1 333.9 L513.5 328.3 L529.0 323.0 L544.5 317.8 L560.0 312.9 L575.6 308.1 L591.2 303.5 L606.8 299.0 L622.5 294.7 L638.2 290.5 L653.9 286.5 L669.7 282.6 L685.4 278.9 L701.2 275.2 L717.0 271.7 L732.9 268.2 L748.7 264.9 L764.6 261.7 L780.5 258.5 L796.4 255.5 L812.3 252.5 L828.3 249.6 L844.2 246.8 L860.2 244.1 L876.2 241.4" fill="none" stroke="#004aef" stroke-width="1.8" opacity="0.32" style="--len:900;animation-delay:0.10s"/><text x="888.2" y="245.4" text-anchor="start" font-size="12" fill="#5f656d" font-weight="400">k1 = 2.4</text><path class="draw" d="M258.5 451.6 L272.6 436.6 L286.9 424.2 L301.5 413.8 L316.2 404.9 L331.0 397.2 L345.9 390.5 L361.0 384.5 L376.1 379.3 L391.2 374.6 L406.4 370.4 L421.6 366.6 L436.9 363.1 L452.2 359.9 L467.6 357.0 L482.9 354.4 L498.3 351.9 L513.7 349.7 L529.1 347.6 L544.6 345.6 L560.0 343.8 L575.5 342.1 L590.9 340.5 L606.4 339.0 L621.9 337.6 L637.4 336.3 L652.9 335.0 L668.4 333.8 L683.9 332.7 L699.4 331.6 L715.0 330.6 L730.5 329.6 L746.1 328.7 L761.6 327.9 L777.1 327.0 L792.7 326.2 L808.3 325.5 L823.8 324.7 L839.4 324.0 L854.9 323.4 L870.5 322.7" fill="none" stroke="#004aef" stroke-width="1.8" opacity="0.32" style="--len:900;animation-delay:0.10s"/><text x="882.5" y="326.7" text-anchor="start" font-size="12" fill="#5f656d" font-weight="400">k1 = 0.6</text><path class="draw" d="M259.1 460.7 L273.3 447.5 L287.6 435.6 L302.1 424.9 L316.7 415.2 L331.5 406.3 L346.3 398.1 L361.2 390.7 L376.2 383.8 L391.3 377.4 L406.4 371.4 L421.6 365.9 L436.9 360.8 L452.1 355.9 L467.4 351.4 L482.8 347.2 L498.2 343.2 L513.6 339.4 L529.0 335.9 L544.5 332.5 L560.0 329.4 L575.5 326.3 L591.0 323.5 L606.6 320.7 L622.2 318.2 L637.7 315.7 L653.3 313.3 L669.0 311.1 L684.6 308.9 L700.2 306.8 L715.9 304.9 L731.5 303.0 L747.2 301.1 L762.9 299.4 L778.6 297.7 L794.3 296.1 L810.0 294.5 L825.7 293.0 L841.4 291.6 L857.1 290.2 L872.9 288.8" fill="none" stroke="#004aef" stroke-width="2.8" opacity="1.0" style="--len:900;animation-delay:0.35s"/><text x="884.9" y="292.8" text-anchor="start" font-size="12" fill="#04815a" font-weight="400">k1 = 1.2</text><circle class="pop" cx="634.6" cy="316.2" r="7" fill="url(#ggreen)" style="--o:1;animation-delay:0.9s"/><path class="rise" d="M93.4 216.1 Q93.1 202.1 107.1 202.1 L284.9 202.1 Q298.9 202.1 298.6 216.1 L293.6 437.0 Q293.3 451.0 279.3 451.0 L112.7 451.0 Q98.7 451.0 98.4 437.0 Z" fill="url(#gcard)" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.05s"/><text x="112.4" y="243.8" text-anchor="start" font-size="12" fill="#5f656d" font-weight="500">times seen</text><text x="277.6" y="243.8" text-anchor="end" font-size="12" fill="#5f656d" font-weight="500">score</text><text x="113.4" y="294.9" text-anchor="start" font-size="13" fill="#5f656d" font-weight="400">1×</text><text x="276.6" y="294.9" text-anchor="end" font-size="13" fill="#5f656d" font-weight="500">0.45</text><text x="114.2" y="342.4" text-anchor="start" font-size="13" fill="#5f656d" font-weight="400">2×</text><text x="275.8" y="342.4" text-anchor="end" font-size="13" fill="#5f656d" font-weight="500">0.62</text><text x="115.1" y="388.9" text-anchor="start" font-size="13" fill="#5f656d" font-weight="400">5×</text><text x="274.9" y="388.9" text-anchor="end" font-size="13" fill="#5f656d" font-weight="500">0.81</text><text x="115.9" y="434.4" text-anchor="start" font-size="13" fill="#5f656d" font-weight="400">20×</text><text x="274.1" y="434.4" text-anchor="end" font-size="13" fill="#04815a" font-weight="500">0.94</text></g><g class="mark"><line x1="622.6" y1="442.2" x2="664.6" y2="442.2" stroke="#04815a" stroke-width="1.4"/><text x="674.6" y="436.2" font-size="17" fill="#04815a">past here, more of the</text><text x="674.6" y="458.2" font-size="17" fill="#04815a">same word buys nothing</text></g><text x="190.0" y="100.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">score contribution, as one word repeats</text>
</svg>
