<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#F3FEF9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7E9BF7"/>
      <stop offset="1" stop-color="#86F7CC"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      .drift1 { animation: d1 18s ease-in-out infinite alternate; }
      .drift2 { animation: d2 24s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(22px, -16px); } }
      @keyframes d2 { to { transform: translate(-18px, 14px); } }
      .float { animation: fl 12s ease-in-out infinite alternate; }
      @keyframes fl { to { transform: translateY(-12px); } }
      .spin { animation: sp 60s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      .sparkle { animation: sk 6s ease-in-out infinite alternate; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="240" cy="170" r="210" fill="#C9FBE8" fill-opacity="0.55" filter="url(#soft)"/>
  <circle class="drift2" cx="1000" cy="490" r="220" fill="#86F7CC" fill-opacity="0.5" filter="url(#soft)"/>
  <rect x="480" y="190" width="330" height="64" rx="32" fill="url(#brand)" fill-opacity="1" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="852" cy="222" r="19" fill="none" stroke="url(#brand)" stroke-opacity="0.7" stroke-width="2.5"/>
  <rect x="842" y="218" width="20" height="8" rx="4" fill="#07ef9c"/>
  <rect x="480" y="285" width="250" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="772" cy="317" r="19" fill="none" stroke="url(#brand)" stroke-opacity="0.7" stroke-width="2.5"/>
  <rect x="762" y="313" width="20" height="8" rx="4" fill="#07ef9c"/>
  <rect x="480" y="380" width="170" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="692" cy="412" r="19" fill="none" stroke="url(#brand)" stroke-opacity="0.7" stroke-width="2.5"/>
  <rect x="682" y="408" width="20" height="8" rx="4" fill="#07ef9c"/>
  <rect x="440" y="218.8" width="330" height="64" rx="32" fill="none" stroke="url(#brand)" stroke-opacity="0.29" stroke-width="2.5"/>
  <rect x="460" y="204.4" width="330" height="64" rx="32" fill="none" stroke="url(#brand)" stroke-opacity="0.42" stroke-width="2.5"/>
  <rect x="480" y="190" width="330" height="64" rx="32" fill="url(#brand)"/>
  <g class="sparkle" style="transform-origin:1010px 140px"><path d="M 1010 98 Q 1019.24 130.76 1052 140 Q 1019.24 149.24 1010 182 Q 1000.76 149.24 968 140 Q 1000.76 130.76 1010 98 Z" fill="#0fd6f7"/></g>
  <text x="60" y="580" font-size="360" font-weight="700" fill="#07ef9c" fill-opacity="0.13" letter-spacing="-12">04</text>
</svg>
