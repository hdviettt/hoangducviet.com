<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0" stop-color="#0D1830"/><stop offset="0.55" stop-color="#080D18"/><stop offset="1" stop-color="#04060B"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0057FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#12B4E8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#07EF9C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#5B7BB5" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="haze" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="warm" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="track"><rect x="295" y="418" width="610" height="80" rx="20"/></clipPath>
    <style>
      .tok { animation: hop 14s cubic-bezier(.6,0,.2,1) infinite; }
      @keyframes hop {
        2.0% { transform: translateX(0px); }
        17.0% { transform: translateX(106px); }
        32.0% { transform: translateX(212px); }
        47.0% { transform: translateX(318px); }
        62.0% { transform: translateX(424px); }
        77.0% { transform: translateX(530px); }
        92%, 100% { transform: translateX(530px); }
      }
      .h0 { opacity: 0; animation: lit0 14s ease-out infinite; }
      @keyframes lit0 { 0%,2% {opacity:0} 5%,92% {opacity:1} 97%,100% {opacity:0} }
      .h1 { opacity: 0; animation: lit1 14s ease-out infinite; }
      @keyframes lit1 { 0%,17% {opacity:0} 20%,92% {opacity:1} 97%,100% {opacity:0} }
      .h2 { opacity: 0; animation: lit2 14s ease-out infinite; }
      @keyframes lit2 { 0%,32% {opacity:0} 35%,92% {opacity:1} 97%,100% {opacity:0} }
      .h3 { opacity: 0; animation: lit3 14s ease-out infinite; }
      @keyframes lit3 { 0%,47% {opacity:0} 50%,92% {opacity:1} 97%,100% {opacity:0} }
      .h4 { opacity: 0; animation: lit4 14s ease-out infinite; }
      @keyframes lit4 { 0%,62% {opacity:0} 65%,92% {opacity:1} 97%,100% {opacity:0} }
      .h5 { opacity: 0; animation: lit5 14s ease-out infinite; }
      @keyframes lit5 { 0%,77% {opacity:0} 80%,92% {opacity:1} 97%,100% {opacity:0} }
      .swp { animation: run 14s linear infinite; }
      @keyframes run { 0% { transform: translateX(-320px); } 100% { transform: translateX(918px); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .tok { transform: translateX(318px); }
        .h0, .h1, .h2, .h3 { opacity: 1; }
        .swp { transform: translateX(265px); }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="330" rx="380" ry="210" fill="#0B6BFF" fill-opacity="0.13" filter="url(#haze)"/>

  <!-- the same six steps line up, one under the other -->
  <g stroke="#3A5480" stroke-width="1.8" stroke-dasharray="3 8">
    <line x1="335" y1="278" x2="335" y2="410"/>
    <line x1="441" y1="278" x2="441" y2="410"/>
    <line x1="547" y1="278" x2="547" y2="410"/>
    <line x1="653" y1="278" x2="653" y2="410"/>
    <line x1="759" y1="278" x2="759" y2="410"/>
    <line x1="865" y1="278" x2="865" y2="410"/>
  </g>

  <g class="top">
    <rect x="301" y="196" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(335.0,230.0) scale(1.18)"><path d="M -8 -12 h 11 l 5 5 v 19 h -16 z"/><path d="M 3 -12 v 5 h 5"/><path d="M -4 -1 h 8"/><path d="M -4 5 h 8"/></g>
    <line x1="369" y1="230" x2="407" y2="230" stroke="#26364F" stroke-width="2"/>
    <rect x="407" y="196" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(441.0,230.0) scale(1.18)"><path d="M -5 -9 L -13 0 L -5 9"/><path d="M 5 -9 L 13 0 L 5 9"/><path d="M 1 -11 L -1 11"/></g>
    <line x1="475" y1="230" x2="513" y2="230" stroke="#26364F" stroke-width="2"/>
    <rect x="513" y="196" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(547.0,230.0) scale(1.18)"><rect x="-13" y="-10" width="26" height="20" rx="3"/><path d="M -9 6 L -3 -1 L 2 4 L 6 0 L 10 6 Z" fill="#7FA6D8" stroke="none"/><circle cx="-6" cy="-4" r="2.4"/></g>
    <line x1="581" y1="230" x2="619" y2="230" stroke="#26364F" stroke-width="2"/>
    <rect x="619" y="196" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(653.0,230.0) scale(1.18)"><path d="M 0 8 V -9"/><path d="M -7 -2 L 0 -9 L 7 -2"/><path d="M -11 12 h 22"/></g>
    <line x1="687" y1="230" x2="725" y2="230" stroke="#26364F" stroke-width="2"/>
    <rect x="725" y="196" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(759.0,230.0) scale(1.18)"><path d="M -2 -5 h -5 a 6 6 0 0 0 0 12 h 5"/><path d="M 2 -5 h 5 a 6 6 0 0 1 0 12 h -5"/><path d="M -4 1 h 8"/></g>
    <line x1="793" y1="230" x2="831" y2="230" stroke="#26364F" stroke-width="2"/>
    <rect x="831" y="196" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(865.0,230.0) scale(1.18)"><path d="M -8 -12 h 16 v 24 h -16 z"/><path d="M -4 0 l 3 3 l 6 -7"/></g>
  </g>

  <!-- a model walks it, stopping at every step -->
  <circle class="h0" cx="335" cy="230" r="41.0" fill="none" stroke="#FFCE00" stroke-opacity="0.28" stroke-width="1.6"/>
  <circle class="h1" cx="441" cy="230" r="41.0" fill="none" stroke="#FFCE00" stroke-opacity="0.28" stroke-width="1.6"/>
  <circle class="h2" cx="547" cy="230" r="41.0" fill="none" stroke="#FFCE00" stroke-opacity="0.28" stroke-width="1.6"/>
  <circle class="h3" cx="653" cy="230" r="41.0" fill="none" stroke="#FFCE00" stroke-opacity="0.28" stroke-width="1.6"/>
  <circle class="h4" cx="759" cy="230" r="41.0" fill="none" stroke="#FFCE00" stroke-opacity="0.28" stroke-width="1.6"/>
  <circle class="h5" cx="865" cy="230" r="41.0" fill="none" stroke="#FFCE00" stroke-opacity="0.28" stroke-width="1.6"/>
  <g class="tok" filter="url(#warm)">
    <circle cx="335" cy="166" r="9" fill="#FFCE00"/>
    <path d="M 335 180 l -6 -8 h 12 z" fill="#FFCE00"/>
  </g>

  <g class="bottom">
    <rect x="301" y="424" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(335.0,458.0) scale(1.18)"><path d="M -8 -12 h 11 l 5 5 v 19 h -16 z"/><path d="M 3 -12 v 5 h 5"/><path d="M -4 -1 h 8"/><path d="M -4 5 h 8"/></g>
    <line x1="369" y1="458" x2="407" y2="458" stroke="#26364F" stroke-width="2"/>
    <rect x="407" y="424" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(441.0,458.0) scale(1.18)"><path d="M -5 -9 L -13 0 L -5 9"/><path d="M 5 -9 L 13 0 L 5 9"/><path d="M 1 -11 L -1 11"/></g>
    <line x1="475" y1="458" x2="513" y2="458" stroke="#26364F" stroke-width="2"/>
    <rect x="513" y="424" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(547.0,458.0) scale(1.18)"><rect x="-13" y="-10" width="26" height="20" rx="3"/><path d="M -9 6 L -3 -1 L 2 4 L 6 0 L 10 6 Z" fill="#7FA6D8" stroke="none"/><circle cx="-6" cy="-4" r="2.4"/></g>
    <line x1="581" y1="458" x2="619" y2="458" stroke="#26364F" stroke-width="2"/>
    <rect x="619" y="424" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(653.0,458.0) scale(1.18)"><path d="M 0 8 V -9"/><path d="M -7 -2 L 0 -9 L 7 -2"/><path d="M -11 12 h 22"/></g>
    <line x1="687" y1="458" x2="725" y2="458" stroke="#26364F" stroke-width="2"/>
    <rect x="725" y="424" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(759.0,458.0) scale(1.18)"><path d="M -2 -5 h -5 a 6 6 0 0 0 0 12 h 5"/><path d="M 2 -5 h 5 a 6 6 0 0 1 0 12 h -5"/><path d="M -4 1 h 8"/></g>
    <line x1="793" y1="458" x2="831" y2="458" stroke="#26364F" stroke-width="2"/>
    <rect x="831" y="424" width="68" height="68" rx="15" fill="#0D1524" stroke="#2B3E5C" stroke-width="1.8"/>
    <g stroke="#7FA6D8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(865.0,458.0) scale(1.18)"><path d="M -8 -12 h 16 v 24 h -16 z"/><path d="M -4 0 l 3 3 l 6 -7"/></g>
  </g>

  <!-- code runs straight through, over and over -->
  <g clip-path="url(#track)">
    <rect class="swp" x="295" y="418" width="300" height="80" fill="url(#sweep)" opacity="0.55"/>
  </g>
</svg>
