<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="glowbg" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0" stop-color="#101B33"/>
      <stop offset="0.55" stop-color="#0A101E"/>
      <stop offset="1" stop-color="#05070D"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0057ff"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07ef9c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#07ef9c" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#5B7BB5" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>
    <filter id="lum" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <style>
      /* 13s loop: the core never moves. Two housings slide over it in turn,
         one the model reads, one the worker runs. Dark technical drawing,
         deliberately unlike the rest of the cover set. */
      .shellA { animation: sa 13s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .shellB { animation: sb 13s cubic-bezier(0.4, 0, 0.2, 1) infinite; opacity: 0; }
      @keyframes sa {
        0% { opacity: 0; transform: translateX(-70px); }
        7%, 40% { opacity: 1; transform: translateX(0); }
        49% { opacity: 0; transform: translateX(-70px); }
        100% { opacity: 0; transform: translateX(-70px); }
      }
      @keyframes sb {
        0%, 46% { opacity: 0; transform: translateX(70px); }
        55%, 90% { opacity: 1; transform: translateX(0); }
        97%, 100% { opacity: 0; transform: translateX(70px); }
      }
      .pulse { animation: pl 13s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pl { 0%, 100% { opacity: 0.9; } 46%, 54% { opacity: 1; transform: scale(1.015); } }
      .tick { animation: tk 13s ease-in-out infinite; }
      @keyframes tk { 0%, 100% { stroke-opacity: 0.28; } 50% { stroke-opacity: 0.5; } }
      .spark { animation: sk 7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes sk { from { transform: scale(0.9) rotate(0deg); opacity: 0.85; } to { transform: scale(1.12) rotate(8deg); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .shellA { opacity: 0; }
        .shellB { opacity: 1; transform: translateX(0); }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#glowbg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="330" rx="300" ry="180" fill="#0B6BFF" fill-opacity="0.22" filter="url(#softglow)"/>
  <ellipse cx="770" cy="400" rx="200" ry="130" fill="#07ef9c" fill-opacity="0.16" filter="url(#softglow)"/>

  <!-- technical framing -->
  <g class="tick" stroke="#7FA6E8" stroke-opacity="0.28" stroke-width="1.5" fill="none">
    <path d="M 96 128 h 34 M 96 128 v 34"/>
    <path d="M 1104 128 h -34 M 1104 128 v 34"/>
    <path d="M 96 502 h 34 M 96 502 v -34"/>
    <path d="M 1104 502 h -34 M 1104 502 v -34"/>
  </g>

  <!-- the core: the procedure, unchanged -->
  <g class="pulse" filter="url(#lum)">
    <rect x="452" y="222" width="196" height="15" rx="7.5" fill="url(#core)"/>
    <rect x="452" y="262" width="296" height="15" rx="7.5" fill="url(#core)"/>
    <rect x="452" y="302" width="242" height="15" rx="7.5" fill="url(#core)"/>
    <rect x="452" y="342" width="318" height="15" rx="7.5" fill="url(#core)"/>
    <rect x="452" y="382" width="210" height="15" rx="7.5" fill="url(#fade)"/>
  </g>
  <circle cx="432" cy="229" r="4" fill="#07ef9c"/>
  <circle cx="432" cy="269" r="4" fill="#07ef9c" fill-opacity="0.8"/>
  <circle cx="432" cy="309" r="4" fill="#07ef9c" fill-opacity="0.6"/>
  <circle cx="432" cy="349" r="4" fill="#07ef9c" fill-opacity="0.45"/>
  <circle cx="432" cy="389" r="4" fill="#07ef9c" fill-opacity="0.3"/>

  <!-- housing A: read by a model -->
  <g class="shellA">
    <rect x="386" y="180" width="428" height="270" rx="20" fill="none" stroke="#FFCE00" stroke-width="2.5" stroke-opacity="0.9"/>
    <path d="M 386 214 h 428" stroke="#FFCE00" stroke-opacity="0.35" stroke-width="1.25"/>
    <rect x="386" y="132" width="184" height="38" rx="19" fill="#FFCE00" fill-opacity="0.14" stroke="#FFCE00" stroke-opacity="0.5" stroke-width="1.25"/>
    <circle cx="412" cy="151" r="6" fill="#FFCE00"/>
    <text x="428" y="158" font-size="20" font-weight="700" fill="#FFD84D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent.md</text>
    <path d="M 814 300 l 26 0 M 830 292 l 10 8 l -10 8" fill="none" stroke="#FFCE00" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- housing B: run by the worker -->
  <g class="shellB">
    <rect x="386" y="180" width="428" height="270" rx="20" fill="none" stroke="#2E86FF" stroke-width="2.5" stroke-opacity="0.9"/>
    <path d="M 386 214 h 428" stroke="#2E86FF" stroke-opacity="0.35" stroke-width="1.25"/>
    <rect x="386" y="132" width="236" height="38" rx="19" fill="#2E86FF" fill-opacity="0.14" stroke="#2E86FF" stroke-opacity="0.5" stroke-width="1.25"/>
    <rect x="404" y="144" width="15" height="15" rx="3.5" fill="#2E86FF"/>
    <text x="430" y="158" font-size="20" font-weight="700" fill="#7FB4FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">publish_run.py</text>
    <path d="M 814 300 l 26 0 M 830 292 l 10 8 l -10 8" fill="none" stroke="#2E86FF" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- dimension line: the core is the measured thing -->
  <g stroke="#7FA6E8" stroke-opacity="0.3" stroke-width="1.25" fill="none">
    <path d="M 452 470 v 14 M 770 470 v 14 M 452 477 h 318"/>
  </g>
  <circle cx="611" cy="477" r="3" fill="#07ef9c" fill-opacity="0.7"/>

  <g class="spark">
    <path d="M 906 168 Q 913.5 190 936 196 Q 913.5 202 906 224 Q 898.5 202 876 196 Q 898.5 190 906 168 Z" fill="#FFCE00"/>
  </g>
</svg>
