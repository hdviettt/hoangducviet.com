<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F1F5FF"/>
      <stop offset="1" stop-color="#F2FEF8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      /* 12s loop: the procedure in the middle never changes. The shell around
         it does. First it is an agent the model reads, then the same steps are
         a script the worker runs, and the amber shell is gone. */
      .shellA { animation: sA 12s ease-in-out infinite; }
      .shellB { animation: sB 12s ease-in-out infinite; opacity: 0; }
      @keyframes sA { 0%, 6% { opacity: 0; } 12%, 42% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes sB { 0%, 48% { opacity: 0; } 56%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
      .steps { animation: breathe 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 46%, 54% { transform: scale(1.02); } }
      .drift1 { animation: d1 20s ease-in-out infinite alternate; }
      .drift2 { animation: d2 26s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(20px, -14px); } }
      @keyframes d2 { to { transform: translate(-16px, 12px); } }
      .spark { animation: sk 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes sk { from { transform: scale(0.94); } to { transform: scale(1.1); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .shellA { opacity: 0; }
        .shellB { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle class="drift1" cx="230" cy="180" r="200" fill="#B8C9FF" fill-opacity="0.5" filter="url(#soft)"/>
  <circle class="drift2" cx="990" cy="470" r="200" fill="#86F7CC" fill-opacity="0.45" filter="url(#soft)"/>

  <!-- echo outlines: the SEONGON signature -->
  <rect x="404" y="209" width="480" height="290" rx="26" fill="none" stroke="url(#brand)" stroke-opacity="0.14" stroke-width="3"/>
  <rect x="388" y="193" width="480" height="290" rx="26" fill="none" stroke="url(#brand)" stroke-opacity="0.3" stroke-width="3"/>

  <!-- the constant: the procedure -->
  <rect x="372" y="177" width="480" height="290" rx="26" fill="#FFFFFF" fill-opacity="0.96"/>
  <g class="steps">
    <rect x="416" y="228" width="240" height="18" rx="9" fill="#07ef9c" fill-opacity="0.9"/>
    <rect x="416" y="268" width="330" height="18" rx="9" fill="#07ef9c" fill-opacity="0.72"/>
    <rect x="416" y="308" width="288" height="18" rx="9" fill="#07ef9c" fill-opacity="0.58"/>
    <rect x="416" y="348" width="360" height="18" rx="9" fill="#07ef9c" fill-opacity="0.44"/>
    <rect x="416" y="388" width="252" height="18" rx="9" fill="#07ef9c" fill-opacity="0.32"/>
  </g>

  <!-- shell A: the model reads it -->
  <g class="shellA">
    <rect x="372" y="177" width="480" height="290" rx="26" fill="none" stroke="#D9A400" stroke-width="4"/>
    <rect x="372" y="132" width="196" height="42" rx="21" fill="#FFF3CF"/>
    <circle cx="400" cy="153" r="9" fill="#D9A400"/>
    <text x="418" y="161" font-size="22" font-weight="700" fill="#8A6D00">agent.md</text>
  </g>

  <!-- shell B: the worker runs it -->
  <g class="shellB">
    <rect x="372" y="177" width="480" height="290" rx="26" fill="none" stroke="#004AEF" stroke-width="4"/>
    <rect x="372" y="132" width="252" height="42" rx="21" fill="#E6EDFF"/>
    <rect x="392" y="144" width="18" height="18" rx="4" fill="#004AEF"/>
    <text x="420" y="161" font-size="22" font-weight="700" fill="#0038B8">publish_run.py</text>
  </g>

  <g class="spark">
    <path d="M 940 152 Q 947 172.4 967 178 Q 947 183.6 940 204 Q 933 183.6 913 178 Q 933 172.4 940 152 Z" fill="#ffce00"/>
  </g>
</svg>
