<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop: the figure resolves on a sweep, the one annotation arrives,
       then it rests. Reduced motion paints the finished frame, which is also
       what the og:image renderer captures. */
    .c { opacity: 0; animation: fill 14s ease-in-out infinite; }
    @keyframes fill { 0% { opacity: 0 } 22%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }
    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }
    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 34% { opacity: 0 } 46%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .c { opacity: var(--o, 1); animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><polygon class="c" points="183.6,149.2 821.8,149.2 819.3,187.3 186.3,187.3" fill="#004aef" style="--o:0.9;animation-delay:0.00s"/><text x="170.9" y="173.3" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">stopword heavy</text><text x="832.6" y="173.3" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">0.960</text><polygon class="c" points="188.1,212.4 723.9,212.4 722.2,249.5 190.8,249.5" fill="#004aef" style="--o:0.9;animation-delay:0.09s"/><text x="175.5" y="236.1" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">multi-term</text><text x="735.0" y="236.1" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">0.817</text><polygon class="c" points="192.5,274.0 679.7,274.0 678.4,310.1 195.1,310.1" fill="#004aef" style="--o:0.9;animation-delay:0.18s"/><text x="179.8" y="297.1" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">entity</text><text x="691.0" y="297.1" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">0.753</text><polygon class="c" points="196.9,333.9 657.7,333.9 656.6,369.0 199.4,369.0" fill="#004aef" style="--o:0.9;animation-delay:0.27s"/><text x="184.1" y="356.5" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">informational</text><text x="669.1" y="356.5" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">0.722</text><polygon class="c" points="201.0,392.2 604.2,392.2 603.5,426.4 203.5,426.4" fill="#07ef9c" style="--o:0.55;animation-delay:0.36s"/><text x="188.3" y="414.4" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">navigational</text><text x="615.8" y="414.4" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">0.640</text><polygon class="c" points="205.1,449.0 591.9,449.0 591.3,482.4 207.5,482.4" fill="#07ef9c" style="--o:0.55;animation-delay:0.45s"/><text x="192.3" y="470.7" text-anchor="end" font-size="14" fill="#5f656d" font-weight="400">misspelled</text><text x="603.6" y="470.7" text-anchor="start" font-size="14" fill="#1f2124" font-weight="500">0.622</text></g><g class="mark"><line x1="653.8" y1="409.4" x2="695.8" y2="409.4" stroke="#04815a" stroke-width="1.4"/><text x="705.8" y="403.4" font-size="17" fill="#04815a">a name it cannot</text><text x="705.8" y="425.4" font-size="17" fill="#04815a">match on words</text></g><text x="480.0" y="566.0" text-anchor="start" font-size="14" fill="#5f656d" font-weight="400">nDCG@10 across fifty labelled queries</text>
</svg>
