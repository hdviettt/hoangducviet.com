="start" xml:space="preserve">Argentina beat France 4–2 on penalties after a 3–3 draw in</text><text x="102.0" y="252.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="currentColor" fill-opacity="0.72" text-anchor="start" xml:space="preserve">Lusail. Messi scored twice and Mbappé took a hat-trick, the</text><text x="102.0" y="276.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="currentColor" fill-opacity="0.72" text-anchor="start" xml:space="preserve">first in a final since 1966.</text><text x="142.0" y="310.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.70" text-anchor="middle" xml:space="preserve">fifa.com</text><text x="250.0" y="310.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.70" text-anchor="middle" xml:space="preserve">espn.com</text><text x="366.0" y="310.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.70" text-anchor="middle" xml:space="preserve">wikipedia.org</text><text x="112.0" y="362.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.38" text-anchor="start" xml:space="preserve">Ask a follow-up</text><text x="98.0" y="420.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">en.wikipedia.org › 2022 FIFA World Cup final</text><text x="72.0" y="449.0" font-family="system-ui, -apple-system, Segoe UI, Robo