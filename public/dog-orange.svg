<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Orange Dog - Jake-inspired, chill, chubby, simple pose -->

  <!-- Floppy ears -->
  <rect x="4" y="4" width="2" height="2" fill="#262626"/>
  <rect x="2" y="6" width="2" height="6" fill="#262626"/>
  <rect x="4" y="6" width="4" height="6" fill="#F58A00"/>
  <rect x="4" y="12" width="2" height="2" fill="#262626"/>
  <rect x="6" y="10" width="2" height="2" fill="#262626"/>

  <rect x="26" y="4" width="2" height="2" fill="#262626"/>
  <rect x="28" y="6" width="2" height="6" fill="#262626"/>
  <rect x="24" y="6" width="4" height="6" fill="#F58A00"/>
  <rect x="26" y="12" width="2" height="2" fill="#262626"/>
  <rect x="24" y="10" width="2" height="2" fill="#262626"/>

  <!-- Head -->
  <rect x="8" y="2" width="16" height="2" fill="#262626"/>
  <rect x="6" y="4" width="2" height="2" fill="#262626"/>
  <rect x="24" y="4" width="2" height="2" fill="#262626"/>
  <rect x="6" y="6" width="2" height="8" fill="#262626"/>
  <rect x="24" y="6" width="2" height="8" fill="#262626"/>
  <rect x="8" y="4" width="16" height="10" fill="#F58A00"/>

  <!-- Eyes - half-lidded chill -->
  <rect x="10" y="6" width="4" height="4" fill="#0D0D0D"/>
  <rect x="10" y="6" width="4" height="1" fill="#F58A00"/>
  <rect x="11" y="8" width="1" height="1" fill="#DEDEDE"/>

  <rect x="18" y="6" width="4" height="4" fill="#0D0D0D"/>
  <rect x="18" y="6" width="4" height="1" fill="#F58A00"/>
  <rect x="19" y="8" width="1" height="1" fill="#DEDEDE"/>

  <!-- Muzzle -->
  <rect x="10" y="10" width="12" height="4" fill="#FFAA33"/>

  <!-- Nose -->
  <rect x="14" y="10" width="4" height="3" fill="#0D0D0D"/>
  <rect x="15" y="10" width="1" height="1" fill="#4A4A4A"/>

  <!-- Chubby body -->
  <rect x="8" y="14" width="2" height="2" fill="#262626"/>
  <rect x="22" y="14" width="2" height="2" fill="#262626"/>
  <rect x="4" y="16" width="4" height="2" fill="#262626"/>
  <rect x="24" y="16" width="4" height="2" fill="#262626"/>
  <rect x="2" y="18" width="2" height="8" fill="#262626"/>
  <rect x="28" y="18" width="2" height="8" fill="#262626"/>
  <rect x="4" y="26" width="6" height="2" fill="#262626"/>
  <rect x="22" y="26" width="6" height="2" fill="#262626"/>

  <!-- Body fill -->
  <rect x="10" y="14" width="12" height="2" fill="#F58A00"/>
  <rect x="4" y="16" width="24" height="2" fill="#F58A00"/>
  <rect x="4" y="18" width="24" height="8" fill="#F58A00"/>

  <!-- Big round belly -->
  <rect x="8" y="18" width="16" height="6" fill="#FFAA33"/>
  <rect x="6" y="20" width="20" height="4" fill="#FFAA33"/>

  <!-- Feet -->
  <rect x="10" y="26" width="4" height="2" fill="#262626"/>
  <rect x="18" y="26" width="4" height="2" fill="#262626"/>
  <rect x="11" y="26" width="2" height="2" fill="#F58A00"/>
  <rect x="19" y="26" width="2" height="2" fill="#F58A00"/>
</svg>
