<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 312" width="1080" height="312"><rect width="1080" height="312" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dadce0"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#004aef"/></marker></defs><text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" text-anchor="start" fill="#0a0a0a" font-weight="600">Scored on MS MARCO's own human judgments</text><text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" text-anchor="start" fill="#5f656d" font-weight="400">800 held-out queries, about nine passages each. Labels by Microsoft's annotators, not by me.</text><text x="288" y="93" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="end" fill="#5f656d" font-weight="400">random shuffle</text><rect x="300" y="78" width="70" height="20" rx="4" fill="#004aef" opacity="0.28"/><text x="382.1629629629631" y="93" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="start" fill="#5f656d" font-weight="400">0.5096</text><text x="288" y="133" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="end" fill="#5f656d" font-weight="400">retrieval order, no reranking</text><rect x="300" y="118" width="85" height="20" rx="4" fill="#004aef" opacity="0.28"/><text x="397.33333333333337" y="133" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="start" fill="#5f656d" font-weight="400">0.5160</text><text x="288" y="173" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="end" fill="#5f656d" font-weight="400">count query words in the passage</text><rect x="300" y="158" width="219" height="20" rx="4" fill="#c2410c" opacity="1"/><text x="531.2592592592594" y="173" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="start" fill="#0a0a0a" font-weight="600">0.5725</text><text x="288" y="213" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="end" fill="#5f656d" font-weight="400">mini-reranker, written by hand</text><rect x="300" y="198" width="276" height="20" rx="4" fill="#004aef" opacity="1"/><text x="587.6740740740743" y="213" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="start" fill="#0a0a0a" font-weight="600">0.5963</text><text x="288" y="253" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="end" fill="#5f656d" font-weight="400">ms-marco-MiniLM-L-6-v2</text><rect x="300" y="238" width="568" height="20" rx="4" fill="#004aef" opacity="1"/><text x="879.9407407407408" y="253" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="start" fill="#0a0a0a" font-weight="600">0.7196</text><text x="300" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#5f656d" font-weight="400">A transformer written by hand got 16% of the way from counting keywords to a pretrained BERT.</text></svg>