<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-label="Request flow from user through the runner into the SDK, tools, skills, and run history" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA4B6"/>
    </marker>
  </defs>
  <rect width="1100" height="400" rx="24" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="1098.5" height="398.5" rx="23.25" fill="none" stroke="#E1E6EC" stroke-width="1.5"/>

  <circle cx="106" cy="150" r="26" fill="#E4FDF2" stroke="#9FE8C9" stroke-width="1.5"/>
  <circle cx="106" cy="142" r="8" fill="#04B876"/>
  <path d="M 92 166 a 14 9 0 0 1 28 0 z" fill="#04B876"/>
  <text x="106" y="204" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">User</text>
  <line x1="140" y1="150" x2="186" y2="150" stroke="#9AA4B6" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="192" y="116" width="150" height="68" rx="14" fill="#F0FDF7" stroke="#BFEFD9" stroke-width="1.5"/>
  <text x="267" y="146" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Interface</text>
  <text x="267" y="166" font-size="13" fill="#4E4F56" text-anchor="middle">Lark / web</text>
  <line x1="348" y1="150" x2="394" y2="150" stroke="#9AA4B6" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="400" y="108" width="188" height="84" rx="14" fill="#F4F7FF" stroke="#C9D4EE" stroke-width="1.5"/>
  <text x="494" y="140" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Runner</text>
  <text x="494" y="162" font-size="13.5" fill="#2B3A67" text-anchor="middle" font-family="monospace">frontmatter → options</text>
  <line x1="594" y1="150" x2="640" y2="150" stroke="#9AA4B6" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="646" y="102" width="196" height="96" rx="14" fill="#FFF7DC" stroke="#F2D98C" stroke-width="1.5"/>
  <text x="744" y="140" font-size="16" font-weight="700" fill="#5C4A00" text-anchor="middle">Claude Agent SDK</text>
  <text x="744" y="162" font-size="13" fill="#8A6D00" text-anchor="middle">the only place a</text>
  <text x="744" y="180" font-size="13" fill="#8A6D00" text-anchor="middle">model runs</text>

  <line x1="848" y1="128" x2="894" y2="96" stroke="#9AA4B6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="848" y1="172" x2="894" y2="204" stroke="#9AA4B6" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="900" y="58" width="164" height="66" rx="14" fill="#F4F7FF" stroke="#C9D4EE" stroke-width="1.5"/>
  <text x="982" y="86" font-size="15.5" font-weight="700" fill="#1F2430" text-anchor="middle">Tools</text>
  <text x="982" y="106" font-size="13" fill="#2B3A67" text-anchor="middle">21 pure connectors</text>
  <rect x="900" y="176" width="164" height="66" rx="14" fill="#E4FDF2" stroke="#9FE8C9" stroke-width="1.5"/>
  <text x="982" y="204" font-size="15.5" font-weight="700" fill="#1F2430" text-anchor="middle">Skills</text>
  <text x="982" y="224" font-size="13" fill="#04915D" text-anchor="middle">63 packaged, 31 scripted</text>

  <path d="M 744 198 L 744 300 L 546 300" fill="none" stroke="#9AA4B6" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="192" y="272" width="348" height="56" rx="14" fill="#F4F7FF" stroke="#C9D4EE" stroke-width="1.5"/>
  <text x="366" y="298" font-size="15.5" font-weight="700" fill="#1F2430" text-anchor="middle">Run history + per-turn cost</text>
  <text x="366" y="317" font-size="13" fill="#2B3A67" text-anchor="middle">every run leaves a paper trail</text>
</svg>
