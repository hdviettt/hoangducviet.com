<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="One publish run moving through six deterministic steps, with the model lane below staying empty from start to finish" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      /* One 12s loop. Each step lights as the run reaches it and stays lit,
         so the completed frame is the whole pipeline lit and the model lane
         still dark — which is also the reduced-motion frame below. */
      .s { opacity: 0; animation: lit 12s linear infinite; }
      .s1 { animation-delay: 0.6s }  .s2 { animation-delay: 2.0s }
      .s3 { animation-delay: 3.4s }  .s4 { animation-delay: 4.8s }
      .s5 { animation-delay: 6.2s }  .s6 { animation-delay: 7.6s }
      @keyframes lit {
        0%   { opacity: 0 }
        2%   { opacity: 1 }
        88%  { opacity: 1 }
        96%,100% { opacity: 0 }
      }
      /* The document does not park on the last station — it becomes the draft.
         It fades out exactly as the DRAFT card fades in, so the run ends with
         one object, not two overlapping ones. */
      .doc { animation: travel 12s linear infinite; }
      @keyframes travel {
        0%       { transform: translateX(0px);   opacity: 0 }
        3%       { transform: translateX(0px);   opacity: 1 }
        8%,11%   { transform: translateX(0px)   }
        16%,19%  { transform: translateX(168px) }
        28%,31%  { transform: translateX(336px) }
        40%,43%  { transform: translateX(504px) }
        52%,55%  { transform: translateX(672px) }
        64%,67%  { transform: translateX(840px); opacity: 1 }
        72%,100% { transform: translateX(840px); opacity: 0 }
      }
      .out { opacity: 0; animation: lit 12s linear infinite; animation-delay: 8.6s }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important }
        .s, .out { opacity: 1 }
        .doc { opacity: 0 }
      }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#F7F9FC"/>

  <text x="64" y="82" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1.5">ONE PUBLISH RUN — GOOGLE DOC TO WORDPRESS DRAFT</text>
  <line x1="64" y1="112" x2="1136" y2="112" stroke="#0A0A0A" stroke-width="1.5"/>

  <!-- ============ deterministic lane ============ -->
  <text x="64" y="152" font-size="12.5" font-weight="700" fill="#0038B8" letter-spacing="1">DETERMINISTIC CODE — 336 LINES, RUNS ON THE WORKER</text>

  <!-- rail -->
  <line x1="112" y1="232" x2="1064" y2="232" stroke="#DDE3EC" stroke-width="2"/>

  <!-- six stations -->
  <g fill="#8A93A3" font-size="13.5" text-anchor="middle">
    <circle cx="112"  cy="232" r="7" fill="#C8D0DC"/>
    <circle cx="280"  cy="232" r="7" fill="#C8D0DC"/>
    <circle cx="448"  cy="232" r="7" fill="#C8D0DC"/>
    <circle cx="616"  cy="232" r="7" fill="#C8D0DC"/>
    <circle cx="784"  cy="232" r="7" fill="#C8D0DC"/>
    <circle cx="952"  cy="232" r="7" fill="#C8D0DC"/>
  </g>

  <g class="s s1"><circle cx="112" cy="232" r="7" fill="#004AEF"/><line x1="112" y1="232" x2="280" y2="232" stroke="#004AEF" stroke-width="2"/></g>
  <g class="s s2"><circle cx="280" cy="232" r="7" fill="#004AEF"/><line x1="280" y1="232" x2="448" y2="232" stroke="#004AEF" stroke-width="2"/></g>
  <g class="s s3"><circle cx="448" cy="232" r="7" fill="#004AEF"/><line x1="448" y1="232" x2="616" y2="232" stroke="#004AEF" stroke-width="2"/></g>
  <g class="s s4"><circle cx="616" cy="232" r="7" fill="#004AEF"/><line x1="616" y1="232" x2="784" y2="232" stroke="#004AEF" stroke-width="2"/></g>
  <g class="s s5"><circle cx="784" cy="232" r="7" fill="#004AEF"/><line x1="784" y1="232" x2="952" y2="232" stroke="#004AEF" stroke-width="2"/></g>
  <g class="s s6"><circle cx="952" cy="232" r="7" fill="#004AEF"/><line x1="952" y1="232" x2="1064" y2="232" stroke="#004AEF" stroke-width="2"/></g>

  <!-- step numbers + labels -->
  <g text-anchor="middle" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1">
    <text x="112" y="200">1</text><text x="280" y="200">2</text><text x="448" y="200">3</text>
    <text x="616" y="200">4</text><text x="784" y="200">5</text><text x="952" y="200">6</text>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#0A0A0A">
    <text x="112" y="272">Read the doc</text>
    <text x="280" y="272">Normalize</text>
    <text x="448" y="272">Process images</text>
    <text x="616" y="272">Upload</text>
    <text x="784" y="272">Rewire</text>
    <text x="952" y="272">Create draft</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#6B7280">
    <text x="112" y="294">gdocs connector</text>
    <text x="280" y="294">saved patterns</text>
    <text x="448" y="294">resize · convert · rename</text>
    <text x="616" y="294">all or nothing</text>
    <text x="784" y="294">final URLs · captions</text>
    <text x="952" y="294">status = draft</text>
  </g>

  <!-- the document travelling -->
  <g class="doc">
    <rect x="94" y="150" width="36" height="46" rx="4" fill="#FFFFFF" stroke="#0038B8" stroke-width="1.75"/>
    <line x1="102" y1="162" x2="122" y2="162" stroke="#C8D0DC" stroke-width="2"/>
    <line x1="102" y1="171" x2="122" y2="171" stroke="#C8D0DC" stroke-width="2"/>
    <line x1="102" y1="180" x2="115" y2="180" stroke="#C8D0DC" stroke-width="2"/>
  </g>

  <!-- output -->
  <g class="out">
    <rect x="1036" y="208" width="56" height="48" rx="6" fill="#FFFFFF" stroke="#004AEF" stroke-width="1.75"/>
    <text x="1064" y="238" font-size="12" font-weight="700" fill="#0038B8" text-anchor="middle">DRAFT</text>
  </g>

  <!-- ============ model lane ============ -->
  <line x1="64" y1="352" x2="1136" y2="352" stroke="#DDE3EC" stroke-width="1.25"/>
  <text x="64" y="392" font-size="12.5" font-weight="700" fill="#8A6D00" letter-spacing="1">MODEL</text>

  <rect x="112" y="412" width="952" height="52" rx="8" fill="none" stroke="#D9A400" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.55"/>
  <text x="588" y="444" font-size="15.5" font-weight="700" fill="#8A6D00" text-anchor="middle">no call — not once, for any article, ever</text>

  <line x1="64" y1="500" x2="1136" y2="500" stroke="#0A0A0A" stroke-width="1.5"/>
  <text x="64" y="530" font-size="14" fill="#6B7280">The thirty-page document never enters a context window, because there is no model downstream to put it into. The model was spent once, at step zero, before any of this.</text>
</svg>
