<svg xmlns="http://www.w3.org/2000/svg" id="s13" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 900 588" role="img" aria-label="On the left, the usual approach: lay out the steps first and work out the output later. On the right, drawing the output first and deriving the steps from it, with four questions asked of every output: who owns it, what a good one looks like, what the current process is, and which tools it needs.">
