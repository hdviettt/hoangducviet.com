<rect width="900" height="588" fill="#12171E"/>


  <defs>
    <marker id="s13-ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.6 0.8 L7 4 L0.6 7.2" fill="none" stroke="#313D49" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker>
    <marker id="s13-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.6 0.8 L7 4 L0.6 7.2" fill="none" stroke="#4E82FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker>
  </defs>

  <text class="lead" x="30" y="16">Instead of mapping how people work,</text>
  <text class="lead" x="30" y="40">map the things they produce.</text>

  <text class="sl" x="30" y="90">THE USUAL WAY</text>
  <rect class="mini" x="190" y="68" width="52" height="34" rx="7"></rect>
  <path class="ar" d="M245 85h8" marker-end="url(#s13-ag)"></path>
  <rect class="mini" x="258" y="68" width="52" height="34" rx="7"></rect>
  <path class="ar" d="M313 85h8" marker-end="url(#s13-ag)"></path>
  <rect class="mini" x="326" y="68" width="52" height="34" rx="7"></rect>
  <path class="ar" d="M390 85h26" marker-end="url(#s13-ag)"></path>
  <rect class="pg gh" x="438" y="59" width="44" height="52" rx="6"></rect>
  <text class="qm" x="460" y="93" text-anchor="middle">?</text>
  <text class="nt" x="540" y="79">Lay out the steps first.</text>
  <text class="nt" x="540" y="99">Work out the output later.</text>

  <text class="sl on" x="30" y="162">THE WAY WE DO IT</text>
  <rect class="pg hot" x="190" y="131" width="44" height="52" rx="6"></rect>
  <path class="pgl b" d="M190 146h44"></path>
  <path class="pgl b" d="M199 157h24"></path>
  <path class="pgl b" d="M199 165h28"></path>
  <path class="pgl b" d="M199 173h20"></path>
  <path class="ar b" d="M248 157h26" marker-end="url(#s13-ab)"></path>
  <rect class="mini" x="296" y="140" width="52" height="34" rx="7"></rect>
  <path class="ar" d="M351 157h8" marker-end="url(#s13-ag)"></path>
  <rect class="mini" x="364" y="140" width="52" height="34" rx="7"></rect>
  <path class="ar" d="M419 157h8" marker-end="url(#s13-ag)"></path>
  <rect class="mini" x="432" y="140" width="52" height="34" rx="7"></rect>
  <text class="nt" x="540" y="151">Draw the output first.</text>
  <text class="nt" x="540" y="171">Then derive the steps it needs.</text>
  <line class="hr" x1="30" y1="208" x2="870" y2="208"></line>

  <text class="sl" x="30" y="240">FOUR QUESTIONS PER OUTPUT</text>
  <rect class="doc" x="30" y="258" width="230" height="258" rx="12"></rect>
  <path class="docl" d="M30 288h230"></path>
  <circle class="dot" cx="48" cy="273" r="2.8"></circle>
  <circle class="dot" cx="60" cy="273" r="2.8"></circle>
  <circle class="dot" cx="72" cy="273" r="2.8"></circle>
  <rect class="tt" x="54" y="306" width="146" height="13" rx="4"></rect>
  <rect class="ln" x="54" y="334" width="182" height="6" rx="3"></rect>
  <rect class="ln" x="54" y="350" width="182" height="6" rx="3"></rect>
  <rect class="ln" x="54" y="366" width="152" height="6" rx="3"></rect>
  <rect class="img" x="54" y="386" width="182" height="62" rx="8"></rect>
  <circle class="imgd" cx="78" cy="408" r="5"></circle>
  <path class="imgp" d="M60 444l22-24 20 22 12-12 16 16"></path>
  <rect class="ln" x="54" y="466" width="182" height="6" rx="3"></rect>
  <rect class="ln" x="54" y="482" width="146" height="6" rx="3"></rect>
  <text class="cap" x="145" y="544" text-anchor="middle">One published SEO article</text>

  <path class="lead2" d="M264 387H300"></path>
  <path class="lead2" d="M300 284V518"></path>

  <path class="lead2" d="M300 278h30" marker-end="url(#s13-ag)"></path>
  <rect class="vg" x="340" y="250" width="56" height="56" rx="12"></rect>
  <circle class="vs" cx="363" cy="271" r="7.5"></circle>
  <path class="vs" d="M351 295c0-8.4 5.4-12.8 12-12.8s12 4.4 12 12.8"></path>
  <circle class="vf" cx="382" cy="265" r="6.5"></circle>
  <path class="vk" d="M378.8 265l2.2 2.4 4.2-4.6"></path>
  <text class="no" x="412" y="270">01</text>
  <text class="qt" x="440" y="271">Who owns the final output?</text>
  <text class="ansl" x="412" y="292">A name, not a department.</text>
  <text class="ansl" x="412" y="310">For example: the SEO lead.</text>

  <path class="lead2" d="M300 356h30" marker-end="url(#s13-ag)"></path>
  <rect class="vg" x="340" y="328" width="56" height="56" rx="12"></rect>
  <path class="vs b" d="M351 346l2.6 3 5.2-6"></path>
  <rect class="vl" x="365" y="344" width="20" height="3.5" rx="1.8"></rect>
  <path class="vs b" d="M351 357l2.6 3 5.2-6"></path>
  <rect class="vl" x="365" y="355" width="20" height="3.5" rx="1.8"></rect>
  <path class="vs b" d="M351 368l2.6 3 5.2-6"></path>
  <rect class="vl" x="365" y="366" width="20" height="3.5" rx="1.8"></rect>
  <text class="no" x="412" y="348">02</text>
  <text class="qt" x="440" y="349">What counts as a good one?</text>
  <text class="ansl" x="412" y="370">Written down as a checkable list:</text>
  <text class="ansl" x="412" y="388">on brief, primary keywords covered, no technical errors.</text>

  <path class="lead2" d="M300 434h30" marker-end="url(#s13-ag)"></path>
  <rect class="vg" x="340" y="406" width="56" height="56" rx="12"></rect>
  <rect class="vs" x="348" y="428" width="11" height="13" rx="3"></rect>
  <path class="vs" d="M360 434.5h3"></path>
  <rect class="vs" x="364" y="428" width="11" height="13" rx="3"></rect>
  <path class="vs" d="M376 434.5h3"></path>
  <rect class="vs" x="380" y="428" width="11" height="13" rx="3"></rect>
  <text class="no" x="412" y="426">03</text>
  <text class="qt" x="440" y="427">What is the current process for it?</text>
  <text class="ansl" x="412" y="448">Described after the target is known, not before.</text>
  <text class="ansl" x="412" y="466">These are the five stages in the blueprint.</text>

  <path class="lead2" d="M300 512h30" marker-end="url(#s13-ag)"></path>
  <rect class="vg" x="340" y="484" width="56" height="56" rx="12"></rect>
  <rect class="vs" x="352" y="496" width="14" height="14" rx="4"></rect>
  <rect class="vs" x="370" y="496" width="14" height="14" rx="4"></rect>
  <rect class="vs" x="352" y="514" width="14" height="14" rx="4"></rect>
  <rect class="vs" x="370" y="514" width="14" height="14" rx="4"></rect>
  <circle class="vf" cx="377" cy="521" r="3.5"></circle>
  <text class="no" x="412" y="504">04</text>
  <text class="qt" x="440" y="505">Which tools and accounts are needed?</text>
  <text class="ansl" x="412" y="526">Only now do you decide what to buy and who gets access.</text>
  <text class="ansl" x="412" y="544">Not at the start.</text>
</svg>