<svg viewBox="0 0 1100 596" width="1100" height="596" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manual work: copy-paste, rebuild formatting, a 20-image loop per article"><style>
      text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
      .n{fill:#FFFFFF;stroke:#16181A;stroke-width:.9} .in{fill:#FBFBFA;stroke:#3A4046;stroke-width:.9}
      .tot{fill:#16181A;stroke:#16181A;stroke-width:.9} .chip{fill:#FFFFFF;stroke:#C6CBCF;stroke-width:.8}
      .ln{stroke:#16181A;stroke-width:.9;fill:none}
      .lbb{font-size:13.5px;font-weight:700;fill:#16181A;text-anchor:middle} .lbs{font-size:11px;fill:#6E757C;text-anchor:middle}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;font-size:10.5px;fill:#555B61;text-anchor:middle}
      .toti{font-size:13.5px;font-weight:700;fill:#FFFFFF;text-anchor:middle} .monot{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;font-size:10.5px;fill:#FFFFFF;opacity:.85;text-anchor:middle}
      .ct{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:9.5px;fill:#6E757C;text-anchor:middle} .kick{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;font-size:9.5px;letter-spacing:.13em;fill:#6E757C}
    </style><rect x="0" y="0" width="1100" height="596" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#16181A"/></marker></defs><text class="kick" x="40" y="26" text-anchor="start">MANUAL · BY HAND · NO AGENT · NO HTML</text><rect class="in" x="440" y="40" width="220" height="54" rx="3"/><text class="lbb" x="550" y="64" text-anchor="middle">Google Doc</text><text class="mono" x="550" y="80" text-anchor="middle">30 pages · 20 images</text><line class="ln" x1="550" y1="94" x2="550" y2="120" marker-end="url(#ah)"/><rect class="n" x="420" y="120" width="260" height="48" rx="3"/><text class="lbb" x="550" y="150" text-anchor="middle">Copy-paste into the CMS</text><line class="ln" x1="550" y1="168" x2="550" y2="196" marker-end="url(#ah)"/><rect class="n" x="330" y="196" width="440" height="92" rx="3"/><text class="lbb" x="550" y="220" text-anchor="middle">Rebuild the formatting by hand</text><rect class="chip" x="334.0" y="238" width="80" height="26" rx="13"/><text class="ct" x="374.0" y="255" text-anchor="middle">headings</text><rect class="chip" x="422.0" y="238" width="80" height="26" rx="13"/><text class="ct" x="462.0" y="255" text-anchor="middle">colours</text><rect class="chip" x="510.0" y="238" width="80" height="26" rx="13"/><text class="ct" x="550.0" y="255" text-anchor="middle">alignment</text><rect class="chip" x="598.0" y="238" width="80" height="26" rx="13"/><text class="ct" x="638.0" y="255" text-anchor="middle">lists</text><rect class="chip" x="686.0" y="238" width="80" height="26" rx="13"/><text class="ct" x="726.0" y="255" text-anchor="middle">tables</text><text class="lbs" x="550" y="282" text-anchor="middle">whatever the paste dropped</text><line class="ln" x1="550" y1="288" x2="550" y2="318" marker-end="url(#ah)"/><rect x="250" y="318" width="600" height="118" rx="4" fill="#FFFDF6" stroke="#B4801F" stroke-width="1.3"/><text x="826" y="338" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="9.5px" letter-spacing="0.12em" fill="#B4801F">EACH IMAGE · REPEAT 20×</text><rect class="chip" x="284.0" y="372" width="82" height="32" rx="3"/><text class="ct" x="325.0" y="391" text-anchor="middle">pull out</text><rect class="chip" x="374.0" y="372" width="82" height="32" rx="3"/><text class="ct" x="415.0" y="391" text-anchor="middle">resize</text><line class="ln" x1="366.0" y1="388" x2="374.0" y2="388" marker-end="url(#ah)"/><rect class="chip" x="464.0" y="372" width="82" height="32" rx="3"/><text class="ct" x="505.0" y="391" text-anchor="middle">convert</text><line class="ln" x1="456.0" y1="388" x2="464.0" y2="388" marker-end="url(#ah)"/><rect class="chip" x="554.0" y="372" width="82" height="32" rx="3"/><text class="ct" x="595.0" y="391" text-anchor="middle">rename</text><line class="ln" x1="546.0" y1="388" x2="554.0" y2="388" marker-end="url(#ah)"/><rect class="chip" x="644.0" y="372" width="82" height="32" rx="3"/><text class="ct" x="685.0" y="391" text-anchor="middle">upload</text><line class="ln" x1="636.0" y1="388" x2="644.0" y2="388" marker-end="url(#ah)"/><rect class="chip" x="734.0" y="372" width="82" height="32" rx="3"/><text class="ct" x="775.0" y="391" text-anchor="middle">re-insert</text><line class="ln" x1="726.0" y1="388" x2="734.0" y2="388" marker-end="url(#ah)"/><path d="M808.0,404 q26,26 -520,18 q-24,4 -24,-14" fill="none" stroke="#B4801F" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="550" y="430" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="14px" font-weight="700" fill="#B4801F">× 20</text><line class="ln" x1="550" y1="436" x2="550" y2="466" marker-end="url(#ah)"/><rect class="tot" x="430" y="466" width="240" height="50" rx="3"/><text class="toti" x="550" y="490" text-anchor="middle">Published in the CMS</text><text class="monot" x="550" y="506" text-anchor="middle">by hand, step by step</text><text class="lbs" x="550" y="556" text-anchor="middle">no agent · no HTML · a slow afternoon per article</text></svg>