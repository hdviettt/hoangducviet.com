<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Step 2 of the publishing pipeline: Normalize" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style></defs>
  <rect width="1200" height="720" fill="#F7F9FC"/>
  <text x="1128" y="560" font-size="440" font-weight="800" fill="#EAEFF7" text-anchor="end" letter-spacing="-10">2</text>
  <text x="72" y="96" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1.5">STEP 2 OF 6 · NORMALIZE</text>
  <line x1="72" y1="124" x2="1128" y2="124" stroke="#0A0A0A" stroke-width="1.5"/>
  <text x="72" y="196" font-size="46" font-weight="700" fill="#0A0A0A" letter-spacing="-0.5">Normalize</text>
  <text x="72" y="242" font-size="19" fill="#3D4149">The patterns learned once for this site are applied deterministically.</text>
  <rect x="72" y="300" width="480" height="220" rx="10" fill="#FBECEC" stroke="#EAC8C8" stroke-width="1.25"/>
  <text x="96" y="340" font-size="12" font-weight="700" fill="#A44" letter-spacing="1">GOOGLE DOCS MARKUP</text>
  <text x="96" y="384" class="mono" font-size="14" fill="#2B3A67">&lt;p style=<tspan fill="#A44">"margin:0;line-height:1.38"</tspan>&gt;</text>
  <text x="96" y="414" class="mono" font-size="14" fill="#2B3A67">&lt;span style=<tspan fill="#A44">"font-weight:400"</tspan>&gt;…</text>
  <text x="96" y="470" font-size="14" font-weight="400" fill="#A44">inline-style noise</text>
  <line x1="576" y1="410" x2="672" y2="410" stroke="#C8D0DC" stroke-width="2"/>
  <path d="M672 410 l-11 -6 v12 z" fill="#C8D0DC"/>
  <rect x="696" y="300" width="360" height="220" rx="10" fill="#EEF2FA" stroke="#DDE3EC" stroke-width="1.25"/>
  <text x="720" y="340" font-size="12" font-weight="700" fill="#0038B8" letter-spacing="1">HOUSE STYLE</text>
  <text x="720" y="384" class="mono" font-size="14" fill="#2B3A67">&lt;p style=<tspan fill="#0038B8">"text-align: justify;"</tspan>&gt;</text>
  <text x="720" y="414" class="mono" font-size="14" fill="#2B3A67">&lt;h2 class="titletab"&gt;</text>
  <text x="720" y="470" font-size="14" font-weight="400" fill="#0038B8">the saved patterns, applied by script</text>
  <line x1="72" y1="636" x2="1128" y2="636" stroke="#DDE3EC" stroke-width="1.25"/>
  <text x="72" y="676" font-size="15.5" fill="#3D4149"><tspan font-size="16" font-weight="700" fill="#0038B8">NO MODEL HERE</tspan>   the same input produces the same HTML on every run — which is the whole point.</text>
</svg>
