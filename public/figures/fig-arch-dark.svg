    </style><rect x="0" y="0" width="1160" height="1020" fill="#24272D"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#ECEEF1"/></marker></defs><rect class="band" x="150" y="30" width="860" height="430" rx="3"/><text class="bandn" x="168" y="50">A</text><text class="bandt" x="182" y="50">ONBOARDING · ONCE PER WEBSITE</text><rect class="in" x="360" y="68" width="220" height="50" rx="2"/><text class="lbb" x="470.0" y="89.0">Raw Google Doc</text><text class="lbs" x="470.0" y="106.0">unformatted article</text><rect class="in" x="620" y="68" width="220" height="50" rx="2"/><text class="lbb" x="730.0" y="89.0">One published article</text><text class="lbs" x="730.0" y="106.0">in the client&#x27;s house style</text><line class="ln" x1="470" y1="118" x2="470" y2="140"/><line class="ln" x1="730" y1="118" x2="730" y2="140"/><line class="ln" x1="470" y1="140" x2="730" y2="140"/><line class="ln" x1="600" y1="140" x2="600" y2="168" marker-end="url(#ah)"/><rect class="ai" x="380" y="168" width="440" height="58" rx="2"/><text class="idxi" x="388" y="182">1</text><text class="lbbi" x="600.0" y="193.0">One Claude call</text><text class="monoi" x="600.0" y="210.0">sonnet-4-5 · max_tokens=4000 · 60s · no retries</text><text class="edge1" x="828" y="192" text-anchor="start">the only place</text><text class="edge1" x="828" y="207" text-anchor="start">a model runs</text><line class="ln" x1="600" y1="226" x2="600" y2="252" marker-end="url(#ah)"/><rect class="n" x="320" y="252" width="560" height="172" rx="3"/><text class="idx" x="328" y="266">2</text><text class="lbb" x="600" y="272">Deterministic post-processing</text><text class="lbs" x="600" y="289">merges the model output in a fixed order</text><rect class="row" x="346" y="304" width="508" height="30" rx="2"/><text class="lbl" x="362" y="323">REPLACE   paragraph · span · anchor</text><rect class="chip" x="742" y="310" width="96" height="18" rx="9"/><text class="ct" x="790" y="322">drop model&#x27;s</text><rect class="row" x="346" y="340" width="508" height="30" rx="2"/><text class="lbl" x="362" y="359">APPEND   wrapper · table</text><rect class="chip" x="742" y="346" width="96" height="18" rx="9"/><text class="ct" x="790" y="358">keep + add</text><text class="lbs" x="600" y="395">code wins where code has evidence · deterministic, identical every run</text><line class="ln" x1="600" y1="424" x2="600" y2="470" marker-end="url(#ah)"/><rect class="sunk" x="400" y="470" width="400" height="66" rx="3"/><line x1="400" y1="470" x2="400" y2="536" stroke="#4FD3A0" stroke-width="3"/><text class="lbb" x="600" y="493">Pattern store</text><text class="mono" x="600" y="510">postgres · html_configs[patterns]</text><text class="lbs" x="600" y="527">the model&#x27;s answer is frozen here, never re-run</text><text class="edge1" x="806" y="505" text-anchor="start">1 store</text><text class="edge1" x="806" y="520" text-anchor="start">· N articles</text><line class="ln" x1="600" y1="536" x2="600" y2="566" marker-end="url(#ah)"/><rect class="band" x="150" y="560" width="860" height="430" rx="3"/><text class="bandn" x="168" y="580">B</text><text class="bandt" x="182" y="580">PUBLISH · EVERY ARTICLE</text><text x="994" y="580" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9px" letter-spacing="0.14em" font-weight="700" fill="#4FD3A0" text-anchor="end">0 MODEL CALLS</text><rect class="in" x="175" y="596" width="150" height="96" rx="3"/><text class="lbb" x="250" y="628">New Google Doc</text><text class="lbs" x="250" y="648">next article</text><path class="lnv" d="M325,644 H358" marker-end="url(#ah)"/><rect class="n" x="360" y="596" width="540" height="160" rx="3"/><text class="idx" x="368" y="610">3</text><text class="lbb" x="630" y="616">publish_run.py</text><text class="mono" x="630" y="633">332 lines · 6 steps · 0 model calls</text><rect class="chip" x="372" y="670" width="80" height="34" rx="3"/><text class="cti" x="412.0" y="685">1</text><text class="ct" x="412.0" y="697">read Doc</text><rect class="chip" x="459" y="670" width="80" height="34" rx="3"/><text class="cti" x="499.0" y="685">2</text><text class="ct" x="499.0" y="697">apply patterns</text><line class="ln" x1="452" y1="687" x2="459" y2="687" marker-end="url(#ah)"/><rect class="chip" x="546" y="670" width="80" height="34" rx="3"/><text class="cti" x="586.0" y="685">3</text><text class="ct" x="586.0" y="697">process images</text><line class="ln" x1="539" y1="687" x2="546" y2="687" marker-end="url(#ah)"/><rect class="chip" x="633" y="670" width="80" height="34" rx="3"/><text class="cti" x="673.0" y="685">4</text><text class="ct" x="673.0" y="697">upload to WP</text><line class="ln" x1="626" y1="687" x2="633" y2="687" marker-end="url(#ah)"/><rect class="chip" x="720" y="670" width="80" height="34" rx="3"/><text class="cti" x="760.0" y="685">5</text><text class="ct" x="760.0" y="697">finalize HTML</text><line class="ln" x1="713" y1="687" x2="720" y2="687" marker-end="url(#ah)"/><rect class="chip" x="807" y="670" width="80" height="34" rx="3"/><text class="cti" x="847.0" y="685">6</text><text class="ct" x="847.0" y="697">create draft</text><line class="ln" x1="800" y1="687" x2="807" y2="687" marker-end="url(#ah)"/><text class="lbs" x="630" y="738">all image uploads fail → stop before creating the post · filenames normalized to the first publish</text><line class="ln" x1="600" y1="756" x2="600" y2="786" marker-end="url(#ah)"/><rect class="tot" x="450" y="786" width="300" height="56" rx="2"/><text class="toti" x="600.0" y="810.0">WordPress draft</text><text class="monot" x="600.0" y="827.0">status=&quot;draft&quot;  (literal)</text><path class="lnv" d="M750,814 H980 V734" marker-end="url(#ah)"/><rect class="in" x="905" y="660" width="150" height="72" rx="3"/><text class="lb" x="980" y="684">Hand-off HTML</text><text class="lbs" x="980" y="702">when the client</text><text class="lbs" x="980" y="718">grants no API</text><text class="edge1" x="812" y="806">or</text><line class="ln" x1="600" y1="842" x2="600" y2="860" marker-end="url(#ah)"/><rect class="gate" x="430" y="860" width="340" height="76" rx="3"/><text class="gatet" x="760" y="879" text-anchor="end">HUMAN GATE</text><text class="lbb" x="600" y="906">A person reviews &amp; clicks Publish</text><text x="600" y="925" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11px" fill="#ECEEF1" text-anchor="middle">every article is still published by a human, never auto-clicked</text><line class="rule" x1="40" y1="966" x2="1120" y2="966"/><rect class="n" x="40" y="979" width="22" height="14" rx="2"/><text class="edge1" x="70" y="990" text-anchor="start">node/step</text><rect class="ai" x="180" y="979" width="22" height="14" rx="2"/><text class="edge1" x="210" y="990" text-anchor="start">model call (1×/website)</text><rect class="sunk" x="420" y="979" width="22" height="14" rx="2"/><text class="edge1" x="450" y="990" text-anchor="start">pattern store</text><rect class="tot" x="575" y="979" width="22" height="14" rx="2"/><text class="edge1" x="605" y="990" text-anchor="start">final result</text><rect class="gate" x="720" y="979" width="22" height="14" rx="2"/><text class="edge1" x="750" y="990" text-anchor="start">human gate</text><line class="lnv" x1="880" y1="986" x2="902" y2="986"/><text class="edge1" x="910" y="990" text-anchor="start">read-in / side branch</text></svg>