<svg viewBox="0 0 1160 1020" width="1160" height="1020" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Publishing agent architecture: one onboarding model call, frozen pattern store, zero-model publish"><style>
      text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
