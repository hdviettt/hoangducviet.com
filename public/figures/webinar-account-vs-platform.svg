<svg xmlns="http://www.w3.org/2000/svg" id="s6" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 960 606" role="img" aria-label="On the left, what one person needs: a chatbot subscription and nothing to build. On the right, what a department or company needs: several automations of different shapes standing on one shared platform of data and tools, permissions and safety, measurement and operations.">
<style>
/* --- Cá nhân cần gì · Tổ chức cần gì --- */
#s6 .sl{fill:#94A3B4;font-size:11.5px;font-weight:700;letter-spacing:.16em}
#s6 .sl.on{fill:#004AEF}
#s6 .tag{fill:#94A3B4;font-size:10.5px;font-weight:700;letter-spacing:.14em}
#s6 .tag.on{fill:#004AEF}
#s6 .pt{fill:#101E33;font-size:16px;font-weight:600}
#s6 .pt.mut{fill:#94A3B4;font-style:italic;font-weight:400}
#s6 .nt{fill:#44566E;font-size:15px}
#s6 .bt{fill:#101E33;font-size:15px;font-weight:600}
#s6 .li{fill:#44566E;font-size:13.5px}
#s6 .base{fill:#94A3B4;font-size:11.5px;font-weight:700;letter-spacing:.16em}
#s6 .box{fill:#FFFFFF;stroke:#C2CFDD;stroke-width:1.4}
#s6 .box.gh{stroke-dasharray:6 5;fill:none}
#s6 .panel{fill:#FFFFFF;stroke:#C2CFDD;stroke-width:1.4}
#s6 .ic{fill:none;stroke:#7E90A6;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#s6 .hr{stroke:#DFE6EE;stroke-width:1.3}
#s6 .sep{stroke:#DFE6EE;stroke-width:1.2}
#s6 .tick{stroke:#C2CFDD;stroke-width:1.4;fill:none}
#s6 .dot{fill:#C2CFDD}
.s6_ic{fill:none;stroke:#7E90A6;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="960" height="606" fill="#FFFFFF"/>


  <defs>
    <g id="s6-k-user" class="s6_ic"><circle cx="10" cy="6.4" r="3.4"></circle><path d="M3.2 17.2c0-3.4 3-5.6 6.8-5.6s6.8 2.2 6.8 5.6"></path></g>
    <g id="s6-k-db" class="s6_ic"><ellipse cx="10" cy="4.8" rx="6.6" ry="2.6"></ellipse><path d="M3.4 4.8v10.4c0 1.44 2.95 2.6 6.6 2.6s6.6-1.16 6.6-2.6V4.8"></path><path d="M3.4 10c0 1.44 2.95 2.6 6.6 2.6s6.6-1.16 6.6-2.6"></path></g>
    <g id="s6-k-lock" class="s6_ic"><rect x="3.8" y="8.8" width="12.4" height="8.4" rx="2.2"></rect><path d="M6.8 8.8V6.6a3.2 3.2 0 0 1 6.4 0v2.2"></path></g>
    <g id="s6-k-target" class="s6_ic"><circle cx="10" cy="10" r="7.4"></circle><circle cx="10" cy="10" r="3.2"></circle><path d="M10 2.6v2.2M10 15.2v2.2M2.6 10h2.2M15.2 10h2.2"></path></g>
    <marker id="s6-ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.6 0.8 L7 4 L0.6 7.2" fill="none" stroke="#C2CFDD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker>
    <marker id="s6-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.6 0.8 L7 4 L0.6 7.2" fill="none" stroke="#004AEF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker>
  </defs>

  <text class="sl" x="30" y="16">WHAT ONE PERSON NEEDS</text>
  <rect class="box" x="30" y="38" width="330" height="54" rx="27"></rect>
  <use href="#s6-k-user" x="86" y="55"></use>
  <text class="pt" x="118" y="72">One chatbot account</text>
  <text class="nt" x="396" y="62">Paid monthly. Open it and go.</text>
  <text class="nt" x="396" y="84">Nothing to build.</text>
  <line class="hr" x1="30" y1="122" x2="930" y2="122"></line>

  <text class="sl on" x="30" y="158">WHAT A DEPARTMENT OR A COMPANY NEEDS</text>
  <rect class="box" x="30" y="178" width="441" height="74" rx="12"></rect>
  <text class="tag" x="54" y="204">WORKFLOW</text>
  <text class="pt" x="54" y="230">Sync the price list</text>
  <rect class="box" x="489" y="178" width="441" height="74" rx="12"></rect>
  <text class="tag on" x="513" y="204">AI WORKFLOW</text>
  <text class="pt" x="513" y="230">Write the meta description</text>
  <rect class="box" x="30" y="266" width="441" height="74" rx="12"></rect>
  <text class="tag on" x="54" y="292">AGENT</text>
  <text class="pt" x="54" y="318">Publish an SEO article</text>
  <rect class="box gh" x="489" y="266" width="441" height="74" rx="12"></rect>
  <text class="pt mut" x="513" y="310">and many more jobs after that</text>
  <path class="tick" d="M250 340v22M710 340v22"></path>

  <rect class="panel" x="30" y="362" width="900" height="206" rx="16"></rect>
  <text class="base" x="54" y="394">SHARED PLATFORM · BUILT ONCE, REUSED BY EVERY JOB</text>
  <use href="#s6-k-db" x="54" y="414"></use>
  <text class="bt" x="84" y="429">Data &amp; tools</text>
  <circle class="dot" cx="63" cy="454" r="2"></circle>
  <text class="li" x="84" y="459">Internal data sources</text>
  <circle class="dot" cx="63" cy="480" r="2"></circle>
  <text class="li" x="84" y="485">Connectors to existing tools</text>
  <circle class="dot" cx="63" cy="506" r="2"></circle>
  <text class="li" x="84" y="511">Context memory</text>
  <circle class="dot" cx="63" cy="532" r="2"></circle>
  <text class="li" x="84" y="537">Somewhere users click</text>
  <line class="sep" x1="322" y1="410" x2="322" y2="550"></line>
  <use href="#s6-k-lock" x="338" y="414"></use>
  <text class="bt" x="368" y="429">Permissions &amp; safety</text>
  <circle class="dot" cx="347" cy="454" r="2"></circle>
  <text class="li" x="368" y="459">Who may see what</text>
  <circle class="dot" cx="347" cy="480" r="2"></circle>
  <text class="li" x="368" y="485">Guardrails when it breaks</text>
  <circle class="dot" cx="347" cy="506" r="2"></circle>
  <text class="li" x="368" y="511">A human approver before publish</text>
  <line class="sep" x1="606" y1="410" x2="606" y2="550"></line>
  <use href="#s6-k-target" x="622" y="414"></use>
  <text class="bt" x="652" y="429">Measurement &amp; operations</text>
  <circle class="dot" cx="631" cy="454" r="2"></circle>
  <text class="li" x="652" y="459">Logs &amp; tracing</text>
  <circle class="dot" cx="631" cy="480" r="2"></circle>
  <text class="li" x="652" y="485">Quality scoring</text>
  <circle class="dot" cx="631" cy="506" r="2"></circle>
  <text class="li" x="652" y="511">Cost tracking</text>
  <circle class="dot" cx="631" cy="532" r="2"></circle>
  <text class="li" x="652" y="537">Roll back a version</text>
</svg>