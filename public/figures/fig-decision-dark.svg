<svg viewBox="0 0 1000 410" width="1000" height="410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="REPLACE/APPEND matrix across five layers"><style>
      text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
      .rule{stroke:#3C4048;stroke-width:1} .hrule{stroke:#ECEEF1;stroke-width:1.1}
      .h{font-size:10.5px;font-weight:700;letter-spacing:.09em;fill:#A6ADB6}
      .el{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;font-size:13px;fill:#ECEEF1;font-weight:700}
      .act{font-size:13px;font-weight:700;fill:#ECEEF1} .mv{font-size:12.5px} .rs{font-size:12px;fill:#C2C7CE}
    </style><rect x="0" y="0" width="1000" height="410" fill="#24272D"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#ECEEF1"/></marker></defs><text class="h" x="76" y="60" text-anchor="start">POST-PROCESS:  3 layers REPLACE (drop the model&#x27;s)  ·  2 layers APPEND (keep + add)</text><text class="h" x="76" y="96" text-anchor="start">LAYER</text><text class="h" x="360" y="96" text-anchor="middle">DETECTOR</text><text class="h" x="560" y="96" text-anchor="middle">MODEL&#x27;S VERSION</text><text class="h" x="690" y="96" text-anchor="start">WHY</text><line class="hrule" x1="60" y1="108" x2="960" y2="108"/><text class="el" x="76" y="142" text-anchor="start">p</text><text class="act" x="360" y="142" text-anchor="middle" fill="#ECEEF1">REPLACE</text><text class="mv" x="560" y="142" text-anchor="middle" fill="#A6ADB6" text-decoration="line-through">✗ drop</text><text class="rs" x="690" y="142" text-anchor="start">detector reads rules off the target, steadier than the model</text><line class="rule" x1="60" y1="166" x2="960" y2="166"/><text class="el" x="76" y="196" text-anchor="start">span</text><text class="act" x="360" y="196" text-anchor="middle" fill="#ECEEF1">REPLACE</text><text class="mv" x="560" y="196" text-anchor="middle" fill="#A6ADB6" text-decoration="line-through">✗ drop</text><text class="rs" x="690" y="196" text-anchor="start">regular structure, stable rules</text><line class="rule" x1="60" y1="220" x2="960" y2="220"/><text class="el" x="76" y="250" text-anchor="start">a</text><text class="act" x="360" y="250" text-anchor="middle" fill="#ECEEF1">REPLACE</text><text class="mv" x="560" y="250" text-anchor="middle" fill="#A6ADB6" text-decoration="line-through">✗ drop</text><text class="rs" x="690" y="250" text-anchor="start">anchors built consistently</text><line class="rule" x1="60" y1="274" x2="960" y2="274"/><text class="el" x="76" y="304" text-anchor="start">div / wrapper</text><text class="act" x="360" y="304" text-anchor="middle" fill="#4FD3A0">APPEND</text><text class="mv" x="560" y="304" text-anchor="middle" fill="#4FD3A0">✓ keep + add</text><text class="rs" x="690" y="304" text-anchor="start">novel layout, the model infers intent</text><line class="rule" x1="60" y1="328" x2="960" y2="328"/><text class="el" x="76" y="358" text-anchor="start">table</text><text class="act" x="360" y="358" text-anchor="middle" fill="#4FD3A0">APPEND</text><text class="mv" x="560" y="358" text-anchor="middle" fill="#4FD3A0">✓ keep + add</text><text class="rs" x="690" y="358" text-anchor="start">model catches table intent the detector hasn&#x27;t seen</text><line class="rule" x1="60" y1="382" x2="960" y2="382"/><line class="hrule" x1="60" y1="382" x2="960" y2="382"/></svg>