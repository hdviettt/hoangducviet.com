<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="One request travelling from the user to the SDK and back, with the single point where a model runs" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="520" fill="#F7F9FC"/>

  <text x="64" y="80" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1.5">ONE REQUEST, END TO END</text>

  <!-- spine -->
  <line x1="118" y1="190" x2="1030" y2="190" stroke="#C8D0DC" stroke-width="1.25"/>

  <!-- 1 user -->
  <circle cx="118" cy="190" r="7" fill="#04B876"/>
  <text x="118" y="234" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle">User</text>
  <text x="118" y="256" font-size="13.5" fill="#8A93A3" text-anchor="middle">asks</text>

  <!-- 2 interface -->
  <circle cx="330" cy="190" r="7" fill="#FFFFFF" stroke="#4A5262" stroke-width="1.8"/>
  <text x="330" y="234" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle">Interface</text>
  <text x="330" y="256" font-size="13.5" fill="#8A93A3" text-anchor="middle">Lark or web</text>

  <!-- 3 runner -->
  <circle cx="560" cy="190" r="7" fill="#FFFFFF" stroke="#004AEF" stroke-width="1.8"/>
  <text x="560" y="234" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle">Runner</text>
  <text x="560" y="256" font-size="13.5" fill="#2B3A67" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">frontmatter → options</text>

  <!-- 4 SDK, the only model node -->
  <circle cx="812" cy="190" r="15" fill="#FFF3CF" stroke="#D9A400" stroke-width="1.8"/>
  <circle cx="812" cy="190" r="5" fill="#D9A400"/>
  <text x="812" y="242" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle">Claude Agent SDK</text>
  <text x="812" y="264" font-size="13.5" fill="#8A6D00" text-anchor="middle">the session runs here</text>

  <!-- 5 tools + skills -->
  <circle cx="1030" cy="190" r="7" fill="#FFFFFF" stroke="#4A5262" stroke-width="1.8"/>
  <text x="1030" y="234" font-size="16" font-weight="700" fill="#0A0A0A" text-anchor="middle">Tools and skills</text>
  <text x="1030" y="256" font-size="13.5" fill="#8A93A3" text-anchor="middle">connectors, scripts</text>

  <!-- token annotation band -->
  <line x1="118" y1="132" x2="770" y2="132" stroke="#C8D0DC" stroke-width="1.25" stroke-dasharray="3 5"/>
  <line x1="118" y1="126" x2="118" y2="138" stroke="#C8D0DC" stroke-width="1.25"/>
  <line x1="770" y1="126" x2="770" y2="138" stroke="#C8D0DC" stroke-width="1.25"/>
  <text x="444" y="116" font-size="13.5" fill="#8A93A3" text-anchor="middle">plain code, no tokens</text>

  <line x1="854" y1="132" x2="1030" y2="132" stroke="#D9A400" stroke-width="1.25"/>
  <line x1="854" y1="126" x2="854" y2="138" stroke="#D9A400" stroke-width="1.25"/>
  <line x1="1030" y1="126" x2="1030" y2="138" stroke="#D9A400" stroke-width="1.25"/>
  <text x="942" y="116" font-size="13.5" font-weight="700" fill="#8A6D00" text-anchor="middle">every token</text>

  <!-- return path -->
  <path d="M 812 300 L 812 356 L 330 356" fill="none" stroke="#C8D0DC" stroke-width="1.25"/>
  <path d="M 336 350 L 329 356 L 336 362" fill="none" stroke="#C8D0DC" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="580" y="344" font-size="13.5" fill="#8A93A3" text-anchor="middle">result, plus what it cost</text>

  <!-- run history -->
  <line x1="64" y1="404" x2="1136" y2="404" stroke="#DDE3EC" stroke-width="1.25"/>
  <text x="64" y="440" font-size="17" font-weight="700" fill="#0A0A0A">Every run is written down: input, steps, tokens, cost, outcome.</text>
  <text x="64" y="468" font-size="15" fill="#8A93A3">Nineteen agents share one paper trail, so "what did it do and what did it cost" is a query.</text>
</svg>
