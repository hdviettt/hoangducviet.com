xt x="80" y="404" font-size="0" font-weight="400" fill="#3D4149"></text><rect x="130" y="398" width="230" height="7" rx="3" fill="#8B949E" fill-opacity="0.9"/><text x="80" y="430" font-size="0" font-weight="400" fill="#3D4149"></text><text x="112" y="430" font-size="12" font-weight="400" fill="#79C0FF" font-family="ui-monospace, Consolas, monospace">&lt;img </text><text x="152.25" y="430" font-size="12" font-weight="400" fill="#7EE787" font-family="ui-monospace, Consolas, monospace">src=</text><text x="185.45" y="430" font-size="12" font-weight="400" fill="#A5D6FF" font-family="ui-monospace, Consolas, monospace">"data:image/png;base64,…"</text><text x="80" y="456" font-size="0" font-weight="400" fill="#3D4149"></text><text x="112" y="456" font-size="12" font-weight="400" fill="#79C0FF" font-family="ui-monospace, Consolas, monospace">&lt;span </text><text x="159.3" y="456" font-size="12" font-weight="400" fill="#FF7B72" font-family="ui-monospace, Consolas, monospace">style=</text><text x="206.60000000000002" y="456" font-size="12" font-weight="400" fill="#FF7B72" font-family="ui-monospace, Consolas, monospace">"font-weight:700"&gt;</text><text x="80" y="482" font-size="0" font-weight="400" fill="#3D4149"></text><rect x="130" y="476" width="120" height="7" rx="3" fill="#8B949E" fill-opacity="0.9"/><text x="80" y="508" font-size="0" font-weight="400" fill="#3D4149"></text><text x="94" y="508" font-size="12" font-weight="400" fill="#79C0FF" font-family="ui-monospace, Consolas, monospace">&lt;/article&gt;</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#B7C0CE"/></marker></defs><path d="M636 416 h48" stroke="#B7C0CE" stroke-width="2.5" marker-end="url(#ah)"/><rect x="700" y="236" width="436" height="360" rx="14" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/><text x="724" y="282" font-size="12.5" font-weight="700" fill="#0038B8" letter-spacing="1">WRITTEN TO DISK</text><rect x="724" y="300" width="388" height="64" rx="10" fill="#F4F7FC" stroke="#E1E7F0" stroke-width="1"/><path d="M744 322 h18 l6 6 v18 h-24 Z" fill="none" stroke="#6E7681" stroke-width="1.6"/><text x="784" y="340" font-size="13.5" font-weight="600" fill="#3D4149" font-family="ui-monospace, Consolas, monospace">$DATA_DIR/…/doc.html</text><text x="724" y="404" font-size="14" font-weight="400" fill="#6B7280">30 pages · 20 images · inline-style noise</text><rect x="724" y="426" width="115" height="26" rx="13" fill="#EEF3FE"/><text x="781.4" y="443" font-size="12" font-weight="600" fill="#0038B8" text-anchor="middle">no tokeniser</text><rect x="849" y="426" width="159" height="26" rx="13" fill="#EEF3FE"/><text x="928.4" y="443" font-size="12" font-weight="600" fill="#0038B8" text-anchor="middle">0 model downstream</text><rect x="724" y="482" width="388" height="80" rx="10" fill="#F0FDF8" stroke="#BCEBD6" stroke-width="1.25"/><text x="744" y="514" font-size="14.5" font-weight="600" fill="#0E9469">The thirty pages never enter a</text><text x="744" y="536" font-size="14.5" font-weight="600" fill="#0E9469">context window - nothing is tokenised.</text>
<line x1="64" y1="650" x2="1136" y2="650" stroke="#E1E7F0" stroke-width="1.5"/>
<text x="64" y="684" font-size="13" font-weight="800" fill="#0038B8" letter-spacing="0.5">WHY IT MATTERS</text>
<text x="225.6" y="684" font-size="14.5" font-weight="400" fill="#6B7280">nothing is tokenised because there is nothing downstream to tokenise it.</text>
