<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-label="The sidecar pattern: a deterministic engine produces the numbers, a tool-less assistant discusses them" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA4B6"/>
    </marker>
    <linearGradient id="bd2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/><stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="520" rx="24" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="1098.5" height="518.5" rx="23.25" fill="none" stroke="#E1E6EC" stroke-width="1.5"/>

  <!-- engine -->
  <rect x="56" y="60" width="404" height="300" rx="18" fill="#F4F7FF" stroke="#C9D4EE" stroke-width="1.5"/>
  <rect x="80" y="84" width="150" height="30" rx="15" fill="#E7EEFF"/>
  <text x="155" y="104" font-size="13.5" font-weight="700" fill="#0038B8" text-anchor="middle">THE APP · 0 LLM</text>
  <text x="80" y="150" font-size="20" font-weight="700" fill="#0A0A0A">Deterministic engine</text>
  <text x="80" y="176" font-size="14.5" fill="#4E4F56">Scans, counts, computes. Same numbers</text>
  <text x="80" y="198" font-size="14.5" fill="#4E4F56">every time, no tokens spent.</text>

  <rect x="80" y="218" width="356" height="118" rx="12" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
  <rect x="80" y="218" width="356" height="30" rx="12" fill="#F1F4FA"/>
  <rect x="80" y="236" width="356" height="12" fill="#F1F4FA"/>
  <text x="100" y="239" font-size="13" font-weight="700" fill="#4E4F56">results</text>
  <line x1="80" y1="278" x2="436" y2="278" stroke="#EDF0F5" stroke-width="1.5"/>
  <line x1="80" y1="308" x2="436" y2="308" stroke="#EDF0F5" stroke-width="1.5"/>
  <rect x="100" y="260" width="120" height="9" rx="4.5" fill="#C9D4EE"/>
  <rect x="260" y="260" width="46" height="9" rx="4.5" fill="url(#bd2)"/>
  <rect x="340" y="260" width="60" height="9" rx="4.5" fill="#C9D4EE"/>
  <rect x="100" y="290" width="146" height="9" rx="4.5" fill="#C9D4EE"/>
  <rect x="260" y="290" width="34" height="9" rx="4.5" fill="url(#bd2)"/>
  <rect x="340" y="290" width="72" height="9" rx="4.5" fill="#C9D4EE"/>
  <rect x="100" y="320" width="108" height="9" rx="4.5" fill="#C9D4EE"/>
  <rect x="260" y="320" width="52" height="9" rx="4.5" fill="url(#bd2)"/>
  <rect x="340" y="320" width="40" height="9" rx="4.5" fill="#C9D4EE"/>

  <!-- injection arrow -->
  <path d="M 466 210 L 616 210" fill="none" stroke="#9AA4B6" stroke-width="2" marker-end="url(#arr4)"/>
  <text x="541" y="198" font-size="13" font-weight="700" fill="#4E4F56" text-anchor="middle">injected as context</text>
  <text x="541" y="232" font-size="12.5" fill="#7A8090" text-anchor="middle">on the first turn</text>

  <!-- sidecar -->
  <rect x="628" y="60" width="416" height="300" rx="18" fill="#FFF7DC" stroke="#F2D98C" stroke-width="1.5"/>
  <rect x="652" y="84" width="188" height="30" rx="15" fill="#FFEFB8"/>
  <text x="746" y="104" font-size="13.5" font-weight="700" fill="#8A6D00" text-anchor="middle">THE SIDECAR · trợ lý</text>
  <text x="652" y="150" font-size="20" font-weight="700" fill="#0A0A0A">Tool-less assistant</text>
  <text x="652" y="176" font-size="14.5" fill="#5C4A00">Explains, compares, argues about what</text>
  <text x="652" y="198" font-size="14.5" fill="#5C4A00">the numbers mean. Never recomputes them.</text>

  <rect x="652" y="220" width="240" height="46" rx="14" fill="#FFFFFF" stroke="#F2D98C" stroke-width="1.5"/>
  <text x="672" y="249" font-size="14" fill="#5C4A00">Why did this keyword drop?</text>
  <rect x="740" y="278" width="280" height="60" rx="14" fill="#FFFFFF" stroke="#F2D98C" stroke-width="1.5"/>
  <text x="760" y="304" font-size="14" fill="#5C4A00">Two of the three cited pages are</text>
  <text x="760" y="326" font-size="14" fill="#5C4A00">competitor guides published this month.</text>

  <!-- config strip -->
  <rect x="56" y="392" width="988" height="76" rx="16" fill="#FAFBFD" stroke="#D7DEEA" stroke-width="1.5"/>
  <text x="84" y="422" font-size="14" font-weight="700" fill="#7A8090" letter-spacing="0.5">WHAT MAKES IT A SIDECAR</text>
  <g font-family="monospace" font-size="14" font-weight="700">
    <rect x="84" y="432" width="132" height="26" rx="13" fill="#F1F4FA"/>
    <text x="150" y="450" fill="#2B3A67" text-anchor="middle">tools: []</text>
    <rect x="228" y="432" width="150" height="26" rx="13" fill="#F1F4FA"/>
    <text x="303" y="450" fill="#2B3A67" text-anchor="middle">maxTurns: 10</text>
    <rect x="390" y="432" width="156" height="26" rx="13" fill="#F1F4FA"/>
    <text x="468" y="450" fill="#2B3A67" text-anchor="middle">hidden: true</text>
  </g>
  <text x="576" y="450" font-size="14.5" fill="#4E4F56">No tools means it cannot fetch, scan, or write. It can only think out loud.</text>
</svg>
