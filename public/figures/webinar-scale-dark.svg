<svg xmlns="http://www.w3.org/2000/svg" id="s5" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 1120 780" role="img" aria-label="Seven questions asked at three scales: one person, a department, and the whole company. How it runs, how data gets in, who is accountable, how quality is known, what it costs, where the know-how sits, and what happens when the best person leaves.">
<style>
/* --- Cá nhân · Phòng ban · Tổ chức --- */
#s5 .lead{fill:#AFBFD0;font-size:16.5px}
#s5 .tier{fill:#EAF0F6;font-size:21px;font-weight:700;letter-spacing:-.018em}
#s5 .tier.on{fill:#4E82FF}
#s5 .scale{fill:#6E7C8B;font-size:14px}
#s5 .grp{fill:#6E7C8B;font-size:12.5px;font-weight:700;letter-spacing:.16em}
#s5 .q{fill:#EAF0F6;font-size:16px;font-weight:600}
#s5 .v{fill:#AFBFD0;font-size:15px}
#s5 .v.on{fill:#4E82FF;font-weight:700}
#s5 .kl{fill:#EAF0F6;font-size:16.5px;font-weight:700}
#s5 .kv{fill:#EAF0F6;font-size:15.5px;font-weight:600}
#s5 .kv.on{fill:#4E82FF;font-weight:700}
#s5 .dt{fill:#4C5A68}
#s5 .bd{stroke:none}
#s5 .b1{fill:#141A22}
#s5 .b2{fill:#16202E}
#s5 .b3{fill:#182740}
#s5 .cap{stroke:none}
#s5 .k1{fill:#3A4652}
#s5 .k2{fill:#2E5AA8}
#s5 .k3{fill:#4E82FF}
#s5 .ic{fill:none;stroke:#7C8B9C;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#s5 .hr{stroke:#212A34;stroke-width:1.2}
#s5 .hr2{stroke:#313D49;stroke-width:1.6}
.s5_ic{fill:none;stroke:#7C8B9C;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="1120" height="780" fill="#12171E"/>


  <defs>
    <g id="s5-k-clock" class="s5_ic"><circle cx="10" cy="10" r="7.4"></circle><path d="M10 5.4V10l3.2 2"></path></g>
    <g id="s5-k-db" class="s5_ic"><ellipse cx="10" cy="4.8" rx="6.6" ry="2.6"></ellipse>
      <path d="M3.4 4.8v10.4c0 1.44 2.95 2.6 6.6 2.6s6.6-1.16 6.6-2.6V4.8"></path>
      <path d="M3.4 10c0 1.44 2.95 2.6 6.6 2.6s6.6-1.16 6.6-2.6"></path></g>
    <g id="s5-k-user" class="s5_ic"><circle cx="10" cy="6.4" r="3.0"></circle>
      <path d="M3.2 17.2c0-3.4 3-5.6 6.8-5.6s6.8 2.2 6.8 5.6"></path></g>
    <g id="s5-k-gauge" class="s5_ic"><circle cx="10" cy="10" r="7.4"></circle><circle cx="10" cy="10" r="3.2"></circle>
      <path d="M10 2.6v2.2M10 15.2v2.2M2.6 10h2.2M15.2 10h2.2"></path></g>
    <g id="s5-k-coin" class="s5_ic"><circle cx="10" cy="10" r="7.4"></circle>
      <path d="M12.4 7.2c-.5-.9-1.4-1.4-2.6-1.4-1.6 0-2.6.8-2.6 2s1 1.7 2.6 2.1 2.6 1 2.6 2.2-1 2.1-2.6 2.1c-1.2 0-2.1-.5-2.6-1.4"></path>
      <path d="M10 4.4v11.2"></path></g>
    <g id="s5-k-book" class="s5_ic"><path d="M4.2 4.6a2 2 0 0 1 2-2h9.6v14.8H6.2a2 2 0 0 0-2 2z"></path>
      <path d="M4.2 4.6v12.8"></path><path d="M8 6.6h4.8"></path></g>
    <g id="s5-k-exit" class="s5_ic"><path d="M11.4 3.4H5.6a1.6 1.6 0 0 0-1.6 1.6v10a1.6 1.6 0 0 0 1.6 1.6h5.8"></path>
      <path d="M9.6 10h7.2"></path><path d="M14.2 7.4 16.8 10l-2.6 2.6"></path></g>
  </defs>

  <text class="lead" x="30" y="16">More users does not just mean more of the same requirements. It means different ones.</text>

  <rect class="bd b1" x="300" y="151" width="263" height="611" rx="10"></rect>
  <rect class="bd b2" x="563" y="151" width="263" height="611" rx="10"></rect>
  <rect class="bd b3" x="826" y="151" width="263" height="611" rx="10"></rect>
  <rect class="cap k1" x="300" y="146" width="263" height="5" rx="2.5"></rect>
  <rect class="cap k2" x="563" y="146" width="263" height="5" rx="2.5"></rect>
  <rect class="cap k3" x="826" y="146" width="263" height="5" rx="2.5"></rect>

  <text class="tier" x="324" y="70">One person</text>
  <text class="scale" x="324" y="96">1 user</text>
  <circle class="dt" cx="327.0" cy="116.0" r="3.0"></circle>
  <text class="tier" x="587" y="70">A department</text>
  <text class="scale" x="587" y="96">5 to 30 people</text>
  <circle class="dt" cx="590.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="599.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="608.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="617.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="626.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="635.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="644.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="653.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="662.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="671.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="680.0" cy="116.0" r="3.0"></circle><circle class="dt" cx="689.0" cy="116.0" r="3.0"></circle>
  <text class="tier on" x="850" y="70">The company</text>
  <text class="scale" x="850" y="96">Many teams, hundreds of people</text>
  <circle class="dt" cx="853.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="862.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="871.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="880.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="889.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="898.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="907.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="916.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="925.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="934.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="943.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="952.0" cy="102.0" r="3.0"></circle><circle class="dt" cx="853.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="862.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="871.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="880.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="889.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="898.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="907.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="916.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="925.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="934.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="943.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="952.0" cy="115.0" r="3.0"></circle><circle class="dt" cx="853.0" cy="128.0" r="3.0"></circle><circle class="dt" cx="862.0" cy="128.0" r="3.0"></circle><circle class="dt" cx="871.0" cy="128.0" r="3.0"></circle><circle class="dt" cx="880.0" cy="128.0" r="3.0"></circle><circle class="dt" cx="889.0" cy="128.0" r="3.0" opacity="0.79"></circle><circle class="dt" cx="898.0" cy="128.0" r="3.0" opacity="0.69"></circle><circle class="dt" cx="907.0" cy="128.0" r="3.0" opacity="0.60"></circle><circle class="dt" cx="916.0" cy="128.0" r="3.0" opacity="0.51"></circle><circle class="dt" cx="925.0" cy="128.0" r="3.0" opacity="0.42"></circle><circle class="dt" cx="934.0" cy="128.0" r="3.0" opacity="0.33"></circle><circle class="dt" cx="943.0" cy="128.0" r="3.0" opacity="0.23"></circle><circle class="dt" cx="952.0" cy="128.0" r="3.0" opacity="0.14"></circle>
  <line class="hr2" x1="30" y1="148" x2="330" y2="148"></line>

  <text class="grp" x="30" y="182">HOW IT RUNS</text>
  <line class="hr" x1="182" y1="177" x2="1090" y2="177"></line>
  <use href="#s5-k-clock" x="30" y="209"></use>
  <text class="q" x="58" y="224">When does it run?</text>
  <text class="v" x="324" y="224">When I open my laptop</text>
  <text class="v" x="587" y="224">On a schedule, or on a trigger</text>
  <text class="v" x="850" y="224">Continuously, self-triggering</text>
  <line class="hr" x1="30" y1="250" x2="1090" y2="250"></line>
  <use href="#s5-k-db" x="30" y="267"></use>
  <text class="q" x="58" y="282">How does data get in?</text>
  <text class="v" x="324" y="282">I paste it in</text>
  <text class="v" x="587" y="282">Wired into the team's tools</text>
  <text class="v" x="850" y="282">Many sources, with permissions</text>

  <text class="grp" x="30" y="340">ACCOUNTABILITY AND CONTROL</text>
  <line class="hr" x1="286" y1="335" x2="1090" y2="335"></line>
  <use href="#s5-k-user" x="30" y="367"></use>
  <text class="q" x="58" y="382">Who answers when it is wrong?</text>
  <text class="v" x="324" y="382">Me</text>
  <text class="v" x="587" y="382">The department head</text>
  <text class="v" x="850" y="382">The company, to clients and law</text>
  <line class="hr" x1="30" y1="408" x2="1090" y2="408"></line>
  <use href="#s5-k-gauge" x="30" y="425"></use>
  <text class="q" x="58" y="440">How do you know it is good?</text>
  <text class="v" x="324" y="440">I can tell by looking</text>
  <text class="v" x="587" y="440">A fixed set of cases to score</text>
  <text class="v" x="850" y="440">Scored continuously, with alarms</text>
  <line class="hr" x1="30" y1="466" x2="1090" y2="466"></line>
  <use href="#s5-k-coin" x="30" y="483"></use>
  <text class="q" x="58" y="498">Do you know what it costs?</text>
  <text class="v" x="324" y="498">A subscription, known up front</text>
  <text class="v" x="587" y="498">Need to know which task burns it</text>
  <text class="v" x="850" y="498">Forecasts, caps, allocation</text>

  <text class="grp" x="30" y="556">WHAT THE COMPANY IS LEFT WITH</text>
  <line class="hr" x1="270" y1="551" x2="1090" y2="551"></line>
  <use href="#s5-k-book" x="30" y="583"></use>
  <text class="q" x="58" y="598">Where does the know-how sit?</text>
  <text class="v" x="324" y="598">In one person's head</text>
  <text class="v" x="587" y="598">In a shared prompt</text>
  <text class="v" x="850" y="598">In the system, versioned</text>
  <line class="hr" x1="30" y1="624" x2="1090" y2="624"></line>
  <use href="#s5-k-exit" x="30" y="641"></use>
  <text class="q" x="58" y="656">Your best person resigns?</text>
  <text class="v" x="324" y="656">You lose everything</text>
  <text class="v" x="587" y="656">You lose part of it</text>
  <text class="v on" x="850" y="656">You lose nothing</text>

  <line class="hr2" x1="30" y1="698" x2="1090" y2="698"></line>
  <text class="kl" x="30" y="744">So what do you need?</text>
  <text class="kv" x="324" y="744">An account is enough</text>
  <text class="kv" x="587" y="744">Accounts start to fall short</text>
  <text class="kv on" x="850" y="744">It has to be a system you build</text>
</svg>