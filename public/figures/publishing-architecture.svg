<path d="M827.0 262 C 827.0 360, 398.0 350, 398.0 420" fill="none" stroke="#0FB5D6" stroke-width="2.5" marker-end="url(#ahc)"/>
<rect x="340.0" y="356" width="176" height="24" rx="12" fill="#E7FAFE" stroke="#0FB5D6" stroke-width="1.25"/>
<text x="428.0" y="372" font-size="12" font-weight="700" fill="#0B7E96" text-anchor="middle">reads the pattern store</text>
<line x1="64" y1="548" x2="1136" y2="548" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="64" y="580" font-size="15.5" font-weight="700" fill="#0A0A0A">The model runs once, at onboarding, and its answer is frozen into the pattern store.</text>
<text x="64" y="604" font-size="14" font-weight="400" fill="#6B7280">Every publish after that is a script reading that store - thirty pages in, a WordPress draft out, and no model anywhere in the path.</text>
</svg>
