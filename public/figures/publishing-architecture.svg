<rect x="332" y="424" width="132" height="60" rx="12" fill="#FFFFFF" stroke="#C8D0DC" stroke-width="1.5" filter="url(#ds)"/><circle cx="352" cy="445" r="12" fill="#EAF0FF"/><text x="352" y="449" font-size="13" font-weight="700" fill="#004AEF" text-anchor="middle">2</text><text x="398.0" y="466.0" font-size="15" font-weight="600" fill="#3D4149" text-anchor="middle">Normalize</text>
<line x1="464" y1="454.0" x2="472" y2="454.0" stroke="#B7C0CE" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="472" y="424" width="132" height="60" rx="12" fill="#FFFFFF" stroke="#C8D0DC" stroke-width="1.5" filter="url(#ds)"/><circle cx="492" cy="445" r="12" fill="#EAF0FF"/><text x="492" y="449" font-size="13" font-weight="700" fill="#004AEF" text-anchor="middle">3</text><text x="538.0" y="466.0" font-size="15" font-weight="600" fill="#3D4149" text-anchor="middle">Images</text>
<line x1="604" y1="454.0" x2="612" y2="454.0" stroke="#B7C0CE" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="612" y="424" width="132" height="60" rx="12" fill="#FFFFFF" stroke="#C8D0DC" stroke-width="1.5" filter="url(#ds)"/><circle cx="632" cy="445" r="12" fill="#EAF0FF"/><text x="632" y="449" font-size="13" font-weight="700" fill="#004AEF" text-anchor="middle">4</text><text x="678.0" y="466.0" font-size="15" font-weight="600" fill="#3D4149" text-anchor="middle">Upload</text>
<line x1="744" y1="454.0" x2="752" y2="454.0" stroke="#B7C0CE" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="752" y="424" width="132" height="60" rx="12" fill="#FFFFFF" stroke="#C8D0DC" stroke-width="1.5" filter="url(#ds)"/><circle cx="772" cy="445" r="12" fill="#EAF0FF"/><text x="772" y="449" font-size="13" font-weight="700" fill="#004AEF" text-anchor="middle">5</text><text x="818.0" y="466.0" font-size="15" font-weight="600" fill="#3D4149" text-anchor="middle">Rewire</text>
<line x1="884" y1="454.0" x2="892" y2="454.0" stroke="#B7C0CE" stroke-width="2.2" marker-end="url(#ah)"/>
