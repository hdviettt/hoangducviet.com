<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Architecture: a single model call at onboarding produces a pattern store; the six-step publish pipeline reads that store and runs with zero model calls" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
