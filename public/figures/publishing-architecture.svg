    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#0FBE86" flood-opacity="0.35"/></filter>
  </defs>
<rect width="1200" height="640" fill="#F7F9FC"/>
