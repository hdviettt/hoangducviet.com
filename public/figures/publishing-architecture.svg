<line x1="184" y1="228.0" x2="236" y2="228.0" stroke="#B7C0CE" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="238" y="197" width="188" height="62" rx="13" fill="#E9FBF4" stroke="#0FBE86" stroke-width="2" filter="url(#glow)"/>
<rect x="252" y="209" width="40" height="18" rx="9" fill="#0FBE86"/>
<text x="272" y="222" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLM</text>
<text x="332" y="222" font-size="15" font-weight="700" fill="#05663F" text-anchor="middle">Claude</text>
<text x="332" y="242" font-size="12" font-weight="400" fill="#3B7A5E" text-anchor="middle">proposes transform rules</text>
