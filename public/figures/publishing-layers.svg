<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Five HTML layers of a scan. Paragraph, span and anchor rules are replaced by the deterministic detector; wrapper and table rules keep the model's proposal alongside the detector's." font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F7F9FC"/>

  <text x="64" y="76" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1.5">ONE SCAN, FIVE LAYERS, TWO DIFFERENT VERDICTS</text>
  <line x1="64" y1="104" x2="1136" y2="104" stroke="#0A0A0A" stroke-width="1.5"/>

  <text x="64"  y="132" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1">LAYER</text>
  <text x="238" y="132" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1">WHAT THE SCAN WRITES INTO THE PROJECT</text>
  <text x="980" y="132" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1">VERDICT</text>
  <line x1="64" y1="150" x2="1136" y2="150" stroke="#DDE3EC" stroke-width="1.25"/>

  <!-- ========================= REPLACED group ========================= -->
  <rect x="64" y="170" width="4" height="256" fill="#004AEF"/>

  <!-- Paragraph -->
  <text x="96"  y="204" font-size="19" font-weight="700" fill="#0A0A0A">Paragraph</text>
  <text x="96"  y="226" font-size="13" fill="#6B7280">p_justify, p_center …</text>
  <rect x="238" y="182" width="700" height="44" rx="6" fill="#EEF2FA" stroke="#DDE3EC" stroke-width="1"/>
  <text x="256" y="209" class="mono" font-size="13.5" fill="#2B3A67">&lt;p style=<tspan fill="#0038B8">"text-align: justify;"</tspan>&gt;\1&lt;/p&gt;</text>
  <text x="980" y="200" font-size="15" font-weight="700" fill="#0038B8">Detector</text>
  <text x="980" y="220" font-size="13" fill="#8A93A3">model discarded</text>

  <!-- Span -->
  <text x="96"  y="288" font-size="19" font-weight="700" fill="#0A0A0A">Span</text>
  <text x="96"  y="310" font-size="13" fill="#6B7280">span_bold_color …</text>
  <rect x="238" y="266" width="700" height="44" rx="6" fill="#EEF2FA" stroke="#DDE3EC" stroke-width="1"/>
  <text x="256" y="293" class="mono" font-size="13.5" fill="#2B3A67">&lt;span style=<tspan fill="#0038B8">"font-weight:700;color:#c00"</tspan>&gt;\1&lt;/span&gt;</text>
  <text x="980" y="284" font-size="15" font-weight="700" fill="#0038B8">Detector</text>
  <text x="980" y="304" font-size="13" fill="#8A93A3">model discarded</text>

  <!-- Anchor -->
  <text x="96"  y="372" font-size="19" font-weight="700" fill="#0A0A0A">Anchor</text>
  <text x="96"  y="394" font-size="13" fill="#6B7280">a_rel_target …</text>
  <rect x="238" y="350" width="700" height="44" rx="6" fill="#EEF2FA" stroke="#DDE3EC" stroke-width="1"/>
  <text x="256" y="377" class="mono" font-size="13.5" fill="#2B3A67">&lt;a href=<tspan fill="#0038B8">"\1"</tspan> rel=<tspan fill="#0038B8">"nofollow"</tspan> target=<tspan fill="#0038B8">"_blank"</tspan>&gt;</text>
  <text x="980" y="368" font-size="15" font-weight="700" fill="#0038B8">Detector</text>
  <text x="980" y="388" font-size="13" fill="#8A93A3">model discarded</text>

  <!-- group tag -->
  <rect x="238" y="410" width="132" height="24" rx="12" fill="#E3ECFD"/>
  <text x="256" y="427" font-size="12.5" font-weight="700" fill="#0038B8" letter-spacing="0.5">REPLACED</text>
  <text x="386" y="427" font-size="14" fill="#6B7280">structure is regular - the detector derives the rule, and derives the same rule every run</text>

  <line x1="64" y1="456" x2="1136" y2="456" stroke="#DDE3EC" stroke-width="1.25"/>

  <!-- ========================= APPENDED group ========================= -->
  <rect x="64" y="476" width="4" height="172" fill="#D9A400"/>

  <!-- Wrapper -->
  <text x="96"  y="510" font-size="19" font-weight="700" fill="#0A0A0A">Wrapper</text>
  <text x="96"  y="532" font-size="13" fill="#6B7280">div_wrap_h2 …</text>
  <rect x="238" y="488" width="470" height="44" rx="6" fill="#FBF4DE" stroke="#EBD9A0" stroke-width="1"/>
  <text x="256" y="515" class="mono" font-size="13" fill="#7A5C00">&lt;div class=<tspan font-weight="700">"titletab"</tspan>&gt;&lt;h2&gt;\1&lt;/h2&gt;&lt;/div&gt;</text>
  <rect x="722" y="488" width="216" height="44" rx="6" fill="#EEF2FA" stroke="#DDE3EC" stroke-width="1"/>
  <text x="740" y="515" class="mono" font-size="13" fill="#2B3A67">+ detector’s own wrappers</text>
  <text x="980" y="512" font-size="15" font-weight="700" fill="#8A6D00">Both kept</text>

  <!-- Table -->
  <text x="96"  y="596" font-size="19" font-weight="700" fill="#0A0A0A">Table</text>
  <text x="96"  y="618" font-size="13" fill="#6B7280">table_classes …</text>
  <rect x="238" y="574" width="470" height="44" rx="6" fill="#FBF4DE" stroke="#EBD9A0" stroke-width="1"/>
  <text x="256" y="601" class="mono" font-size="13" fill="#7A5C00">&lt;table class=<tspan font-weight="700">"has-fixed-layout"</tspan>&gt;</text>
  <rect x="722" y="574" width="216" height="44" rx="6" fill="#EEF2FA" stroke="#DDE3EC" stroke-width="1"/>
  <text x="740" y="601" class="mono" font-size="13" fill="#2B3A67">+ detector’s own tables</text>
  <text x="980" y="596" font-size="15" font-weight="700" fill="#8A6D00">Both kept</text>

  <!-- group tag -->
  <rect x="238" y="632" width="132" height="24" rx="12" fill="#FBF0D0"/>
  <text x="256" y="649" font-size="12.5" font-weight="700" fill="#8A6D00" letter-spacing="0.5">APPENDED</text>
  <text x="386" y="649" font-size="14" fill="#6B7280">layout intent the detector cannot infer - so the model’s proposal keeps a seat next to it</text>

  <line x1="64" y1="676" x2="1136" y2="676" stroke="#0A0A0A" stroke-width="1.5"/>
  <text x="64" y="704" font-size="15.5" font-weight="700" fill="#0A0A0A">The rule is not “code beats the model.” It is “code wins where code has evidence” - and where it has none, the model’s proposal stands.</text>
</svg>
