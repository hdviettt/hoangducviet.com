<svg xmlns="http://www.w3.org/2000/svg" id="s10" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 864 580" role="img" aria-label="Two failures side by side. Ordinary software raises an error at 09:12 and the article never publishes, so the fault is visible and someone fixes it. The AI publishes a confident, finished article at 09:12 that is missing a required section, carries unchecked figures and is off-brand. No alarm goes off on the right.">
<style>
/* --- Kiểm chứng Agent --- */
#s10 .lead{fill:#EAF0F6;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
#s10 .vr{stroke:#1F272F;stroke-width:1.2;fill:none}
#s10 .pl{fill:#6E7C8B;font-size:10.5px;font-weight:700;letter-spacing:.14em}
#s10 .pl.b{fill:#4E82FF}
#s10 .mock{fill:#1B222C;stroke:#313D49;stroke-width:1.3}
#s10 .mock.c{fill:#12171E}
#s10 .mt{fill:#EAF0F6;font-size:15px;font-weight:700;letter-spacing:-.015em}
#s10 .mn{fill:#AFBFD0;font-size:12.5px}
#s10 .stamp{fill:#6E7C8B;font-size:9.5px;font-weight:700;letter-spacing:.12em}
#s10 .stamp.ok{fill:#4E82FF}
#s10 .hd{fill:#EAF0F6;opacity:.82}
#s10 .li{fill:#212A34}
#s10 .tag{fill:#6E7C8B;font-size:9.3px;font-weight:700;letter-spacing:.14em}
#s10 .tag.b{fill:#4E82FF}
#s10 .ds{fill:#AFBFD0;font-size:12.5px}
#s10 .ch{fill:#12171E;stroke:#313D49;stroke-width:1.3}
#s10 .ch.no{fill:none;stroke:#313D49;stroke-width:1.3;stroke-dasharray:5 4}
#s10 .cht{fill:#EAF0F6;font-size:12.5px;font-weight:500}
#s10 .close{fill:#EAF0F6;font-size:13.5px;font-weight:600}
#s10 .ic{fill:none;stroke:#4E82FF;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
#s10 .ic.o{stroke:#6E7C8B}
.s10_ic{fill:none;stroke:#4E82FF;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.s10_ic.s10_o{stroke:#6E7C8B}
</style>
<rect width="864" height="580" fill="#12171E"/>


  <defs>
    <g id="s10-k-alert" class="s10_ic s10_hi"><path d="M10 3.2 18 16.8H2z"></path><path d="M10 8v4"></path><path d="M10 14.4v.2"></path></g>
    <g id="s10-k-check" class="s10_ic s10_hi"><circle cx="10" cy="10" r="7.6"></circle><path d="M6.5 10.2 9 12.7l4.6-5"></path></g>
    <g id="k-alert-o" class="s10_ic s10_o"><path d="M10 3.2 18 16.8H2z"></path><path d="M10 8v4"></path><path d="M10 14.4v.2"></path></g>
  </defs>

  <text class="lead" x="432" y="40" text-anchor="middle">Both of these are failures. They reach you in completely different ways.</text>

  <path class="vr" d="M430 76V500"></path>

  <text class="pl" x="28" y="96">ORDINARY SOFTWARE</text>
  <rect class="mock" x="28" y="112" width="386" height="120" rx="12"></rect>
  <g transform="translate(52 140) scale(1.3)"><use href="#s10-k-alert"></use></g>
  <text class="mt" x="90" y="152">The article did not publish.</text>
  <text class="mn" x="90" y="174">CMS connection failed. Code 502.</text>
  <text class="stamp" x="52" y="212">ALERTED AT 09:12</text>

  <text class="tag" x="28" y="278">WHAT YOU GET</text>
  <text class="ds" x="28" y="300">An error, at the moment it happens.</text>
  <text class="ds" x="28" y="318">The article is not live.</text>
  <text class="tag" x="28" y="356">WHAT IS WRONG</text>
  <rect class="ch" x="28" y="370" width="386" height="36" rx="10"></rect>
  <g transform="translate(44 378)"><use href="#s10-k-check"></use></g>
  <text class="cht" x="74" y="393">Visible. Someone goes and fixes it.</text>

  <text class="pl b" x="446" y="96">AI</text>
  <rect class="mock c" x="446" y="112" width="386" height="120" rx="12"></rect>
  <rect class="hd" x="470" y="134" width="196" height="12" rx="6"></rect>
  <rect class="li" x="470" y="160" width="330" height="7" rx="3.5"></rect>
  <rect class="li" x="470" y="176" width="330" height="7" rx="3.5"></rect>
  <rect class="li" x="470" y="192" width="236" height="7" rx="3.5"></rect>
  <g transform="translate(470 202)"><use href="#s10-k-check"></use></g>
  <text class="stamp ok" x="498" y="217">PUBLISHED AT 09:12</text>

  <text class="tag" x="446" y="278">WHAT YOU GET</text>
  <text class="ds" x="446" y="300">A finished article, written with total confidence.</text>
  <text class="ds" x="446" y="318">The article is live.</text>
  <text class="tag b" x="446" y="356">WHAT IS WRONG</text>
  <rect class="ch no" x="446" y="370" width="386" height="36" rx="10"></rect>
  <g transform="translate(462 378)"><use href="#k-alert-o"></use></g>
  <text class="cht" x="492" y="393">A required section is missing</text>
  <rect class="ch no" x="446" y="414" width="386" height="36" rx="10"></rect>
  <g transform="translate(462 422)"><use href="#k-alert-o"></use></g>
  <text class="cht" x="492" y="437">Nobody checked the figures</text>
  <rect class="ch no" x="446" y="458" width="386" height="36" rx="10"></rect>
  <g transform="translate(462 466)"><use href="#k-alert-o"></use></g>
  <text class="cht" x="492" y="481">The voice is off-brand</text>

  <text class="close" x="432" y="548" text-anchor="middle">Nothing rings on the right. It does not crash, it just quietly gets worse.</text>
</svg>