<svg xmlns="http://www.w3.org/2000/svg" id="s4" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 940 656" role="img" aria-label="Three real SEO jobs measured against three questions: are the steps fixed, does any step need language, and does it need to look back and revise. Publishing is a workflow, publishing with a meta description is an AI workflow, and writing an article from scratch is an agent.">
<style>
/* --- Chọn kiểu cho từng việc --- */
#s4 .lead{fill:#EAF0F6;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
#s4 .th{fill:#6E7C8B;font-size:9.3px;font-weight:700;letter-spacing:.14em}
#s4 .th.b{fill:#4E82FF}
#s4 .row{fill:#12171E;stroke:#313D49;stroke-width:1.4}
#s4 .jt{fill:#EAF0F6;font-size:15.5px;font-weight:700;letter-spacing:-.015em}
#s4 .js{fill:#6E7C8B;font-size:11.5px}
#s4 .an{fill:#AFBFD0;font-size:13.5px;font-weight:500}
#s4 .an.b{fill:#4E82FF;font-weight:600}
#s4 .vr{stroke:#212A34;stroke-width:1.1;fill:none}
#s4 .hr{stroke:#212A34;stroke-width:1.1;fill:none}
#s4 .bg{fill:none;stroke:#313D49;stroke-width:1.4}
#s4 .bg.m{fill:#14203A;stroke:#4E82FF;stroke-width:1.5}
#s4 .bg.s{fill:#4E82FF;stroke:none}
#s4 .bt{fill:#AFBFD0;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
#s4 .bt.m{fill:#4E82FF}
#s4 .bt.s{fill:#12171E}
#s4 .wy{fill:#AFBFD0;font-size:12.5px}
#s4 .close{fill:#EAF0F6;font-size:13px;font-weight:600}
#s4 .ic{fill:none;stroke:#4E82FF;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.s4_ic{fill:none;stroke:#4E82FF;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="940" height="656" fill="#12171E"/>


  <defs>
    <g id="s4-k-up" class="s4_ic"><path d="M10 13.4V3.6M6.2 7.4 10 3.6l3.8 3.8M3.5 16.8h13"></path></g>
    <g id="s4-k-doc" class="s4_ic"><path d="M5 2.6h6.6L15.4 6.4V17.4H5z"></path><path d="M11.6 2.6v3.8h3.8"></path><path d="M7.6 10.4h5.2M7.6 13.4h5.2"></path></g>
  </defs>

  <text class="lead" x="470" y="42" text-anchor="middle">One SEO pipeline. The three questions in the middle decide which shape each job wants.</text>

  <text class="th" x="45" y="80">THE JOB</text>
  <text class="th" x="296" y="80">STEPS FIXED?</text>
  <text class="th" x="442" y="80">NEEDS LANGUAGE?</text>
  <text class="th" x="588" y="80">LOOK BACK AND REDO?</text>
  <text class="th b" x="736" y="80">SHAPE THAT FITS</text>

  <rect class="row" x="25" y="96" width="890" height="156" rx="14"></rect>
  <g transform="translate(45 122) scale(1.2)"><use href="#s4-k-up"></use></g>
  <text class="jt" x="79" y="137">Publish an article</text>
  <text class="js" x="79" y="155">fetch, convert to HTML, push to CMS</text>
  <text class="an" x="296" y="137">Fixed</text>
  <text class="an" x="442" y="137">No</text>
  <text class="an" x="588" y="137">No</text>
  <path class="vr" d="M716 116V172"></path>
  <rect class="bg" x="736" y="120" width="159" height="38" rx="19"></rect>
  <text class="bt" x="815" y="144" text-anchor="middle">Workflow</text>
  <path class="hr" d="M45 180h850"></path>
  <text class="th" x="45" y="202">WHY</text>
  <text class="wy" x="45" y="222">Nothing here needs judgment. Write it once, run it forever. A model only adds cost and one more place to fail.</text>

  <rect class="row" x="25" y="266" width="890" height="156" rx="14"></rect>
  <g transform="translate(45 292) scale(1.2)"><use href="#s4-k-up"></use></g>
  <text class="jt" x="79" y="307">Publish, plus meta</text>
  <text class="js" x="79" y="325">adds exactly one step that needs language</text>
  <text class="an" x="296" y="307">Fixed</text>
  <text class="an b" x="442" y="307">One step</text>
  <text class="an" x="588" y="307">No</text>
  <path class="vr" d="M716 286V342"></path>
  <rect class="bg m" x="736" y="290" width="159" height="38" rx="19"></rect>
  <text class="bt m" x="815" y="314" text-anchor="middle">AI Workflow</text>
  <path class="hr" d="M45 350h850"></path>
  <text class="th" x="45" y="372">WHY</text>
  <text class="wy" x="45" y="392">The chain is still fixed and one link needs language. Put the model in that link and leave the rest to code.</text>

  <rect class="row" x="25" y="436" width="890" height="156" rx="14"></rect>
  <g transform="translate(45 462) scale(1.2)"><use href="#s4-k-doc"></use></g>
  <text class="jt" x="79" y="477">Write an SEO article</text>
  <text class="js" x="79" y="495">from keyword to submittable draft</text>
  <text class="an b" x="296" y="477">Not fixed</text>
  <text class="an b" x="442" y="477">Almost all of it</text>
  <text class="an b" x="588" y="477">Yes, many rounds</text>
  <path class="vr" d="M716 456V512"></path>
  <rect class="bg s" x="736" y="460" width="159" height="38" rx="19"></rect>
  <text class="bt s" x="815" y="484" text-anchor="middle">Agent</text>
  <path class="hr" d="M45 520h850"></path>
  <text class="th" x="45" y="542">WHY</text>
  <text class="wy" x="45" y="562">You cannot know how many sources it reads or how many rounds it revises. It has to see the result and decide.</text>

  <text class="close" x="470" y="628" text-anchor="middle">Pick the lightest shape the job still runs on. Agent is the most capable and the hardest to check.</text>
</svg>