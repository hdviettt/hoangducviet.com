<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" stroke-linejoin="round"><style>svg{color:#004AEF}@media (prefers-color-scheme:dark){svg{color:#8FB2FF}}</style><defs>
  <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="turbulence" baseFrequency="0.016" numOctaves="2"
                  seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs><g filter="url(#rough)"><rect x="6.0" y="32.0" width="888.0" height="46.0" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="3.0"/><rect x="0.0" y="96.0" width="430.0" height="132.0" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="3.0"/><path d="M392.0,208.0 L398.4,213.8" fill="none" stroke="currentColor" stroke-opacity="0.90" stroke-width="3.9000000000000004" stroke-linecap="round"/><path d="M398.4,213.8 L408.0,201.8" fill="none" stroke="currentColor" stroke-opacity="0.90" stroke-width="3.9000000000000004" stroke-linecap="round"/><rect x="470.0" y="96.0" width="430.0" height="132.0" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="3.0"/><path d="M862.0,200.0 L878.0,216.0" fill="none" stroke="currentColor" stroke-opacity="0.80" stroke-width="4.199999999999999" stroke-linecap="round"/><path d="M878.0,200.0 L862.0,216.0" fill="none" stroke="currentColor" stroke-opacity="0.80" stroke-width="4.199999999999999" stroke-linecap="round"/><path d="M450.0,236.0 L450.0,258.0" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="2.7" stroke-linecap="round"/><path d="M444.0,251.0 L450.0,258.0" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="2.7" stroke-linecap="round"/><path d="M456.0,251.0 L450.0,258.0" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="2.7" stroke-linecap="round"/><rect x="6.0" y="300.0" width="888.0" height="70.0" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.95" stroke-width="4.800000000000001"/></g><text x="0.0" y="18.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="currentColor" fill-opacity="0.40" text-anchor="start" xml:space="preserve">OLD GUIDELINE  ·  WRITTEN FOR PEOPLE</text><text x="20.0" y="62.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">"Articles must not exceed 1,000 words."</text><text x="20.0" y="124.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">Editor</text><text x="20.0" y="148.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">Gets a 1,050-word draft. Cutting it would drop a</text><text x="20.0" y="168.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">required section, so it stays. Everyone in the</text><text x="20.0" y="188.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">trade reads 1,000 as guidance.</text><text x="20.0" y="214.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="currentColor" fill-opacity="0.90" text-anchor="start" xml:space="preserve">Every section survives. Correct.</text><text x="490.0" y="124.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">Agent</text><text x="490.0" y="148.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">Reads it literally. To it, 1,000 is a rule and not</text><text x="490.0" y="168.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">guidance, and there is nowhere in the sentence</text><text x="490.0" y="188.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">for an exception.</text><text x="490.0" y="214.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="currentColor" fill-opacity="0.90" text-anchor="start" xml:space="preserve">Cuts the required section. Broken.</text><text x="0.0" y="288.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="currentColor" fill-opacity="0.40" text-anchor="start" xml:space="preserve">NEW GUIDELINE  ·  WRITTEN FOR BOTH</text><text x="20.0" y="330.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="currentColor" fill-opacity="0.95" text-anchor="start" xml:space="preserve">"Articles target 1,000 words. Up to 10% over is</text><text x="20.0" y="354.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="currentColor" fill-opacity="0.95" text-anchor="start" xml:space="preserve"> acceptable if cutting would drop a required section."</text><text x="0.0" y="396.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.70" text-anchor="start" xml:space="preserve">The tolerance was always there. It was just never written down.</text></svg>