<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 362" width="1080" height="362"><rect width="1080" height="362" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dadce0"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#004aef"/></marker></defs><text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" text-anchor="start" fill="#0a0a0a" font-weight="600">What a cross-encoder does that an embedding model cannot</text><text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" text-anchor="start" fill="#5f656d" font-weight="400">Query and document go in as one sequence, so attention can cross the boundary.</text><rect x="20" y="76" width="58" height="34" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/><text x="49.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">[CLS]</text><rect x="84" y="76" width="66" height="34" rx="8" fill="#e8eeff" stroke="#004aef" stroke-width="1"/><text x="117.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">lionel</text><rect x="156" y="76" width="66" height="34" rx="8" fill="#e8eeff" stroke="#004aef" stroke-width="1"/><text x="189.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">messi</text><rect x="228" y="76" width="58" height="34" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/><text x="257.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">[SEP]</text><rect x="292" y="76" width="68" height="34" rx="8" fill="#fdf1dc" stroke="#c2410c" stroke-width="1"/><text x="326.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">Lionel</text><rect x="366" y="76" width="68" height="34" rx="8" fill="#fdf1dc" stroke="#c2410c" stroke-width="1"/><text x="400.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">Messi</text><rect x="446" y="76" width="46" height="34" rx="8" fill="#fdf1dc" stroke="#c2410c" stroke-width="1"/><text x="469.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">is</text><rect x="498" y="76" width="46" height="34" rx="8" fill="#fdf1dc" stroke="#c2410c" stroke-width="1"/><text x="521.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">an</text><rect x="550" y="76" width="92" height="34" rx="8" fill="#fdf1dc" stroke="#c2410c" stroke-width="1"/><text x="596.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">Argentine</text><rect x="648" y="76" width="58" height="34" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/><text x="677.0" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">[SEP]</text><rect x="716" y="76" width="120" height="34" rx="8" fill="none" stroke="#e1e6ec" stroke-width="1" stroke-dasharray="4 4"/><text x="776" y="98" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">[PAD] ...</text><path d="M117 76 Q 221.0 34 325 76" stroke="#004aef" fill="none" stroke-width="1" opacity="0.5"/><path d="M189 76 Q 294.0 34 399 76" stroke="#004aef" fill="none" stroke-width="1" opacity="0.5"/><path d="M189 76 Q 392.5 34 596 76" stroke="#004aef" fill="none" stroke-width="1" opacity="0.5"/><text x="430" y="30" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11" text-anchor="middle" fill="#004aef" font-weight="600">attention crosses the [SEP]</text><text x="117" y="128" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">segment 0, the query</text><text x="400" y="128" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">segment 1, the document</text><path d="M400 140 L400 162" stroke="#dadce0" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="250" y="166" width="300" height="38" rx="10" fill="#f8f9fa" stroke="#e1e6ec" stroke-width="1"/><text x="400" y="190" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">token + position + segment embeddings</text><path d="M400 208 L400 228" stroke="#dadce0" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="250" y="232" width="300" height="44" rx="10" fill="#f8f9fa" stroke="#e1e6ec" stroke-width="1"/><text x="400" y="251" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#0a0a0a" font-weight="400">4 x encoder block</text><text x="400" y="267" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10" text-anchor="middle" fill="#5f656d" font-weight="400">pre-norm, multi-head, FFN, residual</text><path d="M400 280 L400 300" stroke="#dadce0" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="250" y="304" width="300" height="38" rx="10" fill="#e8eeff" stroke="#004aef" stroke-width="1.4"/><text x="400" y="328" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#004aef" font-weight="400">read [CLS] -&gt; linear -&gt; one logit</text><rect x="600" y="166" width="460" height="176" rx="10" fill="none" stroke="#e1e6ec" stroke-width="1" stroke-dasharray="4 4"/><text x="622" y="190" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#0a0a0a" font-weight="400">A bi-encoder embeds the query and the document</text><text x="622" y="205" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400">apart, then compares two vectors. Cheap, because</text><text x="622" y="220" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400">documents can be embedded ahead of time.</text><text x="622" y="235" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400"></text><text x="622" y="250" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400">But nothing ever looks at both at once, so 'messi'</text><text x="622" y="265" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400">cannot attend to 'Argentine' and the score is a</text><text x="622" y="280" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400">comparison of two summaries.</text><text x="622" y="295" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400"></text><text x="622" y="310" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400">A cross-encoder precomputes nothing. Every pair is</text><text x="622" y="325" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400">a fresh forward pass, about 10 ms. That is why</text><text x="622" y="340" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#5f656d" font-weight="400">BM25 picks 500 first and it only sees 40.</text></svg>