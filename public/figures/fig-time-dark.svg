<svg viewBox="0 0 960 340" width="960" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Time per article: by hand about 150 minutes vs about 2 minutes with the agent"><style>
      text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
      .spine{stroke:#ECEEF1;stroke-width:1.1;fill:none} .grid{stroke:#33373E;stroke-width:1}
      .tk{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;font-size:11px;fill:#A6ADB6} .axt{font-size:12px;fill:#ECEEF1;font-weight:600}
      .barlab{font-size:13px;fill:#ECEEF1;font-weight:600} .barsub{font-size:11px;fill:#A6ADB6}
      .val{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;font-size:13px;font-weight:700} .note{font-size:11px;fill:#A6ADB6}
    </style><rect x="0" y="0" width="960" height="340" fill="#24272D"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#ECEEF1"/></marker></defs><line class="grid" x1="300.0" y1="60" x2="300.0" y2="280"/><line stroke="#ECEEF1" stroke-width="1" x1="300.0" y1="280" x2="300.0" y2="285"/><text class="tk" x="300.0" y="300" text-anchor="middle">0</text><line class="grid" x1="500.0" y1="60" x2="500.0" y2="280"/><line stroke="#ECEEF1" stroke-width="1" x1="500.0" y1="280" x2="500.0" y2="285"/><text class="tk" x="500.0" y="300" text-anchor="middle">60</text><line class="grid" x1="700.0" y1="60" x2="700.0" y2="280"/><line stroke="#ECEEF1" stroke-width="1" x1="700.0" y1="280" x2="700.0" y2="285"/><text class="tk" x="700.0" y="300" text-anchor="middle">120</text><line class="grid" x1="900.0" y1="60" x2="900.0" y2="280"/><line stroke="#ECEEF1" stroke-width="1" x1="900.0" y1="280" x2="900.0" y2="285"/><text class="tk" x="900.0" y="300" text-anchor="middle">180</text><line class="spine" x1="300" y1="60" x2="300" y2="280"/><line class="spine" x1="300" y1="280" x2="900" y2="280"/><rect x="300" y="98" width="500.0" height="48" fill="#E3B172" opacity="0.92"/><text class="barlab" x="284" y="118" text-anchor="end">By hand</text><text class="barsub" x="284" y="135" text-anchor="end">reformat + image wrangling</text><text class="val" x="812.0" y="128" text-anchor="start" fill="#E3B172">~150 min</text><rect x="300" y="186" width="6.7" height="48" fill="#4FD3A0"/><text class="barlab" x="284" y="206" text-anchor="end">With the agent</text><text class="barsub" x="284" y="223" text-anchor="end">paste + review</text><text class="val" x="318.6666666666667" y="216" text-anchor="start" fill="#4FD3A0">~2 min</text><text class="axt" x="600.0" y="324" text-anchor="middle">minutes per article</text><text class="note" x="900" y="52" text-anchor="end">estimate, not a benchmark</text></svg>