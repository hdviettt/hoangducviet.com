"preserve">the adapter</text><text x="24.0" y="130.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.82" text-anchor="start" xml:space="preserve">A thin layer that lets a model use</text><text x="24.0" y="150.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.82" text-anchor="start" xml:space="preserve">the other two. Delete it and the</text><text x="24.0" y="170.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.82" text-anchor="start" xml:space="preserve">work itself still survives.</text><text x="24.0" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.62" text-anchor="start" xml:space="preserve">agents/publish-article.md</text><text x="24.0" y="232.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">19 in production, optional</text><text x="330.0" y="74.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="currentColor" fill-opacity="0.95" text-anchor="start" xml:space="preserve">Skill</text><text x="330.0" y="96.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.56" text-anchor="start" xml:space="preserve">the asset</text><text x="330.0" y="130.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.82" text-anchor="start" xml:space="preserve">The steps, the standards, the</text><text x="330.0" y="150.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.82" text-anchor="start" xml:space="preserve">judgment points. The thing the</text><text x="330.0" y="170.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.82" text-anchor="start" xml:space="preserve">company is actually accumulating.</text><text x="330.0" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.62" text-anchor="start" xml:space="preserve">skills/wp-publish/SKILL.md</text><text x="330.0" y="232.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">63 in the repo</text><text x="636.0" y="74.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="currentColor" fill-opacity="0.88" text-anchor="start" xml:space="preserve">Tool</text><text x="636.0" y="96.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.56" text-anchor="start" xml:space="preserve">the reach</text><text x="636.0" y="130.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.82" text-anchor="start" xml:space="preserve">One crude connector to one</text><text x="636.0" y="150.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.82" text-anchor="start" xml:space="preserve">outside system. It knows nothing</text><text x="636.0" y="170.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.82" text-anchor="start" xml:space="preserve">about the work.</text><text x="636.0" y="208.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.62" text-anchor="start" xml:space="preserve">Google Docs, WordPress, Ahrefs</text><text x="636.0" y="232.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">21 connectors</text><text x="0.0" y="290.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="currentColor" fill-opacity="0.65" text-anchor="start" xml:space="preserve">Delete the agent and the work survives. Delete the skill and there is nothing left.</text></svg>