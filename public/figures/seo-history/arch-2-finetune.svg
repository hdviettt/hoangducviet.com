0">outline</text><text x="402.7" y="471.1" text-anchor="start" font-size="11.5" fill="#04815a" font-weight="400">what shipped</text><polygon class="rise" points="600.0,147.7 1109.2,147.7 1073.0,476.6 600.0,476.6" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.10s"/><polygon class="rise" points="600.0,147.7 1109.2,147.7 1105.3,183.2 600.0,183.2" fill="#f6f8fd" style="--o:1;animation-delay:0.11s"/><text x="621.1" y="172.0" text-anchor="start" font-size="13" fill="#1f2124" font-weight="600">training run</text><text x="1085.4" y="172.0" text-anchor="end" font-size="12" fill="#5f656d" font-weight="400">epoch 2 / 3</text><polygon class="rise" points="678.4,216.2 1065.1,216.2 1065.0,217.4 678.4,217.4" fill="#dfe4ec" style="--o:0.8;animation-delay:0.14s"/><text x="667.8" y="223.6" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">2.0</text><polygon class="rise" points="677.6,262.8 1060.4,262.8 1060.2,264.0 677.6,264.0" fill="#dfe4ec" style="--o:0.8;animation-delay:0.14s"/><text x="667.1" y="270.0" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">1.5</text><polygon class="rise" points="676.8,308.4 1055.7,308.4 1055.6,309.6 676.8,309.6" fill="#dfe4ec" style="--o:0.8;animation-delay:0.14s"/><text x="666.5" y="315.5" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">1.0</text><polygon class="rise" points="676.0,353.1 1051.1,353.1 1051.0,354.3 676.0,354.3" fill="#dfe4ec" style="--o:0.8;animation-delay:0.14s"/><text x="665.8" y="360.0" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">0.5</text><path class="c" d="M685.7 216.2 L702.2 234.5 L718.5 251.4 L734.8 266.9 L751.0 281.0 L767.1 293.8 L783.2 305.4 L799.3 315.9 L815.3 325.2 L831.4 333.6 L847.4 340.9 L863.4 347.3 L879.5 352.8 L895.5 357.5 L911.6 361.4 L927.7 364.6 L943.8 367.1 L959.9 369.1 L976.1 370.5 L992.3 371.4 L1008.6 372.0 L1024.8 372.2 L1041.1 372.3 L1039.4 389.4 L682.4 389.4 Z" fill="url(#loss)" style="--o:1;anim