<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><polygon class="type" points="171.7,142.8 330.0,142.8 331.0,159.5 173.3,159.5" fill="#004aef" style="--o:0.6;animation-delay:0.05s"/><polygon class="type" points="353.3,142.8 553.5,142.8 553.6,159.5 354.2,159.5" fill="#5f656d" style="--o:0.24;animation-delay:0.07s"/><polygon class="type" points="175.5,183.3 332.4,183.3 333.3,199.7 177.0,199.7" fill="#004aef" style="--o:0.6;animation-delay:0.10s"/><polygon class="type" points="355.5,183.3 553.9,183.3 554.0,199.7 356.3,199.7" fill="#5f656d" style="--o:0.24;animation-delay:0.12s"/><polygon class="type" points="179.2,223.1 334.7,223.1 335.7,239.2 180.7,239.2" fill="#004aef" style="--o:0.6;animation-delay:0.15s"/><polygon class="type" points="357.6,223.1 554.3,223.1 554.4,239.2 358.5,239.2" fill="#5f656d" style="--o:0.24;animation-delay:0.17s"/><polygon class="type" points="182.9,262.2 337.0,262.2 337.9,278.0 184.3,278.0" fill="#004aef" style="--o:0.6;animation-delay:0.20s"/><polygon class="type" points="359.7,262.2 554.7,262.2 554.8,278.0 360.5,278.0" fill="#5f656d" style="--o:0.24;animation-delay:0.22s"/><polygon class="type" points="186.4,300.7 339.3,300.7 340.2,316.2 187.9,316.2" fill="#004aef" style="--o:0.6;animation-delay:0.25s"/><polygon class="type" points="361.8,300.7 555.0,300.7 555.2,316.2 362.6,316.2" fill="#5f656d" style="--o:0.24;animation-delay:0.27s"/><polygon class="type" points="190.0,338.5 341.5,338.5 342.4,353.7 191.4,353.7" fill="#004aef" style="--o:0.6;animation-delay:0.30s"/><polygon class="type" points="363.8,338.5 555.4,338.5 555.6,353.7 364.6,353.7" fill="#5f656d" style="--o:0.24;animation-delay:0.32s"/><polygon class="type" points="193.4,375.6 343.7,375.6 344.6,390.6 194.8,390.6" fill="#004aef" style="--o:0.6;animation-delay:0.35s"/><polygon class="type" points="365.8,375.6 555.8,375.6 556.0,390.6 366.6,390.6" fill="#5f656d" style="--o:0.24;animation-delay:0.37s"/><text x="248.8" y="115.6" text-anchor="middle" font-size="15" fill="#5f656d" font-weight="400">outline</text><text x="450.2" y="115.6" text-anchor="middle" font-size="15" fill="#5f656d" font-weight="400">what shipped</text><g class="c" style="--o:0.5;animation-delay:0.50s"><line x1="590.9" y1="268.6" x2="672.5" y2="268.6" stroke="#004aef" stroke-width="1.6"/><polygon points="681.5,268.6 672.5,273.1 672.5,264.1" fill="#004aef"/></g><polygon class="rise" points="700.6,224.7 1011.5,224.7 1003.6,311.5 698.7,311.5" fill="#004aef" style="--o:1;animation-delay:0.54s"/><text x="853.3" y="273.3" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="500">weights</text></g><g class="mark"><line x1="350.0" y1="556.0" x2="392.0" y2="556.0" stroke="#04815a" stroke-width="1.4"/><text x="402.0" y="561.0" font-size="17" fill="#04815a">the target is what a human was willing to publish</text></g>
</svg>
