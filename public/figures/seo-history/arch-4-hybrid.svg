<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#lift)"><polygon class="rise" points="151.4,121.6 730.8,121.6 722.5,415.3 180.0,415.3" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.04s"/><polygon class="rise" points="151.4,121.6 730.8,121.6 729.8,159.5 155.1,159.5" fill="#004aef" style="--o:0.9;animation-delay:0.06s"/><polygon class="rise" points="189.9,185.0 411.1,185.0 411.5,196.7 190.9,196.7" fill="#5f656d" style="--o:0.26;animation-delay:0.10s"/><circle class="pop" cx="687.4" cy="190.9" r="5.0" fill="#dfe4ec" style="--o:1;animation-delay:0.12s"/><polygon class="c" points="160.1,211.1 728.3,211.1 728.3,211.9 160.2,211.9" fill="#dfe4ec" style="--o:0.7;animation-delay:0.10s"/><polygon class="rise" points="193.5,225.7 467.6,225.7 467.9,237.2 194.6,237.2" fill="#5f656d" style="--o:0.26;animation-delay:0.14s"/><circle class="pop" cx="686.7" cy="231.5" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.16s"/><polygon class="c" points="164.1,251.3 727.2,251.3 727.1,252.1 164.1,252.1" fill="#dfe4ec" style="--o:0.7;animation-delay:0.14s"/><polygon class="rise" points="197.1,265.7 378.2,265.7 378.8,277.0 198.2,277.0" fill="#5f656d" style="--o:0.26;animation-delay:0.18s"/><circle class="pop" cx="685.9" cy="271.4" r="5.0" fill="#dfe4ec" style="--o:1;animation-delay:0.20s"/><polygon class="c" points="167.9,290.9 726.0,290.9 726.0,291.6 168.0,291.6" fill="#dfe4ec" style="--o:0.7;animation-delay:0.18s"/><polygon class="rise" points="200.7,305.0 443.0,305.0 443.4,316.1 201.7,316.1" fill="#5f656d" style="--o:0.26;animation-delay:0.22s"/><circle class="pop" cx="685.1" cy="310.6" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.24s"/><polygon class="c" points="171.7,329.7 724.9,329.7 724.9,330.5 171.7,330.5" fill="#dfe4ec" style="--o:0.7;animation-delay:0.22s"/><polygon class="rise" points="204.1,343.6 399.9,343.6 400.3,354.5 205.1,354.5" fill="#5f656d" style="--o:0.26;animation-delay:0.26s"/><circle class="pop" cx="684.4" cy="349.1" r="5.0" fill="#dfe4ec" style="--o:1;animation-delay:0.28s"/><polygon class="c" points="175.4,367.9 723.8,367.9 723.8,368.6 175.4,368.6" fill="#dfe4ec" style="--o:0.7;animation-delay:0.26s"/><polygon class="rise" points="207.6,381.6 480.9,381.6 481.2,392.3 208.5,392.3" fill="#5f656d" style="--o:0.26;animation-delay:0.30s"/><circle class="pop" cx="683.7" cy="386.9" r="5.0" fill="#dfe4ec" style="--o:1;animation-delay:0.32s"/><polygon class="c" points="179.0,405.4 722.8,405.4 722.8,406.1 179.1,406.1" fill="#dfe4ec" style="--o:0.7;animation-delay:0.30s"/><polygon class="rise" points="777.6,121.6 1048.6,121.6 1020.0,415.3 766.3,415.3" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.42s"/><polygon class="rise" points="777.6,121.6 1048.6,121.6 1044.9,159.5 776.1,159.5" fill="#07ef9c" style="--o:0.95;animation-delay:0.44s"/><polygon class="type" points="798.0,189.3 991.3,189.3 990.4,200.2 797.5,200.2" fill="#5f656d" style="--o:0.24;animation-delay:0.48s"/><polygon class="type" points="796.4,226.1 933.4,226.1 932.6,236.9 795.9,236.9" fill="#5f656d" style="--o:0.24;animation-delay:0.54s"/><polygon class="type" points="794.8,262.3 1003.2,262.3 1002.2,272.9 794.3,272.9" fill="#5f656d" style="--o:0.24;animation-delay:0.60s"/><polygon class="type" points="793.2,298.0 901.1,298.0 900.4,308.4 792.8,308.4" fill="#5f656d" style="--o:0.24;animation-delay:0.66s"/><g class="c" style="--o:0.6;animation-delay:0.78s"><line x1="765.1" y1="329.0" x2="711.6" y2="329.0" stroke="#004aef" stroke-width="1.6"/><polygon points="702.6,329.0 711.6,324.5 711.6,333.5" fill="#004aef"/></g></g><g class="mark"><line x1="350.0" y1="556.0" x2="392.0" y2="556.0" stroke="#04815a" stroke-width="1.4"/><text x="402.0" y="561.0" font-size="17" fill="#04815a">the conversation moved to a rail beside the work</text></g>
</svg>
