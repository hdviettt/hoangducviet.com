49.4,341.9 838.8,341.9 838.8,342.7 249.4,342.7" fill="#dfe4ec" style="--o:0.7;animation-delay:0.16s"/><text x="271.6" y="368.1" text-anchor="start" font-size="12.5" fill="#1f2124" font-weight="400">Landing page tips</text><text x="574.7" y="368.1" text-anchor="start" font-size="12" fill="#5f656d" font-weight="400">An</text><polygon class="rise" points="686.2,353.5 767.3,353.5 766.4,374.9 685.7,374.9" fill="url(#chip)" style="--o:1;animation-delay:0.20s"/><text x="726.3" y="368.5" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="500">Live</text><text x="822.3" y="368.1" text-anchor="end" font-size="12" fill="#5f656d" font-weight="400">980</text><polygon class="rise" points="252.5,381.8 836.7,381.8 836.7,382.5 252.6,382.5" fill="#dfe4ec" style="--o:0.7;animation-delay:0.20s"/><text x="274.6" y="407.5" text-anchor="start" font-size="12.5" fill="#1f2124" font-weight="400">Email flows 101</text><text x="575.0" y="407.5" text-anchor="start" font-size="12" fill="#5f656d" font-weight="400">Minh</text><polygon class="rise" points="685.4,393.2 765.8,393.2 765.0,414.2 685.0,414.2" fill="#eef1f7" style="--o:1;animation-delay:0.24s"/><text x="725.2" y="407.9" text-anchor="middle" font-size="11" fill="#5f656d" font-weight="500">Draft</text><text x="820.3" y="407.5" text-anchor="end" font-size="12" fill="#5f656d" font-weight="400">740</text><polygon class="rise" points="255.6,421.0 834.6,421.0 834.5,421.7 255.7,421.7" fill="#dfe4ec" style="--o:0.7;animation-delay:0.24s"/><text x="277.5" y="446.2" text-anchor="start" font-size="12.5" fill="#1f2124" font-weight="400">Choosing a helpdesk</text><text x="575.2" y="446.2" text-anchor="start" font-size="12" fill="#5f656d" font-weight="400">An</text><polygon class="rise" points="684.6,432.1 764.3,432.1 763.5,452.8 684.2,452.8" fill="#eef1f7" style="--o:1;animation-delay:0.28s"/><text x="724.0" y="446.5" text-anchor="middle" font-size="11" fill="#5f656d" font-weight="500">Draft</text><text x="818.3" y="446.2" text-anchor="end" font-size="12" fill="#5f656d" font-weight="400">560</text><polygon class="rise" points="258.7,459.4 832.5,459.4 832.5,460.2 258.7,460.2" fill="#dfe4ec" style="--o:0.7;animation-delay:0.28s"/><polygon class="rise" points="847.6,179.1 850.8,179.1 834.5,476.6 831.6,476.6" fill="#dfe4ec" style="--o:0.9;animation-delay:0.34s"/><text x="867.2" y="203.9" text-anchor="start" font-size="12" fill="#5f656d" font-weight="600">Agent</text><polygon class="rise" points="908.3,216.2 1080.8,216.2 1077.4,248.7 906.1,248.7" fill="url(#chip)" style="--o:1;animation-delay:0.38s"/><text x="1055.3" y="235.3" text-anchor="end" font-size="11.5" fill="#ffffff" font-weight="400">rewrite the intro</text><polygon class="rise" points="863.9,260.8 1060.6,260.8 1055.3,312.3 860.9,312.3" fill="#f2f4f9" style="--o:1;animation-delay:0.44s"/><text x="880.3" y="280.7" text-anchor="start" font-size="11.5" fill="#5f656d" font-weight="400">done. 940 words, and the</text><text x="879.2" y="297.8" text-anchor="start" font-size="11.5" fill="#5f656d" font-weight="400">intro leads with the price.</text><polygon class="rise" points="921.4,324.1 1069.4,324.1 1066.1,355.0 919.2,355.0" fill="url(#chip)" style="--o:1;animation-delay:0.50s"/><text x="1044.6" y="342.3" text-anchor="end" font-size="11.5" fill="#ffffff" font-weight="400">set it to Review</text><polygon class="rise" points="857.7,366.5 1004.3,366.5 1001.5,396.9 856.0,396.9" fill="#f2f4f9" style="--o:1;animation-delay:0.56s"/><text x="873.8" y="384.4" text-anchor="start" font-size="11.5" fill="#5f656d" font-weight="400">row 2 updated.</text><polygon class="rise" points="853.7,436.2 1057.6,436.2 1054.7,463.8 852.0,463.8" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.62s"/><text x="869.5" y="453.9" text-anchor="start" font-size="11.5" fill="#5f656d" font-weight="400">ask the agent…</text><g class="c" style="--o:0.7;animation-delay:0.66s"><path d="M856.0 343.5 C822.0 343.5 807.3 279.9 777.3 279.9" fill="none" stroke="#