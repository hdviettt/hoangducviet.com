<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#2f6bf6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a72f4"/>
      <stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="loss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b1a3a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g filter="url(#lift)"><polygon class="rise" points="175.3,143.5 1024.7,143.5 994.2,476.6 205.8,476.6" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.02s"/><polygon class="rise" points="175.3,143.5 1024.7,143.5 1021.5,179.1 178.5,179.1" fill="#f6f8fd" style="--o:1;animation-delay:0.03s"/><text x="198.6" y="167.8" text-anchor="start" font-size="13" fill="#1f2124" font-weight="600">run 4f2a</text><text x="320.1" y="167.8" text-anchor="start" font-size="12" fill="#5f656d" font-weight="400">claude agent sdk</text><text x="1001.4" y="167.8" text-anchor="end" font-size="12" fill="#5f656d" font-weight="400">18.4s</text><text x="208.0" y="215.4" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400"> 1</text><polygon class="type" points="243.3,199.0 248.0,199.0 249.7,220.3 245.0,220.3" fill="#5f656d" style="--o:0.35;animation-delay:0.06s"/><text x="261.3" y="215.0" text-anchor="start" font-size="12" fill="#1f2124" font-weight="400">the brief caps the article at 1,000 words</text><text x="228.9" y="215.0" text-anchor="start" font-size="10" fill="#5f656d" font-weight="400"></text><text x="992.0" y="215.0" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">84</text><text x="211.4" y="255.1" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400"> 2</text><polygon class="type" points="277.4,235.8 723.1,235.8 722.3,263.2 279.3,263.2" fill="url(#chip)" style="--o:1;animation-delay:0.11s"/><text x="294.3" y="254.7" text-anchor="start" font-size="12" fill="#ffffff" font-weight="500">search(brand_guide, "tone")</text><text x="232.1" y="254.7" text-anchor="start" font-size="10" fill="#5f656d" font-weight="400"></text><text x="988.6" y="254.7" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">1.2k</text><text x="214.8" y="294.2" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400"> 3</text><polygon class="type" points="311.3,278.3 316.0,278.3 317.3,299.0 312.7,299.0" fill="#5f656d" style="--o:0.35;animation-delay:0.16s"/><text x="328.8" y="293.8" text-anchor="start" font-size="12" fill="#5f656d" font-weight="400">3 passages returned</text><text x="235.3" y="293.8" text-anchor="start" font-size="10" fill="#5f656d" font-weight="400"></text><text x="985.3" y="293.8" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">310</text><text x="218.1" y="332.6" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400"> 4</text><polygon class="type" points="252.5,317.0 257.1,317.0 258.7,337.3 254.1,337.3" fill="#5f656d" style="--o:0.35;animation-delay:0.21s"/><text x="270.0" y="332.2" text-anchor="start" font-size="12" fill="#1f2124" font-weight="400">the approved outline expands to 900</text><text x="238.4" y="332.2" text-anchor="start" font-size="10" fill="#5f656d" font-weight="400"></text><text x="982.0" y="332.2" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">96</text><text x="221.3" y="370.4" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400"> 5</text><polygon class="type" points="285.6,352.0 678.4,352.0 678.0,378.0 287.5,378.0" fill="url(#chip)" style="--o:1;animation-delay:0.26s"/><text x="302.1" y="370.0" text-anchor="start" font-size="12" fill="#ffffff" font-weight="500">trim_outline(target=850)</text><text x="241.5" y="370.0" text-anchor="start" font-size="10" fill="#5f656d" font-weight="400"></text><text x="978.7" y="370.0" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">540</text><text x="224.5" y="407.5" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400"> 6</text><polygon class="type" points="318.7,392.4 323.2,392.4 324.4,412.0 319.9,412.0" fill="#5f656d" style="--o:0.35;animation-delay:0.31s"/><text x="335.6" y="407.1" text-anchor="start" font-size="12" fill="#5f656d" font-weight="400">section 3 is now missing</text><text x="244.5" y="407.1" text-anchor="start" font-size="10" fill="#5f656d" font-weight="400"></text><text x="975.5" y="407.1" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">128</text><text x="227.6" y="444.0" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400"> 7</text><polygon class="type" points="290.9,426.2 677.1,426.2 676.7,451.3 292.7,451.3" fill="url(#chip)" style="--o:1;animation-delay:0.36s"/><text x="307.1" y="443.6" text-anchor="start" font-size="12" fill="#ffffff" font-weight="500">trim_outline(target=850)</text><text x="247.5" y="443.6" text-anchor="start" font-size="10" fill="#5f656d" font-weight="400"></text><text x="972.4" y="443.6" text-anchor="end" font-size="10.5" fill="#5f656d" font-weight="400">540</text><g class="c" style="--o:0.75;animation-delay:0.52s"><path d="M1010.7 352.0 h14 V462.4 h-14" fill="none" stroke="#004aef" stroke-opacity="0.6" stroke-width="1.8"/></g><g class="mark"><rect x="1032" y="393" width="86" height="30" rx="15" fill="#ffffff" stroke="#004aef" stroke-width="1.4"/><text x="1075" y="413" font-size="13" fill="#004aef" text-anchor="middle" font-weight="600">↺ × 7</text></g><text x="600.0" y="496.5" text-anchor="middle" font-size="13.5" fill="#5f656d" font-weight="400">the same two steps arrive again; the rule had a tolerance nobody wrote down</text></g>
</svg>
