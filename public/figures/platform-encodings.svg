<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 302" width="900" height="302" role="img" stroke-linejoin="round"><style>svg{color:#004AEF}@media (prefers-color-scheme:dark){svg{color:#8FB2FF}}</style><defs>
  <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="turbulence" baseFrequency="0.016" numOctaves="2"
                  seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs><g filter="url(#rough)"><rect x="0.0" y="40.0" width="430.0" height="250.0" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.50" stroke-width="3.0"/><path d="M436.0,165.0 L462.0,165.0" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2.7" stroke-linecap="round"/><path d="M453.5,159.4 L462.0,165.0" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2.7" stroke-linecap="round"/><path d="M453.5,170.6 L462.0,165.0" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2.7" stroke-linecap="round"/><rect x="470.0" y="40.0" width="430.0" height="250.0" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.95" stroke-width="4.800000000000001"/><path d="M490.0,124.0 L551.2,124.0" fill="none" stroke="currentColor" stroke-opacity="0.50" stroke-width="3.0" stroke-linecap="round"/></g><text x="0.0" y="16.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="currentColor" fill-opacity="0.42" text-anchor="start" xml:space="preserve">ONE PROCEDURE, TWO ENCODINGS</text><text x="22.0" y="72.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="currentColor" fill-opacity="0.88" text-anchor="start" xml:space="preserve">Encoding A</text><text x="22.0" y="92.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.45" text-anchor="start" xml:space="preserve">conversation-first</text><text x="22.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">agent.md</text><text x="22.0" y="145.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.56" text-anchor="start" xml:space="preserve">a thin adapter so a model can use the two below</text><text x="22.0" y="166.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">SKILL.md</text><text x="22.0" y="183.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.56" text-anchor="start" xml:space="preserve">the procedure, written for a model to follow</text><text x="22.0" y="204.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">connectors</text><text x="22.0" y="221.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.56" text-anchor="start" xml:space="preserve">Google Docs, WordPress</text><text x="22.0" y="262.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">Runtime: the Claude Agent SDK. The model reads the</text><text x="22.0" y="278.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">steps and decides each one.</text><text x="492.0" y="72.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="currentColor" fill-opacity="0.95" text-anchor="start" xml:space="preserve">Encoding B</text><text x="492.0" y="92.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.45" text-anchor="start" xml:space="preserve">app-first</text><text x="492.0" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.35" text-anchor="start" xml:space="preserve">agent.md</text><text x="492.0" y="145.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.56" text-anchor="start" xml:space="preserve">deleted, nothing was left for it to decide</text><text x="492.0" y="166.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">publish_run.py</text><text x="492.0" y="183.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.56" text-anchor="start" xml:space="preserve">the same steps, as Python the worker runs</text><text x="492.0" y="204.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">connectors</text><text x="492.0" y="221.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.56" text-anchor="start" xml:space="preserve">the same two, untouched</text><text x="492.0" y="242.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">scan_patterns.py</text><text x="492.0" y="259.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.56" text-anchor="start" xml:space="preserve">one model call per client, at setup</text><text x="492.0" y="262.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">Right when every step stopped needing judgment.</text><text x="492.0" y="278.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">Variance ran out.</text></svg>