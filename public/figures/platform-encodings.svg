<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="The same procedure expressed two ways: conversation-first with an agent, and app-first as a script job" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#04B876"/>
    </marker>
    <marker id="side" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#F7F9FC"/>

  <text x="64" y="76" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1.5">ONE PROCEDURE, TWO ENCODINGS</text>

  <!-- ── Encoding A ─────────────────────────────── -->
  <text x="64" y="128" font-size="15" font-weight="700" fill="#0A0A0A">Encoding A</text>
  <text x="158" y="128" font-size="15" fill="#8A93A3">conversation-first</text>
  <line x1="64" y1="144" x2="556" y2="144" stroke="#0A0A0A" stroke-width="1.5"/>

  <rect x="64" y="168" width="492" height="60" rx="6" fill="#FFF3CF"/>
  <text x="88" y="196" font-size="15.5" font-weight="700" fill="#8A6D00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent.md</text>
  <text x="88" y="217" font-size="14" fill="#8A6D00">a thin adapter so a model can use the two below</text>

  <rect x="64" y="238" width="492" height="60" rx="6" fill="#E2F8EF"/>
  <text x="88" y="266" font-size="15.5" font-weight="700" fill="#04915D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SKILL.md</text>
  <text x="88" y="287" font-size="14" fill="#04915D">the procedure, written for a model to read and follow</text>

  <rect x="64" y="308" width="492" height="60" rx="6" fill="#E6EDFF"/>
  <text x="88" y="336" font-size="15.5" font-weight="700" fill="#0038B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">connectors</text>
  <text x="88" y="357" font-size="14" fill="#0038B8">Google Docs, WordPress</text>

  <text x="64" y="404" font-size="14.5" font-weight="700" fill="#3D4149">Runtime: the Claude Agent SDK.</text>
  <text x="64" y="428" font-size="14.5" fill="#8A93A3">The model reads the steps and decides each one.</text>
  <text x="64" y="452" font-size="14.5" fill="#8A93A3">Right when the work still needs judgment at every turn.</text>

  <!-- ── transition ─────────────────────────────── -->
  <line x1="576" y1="268" x2="624" y2="268" stroke="#6B7280" stroke-width="1.5" marker-end="url(#side)"/>
  <text x="600" y="248" font-size="13" font-weight="700" fill="#4A5262" text-anchor="middle">variance</text>
  <text x="600" y="300" font-size="13" fill="#8A93A3" text-anchor="middle">runs out</text>

  <!-- ── Encoding B ─────────────────────────────── -->
  <text x="644" y="128" font-size="15" font-weight="700" fill="#0A0A0A">Encoding B</text>
  <text x="738" y="128" font-size="15" fill="#8A93A3">app-first</text>
  <line x1="644" y1="144" x2="1136" y2="144" stroke="#0A0A0A" stroke-width="1.5"/>

  <rect x="644" y="168" width="492" height="60" rx="6" fill="none" stroke="#C8D0DC" stroke-width="1.25" stroke-dasharray="5 5"/>
  <text x="668" y="196" font-size="15.5" font-weight="700" fill="#A3AAB8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent.md</text>
  <line x1="666" y1="191" x2="762" y2="191" stroke="#A3AAB8" stroke-width="1.5"/>
  <text x="668" y="217" font-size="14" fill="#A3AAB8">deleted, because nothing was left for it to decide</text>

  <rect x="644" y="238" width="492" height="60" rx="6" fill="#E6EDFF"/>
  <text x="668" y="266" font-size="15.5" font-weight="700" fill="#0038B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">publish_run.py</text>
  <text x="668" y="287" font-size="14" fill="#0038B8">the same steps, now as Python the worker executes</text>

  <rect x="644" y="308" width="492" height="60" rx="6" fill="#E6EDFF"/>
  <text x="668" y="336" font-size="15.5" font-weight="700" fill="#0038B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">connectors</text>
  <text x="668" y="357" font-size="14" fill="#0038B8">the same two, untouched</text>

  <text x="644" y="404" font-size="14.5" font-weight="700" fill="#3D4149">Runtime: the worker queue.</text>
  <text x="644" y="428" font-size="14.5" fill="#8A93A3">A model survives only where judgment does, and in this</text>
  <text x="644" y="452" font-size="14.5" fill="#8A93A3">particular pipeline it does not survive at all.</text>

  <!-- ── the invariant ──────────────────────────── -->
  <line x1="310" y1="556" x2="310" y2="500" stroke="#04B876" stroke-width="1.5" marker-end="url(#up)"/>
  <line x1="890" y1="556" x2="890" y2="500" stroke="#04B876" stroke-width="1.5" marker-end="url(#up)"/>
  <text x="326" y="530" font-size="13" fill="#04915D">expressed as</text>
  <text x="906" y="530" font-size="13" fill="#04915D">expressed as</text>

  <rect x="64" y="566" width="1072" height="94" rx="8" fill="#E2F8EF"/>
  <text x="92" y="600" font-size="12" font-weight="700" fill="#04915D" letter-spacing="1.5">THE PROCEDURE</text>
  <text x="92" y="630" font-size="17" font-weight="700" fill="#0A0A0A">The steps, the standards, the judgment points, what good output looks like.</text>
  <text x="92" y="652" font-size="14.5" fill="#04915D">Written by the people who do the work. Unchanged by either encoding, and older than both.</text>

  <text x="64" y="700" font-size="15" fill="#8A93A3">The know-how is the asset. How it runs is a decision you get to revisit.</text>
</svg>
