<svg xmlns="http://www.w3.org/2000/svg" id="s14" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" viewBox="0 0 940 682" role="img" aria-label="The same word-count rule read two ways. An editor treats 1,000 words as guidance and keeps a required section in a 1,050-word draft. An agent reads it literally and cuts the required section. The rewritten rule states the tolerance explicitly, and both then behave the same way.">
<style>
/* --- Đóng gói chất xám --- */
#s14 .eb{fill:#6E7C8B;font-size:10px;font-weight:700;letter-spacing:.14em}
#s14 .eb.b{fill:#4E82FF}
#s14 .qbox{fill:#1B222C;stroke:#313D49;stroke-width:1.3}
#s14 .qbox.b{fill:#14203A;stroke:#4E82FF}
#s14 .qbar{stroke:#313D49;stroke-width:2.4;fill:none;stroke-linecap:round}
#s14 .qbar.b{stroke:#4E82FF}
#s14 .q{fill:#EAF0F6;font-size:15px;font-weight:500}
#s14 .card{fill:#12171E;stroke:#313D49;stroke-width:1.4}
#s14 .card.w{stroke:#6E7C8B}
#s14 .ten{fill:#EAF0F6;font-size:14.5px;font-weight:700;letter-spacing:-.015em}
#s14 .mt{fill:#AFBFD0;font-size:12.5px}
#s14 .hr{stroke:#212A34;stroke-width:1.1;fill:none}
#s14 .kq{fill:#4E82FF;font-size:12.5px;font-weight:600}
#s14 .kq.d{fill:#EAF0F6}
#s14 .ln{stroke:#313D49;stroke-width:1.4;fill:none}
#s14 .ln.b{stroke:#4E82FF;opacity:.8}
#s14 .div{stroke:#1F272F;stroke-width:1.2;fill:none}
#s14 .pill{fill:#12171E;stroke:#313D49;stroke-width:1.3}
#s14 .pt{fill:#6E7C8B;font-size:10px;font-weight:700;letter-spacing:.14em}
#s14 .chip{fill:#12171E;stroke:#2C4B85;stroke-width:1.4}
#s14 .ct{fill:#EAF0F6;font-size:13px;font-weight:600}
#s14 .obox{fill:#14203A;stroke:#4E82FF;stroke-width:1.5}
#s14 .ot{fill:#4E82FF;font-size:13.5px;font-weight:600}
#s14 .nt{fill:#AFBFD0;font-size:12.5px}
#s14 .ic{fill:none;stroke:#4E82FF;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
#s14 .ic.d{stroke:#EAF0F6}
.s14_ic{fill:none;stroke:#4E82FF;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="940" height="682" fill="#12171E"/>


  <defs>
    <g id="s14-k-user" class="s14_ic"><circle cx="10" cy="6.4" r="3.4"></circle><path d="M3.2 17.2c0-3.4 3-5.6 6.8-5.6s6.8 2.2 6.8 5.6"></path></g>
    <g id="s14-k-spark" class="s14_ic"><path d="M10 2.2c.7 4.6 2.5 6.4 7.1 7.1-4.6.7-6.4 2.5-7.1 7.1-.7-4.6-2.5-6.4-7.1-7.1 4.6-.7 6.4-2.5 7.1-7.1z"></path></g>
    <g id="s14-k-check" class="s14_ic"><circle cx="10" cy="10" r="7.6"></circle><path d="M6.5 10.2 9 12.7l4.6-5"></path></g>
    <g id="s14-k-alert" class="s14_ic"><path d="M10 3.2 18 16.8H2z"></path><path d="M10 8v4"></path><path d="M10 14.4v.2"></path></g>
    <marker id="s14-ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.6 0.8 L7 4 L0.6 7.2" fill="none" stroke="#313D49" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker>
    <marker id="s14-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.6 0.8 L7 4 L0.6 7.2" fill="none" stroke="#4E82FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker>
  </defs>

  <text class="eb" x="34" y="38">OLD GUIDELINE · WRITTEN FOR PEOPLE</text>
  <rect class="qbox" x="34" y="50" width="872" height="52" rx="8"></rect>
  <path class="qbar" d="M46 64v24"></path>
  <text class="q" x="62" y="83">“Articles must not exceed 1,000 words.”</text>

  <path class="ln" d="M470 102V122"></path>
  <path class="ln" d="M470 122H244V140" marker-end="url(#s14-ag)"></path>
  <path class="ln" d="M470 122H696V140" marker-end="url(#s14-ag)"></path>

  <rect class="card" x="34" y="146" width="420" height="158" rx="12"></rect>
  <g transform="translate(50 164) scale(1.2)"><use href="#s14-k-user"></use></g>
  <text class="ten" x="84" y="183">Editor</text>
  <text class="mt" x="50" y="216">Gets a 1,050-word draft. Cutting it would drop a</text>
  <text class="mt" x="50" y="233">required section, so it stays. Everyone in the</text>
  <text class="mt" x="50" y="250">trade reads 1,000 as guidance.</text>
  <path class="hr" d="M50 265h388"></path>
  <g transform="translate(50 278) scale(.9)"><use class="ic" href="#s14-k-check"></use></g>
  <text class="kq" x="76" y="292">Every section survives. Correct.</text>
  <rect class="card w" x="486" y="146" width="420" height="158" rx="12"></rect>
  <g transform="translate(502 164) scale(1.2)"><use href="#s14-k-spark"></use></g>
  <text class="ten" x="536" y="183">Agent</text>
  <text class="mt" x="502" y="216">Reads it literally. To it, 1,000 is a rule and</text>
  <text class="mt" x="502" y="233">not guidance, and there is nowhere in the</text>
  <text class="mt" x="502" y="250">sentence for an exception.</text>
  <path class="hr" d="M502 265h388"></path>
  <g transform="translate(502 278) scale(.9)"><use class="ic d" href="#s14-k-alert"></use></g>
  <text class="kq d" x="528" y="292">Cuts the required section. Broken.</text>

  <path class="div" d="M34 340H906"></path>
  <rect class="pill" x="330" y="326" width="280" height="28" rx="14"></rect>
  <text class="pt" x="470" y="344" text-anchor="middle">REWRITTEN SO BOTH CAN READ IT</text>

  <text class="eb b" x="34" y="386">NEW GUIDELINE · WRITTEN FOR BOTH</text>
  <rect class="qbox b" x="34" y="396" width="872" height="66" rx="8"></rect>
  <path class="qbar b" d="M46 410v38"></path>
  <text class="q" x="62" y="423">“Target under 1,000 words. Up to 10% over is acceptable</text>
  <text class="q" x="62" y="445">if cutting would drop a required section.”</text>

  <path class="ln b" d="M470 462V480"></path>
  <path class="ln b" d="M470 480H300V496" marker-end="url(#s14-ab)"></path>
  <path class="ln b" d="M470 480H640V496" marker-end="url(#s14-ab)"></path>
  <rect class="chip" x="210" y="500" width="180" height="44" rx="22"></rect>
  <g transform="translate(232 512)"><use href="#s14-k-user"></use></g>
  <text class="ct" x="260" y="528">Editor</text>
  <rect class="chip" x="550" y="500" width="180" height="44" rx="22"></rect>
  <g transform="translate(572 512)"><use href="#s14-k-spark"></use></g>
  <text class="ct" x="600" y="528">Agent</text>

  <path class="ln b" d="M300 544V562H470"></path>
  <path class="ln b" d="M640 544V562H470"></path>
  <path class="ln b" d="M470 562V578" marker-end="url(#s14-ab)"></path>
  <rect class="obox" x="230" y="582" width="480" height="52" rx="10"></rect>
  <text class="ot" x="470" y="613" text-anchor="middle">Both now do the same thing: keep the section, accept 1,050 words.</text>
  <text class="nt" x="470" y="664" text-anchor="middle">The tolerance that lived in a practitioner's head is now written down.</text>
</svg>