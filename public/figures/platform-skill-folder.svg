<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 358" width="900" height="358" role="img" stroke-linejoin="round"><style>svg{color:#004AEF}</style><defs>
  <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
