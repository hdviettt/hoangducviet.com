</defs><g filter="url(#rough)"><rect x="0.0" y="40.0" width="300.0" height="250.0" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="3.5999999999999996"/><path d="M310.0,96.0 L350.0,96.0" fill="none" stroke="currentColor" stroke-opacity="0.40" stroke-width="3.0" stroke-linecap="round"/><path d="M310.0,190.0 L350.0,190.0" fill="none" stroke="currentColor" stroke-opacity="0.40" stroke-width="3.0" stroke-linecap="round" stroke-dasharray="6 6"/></g><text x="0.0" y="16.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="currentColor" fill-opacity="0.42" text-anchor="start" xml:space="preserve">INSIDE ONE SKILL FOLDER</text><text x="20.0" y="70.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="500" fill="currentColor" fill-opacity="0.80" text-anchor="start" xml:space="preserve">skills/wp-publish/</text><text x="24.0" y="104.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">SKILL.md</text><text x="24.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">scripts/</text><text x="46.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">prep_doc.py</text><text x="46.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">process_images.py</text><text x="46.0" y="216.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">publish_run.py</text><text x="24.0" y="244.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">references/</text><text x="360.0" y="78.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="currentColor" fill-opacity="0.90" text-anchor="start" xml:space="preserve">The model reads this</text><text x="360.0" y="100.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.62" text-anchor="start" xml:space="preserve">When the skill should trigger, the process</text><text x="360.0" y="119.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.62" text-anchor="start" xml:space="preserve">step by step, and the contracts it must keep.</text><text x="360.0" y="172.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="currentColor" fill-opacity="0.60" text-anchor="start" xml:space="preserve">The model never reads this</text><text x="360.0" y="194.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.62" text-anchor="start" xml:space="preserve">Plain Python. Identical result every run, at</text><text x="360.0" y="213.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="currentColor" fill-opacity="0.62" text-anchor="start" xml:space="preserve">zero tokens. Thirty-one of our 63 skills ship code.</text><text x="0.0" y="322.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.65" text-anchor="start" xml:space="preserve">A champion owns the whole folder. The person who knows the work edits it,</text><text x="0.0" y="344.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.65" text-anchor="start" xml:space="preserve">and no platform code changes hands.</text></svg>