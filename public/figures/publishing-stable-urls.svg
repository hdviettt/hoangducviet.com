  </defs><rect width="1200" height="640" fill="url(#fbg)"/><ellipse cx="600.0" cy="204.8" rx="504.0" ry="320.0" fill="#1B4488" fill-opacity="0.28" filter="url(#fsoft)"/><circle cx="103" cy="47" r="3.2" fill="#35EAA6"/><text x="116.0" y="52.0" font-size="15" font-weight="400" fill="#7C93B8" fill-opacity="1.0" letter-spacing="0.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">What happens to one image URL when you publish the same doc twice</text><rect x="100" y="68" width="1000" height="1" fill="#3A527E" fill-opacity="0.5"/><text x="100.0" y="132.0" font-size="15" font-weight="400" fill="#7C93B8" fill-opacity="1.0" letter-spacing="0.3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">First publish</text><rect x="100" y="148" width="300" height="1" fill="#3A527E" fill-opacity="0.35"/><rect x="100" y="176" width="4" height="96" rx="2" fill="#5FB2F0"/><text x="122.0" y="208.0" font-size="20" font-weight="400" fill="#CFE0FA" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">main-keyword-2-</text><text x="122.0" y="240.0" font-size="20" font-weight="400" fill="#CFE0FA" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">benefits.webp</text><text x="122.0" y="268.0" font-size="14.5" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">the name we determined</text><line x1="406.0" y1="224" x2="429.0" y2="224" stroke="#5FB2F0" stroke-opacity="0.75" stroke-width="2"/><path d="M427.0 218 L438.0 224 L427.0 230" fill="none" stroke="#5FB2F0" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="444.0" y="132.0" font-size="15" font-weight="400" fill="#7C93B8" fill-opacity="1.0" letter-spacing="0.3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Republish · what WordPress does</text><rect x="444" y="148" width="300" height="1" fill="#3A527E" fill-opacity="0.35"/><rect x="444" y="176" width="4" height="96" rx="2" fill="#F2748A"/><text x="466.0" y="208.0" font-size="20" font-weight="400" fill="#CFE0FA" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">main-keyword-2-</text><text x="466.0" y="240.0" font-size="20" font-weight="400" fill="#CFE0FA" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">benefits</text><text x="554.0" y="240.0" font-size="20" font-weight="500" fill="#F2748A" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">-1</text><text x="576.0" y="240.0" font-size="20" font-weight="400" fill="#CFE0FA" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">.webp</text><text x="466.0" y="268.0" font-size="14.5" font-weight="400" fill="#F2748A" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">a file with that name already exists, so WP dedups</text><line x1="750.0" y1="224" x2="773.0" y2="224" stroke="#5FB2F0" stroke-opacity="0.75" stroke-width="2"/><path d="M771.0 218 L782.0 224 L771.0 230" fill="none" stroke="#5FB2F0" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="788.0" y="132.0" font-size="15" font-weight="400" fill="#7C93B8" fill-opacity="1.0" letter-spacing="0.3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Republish · what we store</text><rect x="788" y="148" width="300" height="1" fill="#3A527E" fill-opacity="0.35"/><rect x="788" y="176" width="4" height="96" rx="2" fill="#35EAA6"/><text x="810.0" y="208.0" font-size="20" font-weight="400" fill="#CFE0FA" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">main-keyword-2-</text><text x="810.0" y="240.0" font-size="20" font-weight="400" fill="#35EAA6" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">benefits.webp</text><text x="810.0" y="268.0" font-size="14.5" font-weight="400" fill="#35EAA6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">normalised back - the URL never moved</text><rect x="100" y="320" width="1000" height="1" fill="#3A527E" fill-opacity="0.35"/><text x="100.0" y="360.0" font-size="15" font-weight="400" fill="#35EAA6" fill-opacity="1.0" letter-spacing="0.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">The clause that makes it a fix and not a bug</text><rect x="100" y="380" width="4" height="70" rx="2" fill="#35EAA6"/><text x="122.0" y="410.0" font-size="17" font-weight="400" fill="#EAF1FB" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">The rewrite only touches filenames the pipeline itself chose. A client's own upload</text><text x="122.0" y="438.0" font-size="17" font-weight="400" fill="#EAF1FB" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">that happens to end in -1 is left exactly where it is.</text><rect x="100" y="560" width="1000" height="1" fill="#3A527E" fill-opacity="0.4"/><text x="100.0" y="588.0" font-size="16" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">The count of renamed images is returned in every run result. Nobody asked for that number -</text><text x="100.0" y="612.0" font-size="16" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">it exists because the first time this went wrong, the only way to find it was diffing two published articles by hand.</text></svg>