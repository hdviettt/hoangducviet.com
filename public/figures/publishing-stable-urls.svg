<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <radialGradient id="fbg" cx="0.5" cy="0.30" r="1.05"><stop offset="0" stop-color="#12294F"/><stop offset="0.5" stop-color="#0B1A34"/><stop offset="1" stop-color="#060E20"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#132848" stop-opacity="0.9"/><stop offset="1" stop-color="#0C1B34" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="ptop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="edtop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20365C"/><stop offset="1" stop-color="#16294A"/></linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2AC6F0"/><stop offset="0.55" stop-color="#2E8FEE"/><stop offset="1" stop-color="#35EAA6"/></linearGradient>
    <filter id="psh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#03060F" flood-opacity="0.5"/></filter>
