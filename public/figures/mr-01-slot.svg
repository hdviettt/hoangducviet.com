<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 272" width="1080" height="272"><rect width="1080" height="272" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dadce0"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#004aef"/></marker></defs><text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" text-anchor="start" fill="#0a0a0a" font-weight="600">Where the model plugs in</text><text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" text-anchor="start" fill="#5f656d" font-weight="400">One slot in the query pipeline is swappable. Everything else is held fixed.</text><rect x="20" y="78" width="130" height="50" rx="10" fill="#f8f9fa" stroke="#e1e6ec" stroke-width="1"/><text x="85" y="100" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle" fill="#0a0a0a" font-weight="400">BM25F</text><text x="85" y="117" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">pool 500</text><rect x="175" y="78" width="130" height="50" rx="10" fill="#f8f9fa" stroke="#e1e6ec" stroke-width="1"/><text x="240" y="100" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle" fill="#0a0a0a" font-weight="400">PageRank</text><text x="240" y="117" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">+ freshness</text><rect x="640" y="78" width="130" height="50" rx="10" fill="#f8f9fa" stroke="#e1e6ec" stroke-width="1"/><text x="705" y="100" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle" fill="#0a0a0a" font-weight="400">min-score</text><text x="705" y="117" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">drops &lt; -8.0</text><rect x="795" y="78" width="130" height="50" rx="10" fill="#f8f9fa" stroke="#e1e6ec" stroke-width="1"/><text x="860" y="100" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle" fill="#0a0a0a" font-weight="400">dedup</text><text x="860" y="117" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">2 per domain</text><rect x="330" y="72" width="180" height="62" rx="10" fill="#e8eeff" stroke="#004aef" stroke-width="1.4"/><text x="420" y="96" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle" fill="#004aef" font-weight="600">CROSS-ENCODER</text><text x="420" y="114" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">reranks top 40</text><path d="M154 103 L326 103" stroke="#dadce0" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M309 103 L326 103" stroke="#dadce0" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M514 103 L636 103" stroke="#dadce0" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M774 103 L791 103" stroke="#dadce0" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M929 103 L960 103" stroke="#dadce0" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="964" y="78" width="96" height="50" rx="10" fill="#f8f9fa" stroke="#e1e6ec" stroke-width="1"/><text x="1012" y="107" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle" fill="#0a0a0a" font-weight="400">results</text><path d="M420 138 L420 176" stroke="#e1e6ec" stroke-width="1.2" fill="none" marker-end="url(#a)" stroke-dasharray="3 3"/><text x="430" y="163" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="start" fill="#8b90a0" font-weight="400">same candidates, both models</text><rect x="140" y="186" width="250" height="66" rx="10" fill="#f8f9fa" stroke="#e1e6ec" stroke-width="1"/><text x="265" y="209" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle" fill="#0a0a0a" font-weight="400">ms-marco-MiniLM-L-6-v2</text><text x="265" y="226" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">22M params, pretrained BERT</text><text x="265" y="241" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">then 500K labelled pairs</text><rect x="450" y="186" width="250" height="66" rx="10" fill="#e8eeff" stroke="#004aef" stroke-width="1.4"/><text x="575" y="209" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle" fill="#004aef" font-weight="600">mini-reranker</text><text x="575" y="226" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">7.36M params, random init</text><text x="575" y="241" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">676,190 pairs, seen once</text><rect x="760" y="186" width="300" height="66" rx="10" fill="#f8f9fa" stroke="#e1e6ec" stroke-width="1"/><text x="910" y="209" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" text-anchor="middle" fill="#0a0a0a" font-weight="400">eval/</text><text x="910" y="226" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">nDCG@10, MRR, paired</text><text x="910" y="241" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#5f656d" font-weight="400">with the standard error printed</text><path d="M394 219 L446 219" stroke="#dadce0" stroke-width="1.2" fill="none" marker-end="url(#a)"/><path d="M704 219 L756 219" stroke="#004aef" stroke-width="1.6" fill="none" marker-end="url(#ap)"/></svg>