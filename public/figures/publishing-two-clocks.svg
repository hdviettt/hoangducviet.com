<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <radialGradient id="fbg" cx="0.5" cy="0.30" r="1.05"><stop offset="0" stop-color="#12294F"/><stop offset="0.5" stop-color="#0B1A34"/><stop offset="1" stop-color="#060E20"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#132848" stop-opacity="0.9"/><stop offset="1" stop-color="#0C1B34" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="ptop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="edtop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20365C"/><stop offset="1" stop-color="#16294A"/></linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2AC6F0"/><stop offset="0.55" stop-color="#2E8FEE"/><stop offset="1" stop-color="#35EAA6"/></linearGradient>
    <filter id="psh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#03060F" flood-opacity="0.5"/></filter>
    <filter id="fsoft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="fglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs><rect width="1200" height="640" fill="url(#fbg)"/><ellipse cx="600.0" cy="204.8" rx="504.0" ry="320.0" fill="#1B4488" fill-opacity="0.28" filter="url(#fsoft)"/><circle cx="103" cy="47" r="3.2" fill="#35EAA6"/><text x="116.0" y="52.0" font-size="15" font-weight="400" fill="#7C93B8" fill-opacity="1.0" letter-spacing="0.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Two places to put the model · one website, 400 articles</text><rect x="100" y="68" width="1000" height="1" fill="#3A527E" fill-opacity="0.5"/><text x="100.0" y="116.0" font-size="14" font-weight="400" fill="#7C93B8" fill-opacity="1.0" letter-spacing="0.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Cumulative model calls</text><rect x="150" y="130" width="680" height="1" fill="#3A527E" fill-opacity="0.28"/><text x="134.0" y="135.0" font-size="14" font-weight="400" fill="#5E7399" fill-opacity="1.0" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">400</text><rect x="150" y="215" width="680" height="1" fill="#3A527E" fill-opacity="0.28"/><text x="134.0" y="220.0" font-size="14" font-weight="400" fill="#5E7399" fill-opacity="1.0" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">300</text><rect x="150" y="300" width="680" height="1" fill="#3A527E" fill-opacity="0.28"/><text x="134.0" y="305.0" font-size="14" font-weight="400" fill="#5E7399" fill-opacity="1.0" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">200</text><rect x="150" y="385" width="680" height="1" fill="#3A527E" fill-opacity="0.28"/><text x="134.0" y="390.0" font-size="14" font-weight="400" fill="#5E7399" fill-opacity="1.0" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">100</text><rect x="150" y="470" width="680" height="1" fill="#3A527E" fill-opacity="0.28"/><text x="134.0" y="475.0" font-size="14" font-weight="400" fill="#5E7399" fill-opacity="1.0" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">0</text><line x1="150" y1="470" x2="830" y2="130" stroke="#E0A96B" stroke-opacity="0.9" stroke-width="2.4"/><circle cx="830" cy="130" r="6" fill="#E0A96B"/><text x="830.0" y="112.0" font-size="17" font-weight="400" fill="#E0A96B" fill-opacity="1.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">400 calls</text><text x="490" y="300" font-size="15" fill="#E0A96B" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" transform="rotate(-26 490 300)" text-anchor="middle">model formats each article</text><line x1="150" y1="470" x2="830" y2="470" stroke="#35EAA6" stroke-opacity="0.95" stroke-width="2.6"/><circle cx="150" cy="470" r="6" fill="#35EAA6"/><circle cx="830" cy="470" r="6" fill="#35EAA6"/><text x="158.0" y="452.0" font-size="16" font-weight="400" fill="#35EAA6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">1 call, at onboarding</text><text x="830.0" y="452.0" font-size="16" font-weight="400" fill="#35EAA6" fill-opacity="1.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">still 1</text><text x="150.0" y="500.0" font-size="14" font-weight="400" fill="#5E7399" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">article 1</text><text x="830.0" y="500.0" font-size="14" font-weight="400" fill="#5E7399" fill-opacity="1.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">article 400</text><text x="490.0" y="530.0" font-size="14" font-weight="400" fill="#7C93B8" fill-opacity="1.0" text-anchor="middle" letter-spacing="0.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">articles published for one website</text><rect x="860" y="130" width="1" height="340" fill="#3A527E" fill-opacity="0.5"/><text x="880.0" y="150.0" font-size="15" font-weight="400" fill="#7C93B8" fill-opacity="1.0" letter-spacing="0.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">What we gave up</text><text x="880.0" y="180.0" font-size="15.5" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">The pipeline cannot improvise.</text><text x="880.0" y="204.0" font-size="15.5" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">A document shaped in a way the</text><text x="880.0" y="228.0" font-size="15.5" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">patterns don't cover comes out wrong.</text><text x="880.0" y="300.0" font-size="15" font-weight="400" fill="#35EAA6" fill-opacity="1.0" letter-spacing="0.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">What we bought</text><text x="880.0" y="330.0" font-size="15.5" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">It comes out wrong the same way</text><text x="880.0" y="354.0" font-size="15.5" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">every time - which is the version of</text><text x="880.0" y="378.0" font-size="15.5" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">wrong you can diagnose.</text><rect x="100" y="570" width="1000" height="1" fill="#3A527E" fill-opacity="0.4"/><text x="100.0" y="596.0" font-size="18" font-weight="400" fill="#EAF1FB" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">The two lines answer different questions. Markup conventions vary per website; nothing varies per article.</text><text x="100.0" y="620.0" font-size="15.5" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">SEO is built on consistency, so a step that is slightly different every run is not a quirk there - it is a defect that surfaces months later.</text></svg>