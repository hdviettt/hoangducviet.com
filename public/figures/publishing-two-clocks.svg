<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Cumulative model calls against articles published: one call per website in this design, versus one call per article if the model sat in the publishing path" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#F7F9FC"/>

  <text x="64" y="82" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1.5">TWO PLACES TO PUT THE MODEL, ONE WEBSITE, 400 ARTICLES</text>

  <line x1="64" y1="112" x2="1136" y2="112" stroke="#0A0A0A" stroke-width="1.5"/>

  <!-- plot frame: x 140..900, y 160..470 -->
  <text x="64" y="138" font-size="12.5" font-weight="700" fill="#8A93A3" letter-spacing="1">CUMULATIVE MODEL CALLS</text>

  <!-- y gridlines -->
  <line x1="140" y1="470" x2="900" y2="470" stroke="#0A0A0A" stroke-width="1.25"/>
  <line x1="140" y1="393" x2="900" y2="393" stroke="#EBEFF5" stroke-width="1"/>
  <line x1="140" y1="315" x2="900" y2="315" stroke="#EBEFF5" stroke-width="1"/>
  <line x1="140" y1="238" x2="900" y2="238" stroke="#EBEFF5" stroke-width="1"/>
  <line x1="140" y1="160" x2="900" y2="160" stroke="#EBEFF5" stroke-width="1"/>

  <text x="126" y="474" font-size="13" fill="#8A93A3" text-anchor="end">0</text>
  <text x="126" y="397" font-size="13" fill="#8A93A3" text-anchor="end">100</text>
  <text x="126" y="319" font-size="13" fill="#8A93A3" text-anchor="end">200</text>
  <text x="126" y="242" font-size="13" fill="#8A93A3" text-anchor="end">300</text>
  <text x="126" y="164" font-size="13" fill="#8A93A3" text-anchor="end">400</text>

  <!-- x axis -->
  <line x1="140" y1="470" x2="140" y2="486" stroke="#C8D0DC" stroke-width="1.25"/>
  <line x1="900" y1="470" x2="900" y2="486" stroke="#C8D0DC" stroke-width="1.25"/>
  <text x="140" y="508" font-size="13" fill="#8A93A3" text-anchor="middle">article 1</text>
  <text x="900" y="508" font-size="13" fill="#8A93A3" text-anchor="middle">article 400</text>
  <text x="520" y="534" font-size="13" font-weight="700" fill="#8A93A3" letter-spacing="1" text-anchor="middle">ARTICLES PUBLISHED FOR ONE WEBSITE</text>

  <!-- counterfactual: model in the per-article path -->
  <line x1="140" y1="470" x2="900" y2="160" stroke="#D9A400" stroke-width="2.5"/>
  <circle cx="900" cy="160" r="5" fill="#D9A400"/>
  <text x="884" y="146" font-size="15" font-weight="700" fill="#8A6D00" text-anchor="end">400 calls</text>
  <text x="620" y="268" font-size="14.5" fill="#8A6D00" transform="rotate(-22 620 268)">model formats each article</text>

  <!-- ours: one call at onboarding, flat forever -->
  <line x1="140" y1="469" x2="900" y2="469" stroke="#004AEF" stroke-width="2.5"/>
  <circle cx="140" cy="469" r="5" fill="#004AEF"/>
  <circle cx="900" cy="469" r="5" fill="#004AEF"/>
  <text x="152" y="450" font-size="15" font-weight="700" fill="#0038B8">1 call, at onboarding</text>
  <text x="884" y="450" font-size="15" font-weight="700" fill="#0038B8" text-anchor="end">still 1</text>

  <!-- right column: the trade -->
  <line x1="960" y1="160" x2="960" y2="470" stroke="#C8D0DC" stroke-width="1.25"/>
  <text x="986" y="186" font-size="12.5" font-weight="700" fill="#8A93A3" letter-spacing="1">WHAT WE GAVE UP</text>
  <text x="986" y="216" font-size="14.5" fill="#3D4149">The pipeline cannot</text>
  <text x="986" y="237" font-size="14.5" fill="#3D4149">improvise. A document</text>
  <text x="986" y="258" font-size="14.5" fill="#3D4149">shaped in a way the</text>
  <text x="986" y="279" font-size="14.5" fill="#3D4149">patterns do not cover</text>
  <text x="986" y="300" font-size="14.5" fill="#3D4149">comes out wrong.</text>

  <text x="986" y="342" font-size="12.5" font-weight="700" fill="#8A93A3" letter-spacing="1">WHAT WE BOUGHT</text>
  <text x="986" y="372" font-size="14.5" fill="#3D4149">It comes out wrong the</text>
  <text x="986" y="393" font-size="14.5" fill="#3D4149">same way every time,</text>
  <text x="986" y="414" font-size="14.5" fill="#3D4149">which is the version of</text>
  <text x="986" y="435" font-size="14.5" fill="#3D4149">wrong you can diagnose.</text>

  <line x1="64" y1="566" x2="1136" y2="566" stroke="#0A0A0A" stroke-width="1.5"/>
  <text x="64" y="598" font-size="15.5" font-weight="700" fill="#0A0A0A">The two lines answer different questions. Markup conventions vary per website; nothing varies per article.</text>
  <text x="64" y="622" font-size="14" fill="#6B7280">SEO is built on consistency, so a step that is slightly different every run is not a quirk there — it is a defect that surfaces months later.</text>
</svg>
