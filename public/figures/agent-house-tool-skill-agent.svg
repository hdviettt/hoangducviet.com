<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-label="Tool, skill and agent compared: the connector, the know-how, and the judgment" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA4B6"/>
    </marker>
    <linearGradient id="bd" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/><stop offset="1" stop-color="#07ef9c"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="660" rx="24" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="1098.5" height="658.5" rx="23.25" fill="none" stroke="#E1E6EC" stroke-width="1.5"/>

  <!-- ============ AGENT ============ -->
  <rect x="56" y="52" width="316" height="374" rx="18" fill="#FAFBFD" stroke="#D7DEEA" stroke-width="1.5"/>
  <rect x="80" y="76" width="88" height="30" rx="15" fill="#E7EEFF"/>
  <text x="124" y="96" font-size="14" font-weight="700" fill="#0038B8" text-anchor="middle">AGENT</text>
  <text x="80" y="140" font-size="22" font-weight="700" fill="#0A0A0A">Judgment</text>
  <text x="80" y="168" font-size="15" fill="#4E4F56">A thin job description that</text>
  <text x="80" y="190" font-size="15" fill="#4E4F56">decides which skill applies.</text>

  <rect x="80" y="212" width="268" height="128" rx="12" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
  <rect x="80" y="212" width="268" height="30" rx="12" fill="#F4F7FF"/>
  <rect x="80" y="230" width="268" height="12" fill="#F4F7FF"/>
  <text x="98" y="233" font-size="13.5" font-weight="700" fill="#2B3A67" font-family="monospace">agent-dang-bai-website.md</text>
  <text x="98" y="264" font-size="13" fill="#7A8090" font-family="monospace">model: sonnet</text>
  <text x="98" y="286" font-size="13" fill="#7A8090" font-family="monospace">maxTurns: 30</text>
  <text x="98" y="308" font-size="13" fill="#7A8090" font-family="monospace">skills: [tech-wp-publish]</text>
  <text x="98" y="330" font-size="13" fill="#7A8090" font-family="monospace">tools: [gdocs, wordpress]</text>

  <rect x="80" y="356" width="132" height="30" rx="15" fill="#FFF7DC"/>
  <text x="146" y="376" font-size="13.5" font-weight="700" fill="#8A6D00" text-anchor="middle">runs on a model</text>
  <text x="80" y="406" font-size="14" font-weight="700" fill="#04915D">19 today · optional</text>

  <!-- arrow agent -> skill -->
  <line x1="378" y1="240" x2="412" y2="240" stroke="#9AA4B6" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="395" y="228" font-size="12.5" font-weight="600" fill="#7A8090" text-anchor="middle">picks</text>

  <!-- ============ SKILL ============ -->
  <rect x="418" y="52" width="316" height="374" rx="18" fill="#F6FEFA" stroke="#BFEFD9" stroke-width="1.5"/>
  <rect x="442" y="76" width="80" height="30" rx="15" fill="#E4FDF2"/>
  <text x="482" y="96" font-size="14" font-weight="700" fill="#04915D" text-anchor="middle">SKILL</text>
  <text x="442" y="140" font-size="22" font-weight="700" fill="#0A0A0A">Know-how</text>
  <text x="442" y="168" font-size="15" fill="#4E4F56">The process, the checklist,</text>
  <text x="442" y="190" font-size="15" fill="#4E4F56">the scripts. The brains.</text>

  <path d="M 442 212 h 48 l 12 12 h 196 a 10 10 0 0 1 10 10 v 106 a 10 10 0 0 1 -10 10 h -256 a 10 10 0 0 1 -10 -10 v -118 a 10 10 0 0 1 10 -10 z" fill="#FFFFFF" stroke="#9FE8C9" stroke-width="1.5"/>
  <text x="462" y="256" font-size="13.5" font-weight="700" fill="#04915D" font-family="monospace">tech-wp-publish/</text>
  <text x="478" y="282" font-size="13" fill="#4E4F56" font-family="monospace">SKILL.md</text>
  <text x="478" y="304" font-size="13" fill="#4E4F56" font-family="monospace">scripts/</text>
  <text x="478" y="326" font-size="13" fill="#4E4F56" font-family="monospace">references/</text>

  <rect x="442" y="356" width="176" height="30" rx="15" fill="#E7EEFF"/>
  <text x="530" y="376" font-size="13.5" font-weight="700" fill="#0038B8" text-anchor="middle">31 of 63 ship code</text>
  <text x="442" y="406" font-size="14" font-weight="700" fill="#04915D">63 today · mandatory</text>

  <!-- arrow skill -> tool -->
  <line x1="740" y1="240" x2="774" y2="240" stroke="#9AA4B6" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="757" y="228" font-size="12.5" font-weight="600" fill="#7A8090" text-anchor="middle">calls</text>

  <!-- ============ TOOL ============ -->
  <rect x="780" y="52" width="264" height="374" rx="18" fill="#FAFBFD" stroke="#D7DEEA" stroke-width="1.5"/>
  <rect x="804" y="76" width="72" height="30" rx="15" fill="#F1F4FA"/>
  <text x="840" y="96" font-size="14" font-weight="700" fill="#4E4F56" text-anchor="middle">TOOL</text>
  <text x="804" y="140" font-size="22" font-weight="700" fill="#0A0A0A">Muscle</text>
  <text x="804" y="168" font-size="15" fill="#4E4F56">A pure connector. Zero</text>
  <text x="804" y="190" font-size="15" fill="#4E4F56">methodology inside.</text>

  <rect x="804" y="212" width="216" height="128" rx="12" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1.5"/>
  <rect x="826" y="240" width="30" height="44" rx="8" fill="url(#bd)" fill-opacity="0.85"/>
  <rect x="834" y="228" width="5" height="14" rx="2.5" fill="#9AA4B6"/>
  <rect x="843" y="228" width="5" height="14" rx="2.5" fill="#9AA4B6"/>
  <path d="M 862 262 h 34" stroke="#9AA4B6" stroke-width="2.5" stroke-dasharray="5 5"/>
  <rect x="900" y="240" width="96" height="44" rx="10" fill="#F1F4FA" stroke="#D7DEEA" stroke-width="1.5"/>
  <text x="948" y="267" font-size="12.5" font-weight="600" fill="#4E4F56" text-anchor="middle">WordPress</text>
  <text x="826" y="316" font-size="12.5" fill="#7A8090" font-family="monospace">POST /wp/v2/posts</text>

  <rect x="804" y="356" width="150" height="30" rx="15" fill="#F1F4FA"/>
  <text x="879" y="376" font-size="13.5" font-weight="700" fill="#4E4F56" text-anchor="middle">no model, ever</text>
  <text x="804" y="406" font-size="14" font-weight="700" fill="#0038B8">21 today · AI Team</text>

  <!-- bottom rule -->
  <line x1="56" y1="470" x2="1044" y2="470" stroke="#E1E6EC" stroke-width="1.5"/>
  <text x="56" y="512" font-size="19" font-weight="700" fill="#0A0A0A">The rule that follows from this split</text>
  <text x="56" y="548" font-size="16" fill="#4E4F56">Deterministic work needs a skill and no agent: the script runs, no model is consulted.</text>
  <text x="56" y="576" font-size="16" fill="#4E4F56">The agent layer exists only where the work genuinely varies.</text>
  <rect x="56" y="596" width="418" height="38" rx="19" fill="#E4FDF2"/>
  <text x="80" y="620" font-size="15.5" font-weight="700" fill="#04915D">Skills are mandatory. Agents are optional.</text>
  <text x="500" y="620" font-size="15" fill="#7A8090">That is why we have 63 of one and 19 of the other.</text>
</svg>
