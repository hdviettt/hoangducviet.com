<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Step 3 of the publishing pipeline: Process the images" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style></defs>
  <rect width="1200" height="720" fill="#F7F9FC"/>
  <text x="1128" y="560" font-size="440" font-weight="800" fill="#EAEFF7" text-anchor="end" letter-spacing="-10">3</text>
  <text x="72" y="96" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1.5">STEP 3 OF 6 · PROCESS IMAGES</text>
  <line x1="72" y1="124" x2="1128" y2="124" stroke="#0A0A0A" stroke-width="1.5"/>
  <text x="72" y="196" font-size="46" font-weight="700" fill="#0A0A0A" letter-spacing="-0.5">Process the images</text>
  <text x="72" y="242" font-size="19" fill="#3D4149">Downloaded, resized, converted, and renamed to the site's convention.</text>
  <rect x="72" y="300" width="984" height="150" rx="10" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="1.25"/>
  <text x="96" y="338" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1">ONE IMAGE, FOUR THINGS DONE TO IT</text>
  <circle cx="105" cy="392" r="5" fill="#004AEF"/>
  <text x="122" y="398" font-size="17" font-weight="700" fill="#0A0A0A">resize</text>
  <text x="122" y="424" font-size="13.5" font-weight="400" fill="#6B7280">800px, ratio kept</text>
  <circle cx="341" cy="392" r="5" fill="#004AEF"/>
  <text x="358" y="398" font-size="17" font-weight="700" fill="#0A0A0A">convert</text>
  <text x="358" y="424" font-size="13.5" font-weight="400" fill="#6B7280">WebP, set quality</text>
  <circle cx="577" cy="392" r="5" fill="#004AEF"/>
  <text x="594" y="398" font-size="17" font-weight="700" fill="#0A0A0A">rename</text>
  <text x="594" y="424" font-size="13.5" font-weight="400" fill="#6B7280">keyword + heading</text>
  <circle cx="813" cy="392" r="5" fill="#004AEF"/>
  <text x="830" y="398" font-size="17" font-weight="700" fill="#0A0A0A">caption</text>
  <text x="830" y="424" font-size="13.5" font-weight="400" fill="#6B7280">doc or alt text</text>
  <rect x="72" y="478" width="984" height="96" rx="10" fill="#EEF2FA" stroke="#DDE3EC" stroke-width="1.25"/>
  <text x="96" y="512" font-size="12" font-weight="700" fill="#0038B8" letter-spacing="1">THE FILENAME A CRAWLER CAN READ</text>
  <text x="96" y="550" class="mono" font-size="18" fill="#2B3A67">image47.png  <tspan fill="#8A93A3">→</tspan>  <tspan fill="#0038B8" font-weight="700">main-keyword-2-benefits-of-x-3.webp</tspan></text>
  <line x1="72" y1="636" x2="1128" y2="636" stroke="#DDE3EC" stroke-width="1.25"/>
  <text x="72" y="676" font-size="15.5" fill="#3D4149"><tspan font-size="16" font-weight="700" fill="#0038B8">THE STRONG MODE</tspan>   filename = main keyword + the nearest heading + an index, so it describes the section.</text>
</svg>
