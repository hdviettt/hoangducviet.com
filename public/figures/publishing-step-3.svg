0" y="550.0" font-size="16" font-weight="400" fill="#35EAA6" fill-opacity="1.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">renamed</text><text x="380.0" y="300.0" font-size="15" font-weight="400" fill="#7C93B8" fill-opacity="1.0" letter-spacing="0.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Filename</text><rect x="380" y="316" width="234" height="48" rx="10" fill="#F2748A" fill-opacity="0.08" stroke="#F2748A" stroke-opacity="0.35" stroke-width="1"/><text x="402.0" y="346.0" font-size="18" font-weight="400" fill="#F2748A" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">image47.png</text><line x1="628" y1="340" x2="671" y2="340" stroke="#5FB2F0" stroke-opacity="0.75" stroke-width="2"/><path d="M669 334 L680 340 L669 346" fill="none" stroke="#5FB2F0" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="692" y="316" width="366" height="48" rx="10" fill="#35EAA6" fill-opacity="0.09" stroke="#35EAA6" stroke-opacity="0.4" stroke-width="1"/><text x="714.0" y="346.0" font-size="18" font-weight="400" fill="#35EAA6" fill-opacity="1.0" font-family="Consolas, ui-monospace, Menlo, monospace">quy-trinh-dang-bai_kts1.webp</text><text x="380.0" y="418.0" font-size="15" font-weight="400" fill="#7C93B8" fill-opacity="1.0" letter-spacing="0.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Four naming modes, configured per site</text><rect x="380" y="438" width="148" height="34" rx="17" fill="#5FB2F0" fill-opacity="0.12" stroke="#5FB2F0" stroke-opacity="0.4" stroke-width="1"/><text x="454.0" y="460.0" font-size="15" font-weight="400" fill="#5FB2F0" fill-opacity="1.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">keep source name</text><rect x="540.0" y="438" width="126" height="34" rx="17" fill="#5FB2F0" fill-opacity="0.12" stroke="#5FB2F0" stroke-opacity="0.4" stroke-width="1"/><text x="602.8" y="460.0" font-size="15" font-weight="400" fill="#5FB2F0" fill-opacity="1.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">from alt text</text><rect x="677.5" y="438" width="156" height="34" rx="17" fill="#5FB2F0" fill-opacity="0.12" stroke="#5FB2F0" stroke-opacity="0.4" stroke-width="1"/><text x="755.2" y="460.0" font-size="15" font-weight="400" fill="#5FB2F0" fill-opacity="1.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">from main keyword</text><rect x="845.0" y="438" width="216" height="34" rx="17" fill="#35EAA6"/><text x="952.8" y="460.0" font-size="15" font-weight="500" fill="#06121F" fill-opacity="1.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">keyword + nearest heading</text><text x="380.0" y="520.0" font-size="17" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">The mode clients ask for builds a filename a crawler reads as a</text><text x="380.0" y="546.0" font-size="17" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">description of the section - not “image47”.</text><rect x="100" y="672" width="1000" height="1" fill="#3A527E" fill-opacity="0.4"/><text x="100.0" y="698.0" font-size="14" font-weight="400" fill="#35EAA6" fill-opacity="1.0" letter-spacing="0.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Why it matters</text><text x="290.0" y="698.0" font-size="17" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">the filename becomes an SEO signal instead of noise - and it is deterministic.</text></svg>