ap="round"/><path d="M595.5,91.6 L604.0,86.0" fill="none" stroke="currentColor" stroke-opacity="0.50" stroke-width="2.7" stroke-linecap="round"/></g><text x="0.0" y="18.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="currentColor" fill-opacity="0.40" text-anchor="start" xml:space="preserve">MAP WHAT PEOPLE PRODUCE, NOT HOW THEY WORK</text><text x="20.0" y="58.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="currentColor" fill-opacity="0.40" text-anchor="start" xml:space="preserve">THE USUAL WAY</text><text x="311.0" y="92.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="middle" xml:space="preserve">?</text><text x="20.0" y="122.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.55" text-anchor="start" xml:space="preserve">Lay out the steps first. Work out the output later.</text><text x="490.0" y="58.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="currentColor" fill-opacity="0.60" text-anchor="start" xml:space="preserve">THE WAY WE DO IT</text><text x="538.0" y="91.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="currentColor" fill-opacity="0.95" text-anchor="middle" xml:space="preserve">the output</text><text x="490.0" y="132.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.60" text-anchor="start" xml:space="preserve">Draw the output first. Then derive the steps it needs.</text><text x="0.0" y="190.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="currentColor" fill-opacity="0.40" text-anchor="start" xml:space="preserve">FOUR QUESTIONS PER OUTPUT</text><text x="300.0" y="190.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">for example: one published SEO article</text><text x="0.0" y="218.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">01</text><text x="34.0" y="218.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">Who owns the final output?</text><text x="34.0" y="236.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">a name, not a department</text><text x="0.0" y="264.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">02</text><text x="34.0" y="264.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">What counts as a good one?</text><text x="34.0" y="282.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">written down as a checkable list</text><text x="0.0" y="310.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">03</text><text x="34.0" y="310.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">What is the current process?</text><text x="34.0" y="328.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">described after the target, not before</text><text x="0.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">04</text><text x="34.0" y="356.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="currentColor" fill-opacity="0.85" text-anchor="start" xml:space="preserve">Which tools and accounts?</text><text x="34.0" y="374.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.50" text-anchor="start" xml:space="preserve">last, never first</text></svg>