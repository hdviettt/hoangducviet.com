<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#2f6bf6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a72f4"/>
      <stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b1a3a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g filter="url(#lift)"><rect x="0" y="0" width="1200" height="630" fill="none"/><polygon class="rise" points="105.0,137.2 1095.0,137.2 1055.7,506.0 144.3,506.0" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.02s"/><polygon class="rise" points="105.0,137.2 1095.0,137.2 1091.3,172.2 108.7,172.2" fill="url(#head)" style="--o:1;animation-delay:0.03s"/><text x="131.6" y="160.6" text-anchor="start" font-size="12.5" fill="#ffffff" font-weight="600">Quote · edit directly in the table</text><polygon class="pop" points="929.5,144.7 1072.2,144.7 1070.1,165.3 928.0,165.3" fill="#07ef9c" style="--o:0.9;animation-delay:0.90s"/><text x="999.5" y="159.7" text-anchor="middle" font-size="10" fill="#04815a" font-weight="700">9/9 · done</text><polygon class="rise" points="109.7,181.5 1090.3,181.5 1087.8,204.5 112.2,204.5" fill="#f0f4f9" style="--o:1;animation-delay:0.10s"/><text x="154.8" y="196.7" text-anchor="start" font-size="9.5" fill="#5f656d" font-weight="600">Item</text><text x="621.7" y="196.7" text-anchor="end" font-size="9.5" fill="#5f656d" font-weight="600">Qty</text><text x="741.2" y="196.7" text-anchor="end" font-size="9.5" fill="#5f656d" font-weight="600">Unit</text><text x="904.0" y="196.7" text-anchor="end" font-size="9.5" fill="#5f656d" font-weight="600">Min cost</text><text x="1034.4" y="196.7" text-anchor="end" font-size="9.5" fill="#5f656d" font-weight="600">Max cost</text><polygon class="rise" points="112.2,204.5 1087.8,204.5 1083.8,242.2 116.2,242.2" fill="#f6f8fb" style="--o:1;animation-delay:0.14s"/><circle class="pop" cx="127.1" cy="223.4" r="3.6" fill="#07ef9c" style="--o:1;animation-delay:0.16s"/><text x="149.3" y="228.9" text-anchor="start" font-size="11" fill="#1f2124" font-weight="600">Content</text><polygon class="rise" points="116.1,241.3 1083.9,241.3 1083.8,242.2 116.2,242.2" fill="#dfe4ec" style="--o:0.7;animation-delay:0.14s"/><circle class="pop" cx="131.0" cy="260.8" r="3.6" fill="#07ef9c" style="--o:1;animation-delay:0.22s"/><text x="153.0" y="266.2" text-anchor="start" font-size="11" fill="#1f2124" font-weight="400">New blog posts</text><text x="621.4" y="266.2" text-anchor="end" font-size="11" fill="#1f2124" font-weight="400">62</text><polygon class="rise" points="664.4,252.1 777.0,252.1 776.3,269.5 664.1,269.5" fill="#004aef" style="--o:0.16;animation-delay:0.24s"/><polygon class="rise" points="814.5,253.0 1029.0,253.0 1027.6,268.6 813.8,268.6" fill="#5f656d" style="--o:0.14;animation-delay:0.25s"/><polygon class="rise" points="120.0,278.4 1080.0,278.4 1079.9,279.3 120.1,279.3" fill="#dfe4ec" style="--o:0.7;animation-delay:0.20s"/><circle class="pop" cx="134.8" cy="297.6" r="3.6" fill="#07ef9c" style="--o:1;animation-delay:0.28s"/><text x="156.6" y="302.8" text-anchor="start" font-size="11" fill="#1f2124" font-weight="400">Product posts</text><text x="621.2" y="302.8" text-anchor="end" font-size="11" fill="#1f2124" font-weight="400">28</text><polygon class="rise" points="663.8,289.0 775.6,289.0 774.9,306.1 663.6,306.1" fill="#004aef" style="--o:0.16;animation-delay:0.30s"/><polygon class="rise" points="812.8,289.9 1025.5,289.9 1024.1,305.2 812.0,305.2" fill="#5f656d" style="--o:0.14;animation-delay:0.31s"/><polygon class="rise" points="123.9,314.9 1076.1,314.9 1076.0,315.7 124.0,315.7" fill="#dfe4ec" style="--o:0.7;animation-delay:0.26s"/><polygon class="rise" points="124.0,315.7 1076.0,315.7 1072.2,351.6 127.8,351.6" fill="#fbeceb" style="--o:0.7;animation-delay:0.32s"/><text x="160.2" y="338.9" text-anchor="start" font-size="11" fill="#1f2124" font-weight="600">Off-page (booking)</text><line class="c" x1="389.3" y1="333.7" x2="1021.4" y2="333.7" stroke="#5f656d" stroke-width="1.4" stroke-dasharray="6 5" style="--o:0.4;animation-delay:0.37s"/><polygon class="rise" points="127.7,350.8 1072.3,350.8 1072.2,351.6 127.8,351.6" fill="#dfe4ec" style="--o:0.7;animation-delay:0.32s"/><polygon class="rise" points="127.8,351.6 1072.2,351.6 1068.4,386.9 131.6,386.9" fill="#f6f8fb" style="--o:1;animation-delay:0.38s"/><circle class="pop" cx="142.3" cy="369.3" r="3.6" fill="#07ef9c" style="--o:1;animation-delay:0.40s"/><text x="163.7" y="374.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="600">Technical</text><polygon class="rise" points="131.5,386.1 1068.5,386.1 1068.4,386.9 131.6,386.9" fill="#dfe4ec" style="--o:0.7;animation-delay:0.38s"/><polygon class="rise" points="131.6,386.9 1068.4,386.9 1064.7,421.7 135.3,421.7" fill="#f6f8fb" style="--o:1;animation-delay:0.44s"/><circle class="pop" cx="145.9" cy="404.4" r="3.6" fill="#07ef9c" style="--o:1;animation-delay:0.46s"/><text x="167.1" y="409.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="600">Personnel</text><polygon class="rise" points="135.2,420.8 1064.8,420.8 1064.7,421.7 135.3,421.7" fill="#dfe4ec" style="--o:0.7;animation-delay:0.44s"/><polygon class="rise" points="135.3,421.7 1064.7,421.7 1062.2,445.6 137.8,445.6" fill="#004aef" style="--o:0.09;animation-delay:0.86s"/><text x="170.0" y="438.2" text-anchor="start" font-size="12" fill="#1f2124" font-weight="700">QUOTE TOTAL</text><polygon class="pop" points="826.8,428.3 1012.4,428.3 1011.4,439.9 826.2,439.9" fill="#004aef" style="--o:0.55;animation-delay:0.90s"/><text x="600.0" y="527.9" text-anchor="middle" font-size="13" fill="#5f656d" font-weight="400">a whole block gone, no error, no warning; the total still computes and looks clean</text></g>
</svg>
