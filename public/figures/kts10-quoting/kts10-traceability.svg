<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#2f6bf6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a72f4"/>
      <stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b1a3a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g filter="url(#lift)"><rect x="0" y="0" width="1200" height="630" fill="none"/><polygon class="rise" points="135.2,145.3 1064.8,145.3 1029.3,499.8 170.7,499.8" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.02s"/><text x="164.4" y="174.5" text-anchor="start" font-size="13" fill="#1f2124" font-weight="600">Diễn giải &amp; chỉnh</text><text x="390.1" y="174.5" text-anchor="start" font-size="11" fill="#5f656d" font-weight="400">vì sao con số này</text><text x="1035.6" y="174.5" text-anchor="end" font-size="15" fill="#04815a" font-weight="400">↗</text><line class="c" x1="215.5" y1="220.8" x2="229.0" y2="381.1" stroke="#004aef" stroke-opacity="0.35" stroke-width="1.6" style="--o:0.5;animation-delay:0.1s"/><circle class="pop" cx="215.5" cy="220.8" r="5.2" fill="#ffffff" style="--o:1;animation-delay:0.14s"/><circle class="pop" cx="215.5" cy="220.8" r="5.2" fill="#ffffff" style="--o:1;animation-delay:0.14s"/><circle cx="215.5" cy="220.8" r="5.2" fill="none" stroke="#004aef" stroke-width="1.6"/><text x="246.2" y="214.7" text-anchor="start" font-size="12" fill="#1f2124" font-weight="500">Cam kết 62% = đang có 41% cộng phần tăng</text><text x="247.8" y="234.8" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400">mục tiêu cam kết</text><text x="249.2" y="253.4" text-anchor="start" font-size="10.5" fill="#04815a" font-weight="500">↳ Bước 6 · Ước KPI</text><circle class="pop" cx="222.4" cy="302.4" r="5.2" fill="#ffffff" style="--o:1;animation-delay:0.22s"/><circle class="pop" cx="222.4" cy="302.4" r="5.2" fill="#ffffff" style="--o:1;animation-delay:0.22s"/><circle cx="222.4" cy="302.4" r="5.2" fill="none" stroke="#004aef" stroke-width="1.6"/><text x="252.6" y="296.5" text-anchor="start" font-size="12" fill="#1f2124" font-weight="500">Đang có 41% = 128 trên 312 từ khoá</text><text x="254.0" y="315.8" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400">đếm thẳng từ kết quả Google</text><text x="255.4" y="333.8" text-anchor="start" font-size="10.5" fill="#04815a" font-weight="500">↳ Bước 3 · Đọc bảng xếp hạng</text><circle class="pop" cx="229.0" cy="381.1" r="5.2" fill="#5f656d" style="--o:1;animation-delay:0.30s"/><text x="258.7" y="375.4" text-anchor="start" font-size="12" fill="#1f2124" font-weight="500">Số bài = MAX(3 cách ước lượng)</text><text x="260.1" y="394.1" text-anchor="start" font-size="10.5" fill="#5f656d" font-weight="400">tránh ước lượng thiếu</text><text x="261.4" y="411.4" text-anchor="start" font-size="10.5" fill="#04815a" font-weight="500">↳ Bước 8 · Tính content</text><polygon class="rise" points="165.6,449.2 1034.4,449.2 1030.8,484.4 169.2,484.4" fill="#f6f8fb" style="--o:1;animation-delay:0.50s"/><circle class="pop" cx="206.6" cy="465.7" r="4.5" fill="#07ef9c" style="--o:1;animation-delay:0.58s"/><text x="228.7" y="470.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="400">phép tính tất định</text><circle class="rise" cx="501.7" cy="465.7" r="4.5" fill="#004aef" style="--o:1;animation-delay:0.64s"/><text x="523.4" y="470.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="400">agent phán đoán</text><circle class="rise" cx="796.7" cy="465.7" r="4.5" fill="#e0a000" style="--o:1;animation-delay:0.70s"/><text x="818.1" y="470.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="400">người chạy chốt</text><text x="600.0" y="520.9" text-anchor="middle" font-size="13" fill="#5f656d" font-weight="400">mỗi số truy được về công thức và bước nguồn, và ai đã tạo ra nó</text></g>
</svg>
