<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#2f6bf6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a72f4"/>
      <stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b1a3a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g filter="url(#lift)"><rect x="0" y="0" width="1200" height="630" fill="none"/><polygon class="rise" points="83.5,141.9 1116.5,141.9 1111.3,188.4 88.7,188.4" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.02s"/><text x="108.6" y="170.8" text-anchor="start" font-size="13" fill="#1f2124" font-weight="600">Tiến độ</text><text x="196.0" y="170.8" text-anchor="start" font-size="11.5" fill="#5f656d" font-weight="400">9/9 bước · một tên miền</text><polygon class="rise" points="109.0,225.0 298.9,225.0 302.9,285.5 115.5,285.5" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.06s"/><circle class="pop" cx="136.6" cy="242.2" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.08s"/><text x="136.8" y="244.4" text-anchor="middle" font-size="8" fill="#04815a" font-weight="700">✓</text><text x="160.6" y="245.3" text-anchor="start" font-size="10" fill="#5f656d" font-weight="600">1</text><text x="128.4" y="266.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="500">Đầu vào</text><polygon class="rise" points="129.1,273.5 280.7,273.5 281.1,277.9 129.6,277.9" fill="#5f656d" style="--o:0.22;animation-delay:0.10s"/><line class="c" x1="300.9" y1="255.4" x2="309.5" y2="255.4" stroke="#004aef" stroke-opacity="0.4" stroke-width="1.5" style="--o:0.5;animation-delay:0.06s"/><polygon class="rise" points="307.5,225.0 497.5,225.0 498.8,285.5 311.4,285.5" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.10s"/><circle class="pop" cx="334.4" cy="242.2" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.12s"/><text x="334.6" y="244.4" text-anchor="middle" font-size="8" fill="#04815a" font-weight="700">✓</text><text x="358.3" y="245.3" text-anchor="start" font-size="10" fill="#5f656d" font-weight="600">2</text><text x="325.2" y="266.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="500">Soát bộ từ khoá</text><polygon class="rise" points="325.6,273.5 477.2,273.5 477.3,277.9 325.9,277.9" fill="#5f656d" style="--o:0.22;animation-delay:0.14s"/><line class="c" x1="498.2" y1="255.4" x2="506.7" y2="255.4" stroke="#004aef" stroke-opacity="0.4" stroke-width="1.5" style="--o:0.5;animation-delay:0.10s"/><polygon class="rise" points="506.1,225.0 696.0,225.0 694.8,285.5 507.4,285.5" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.14s"/><circle class="pop" cx="532.3" cy="242.2" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.16s"/><text x="532.3" y="244.4" text-anchor="middle" font-size="8" fill="#04815a" font-weight="700">✓</text><text x="556.0" y="245.3" text-anchor="start" font-size="10" fill="#5f656d" font-weight="600">3</text><text x="521.9" y="266.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="500">Đọc bảng xếp hạng</text><polygon class="rise" points="522.1,273.5 673.7,273.5 673.6,277.9 522.1,277.9" fill="#5f656d" style="--o:0.22;animation-delay:0.18s"/><line class="c" x1="695.4" y1="255.4" x2="704.0" y2="255.4" stroke="#004aef" stroke-opacity="0.4" stroke-width="1.5" style="--o:0.5;animation-delay:0.14s"/><polygon class="rise" points="704.7,225.0 894.6,225.0 890.7,285.5 703.3,285.5" fill="#ffffff" stroke="#004aef" stroke-width="1.2" style="--o:1;animation-delay:0.18s"/><circle class="pop" cx="730.1" cy="242.2" r="5.0" fill="#004aef" style="--o:1;animation-delay:0.20s"/><text x="730.0" y="244.0" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="400">◆</text><text x="753.6" y="245.3" text-anchor="start" font-size="10" fill="#5f656d" font-weight="600">4</text><text x="718.7" y="266.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="500">Chọn đối thủ</text><polygon class="rise" points="718.5,273.5 870.1,273.5 869.9,277.9 718.4,277.9" fill="#5f656d" style="--o:0.22;animation-delay:0.22s"/><line class="c" x1="892.7" y1="255.4" x2="901.2" y2="255.4" stroke="#004aef" stroke-opacity="0.4" stroke-width="1.5" style="--o:0.5;animation-delay:0.18s"/><polygon class="rise" points="903.3,225.0 1093.2,225.0 1086.7,285.5 899.2,285.5" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.22s"/><circle class="pop" cx="927.9" cy="242.2" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.24s"/><text x="927.8" y="244.4" text-anchor="middle" font-size="8" fill="#04815a" font-weight="700">✓</text><text x="951.3" y="245.3" text-anchor="start" font-size="10" fill="#5f656d" font-weight="600">5</text><text x="915.5" y="266.4" text-anchor="start" font-size="11" fill="#1f2124" font-weight="500">Gom cụm</text><polygon class="rise" points="915.0,273.5 1066.6,273.5 1066.1,277.9 914.7,277.9" fill="#5f656d" style="--o:0.22;animation-delay:0.26s"/><polygon class="rise" points="118.1,309.6 304.5,309.6 308.3,367.8 124.3,367.8" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.26s"/><circle class="pop" cx="145.2" cy="326.2" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.28s"/><text x="145.4" y="328.3" text-anchor="middle" font-size="8" fill="#04815a" font-weight="700">✓</text><text x="168.7" y="329.2" text-anchor="start" font-size="10" fill="#5f656d" font-weight="600">6</text><text x="137.1" y="349.5" text-anchor="start" font-size="11" fill="#1f2124" font-weight="500">Ước KPI</text><polygon class="rise" points="137.8,356.3 286.6,356.3 286.9,360.6 138.2,360.6" fill="#5f656d" style="--o:0.22;animation-delay:0.30s"/><line class="c" x1="306.4" y1="338.9" x2="314.8" y2="338.9" stroke="#004aef" stroke-opacity="0.4" stroke-width="1.5" style="--o:0.5;animation-delay:0.26s"/><polygon class="rise" points="313.0,309.6 499.4,309.6 500.7,367.8 316.7,367.8" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.30s"/><circle class="pop" cx="339.3" cy="326.2" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.32s"/><text x="339.5" y="328.3" text-anchor="middle" font-size="8" fill="#04815a" font-weight="700">✓</text><text x="362.7" y="329.2" text-anchor="start" font-size="10" fill="#5f656d" font-weight="600">7</text><text x="330.2" y="349.5" text-anchor="start" font-size="11" fill="#1f2124" font-weight="500">Đo offpage</text><polygon class="rise" points="330.6,356.3 479.5,356.3 479.6,360.6 330.9,360.6" fill="#5f656d" style="--o:0.22;animation-delay:0.34s"/><line class="c" x1="500.0" y1="338.9" x2="508.5" y2="338.9" stroke="#004aef" stroke-opacity="0.4" stroke-width="1.5" style="--o:0.5;animation-delay:0.30s"/><polygon class="rise" points="507.9,309.6 694.3,309.6 693.0,367.8 509.0,367.8" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.34s"/><circle class="pop" cx="533.5" cy="326.2" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.36s"/><text x="533.6" y="328.3" text-anchor="middle" font-size="8" fill="#04815a" font-weight="700">✓</text><text x="556.8" y="329.2" text-anchor="start" font-size="10" fill="#5f656d" font-weight="600">8</text><text x="523.4" y="349.5" text-anchor="start" font-size="11" fill="#1f2124" font-weight="500">Tính content</text><polygon class="rise" points="523.5,356.3 672.3,356.3 672.3,360.6 523.6,360.6" fill="#5f656d" style="--o:0.22;animation-delay:0.38s"/><line class="c" x1="693.7" y1="338.9" x2="702.1" y2="338.9" stroke="#004aef" stroke-opacity="0.4" stroke-width="1.5" style="--o:0.5;animation-delay:0.34s"/><polygon class="rise" points="702.7,309.6 889.2,309.6 885.4,367.8 701.4,367.8" fill="#ffffff" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.38s"/><circle class="pop" cx="727.7" cy="326.2" r="5.0" fill="#07ef9c" style="--o:1;animation-delay:0.40s"/><text x="727.6" y="328.3" text-anchor="middle" font-size="8" fill="#04815a" font-weight="700">✓</text><text x="750.8" y="329.2" text-anchor="start" font-size="10" fill="#5f656d" font-weight="600">9</text><text x="716.5" y="349.5" text-anchor="start" font-size="11" fill="#1f2124" font-weight="500">Lắp bảng chi phí</text><polygon class="rise" points="716.3,356.3 865.2,356.3 864.9,360.6 716.2,360.6" fill="#5f656d" style="--o:0.22;animation-delay:0.42s"/><text x="408.8" y="296.5" text-anchor="middle" font-size="10.5" fill="#04815a" font-weight="500">một bước gọi mô hình</text><polygon class="rise" points="132.2,441.1 702.8,441.1 701.9,477.9 136.2,477.9" fill="#f6f8fb" stroke="#dfe4ec" stroke-width="1.2" style="--o:1;animation-delay:0.50s"/><text x="155.3" y="465.7" text-anchor="start" font-size="11" fill="#5f656d" font-weight="400">kts10.quote_stages · mỗi bước một dòng</text><text x="743.1" y="465.7" text-anchor="start" font-size="12" fill="#1f2124" font-weight="500">8/9 là script thuần, không mô hình nào chạm số</text><text x="600.0" y="527.9" text-anchor="middle" font-size="13" fill="#5f656d" font-weight="400">chín bước tất định; trạng thái nằm ở các dòng chúng ghi, không phải trong hội thoại</text></g>
</svg>
