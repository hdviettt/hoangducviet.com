<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafbfe"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.47" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#004aef" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#004aef" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a3a" flood-opacity="0.11"/>
    </filter>
  </defs>
  <style>
    /* 14s loop. Each class is a different kind of arrival, because the figures
       are about different kinds of event: text is typed, a result appears, a
       panel expands and pushes what is under it away, a curve is drawn. A fade
       only says "this exists".

       `transform-box: fill-box` is what makes transform-origin mean the shape's
       own box rather than the whole canvas. Without it a scaleX on a text line
       grows from the middle of the page.

       Every class rests on the finished figure, and reduced motion paints that
       frame directly. The og:image renderer forces reduced motion, so the still
       it captures is always the completed drawing. Check this after any change
       to the keyframes: a scaleY(0) that fails to reset removes the shape from
       every social card, and nobody notices until someone shares the post. */
    .c, .type, .pop, .rise, .expandy { transform-box: fill-box; }

    .c { opacity: 0; animation: fade 14s ease-in-out infinite; }
    @keyframes fade { 0% { opacity: 0 } 20%, 88% { opacity: var(--o, 1) } 100% { opacity: 0 } }

    .type { opacity: 0; transform-origin: left center;
             animation: type 14s cubic-bezier(0.25, 0.9, 0.3, 1) infinite; }
    @keyframes type { 0% { opacity: 0; transform: scaleX(0) }
                      6% { opacity: var(--o, 1); transform: scaleX(0) }
                      22%, 88% { opacity: var(--o, 1); transform: scaleX(1) }
                      100% { opacity: 0; transform: scaleX(1) } }

    .pop { opacity: 0; transform-origin: center;
            animation: pop 14s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.6) }
                     18%, 88% { opacity: var(--o, 1); transform: scale(1) }
                     100% { opacity: 0; transform: scale(0.6) } }

    .rise { opacity: 0; animation: rise 14s cubic-bezier(0.2, 0.9, 0.3, 1) infinite; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(22px) }
                      20%, 88% { opacity: var(--o, 1); transform: translateY(0) }
                      100% { opacity: 0; transform: translateY(22px) } }

    .expandy { opacity: 0; transform-origin: top center;
                animation: expandy 14s cubic-bezier(0.2, 0.9, 0.25, 1) infinite; }
    @keyframes expandy { 0% { opacity: 0; transform: scaleY(0) }
                         6% { opacity: var(--o, 1); transform: scaleY(0) }
                         24%, 88% { opacity: var(--o, 1); transform: scaleY(1) }
                         100% { opacity: 0; transform: scaleY(0) } }

    .draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000);
             animation: draw 14s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: var(--len, 2000) }
                      26%, 88% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: var(--len, 2000) } }

    .mark { opacity: 0; animation: mark 14s ease infinite; }
    @keyframes mark { 0%, 40% { opacity: 0 } 52%, 86% { opacity: 1 } 96%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .c, .type, .pop, .rise, .expandy { opacity: var(--o, 1); transform: none; animation: none }
      .draw { stroke-dashoffset: 0; animation: none }
      .mark { opacity: 1; animation: none }
    }
  </style>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#004aef"/>
      <stop offset="1" stop-color="#2f6bf6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a72f4"/>
      <stop offset="1" stop-color="#004aef"/>
    </linearGradient>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0b1a3a" flood-opacity="0.14"/>
    </filter>
  </defs>
<g filter="url(#lift)"><rect class="rise" x="18.0" y="66.0" width="156.0" height="30.0" rx="10" fill="#ffffff" stroke="#04815a" stroke-width="1.3" style="--o:1;animation-delay:0.02s"/><text x="96.0" y="85.0" text-anchor="middle" font-size="12" fill="#1f2124" font-weight="600">Operator</text><line x1="96" y1="96" x2="96" y2="540" stroke="#dfe4ec" stroke-width="1.2" stroke-dasharray="3 4"/><rect class="rise" x="190.0" y="66.0" width="156.0" height="30.0" rx="10" fill="#ffffff" stroke="#004aef" stroke-width="1.3" style="--o:1;animation-delay:0.02s"/><text x="268.0" y="85.0" text-anchor="middle" font-size="12" fill="#1f2124" font-weight="600">The app</text><line x1="268" y1="96" x2="268" y2="540" stroke="#dfe4ec" stroke-width="1.2" stroke-dasharray="3 4"/><rect class="rise" x="362.0" y="66.0" width="156.0" height="30.0" rx="10" fill="#ffffff" stroke="#004aef" stroke-width="1.3" style="--o:1;animation-delay:0.02s"/><text x="440.0" y="85.0" text-anchor="middle" font-size="12" fill="#1f2124" font-weight="600">Agent</text><line x1="440" y1="96" x2="440" y2="540" stroke="#dfe4ec" stroke-width="1.2" stroke-dasharray="3 4"/><rect class="rise" x="562.0" y="66.0" width="156.0" height="30.0" rx="10" fill="#ffffff" stroke="#004aef" stroke-width="1.3" style="--o:1;animation-delay:0.02s"/><text x="640.0" y="85.0" text-anchor="middle" font-size="12" fill="#1f2124" font-weight="600">Pipeline</text><line x1="640" y1="96" x2="640" y2="540" stroke="#dfe4ec" stroke-width="1.2" stroke-dasharray="3 4"/><rect class="rise" x="822.0" y="66.0" width="156.0" height="30.0" rx="10" fill="#ffffff" stroke="#5f656d" stroke-width="1.3" style="--o:1;animation-delay:0.02s"/><text x="900.0" y="85.0" text-anchor="middle" font-size="12" fill="#1f2124" font-weight="600" font-family="ui-monospace, 'JetBrains Mono', monospace">quote_stages</text><line x1="900" y1="96" x2="900" y2="540" stroke="#dfe4ec" stroke-width="1.2" stroke-dasharray="3 4"/><rect class="rise" x="1026.0" y="66.0" width="156.0" height="30.0" rx="10" fill="#ffffff" stroke="#04815a" stroke-width="1.3" style="--o:1;animation-delay:0.02s"/><text x="1104.0" y="85.0" text-anchor="middle" font-size="12" fill="#1f2124" font-weight="600">Gate</text><line x1="1104" y1="96" x2="1104" y2="540" stroke="#dfe4ec" stroke-width="1.2" stroke-dasharray="3 4"/><g class="c" style="--o:0.9;animation-delay:0.08s"><line x1="96" y1="136" x2="259" y2="136" stroke="#004aef" stroke-width="1.5"/><polygon points="268,136 259,131.5 259,140.5" fill="#004aef"/><text x="182" y="130" text-anchor="middle" font-size="11" fill="#1f2124">submit a keyword set</text></g><g class="c" style="--o:0.9;animation-delay:0.14s"><line x1="268" y1="170" x2="891" y2="170" stroke="#004aef" stroke-width="1.5"/><polygon points="900,170 891,165.5 891,174.5" fill="#004aef"/><text x="584" y="164" text-anchor="middle" font-size="11" fill="#1f2124">create an empty quote</text></g><g class="c" style="--o:0.9;animation-delay:0.20s"><line x1="268" y1="204" x2="431" y2="204" stroke="#004aef" stroke-width="1.5"/><polygon points="440,204 431,199.5 431,208.5" fill="#004aef"/><text x="354" y="198" text-anchor="middle" font-size="11" fill="#1f2124">take it</text></g><rect class="rise" x="344" y="230" width="610" height="96" rx="8" fill="none" stroke="#dfe4ec" stroke-width="1.2" stroke-dasharray="2 3" style="--o:1;animation-delay:0.26s"/><rect x="344" y="230" width="118" height="20" fill="#eef3ff" class="rise" style="--o:1;animation-delay:0.26s"/><text x="350.0" y="244.0" text-anchor="start" font-size="10" fill="#004aef" font-weight="600">loop · 9 steps</text><g class="c" style="--o:0.9;animation-delay:0.30s"><line x1="440" y1="272" x2="631" y2="272" stroke="#004aef" stroke-width="1.5"/><polygon points="640,272 631,267.5 631,276.5" fill="#004aef"/><text x="540" y="266" text-anchor="middle" font-size="11" fill="#1f2124">run step k</text></g><g class="c" style="--o:0.9;animation-delay:0.36s"><line x1="640" y1="304" x2="891" y2="304" stroke="#004aef" stroke-width="1.5"/><polygon points="900,304 891,299.5 891,308.5" fill="#004aef"/><text x="770" y="298" text-anchor="middle" font-size="11" fill="#1f2124">write its row</text></g><text x="640.0" y="320.0" text-anchor="middle" font-size="10" fill="#04815a" font-weight="400">step 4 calls the model</text><g class="c" style="--o:0.9;animation-delay:0.44s"><line x1="440" y1="346" x2="1095" y2="346" stroke="#04815a" stroke-width="1.5"/><polygon points="1104,346 1095,341.5 1095,350.5" fill="#04815a"/><text x="772" y="340" text-anchor="middle" font-size="11" fill="#1f2124">every result present?</text></g><g class="c" style="--o:0.9;animation-delay:0.50s"><line x1="1104" y1="378" x2="277" y2="378" stroke="#04815a" stroke-width="1.5" stroke-dasharray="5 3"/><polygon points="268,378 277,373.5 277,382.5" fill="#04815a"/><text x="686" y="372" text-anchor="middle" font-size="11" fill="#1f2124">pass</text></g><g class="c" style="--o:0.9;animation-delay:0.56s"><line x1="268" y1="410" x2="105" y2="410" stroke="#004aef" stroke-width="1.5" stroke-dasharray="5 3"/><polygon points="96,410 105,405.5 105,414.5" fill="#004aef"/><text x="182" y="404" text-anchor="middle" font-size="11" fill="#1f2124">quote ready to approve</text></g><text x="600.0" y="600.0" text-anchor="middle" font-size="15" fill="#5f656d" font-weight="400">one run: every step writes a row; the gate checks before a human sees it</text></g>
</svg>
