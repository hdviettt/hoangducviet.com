ica Neue, Arial, sans-serif">rewritten. A client's own “-1” image is</text><text x="728.0" y="574.0" font-size="15.5" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">left alone - the clause between fix and bug.</text><rect x="100" y="672" width="1000" height="1" fill="#3A527E" fill-opacity="0.4"/><text x="100.0" y="698.0" font-size="14" font-weight="400" fill="#35EAA6" fill-opacity="1.0" letter-spacing="0.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">Why it matters</text><text x="290.0" y="698.0" font-size="17" font-weight="400" fill="#9FB4D6" fill-opacity="1.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">stable image URLs are not a nicety in SEO - they are the point.</text></svg>