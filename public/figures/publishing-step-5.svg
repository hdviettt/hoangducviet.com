<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Rewire" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="1200" height="720" fill="#F7F9FC"/>
<text x="64" y="64" font-size="12.5" font-weight="700" fill="#8A93A3" letter-spacing="1.6">STEP 5 OF 6  ·  REWIRE</text>
<line x1="64" y1="86" x2="1136" y2="86" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="64" y="146" font-size="42" font-weight="800" fill="#0A0A0A">Rewire</text>
<text x="64" y="182" font-size="17" font-weight="400" fill="#6B7280">Sources point at final URLs, and the dedup fix keeps them stable.</text>
<defs><marker id="ah5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#B7C0CE"/></marker></defs><rect x="64" y="236" width="600" height="360" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/><path d="M64 270 v-22 a12 12 0 0 1 12 -12 h576 a12 12 0 0 1 12 12 v22 Z" fill="#161B22"/><circle cx="82" cy="253" r="4" fill="#FF5F56" fill-opacity="0.9"/><circle cx="97" cy="253" r="4" fill="#FEBC2E" fill-opacity="0.9"/><circle cx="112" cy="253" r="4" fill="#28C840" fill-opacity="0.9"/><text x="364.0" y="257" font-size="11.5" font-weight="400" fill="#8B949E" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">rewire · final urls + dedup</text><text x="80" y="300" font-size="0" font-weight="400" fill="#3D4149"></text><text x="94" y="300" font-size="12" font-weight="400" fill="#79C0FF" font-family="ui-monospace, Consolas, monospace">&lt;img </text><text x="134.25" y="300" font-size="12" font-weight="400" fill="#7EE787" font-family="ui-monospace, Consolas, monospace">src=</text><text x="167.45" y="300" font-size="12" font-weight="400" fill="#A5D6FF" font-family="ui-monospace, Consolas, monospace">"…/uploads/img-01.webp"&gt;</text><text x="80" y="326" font-size="0" font-weight="400" fill="#3D4149"></text><text x="94" y="326" font-size="12" font-weight="400" fill="#79C0FF" font-family="ui-monospace, Consolas, monospace">&lt;img </text><text x="134.25" y="326" font-size="12" font-weight="400" fill="#7EE787" font-family="ui-monospace, Consolas, monospace">src=</text><text x="167.45" y="326" font-size="12" font-weight="400" fill="#A5D6FF" font-family="ui-monospace, Consolas, monospace">"…/uploads/img-02.webp"&gt;</text><text x="80" y="352" font-size="0" font-weight="400" fill="#3D4149"></text><text x="80" y="378" font-size="0" font-weight="400" fill="#3D4149"></text><text x="94" y="378" font-size="12" font-weight="400" fill="#6E7681" font-family="ui-monospace, Consolas, monospace"># republish → WP stores img-02-1.webp</text><text x="80" y="404" font-size="0" font-weight="400" fill="#3D4149"></text><text x="94" y="404" font-size="12" font-weight="400" fill="#79C0FF" font-family="ui-monospace, Consolas, monospace">normalize_img_filenames(html, names)</text><text x="80" y="430" font-size="0" font-weight="400" fill="#3D4149"></text><text x="94" y="430" font-size="12" font-weight="400" fill="#6E7681" font-family="ui-monospace, Consolas, monospace"># img-02-1.webp → img-02.webp  (only ours)</text><rect x="700" y="236" width="436" height="360" rx="14" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/><text x="724" y="282" font-size="12.5" font-weight="700" fill="#0038B8" letter-spacing="0.8">ONE FILENAME, TWO PUBLISHES</text><rect x="724" y="300" width="388" height="44" rx="8" fill="#F4F7FC" stroke="#E1E7F0" stroke-width="1"/><text x="742" y="327" font-size="13.5" font-weight="600" fill="#3D4149" font-family="ui-monospace, Consolas, monospace">1st publish    img-02.webp</text><rect x="724" y="352" width="388" height="44" rx="8" fill="#FFF3F3" stroke="#F3C7C7" stroke-width="1.1"/><text x="742" y="379" font-size="13.5" font-weight="600" fill="#B4342E" font-family="ui-monospace, Consolas, monospace">republish      img-02-1.webp</text><path d="M918 400 v18" stroke="#B7C0CE" stroke-width="2.5" marker-end="url(#ah5)"/><rect x="724" y="424" width="388" height="44" rx="8" fill="#F0FDF8" stroke="#BCEBD6" stroke-width="1.1"/><text x="742" y="451" font-size="13.5" font-weight="600" fill="#0E9469" font-family="ui-monospace, Consolas, monospace">normalised     img-02.webp</text><text x="724" y="502" font-size="14" font-weight="400" fill="#6B7280">Only filenames the pipeline chose are rewritten.</text><text x="724" y="524" font-size="14" font-weight="400" fill="#6B7280">A client's own “-1” image is left alone - the</text><text x="724" y="546" font-size="14" font-weight="400" fill="#6B7280">clause between a fix and a bug.</text>
<line x1="64" y1="650" x2="1136" y2="650" stroke="#E1E7F0" stroke-width="1.5"/>
<text x="64" y="684" font-size="13" font-weight="800" fill="#0038B8" letter-spacing="0.5">WHY IT MATTERS</text>
<text x="225.6" y="684" font-size="14.5" font-weight="400" fill="#6B7280">stable image URLs are not a nicety in SEO - they are the point.</text>
</svg>