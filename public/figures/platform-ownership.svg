<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="The three layers of the platform and which team may edit each one" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#F7F9FC"/>

  <text x="64" y="82" font-size="12" font-weight="700" fill="#8A93A3" letter-spacing="1.5">WHO MAY EDIT WHAT</text>

  <!-- column heads -->
  <line x1="64" y1="112" x2="1136" y2="112" stroke="#0A0A0A" stroke-width="1.5"/>
  <text x="64" y="140" font-size="12.5" font-weight="700" fill="#8A93A3" letter-spacing="1">LAYER</text>
  <text x="470" y="140" font-size="12.5" font-weight="700" fill="#8A93A3" letter-spacing="1">WHERE IT LIVES</text>
  <text x="900" y="140" font-size="12.5" font-weight="700" fill="#8A93A3" letter-spacing="1">OWNER</text>
  <line x1="64" y1="160" x2="1136" y2="160" stroke="#DDE3EC" stroke-width="1.25"/>

  <!-- row 1: Interface -->
  <rect x="64" y="176" width="3.5" height="104" fill="#04B876"/>
  <text x="92" y="208" font-size="21" font-weight="700" fill="#0A0A0A">Interface</text>
  <text x="92" y="238" font-size="15" fill="#3D4149">The surface an end user actually touches:</text>
  <text x="92" y="261" font-size="15" fill="#3D4149">a Lark bot, an internal web app.</text>
  <text x="470" y="208" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2B3A67">interfaces/&lt;name&gt;/</text>
  <circle cx="906" cy="202" r="4.5" fill="#04B876"/>
  <text x="922" y="208" font-size="17" font-weight="700" fill="#0A0A0A">Champion</text>
  <text x="900" y="238" font-size="14" fill="#8A93A3">the practitioner who owns</text>
  <text x="900" y="259" font-size="14" fill="#8A93A3">the work itself</text>
  <line x1="64" y1="300" x2="1136" y2="300" stroke="#DDE3EC" stroke-width="1.25"/>

  <!-- row 2: Agent + Skill -->
  <rect x="64" y="316" width="3.5" height="104" fill="#04B876"/>
  <text x="92" y="348" font-size="21" font-weight="700" fill="#0A0A0A">Agent and Skill</text>
  <text x="92" y="378" font-size="15" fill="#3D4149">The job description and the know-how.</text>
  <text x="92" y="401" font-size="15" fill="#3D4149">Everything that decides how good it is.</text>
  <text x="470" y="348" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2B3A67">.claude/agents/&lt;name&gt;.md</text>
  <text x="470" y="374" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2B3A67">.claude/skills/&lt;name&gt;/</text>
  <circle cx="906" cy="342" r="4.5" fill="#04B876"/>
  <text x="922" y="348" font-size="17" font-weight="700" fill="#0A0A0A">Champion</text>
  <text x="900" y="378" font-size="14" fill="#8A93A3">edits it without an</text>
  <text x="900" y="399" font-size="14" fill="#8A93A3">engineer in the room</text>
  <line x1="64" y1="440" x2="1136" y2="440" stroke="#DDE3EC" stroke-width="1.25"/>

  <!-- row 3: System -->
  <rect x="64" y="456" width="3.5" height="104" fill="#004AEF"/>
  <text x="92" y="488" font-size="21" font-weight="700" fill="#0A0A0A">System</text>
  <text x="92" y="518" font-size="15" fill="#3D4149">Runtime, database, auth, connectors, deploy.</text>
  <text x="92" y="541" font-size="15" fill="#3D4149">Built once, shared by every agent above.</text>
  <text x="470" y="488" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2B3A67">core/  api/  tools/</text>
  <circle cx="906" cy="482" r="4.5" fill="#004AEF"/>
  <text x="922" y="488" font-size="17" font-weight="700" fill="#0A0A0A">Platform team</text>
  <text x="900" y="518" font-size="14" fill="#8A93A3">nobody upstairs touches</text>
  <text x="900" y="539" font-size="14" fill="#8A93A3">this floor</text>
  <line x1="64" y1="580" x2="1136" y2="580" stroke="#0A0A0A" stroke-width="1.5"/>
</svg>
